<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مع مين؟ — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ww-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.ww-press:active{transform:scale(.97)}
.ww-in{animation:ww-in 320ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes ww-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ww-press{transition:none}.ww-press:active{transform:none}.ww-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
input::placeholder{color:#8A9A95}
</style>
</helmet>
<div dir="rtl" style="display: flex; flex-direction: column; gap: 12px; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><span style="font-size: 18px; font-weight: 700">{{title}}</span></sc-if>
    <span style="font-size: 13px; line-height: 1.7; color: #637570">{{lead}}</span>
  </div>

  <div role="radiogroup" aria-label="{{title}}" style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{p.on}}" class="ww-press" onClick="{{p.pick}}" style="{{p.style}}">
        <span aria-hidden="true" style="{{p.avatar}}">{{p.initial}}</span>
        <span style="flex: 1 1 auto; min-width: 0; text-align: right; font-size: 15px; font-weight: 700">{{p.name}}</span>
        <span style="{{p.subStyle}}">{{p.sub}}</span>
      </button>
    </sc-for>
    <button type="button" role="radio" aria-checked="{{newOn}}" class="ww-press" onClick="{{pickNew}}" style="{{newStyle}}">
      <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #08634F; background: rgba(8,99,79,0.10)">+</span>
      <span style="flex: 1 1 auto; text-align: right; font-size: 15px; font-weight: 700; color: #08634F">{{newLabel}}</span>
    </button>
    <sc-if value="{{isNew}}" hint-placeholder-val="{{ false }}">
      <input class="ww-in" type="text" autocomplete="off" aria-label="{{nameLabel}}" placeholder="{{nameLabel}}" value="{{newName}}" onInput="{{typeName}}" maxlength="80" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700; color: #193D33; background: #FFFFFF; outline: none; box-shadow: inset 0 0 0 1.5px #08634F">
    </sc-if>
  </div>

  <span style="font-size: 14px; font-weight: 700">{{meanLabel}}</span>
  <div role="radiogroup" aria-label="{{meanLabel}}" style="display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{means}}" as="m" hint-placeholder-count="6">
      <button type="button" role="radio" aria-checked="{{m.on}}" class="ww-press" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
    </sc-for>
  </div>
  <sc-if value="{{hasEffect}}" hint-placeholder-val="{{ true }}">
    <span class="ww-in" style="border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #08634F; background: #DCEBD6">{{effect}}</span>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 2px">
    <button type="button" class="ww-press" onClick="{{save}}" disabled="{{cantSave}}" style="{{saveStyle}}">{{saveLabel}}</button>
    <button type="button" class="ww-press" onClick="{{later}}" style="height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #637570; cursor: pointer; background: transparent">{{laterLabel}}</button>
    <span style="font-size: 12px; line-height: 1.6; text-align: center; color: #8A9A95">{{laterNote}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dir":{"editor":"enum","options":["صادر","وارد"],"default":"صادر","section":"الحالة"},"cat":{"editor":"text","default":"سلفة ادّيتها","section":"الحالة"},"suggest":{"editor":"text","default":"","section":"الحالة"},"bare":{"editor":"boolean","default":false,"section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: null, newName: '', mean: null, done: '' };
  }
  componentDidUpdate(prev) {
    if (prev.dir !== this.props.dir || prev.cat !== this.props.cat) this.setState({ who: null, newName: '', mean: null, done: '' });
  }
  fmt(m) { const a = Math.abs(m), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  money(m, eg) { return eg ? '⁦' + this.fmt(m) + '⁩ ج.م' : '⁦⃁ ' + this.fmt(m) + '⁩'; }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const out = (this.props.dir ?? 'صادر') !== 'وارد';
    const cat = String(this.props.cat || (out ? 'سلفة ادّيتها' : 'سلفة أخدتها'));
    const amt = Number.isInteger(this.props.amount) && this.props.amount > 0 ? this.props.amount : (out ? 50000 : 30000) * (eg ? 3 : 1);
    const s = this.state;
    // كل المعاني ظاهرة على طول مهما كان اتجاه الفلوس (اختيار المالك 2026-10-17) — و«مستحقات له» من رده على الصادر
    const M = [['lent', eg ? 'دين ليا عنده' : 'دين لي عنده'], ['borrowed', eg ? 'دين عليا ليه' : 'دين علي له'], ['back', eg ? 'سلفة رجعتلي' : 'سلفة رجعت لي'], ['repaid', eg ? 'سددتله' : 'سددت له'], ['dues', 'مستحقات له'], ['gift', 'هدية'], ['support', 'دعم'], ['only', eg ? 'مع الشخص ده بس' : 'مع هذا الشخص فقط']];
    // المعنى بيتختار لوحده من التصنيف لو واضح — وتقدر تغيّره
    const preset = { 'سلفة ادّيتها': 'lent', 'سلفة أعطيتها': 'lent', 'سلفة أخدتها': 'borrowed', 'سلفة أخذتها': 'borrowed', 'سداد دين': 'repaid', 'تحصيل دين': 'back', 'مستحقات': 'dues' }[cat] || null;
    const mean = s.mean || (M.some((m) => m[0] === preset) ? preset : null);
    // مخترعة · الرصيد اللي جنب الاسم من صفحة الشخص
    const P = [['ليلى', 20000, 'لك'], ['يوسف', 15000, 'عليك'], ['خالد', 0, ''], ['أحمد', 0, '']];
    const people = P.map(([name, bal, side]) => {
      const on = s.who === name;
      return { name, initial: name.slice(0, 1), on: on ? 'true' : 'false', pick: () => this.setState({ who: name }),
        sub: bal ? (side === 'لك' ? (eg ? 'ليك ' : 'لك ') : 'عليك ') + this.money(bal * (eg ? 3 : 1), eg) : '',
        subStyle: 'flex-shrink: 0; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (side === 'لك' ? '#08634F' : '#BE3D48'),
        avatar: 'width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #08634F; background: #DCEBD6',
        style: 'display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border: 0; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; ' + (on ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: rgba(25,61,51,0.04)') };
    });
    const isNew = s.who === '+';
    const sug = String(this.props.suggest || '');
    const name = isNew ? s.newName.trim() : s.who;
    const chip = (on) => 'min-height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const means = M.map(([id, label]) => ({ label, on: mean === id ? 'true' : 'false', pick: () => this.setState({ mean: id }), style: chip(mean === id) }));
    const who = name || (eg ? 'الشخص' : 'الشخص');
    const v = this.money(amt, eg);
    const effects = {
      lent: (eg ? 'هتتحسب: ليك عند ' : 'تُحسب: لك عند ') + who + ' ' + v,
      borrowed: (eg ? 'هتتحسب: عليك لـ' : 'تُحسب: عليك لـ') + who + ' ' + v,
      repaid: (eg ? 'اللي عليك لـ' : 'ما عليك لـ') + who + (eg ? ' هيقل ' : ' يقلّ ') + v,
      back: (eg ? 'اللي ليك عند ' : 'ما لك عند ') + who + (eg ? ' هيقل ' : ' يقلّ ') + v,
      dues: (eg ? 'مستحقات دفعتها لـ' : 'مستحقات دفعتها لـ') + who + (eg ? ' — بتقلّل اللي عليك من مستحقاته' : ' — تُنقص ما عليك من مستحقاته'),
      gift: (eg ? 'بتظهر في صفحة ' : 'تظهر في صفحة ') + who + (eg ? ' ومش بتغيّر اللي ليك وعليك' : ' ولا تغيّر ما لك وما عليك'),
      support: (eg ? 'بتظهر في صفحة ' : 'تظهر في صفحة ') + who + (eg ? ' ومش بتغيّر اللي ليك وعليك' : ' ولا تغيّر ما لك وما عليك'),
      only: (eg ? 'بتظهر في صفحة ' : 'تظهر في صفحة ') + who + (eg ? ' بس، من غير معنى' : ' فقط، بلا معنى')
    };
    const ok = !!name && !!mean;
    const label = (M.find((m) => m[0] === mean) || [, ''])[1];
    const tell = (k, r) => { if (typeof this.props[k] === 'function') this.props[k](r); };
    return {
      title: eg ? 'مع مين؟' : 'مع من؟',
      full: !this.props.bare,
      lead: (this.props.bare ? '' : '«' + cat + '» · ' + v + ' — ') + (eg ? 'عشان تظهر في صفحة الشخص وتتحسب في اللي ليك وعليك.' : 'لتظهر في صفحة الشخص وتُحسب فيما لك وما عليك.'),
      people,
      newOn: isNew ? 'true' : 'false', isNew,
      newLabel: (eg ? 'شخص جديد' : 'شخص جديد') + (sug ? ': ' + sug : ''),
      newStyle: 'display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border: 0; border-radius: 16px; font: inherit; cursor: pointer; ' + (isNew ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: rgba(8,99,79,0.05)'),
      pickNew: () => this.setState({ who: '+', newName: s.newName || sug }),
      nameLabel: eg ? 'اسمه إيه؟' : 'ما اسمه؟', newName: s.newName,
      typeName: (e) => this.setState({ newName: e.target.value, who: '+' }),
      meanLabel: eg ? 'معناها' : 'معناها',
      means,
      hasEffect: !!mean, effect: mean ? effects[mean] : '',
      cantSave: !ok,
      saveLabel: s.done || (eg ? 'اربط' : 'اربط'),
      saveStyle: 'height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%);' + (ok ? ' box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.22)' : ' opacity: 0.45; cursor: default'),
      save: () => {
        if (!ok) return;
        if (typeof this.props.onDone === 'function') this.props.onDone({ person: name, meaning: label, isNew });
        else this.setState({ done: (eg ? 'اتربطت بـ' : 'رُبطت بـ') + name + ' ✓' });
      },
      laterLabel: eg ? 'مش عارف دلوقتي' : 'لا أعرف الآن',
      later: () => tell('onLater', null),
      laterNote: eg ? 'هتستناك في «محتاجة تربطها بشخص» جوه الأشخاص' : 'تنتظرك في «تحتاج ربطًا بشخص» داخل الأشخاص'
    };
  }
}
</script>
</body>
</html>
