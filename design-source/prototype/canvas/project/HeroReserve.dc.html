<head>
<meta charset="utf-8">
<title>المحجوز للخطط — مصروفي</title>

</head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
.hr-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.hr-press:active{transform:scale(.97)}
.hr-in{animation:hr-in 280ms cubic-bezier(.2,.8,.2,1) both}
@keyframes hr-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.hr-press{transition:none}.hr-press:active{transform:none}.hr-in{animation:none}}
</style>
</helmet>
<div style="{{rootStyle}}">
  <sc-if value="{{showLine}}" hint-placeholder-val="{{ true }}">
    <button type="button" class="hr-press" onClick="{{toggle}}" aria-expanded="{{openAria}}" style="width: 100%; border: 0; min-height: 44px; padding: 8px 12px; border-radius: 16px; display: flex; align-items: center; gap: 8px; font: inherit; text-align: right; color: #FFFFFF; cursor: pointer; background: rgba(255,255,255,0.10)">
      <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">{{freeLine}}</span><span style="font-size: 12px; color: #DCEBD6">{{heldLine}}</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DCEBD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="{{chev}}"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </sc-if>
  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
    <div class="hr-in" style="margin-top: 8px; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.10); color: #FFFFFF">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="2">
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between; font-size: 13px"><span>{{g.name}}</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{g.amt}}</span></span><span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15)"><span style="{{g.bar}}"></span></span></span>
      </sc-for>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
        <span style="display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 6px">
          <span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700">{{t.title}}</span><span style="font-size: 11px; color: #DCEBD6">{{t.sub}}</span></span>
          <button type="button" role="switch" aria-checked="{{t.on}}" aria-label="{{t.title}}" onClick="{{t.tap}}" style="width: 52px; height: 44px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent"><span style="{{t.track}}"><span style="{{t.knob}}"></span></span></button>
        </span>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{hasAlert}}" hint-placeholder-val="{{ false }}">
    <span role="alert" class="hr-in" style="margin-top: 8px; display: block; border-radius: 14px; padding: 8px 10px; font-size: 12px; font-weight: 700; color: #6B4600; background: #FBF0DD">{{alert}}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"مصر","section":"الحالة"},"total":{"editor":"text","default":"","section":"الحالة"},"over":{"editor":"boolean","default":false,"section":"الحالة"},"$preview":{"width":350,"height":300}}'>
// المحجوز للخطط في الكارت الرئيسي (طلب المالك 2026-10-22): واحد عنده حساب واحد، ومحوّش جواه لخطط ⇐ «معاك 40,000» بس «تقدر تصرف 15,000»
// المحجوز = مجموع اللي اتحجز لخطط الادخار (حجز من الرصيد من غير ما الفلوس تتحرك). المستخدم يختار: السطر يظهر في الكارت ولا لأ · تنبيه لو صرف من المحجوز ولا لأ
// over: المصروف دخل في المحجوز ⇐ التنبيه (لو شغال)
const fmt = (m) => { const a = Math.abs(m), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + (f < 10 ? '0' : '') + f : ''); };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, line: true, warn: true }; }
  renderVals() {
    const eg = (this.props.space ?? 'مصر') === 'مصر', T = (sa, e) => (eg ? e : sa), s = this.state;
    const money = (m) => (eg ? '⁦' + fmt(m) + '⁩ ج.م' : '⁦⃁ ' + fmt(m) + '⁩');
    const G = eg ? [['عمرة', 800000, 2000000], ['آيفون', 230000, 500000]] : [['عمرة', 500000, 1200000], ['آيفون', 150000, 450000]];
    const held = G.reduce((t, g) => t + g[1], 0);
    const total = Number(this.props.total) > 0 ? Number(this.props.total) : (eg ? 2530000 : 860000);
    const free = total - held;
    const over = !!this.props.over || free < 0;
    const sw = (on) => ({ track: 'position: relative; display: block; width: 40px; height: 24px; border-radius: 12px; background: ' + (on ? '#3FBF8F' : 'rgba(255,255,255,0.25)'), knob: 'position: absolute; top: 2px; right: ' + (on ? 18 : 2) + 'px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF' });
    return {
      rootStyle: "font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #FFFFFF" + (this.props.total ? '' : '; padding: 14px; background: #0B5E4A; border-radius: 24px'),
      showLine: s.line, isOpen: s.open && s.line, openAria: s.open ? 'true' : 'false',
      chev: 'flex-shrink: 0; transition: transform 220ms; transform: rotate(' + (s.open ? 180 : 0) + 'deg)',
      toggle: () => this.setState({ open: !s.open }),
      freeLine: over ? T('تجاوزت المتاح', 'دخلت في المحجوز') : T('يمكنك صرف ', 'تقدر تصرف ') + money(free),
      heldLine: T('محجوز ', 'محجوز ') + money(held) + T(' للخطط', ' للخطط'),
      goals: G.map(([name, m, target]) => ({ name, amt: money(m) + ' / ' + money(target), bar: 'display: block; height: 100%; border-radius: 2px; background: #A6DEC1; width: ' + Math.round((m * 100) / target) + '%' })),
      toggles: [
        Object.assign({ title: T('إظهار السطر هنا', 'بيّن السطر هنا'), sub: T('يمكن إرجاعه من الإعدادات', 'ترجّعه من الإعدادات'), on: s.line ? 'true' : 'false', tap: () => this.setState({ line: !s.line, open: false }) }, sw(s.line)),
        Object.assign({ title: T('نبّهني لو صرفت من المحجوز', 'نبّهني لو صرفت من المحجوز'), sub: T('إشعار وسطر هنا', 'إشعار وسطر هنا'), on: s.warn ? 'true' : 'false', tap: () => this.setState({ warn: !s.warn }) }, sw(s.warn))
      ],
      hasAlert: over && s.warn, alert: T('صرفت من المحجوز لـ«عمرة»', 'صرفت من المحجوز لـ«عمرة»')
    };
  }
}
</script>
</body>
</html>
