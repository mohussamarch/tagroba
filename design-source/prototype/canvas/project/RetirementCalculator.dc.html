<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // البلد تلقائي من المساحة الشغالة (مش اختيار) — §69
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    return {
      isSa: !eg, isEg: eg, state: this.props.state ?? 'عادي',
      lawLine: eg ? 'مصر · قانون التأمينات والمعاشات 148 لسنة 2019' : 'السعودية · نظام التأمينات الاجتماعية',
      intro: eg ? 'بتجاوب على سؤالين: معاشك هيبقى كام، وتحوّش كام في الشهر عشان تعيش بالمبلغ اللي عايزه.' : 'تجيب عن سؤالين: كم سيكون معاشك، وكم تدّخر شهريًا لتعيش بالمبلغ الذي تريده.'
    };
  }
}
