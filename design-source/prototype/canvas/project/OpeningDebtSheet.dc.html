<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دين قديم — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.od-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.od-press:active{transform:scale(.97)}
.od-veil{animation:od-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.od-up{animation:od-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
@keyframes od-fade{from{opacity:0}to{opacity:1}}
@keyframes od-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.od-press{transition:none}.od-press:active{transform:none}.od-up{animation:od-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div style="border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; background: rgba(25,61,51,0.04)">
    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 700">{{cardTitle}}</span>
      <span style="font-size: 12px; color: #637570">{{cardBody}}</span>
    </span>
    <button type="button" class="od-press" onClick="{{openSheet}}" style="height: 44px; padding: 0 14px; flex-shrink: 0; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.08)">{{openLabel}}</button>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="od-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{title}}" class="od-up" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
        <span style="font-size: 17px; font-weight: 700">{{title}}</span>
        <span style="font-size: 13px; line-height: 1.7; color: #637570">{{body}}</span>
        <div role="radiogroup" aria-label="{{title}}" style="display: flex; gap: 8px">
          <sc-for list="{{dirs}}" as="dr" hint-placeholder-count="2">
            <button type="button" role="radio" aria-checked="{{dr.on}}" class="od-press" onClick="{{dr.pick}}" style="{{dr.style}}">{{dr.label}}</button>
          </sc-for>
        </div>
        <label for="od-amount" style="font-size: 13px; font-weight: 700">{{amountLabel}}</label>
        <div style="display: flex; align-items: center; height: 56px; border-radius: 18px; padding: 0 16px; gap: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)">
          <input id="od-amount" type="text" inputmode="decimal" dir="ltr" value="{{amountText}}" onInput="{{typeAmount}}" placeholder="0.00" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 22px; font-weight: 700; color: #193D33; outline: none; text-align: right; font-variant-numeric: tabular-nums">
          <span style="font-size: 14px; color: #637570">{{currency}}</span>
        </div>
        <span role="alert" style="font-size: 12px; font-weight: 700; color: #BE3D48; min-height: 18px">{{err}}</span>
        <button type="button" class="od-press" onClick="{{save}}" style="height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)">{{saveLabel}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"enum","options":["خالد","فهد","عمر"],"default":"خالد","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"onSave":{"editor":null},"$preview":{"width":350,"height":120}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, side: null, amount: '', err: '' }; }
  toMinor(text) { const t = String(text || '').replace(/[٠-٩۰-۹]/g, (d) => ('٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹'.indexOf(d) % 10)).replace(/[^0-9.]/g, ''); if (!t) return null; const [w, f = ''] = t.split('.'); return parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const who = this.props.person || 'خالد';
    const s = this.state;
    // §27: «ليا عنده» (receivable) · «عليا ليه» (loan_payable) — من غير عملية ومن غير ما يلمس أي محفظة
    const dirs = [['lak', eg ? 'ليا عنده' : 'لي عنده'], ['alek', eg ? 'عليا ليه' : 'عليّ له']].map(([id, label]) => ({
      label, on: s.side === id ? 'true' : 'false', pick: () => this.setState({ side: id, err: '' }),
      style: 'flex: 1 1 0; height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; cursor: pointer; ' + (s.side === id ? 'font-weight: 700; color: #08634F; background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'color: #193D33; background: rgba(25,61,51,0.06)')
    }));
    return {
      cardTitle: eg ? 'فيه دين قديم مع ' + who + ' من قبل التطبيق؟' : 'دين قديم مع ' + who + ' قبل التطبيق؟',
      cardBody: eg ? 'من غير عملية، وما بيلمسش أي محفظة.' : 'بلا عملية، ولا يمسّ أي محفظة.',
      openLabel: eg ? 'سجّله' : 'سجّله',
      openSheet: () => this.setState({ open: true, side: null, amount: '', err: '' }),
      open: s.open,
      title: eg ? 'دين قديم مع ' + who : 'دين قديم مع ' + who,
      body: eg ? 'لفلوس كاش اتبادلت قبل التطبيق ومالهاش سجل. ما بيدخلش المصروف ولا الدخل ولا رصيد الكاش، وبيتسدد عادي.' : 'لمبالغ كاش تبادلتماها قبل التطبيق بلا سجل. لا يدخل المصروف ولا الدخل ولا رصيد الكاش، ويُسدَّد كأي دين.',
      dirs,
      amountLabel: 'المبلغ', amountText: s.amount, currency: eg ? 'ج.م' : 'ر.س',
      typeAmount: (e) => this.setState({ amount: e.target.value, err: '' }),
      err: s.err,
      saveLabel: eg ? 'احفظ الدين' : 'احفظ الدين',
      save: () => {
        const v = this.toMinor(s.amount);
        if (!s.side) { this.setState({ err: eg ? 'اختار: ليك عنده ولا عليك ليه.' : 'اختر: لك عنده أم عليك له.' }); return; }
        if (v == null || v <= 0) { this.setState({ err: eg ? 'اكتب مبلغ أكبر من صفر.' : 'اكتب مبلغًا أكبر من صفر.' }); return; }
        this.setState({ open: false });
        if (typeof this.props.onSave === 'function') this.props.onSave(s.side, v);
      },
      closeSheet: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
