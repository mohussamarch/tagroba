<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اربطها بعملية أو كاش — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.lp-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.lp-press:active{transform:scale(.97)}
.lp-up{animation:lp-up 360ms cubic-bezier(.2,.8,.2,1) both}
@keyframes lp-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.lp-press{transition:none}.lp-press:active{transform:none}.lp-up{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: #DDE5DC">
  <span aria-hidden="true" style="position: absolute; inset: 0; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></span>
  <div role="dialog" aria-modal="true" aria-label="{{title}}" class="lp-up" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 94%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -12px 40px rgba(16,45,53,0.18)">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
    <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 18px; font-weight: 700">{{title}}</span><span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{amount}}</span></span>
    <span style="font-size: 13px; color: #637570">{{sub}}</span>
    <sc-if value="{{hasExtra}}" hint-placeholder-val="{{ false }}"><span style="border-radius: 12px; padding: 8px 10px; font-size: 12px; font-weight: 700; color: #6B4600; background: #FBF0DD">{{extra}}</span></sc-if>

    <div role="radiogroup" aria-label="{{title}}" style="display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: rgba(25,61,51,0.06)">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{m.on}}" class="lp-press" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button></sc-for>
    </div>

    <sc-if value="{{isOp}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{c.on}}" class="lp-press" onClick="{{c.pick}}" style="{{c.style}}">
          <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="{{c.radio}}"></span><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: right"><span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 14px; font-weight: 700">{{c.name}}</span><sc-if value="{{c.best}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 8px; color: #FFFFFF; background: #08634F">{{bestLabel}}</span></sc-if></span><span style="font-size: 12px; color: #637570">{{c.date}}</span></span><span style="flex-shrink: 0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{c.amt}}</span></span>
          <sc-if value="{{c.best}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #08634F; text-align: right">{{c.why}}</span></sc-if>
        </button>
      </sc-for>
      <a href="Operations.dc.html" class="lp-press" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 14px; font-size: 13px; font-weight: 700; color: #08634F; text-decoration: none; background: rgba(8,99,79,0.08)">{{searchLabel}}</a>
    </sc-if>

    <sc-if value="{{isHold}}" hint-placeholder-val="{{ false }}">
      <span style="border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; background: rgba(25,61,51,0.04)"><span style="font-size: 14px; font-weight: 700">{{holdFrom}}</span><span style="font-size: 13px; color: #637570">{{holdHow}}</span></span>
      <span style="border-radius: 12px; padding: 8px 10px; font-size: 13px; color: #08634F; background: rgba(8,99,79,0.07)">{{holdEffect}}</span>
    </sc-if>

    <sc-if value="{{isCash}}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700"><span style="flex: 1 1 auto">{{cashAmtLabel}}</span><input type="text" inputmode="decimal" value="{{cashAmt}}" onInput="{{typeAmt}}" aria-label="{{cashAmtLabel}}" style="width: 120px; height: 46px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700; direction: ltr; text-align: left; color: #193D33; background: rgba(25,61,51,0.05)"><span style="font-weight: 500; color: #637570">{{cur}}</span></label>
      <span style="font-size: 14px; font-weight: 700">{{dateLabel}}</span>
      <div role="radiogroup" aria-label="{{dateLabel}}" style="display: flex; gap: 8px"><sc-for list="{{dates}}" as="d" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{d.on}}" class="lp-press" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button></sc-for></div>
      <span style="border-radius: 12px; padding: 8px 10px; font-size: 13px; color: #08634F; background: rgba(8,99,79,0.07)">{{cashEffect}}</span>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}"><span role="status" style="border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; color: #08634F; background: rgba(8,99,79,0.08)">{{doneText}}</span></sc-if>

    <div style="display: flex; gap: 8px; padding-top: 4px">
      <button type="button" class="lp-press" onClick="{{save}}" style="flex: 2 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">{{saveLabel}}</button>
      <button type="button" class="lp-press" onClick="{{reset}}" style="flex: 1 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.07)">{{cancelLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"place":{"editor":"enum","options":["سداد دين","دفع زيادة","الزكاة","الادخار"],"default":"الزكاة","section":"المكان"},"how":{"editor":"enum","options":["تلقائي","حجز","عملية","كاش"],"default":"تلقائي","section":"المكان"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"مصر","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// «اربطها بعملية أو كاش» على كل مكان بيسجّل دفع (بند 6 من DESIGN-BRIEF-0.6 · قايمة جلسة كوتلن 2026-10-22): سداد دين · دفع زيادة · الزكاة · الادخار
// «عملية» = قايمة العمليات اللي ممكن تكون هي والأقرب مختار «غالبًا» · «كاش» = عملية حقيقية في محفظة الكاش بالمبلغ والتاريخ. مفيش «من غير عملية». كلام قصير (قاعدة المالك)
const fmt = (m) => { const a = Math.abs(m), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; };
const money = (m, eg) => (eg ? '⁦' + fmt(m) + '⁩ ج.م' : '⁦⃁ ' + fmt(m) + '⁩');
const plain = (m) => (m % 100 ? fmt(m) : fmt(m).slice(0, -3)).replace(/,/g, '');
class Component extends DCLogic {
  constructor(props) { super(props); this.state = this.fresh(props); }
  fresh(p) { return { how: p.how === 'كاش' ? 'cash' : p.how === 'حجز' ? 'hold' : ((p.place ?? 'الزكاة') === 'الادخار' && p.how !== 'عملية' ? 'hold' : 'op'), pick: 0, date: 0, amt: null, done: false }; }
  componentDidUpdate(prev) { if (prev.place !== this.props.place || prev.how !== this.props.how || prev.space !== this.props.space) this.setState(this.fresh(this.props)); }
  renderVals() {
    const eg = (this.props.space ?? 'مصر') === 'مصر', T = (sa, e) => (eg ? e : sa);
    const place = this.props.place ?? 'الزكاة', s = this.state, k = eg ? 3 : 1;
    // out = الفلوس خارجة منك (سداد · زكاة · إيداع ادخار)
    const P = {
      'سداد دين': { title: T('سددت لـ«ليلى»', 'سددت لـ«ليلى»'), sub: T('اربطها بالعملية', 'اربطها بالعملية'), amt: 150000, out: true, cands: [['تحويل لـ«ليلى»', 'أمس', 150000], ['تحويل لـ«ليلى»', '3 أكتوبر', 50000], ['سحب نقدي', 'أمس', 200000]], why: T('نفس الشخص والمبلغ', 'نفس الشخص والمبلغ') },
      'دفع زيادة': { title: T('سددت لـ«ليلى»', 'سددت لـ«ليلى»'), sub: T('اربطها بالعملية', 'اربطها بالعملية'), amt: 170000, out: true, extra: T('الزيادة ', 'الزيادة ') + money(20000 * k, eg) + T(' ← سلفة جديدة', ' ← سلفة جديدة'), cands: [['تحويل لـ«ليلى»', 'أمس', 170000], ['تحويل لـ«ليلى»', '3 أكتوبر', 50000]], why: T('نفس الشخص والمبلغ', 'نفس الشخص والمبلغ') },
      'الزكاة': { title: T('دفع زكاة السنة', 'دفع زكاة السنة'), sub: T('اربطها بالعملية', 'اربطها بالعملية'), amt: 245000, out: true, cands: [['تحويل لجمعية خيرية', '2 أكتوبر', 245000], ['تحويل لـ«خالد»', '29 سبتمبر', 100000], ['سحب نقدي', '1 أكتوبر', 300000]], why: T('المبلغ نفسه', 'نفس المبلغ') },
      'الادخار': { title: T('إيداع في «عمرة»', 'إيداع في «عمرة»'), sub: T('اربطه بالعملية', 'اربطه بالعملية'), amt: 100000, out: true, cands: [['تحويل لحساب التوفير', 'أمس', 100000], ['تحويل لـ«يوسف»', '4 أكتوبر', 100000]], why: T('تحويل لحسابك بنفس المبلغ', 'تحويل لحسابك بنفس المبلغ') }
    }[place];
    const total = P.amt * k;
    const green = 'linear-gradient(160deg, #0A7A62 0%, #08634F 100%)';
    const seg = (on) => 'flex: 1 1 0; height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #193D33; background: #FFFFFF; box-shadow: 0 1px 4px rgba(16,45,53,0.12)' : 'color: #637570; background: transparent');
    const chip = (on) => 'flex: 1 1 0; height: 44px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: ' + green : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const amtTxt = s.amt == null ? plain(total) : s.amt;
    const D = [T('اليوم', 'النهارده'), T('أمس', 'امبارح'), T('تاريخ آخر', 'تاريخ تاني')];
    return {
      title: P.title, sub: P.sub, amount: money(total, eg), hasExtra: !!P.extra, extra: P.extra || '', cur: eg ? 'ج.م' : '⃁',
      modes: (place === 'الادخار' ? [['hold', T('حجز من رصيدي', 'حجز من رصيدي')]] : []).concat([['op', T('عملية مسجّلة', 'عملية متسجلة')], ['cash', T('كاش', 'كاش')]]).map(([id, label]) => ({ label, on: s.how === id ? 'true' : 'false', style: seg(s.how === id), pick: () => this.setState({ how: id, done: false }) })),
      isOp: s.how === 'op', isCash: s.how === 'cash', isHold: s.how === 'hold',
      holdFrom: T('من «بنك مصر»', 'من «بنك مصر»').replace('بنك مصر', eg ? 'بنك مصر' : 'مصرف الراجحي'), holdHow: T('المبلغ يبقى في حسابك، ويُحجز للخطة', 'الفلوس فاضلة في حسابك، وتتحجز للخطة'),
      holdEffect: T('ينقص «يمكنك صرف» في الرئيسية', 'هتقلّ من «تقدر تصرف» في الرئيسية'), isDone: s.done,
      bestLabel: T('غالبًا هي', 'غالبًا دي'), searchLabel: T('ما وجدتها؟ ابحث', 'مش لاقيها؟ دوّر'),
      cands: P.cands.map(([name, date, m], i) => {
        const on = s.pick === i;
        return { name, date, amt: money(m * k, eg), best: i === 0, why: P.why, on: on ? 'true' : 'false', pick: () => this.setState({ pick: i, done: false }),
          radio: 'width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; box-sizing: border-box; ' + (on ? 'border: 6px solid #08634F; background: #FFFFFF' : 'border: 2px solid rgba(25,61,51,0.3)'),
          style: 'width: 100%; border: 0; padding: 10px 12px; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; box-shadow: ' + (on ? 'inset 0 0 0 1.5px #08634F' : 'inset 0 0 0 1px rgba(25,61,51,0.10)') };
      }),
      cashAmtLabel: T('المبلغ', 'المبلغ'), cashAmt: amtTxt, typeAmt: (e) => this.setState({ amt: e && e.target ? e.target.value : '' }),
      dateLabel: T('متى؟', 'إمتى؟'), dates: D.map((label, i) => ({ label, on: s.date === i ? 'true' : 'false', style: chip(s.date === i), pick: () => this.setState({ date: i }) })),
      cashEffect: P.out ? T('ستخرج من محفظة الكاش', 'هتطلع من محفظة الكاش') : T('ستدخل محفظة الكاش', 'هتدخل محفظة الكاش'),
      doneText: s.how === 'hold' ? T('تم الحجز', 'اتحجزت') : T('تم الربط', 'اتربطت'),
      saveLabel: T('احفظ', 'احفظ'), save: () => this.setState({ done: true }),
      cancelLabel: T('إلغاء', 'إلغاء'), reset: () => this.setState(this.fresh(this.props))
    };
  }
}
</script>
</body>
</html>
