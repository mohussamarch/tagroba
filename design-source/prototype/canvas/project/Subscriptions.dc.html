<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الاشتراكات — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-in{animation:m-in 450ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes m-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.m-press{transition:none}.m-press:active{transform:none}.m-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="Operations.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">{{title}}</h1>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex: 1 1 0; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><span style="font-size: 12px; color: #637570">{{monthLabel}}</span><span dir="ltr" style="text-align: right; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{monthText}}</span></div>
      <div style="flex: 1 1 0; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><span style="font-size: 12px; color: #637570">{{yearLabel}}</span><span dir="ltr" style="text-align: right; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{yearText}}</span></div>
    </div>

    <sc-if value="{{hasCandidate}}" hint-placeholder-val="{{ true }}">
      <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FBF0DD">
        <span style="font-size: 13px; font-weight: 700; color: #956000">{{candTitle}}</span>
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{candName}}</span><span style="font-size: 12px; color: #6B4600">{{candWhy}}</span></span>
          <span dir="ltr" style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{candAmount}}</span>
        </span>
        <span style="display: flex; gap: 8px">
          <button type="button" class="m-press" onClick="{{confirmCand}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">{{yesLabel}}</button>
          <button type="button" class="m-press" onClick="{{rejectCand}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #6B4600; cursor: pointer; background: rgba(255,255,255,0.7)">{{noLabel}}</button>
        </span>
      </div>
    </sc-if>

    <div style="border-radius: 22px; padding: 4px 16px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
        <sc-if value="{{s.linked}}" hint-placeholder-val="{{ true }}"><a href="SubscriptionDetail.dc.html" data-keep="{{s.keep}}" class="{{s.cls}}" style="{{s.rowStyle}}">
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 700">{{s.name}}</span>
            <span style="font-size: 12px; color: #637570">{{s.sub}}</span>
            <span style="{{s.chipStyle}}">{{s.chip}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <span dir="ltr" style="font-size: 15px; font-weight: 700; color: #BE3D48; font-variant-numeric: tabular-nums">{{s.amount}}</span>
            <span style="font-size: 11px; color: #637570">{{s.cycle}}</span>
          </span>
        </a></sc-if>
        <sc-if value="{{s.plain}}" hint-placeholder-val="{{ false }}"><div class="{{s.cls}}" style="{{s.rowStyle}}">
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 700">{{s.name}}</span>
            <span style="font-size: 12px; color: #637570">{{s.sub}}</span>
            <span style="{{s.chipStyle}}">{{s.chip}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <span dir="ltr" style="font-size: 15px; font-weight: 700; color: #BE3D48; font-variant-numeric: tabular-nums">{{s.amount}}</span>
            <span style="font-size: 11px; color: #637570">{{s.cycle}}</span>
          </span>
        </div></sc-if>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #637570">{{note}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cand: 'pending' }; }
  fmt(minor) { const a = Math.abs(minor), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const k = eg ? 3 : 1, cur = eg ? 'ج.م' : 'ر.س';
    // مخترعة. المدفوعات بتتحسب من عمليات نفس التاجر (مفيش «تسجيل دفعة» منفصل)
    const C = {
      late: { label: eg ? 'متأخرة' : 'متأخرة', style: 'color: #BE3D48; background: rgba(190,61,72,0.10)' },
      soon: { label: eg ? 'قرّبت' : 'قريبة', style: 'color: #956000; background: #FBF0DD' },
      ok: { label: eg ? 'جاية' : 'قادمة', style: 'color: #08634F; background: #DCEBD6' }
    };
    const defs = [
      [eg ? 'فاتورة الكهربا' : 'فاتورة الكهرباء', eg ? 'فاتورة · كان ميعادها 3 أكتوبر' : 'فاتورة · موعدها كان 3 أكتوبر', 38000, 'late', eg ? 'كل شهر' : 'شهرية'],
      [eg ? 'اشتراك الجيم' : 'اشتراك النادي الرياضي', eg ? '9 أكتوبر · بعد يومين' : '9 أكتوبر · بعد يومين', 19900, 'soon', eg ? 'كل شهر' : 'شهري'],
      [eg ? 'النت في البيت' : 'إنترنت المنزل', '15 أكتوبر', 30000, 'ok', eg ? 'كل شهر' : 'شهري'],
      [eg ? 'تخزين سحابي' : 'تخزين سحابي', '20 أكتوبر', 1100, 'ok', eg ? 'كل شهر' : 'شهري']
    ];
    if (this.state.cand === 'yes') defs.push([eg ? 'خدمة أفلام' : 'خدمة بث', '24 أكتوبر', 4500, 'ok', eg ? 'كل شهر' : 'شهري']);
    const KEYS = ['power', 'gym', 'net', 'cloud'];
    const subs = defs.map(([name, sub, v, s, cycle], i) => ({
      linked: !!KEYS[i], plain: !KEYS[i], keep: JSON.stringify({ 'masroufy-sub': KEYS[i] || '' }),
      name, sub, cycle, chip: C[s].label,
      chipStyle: 'align-self: flex-start; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 12px; ' + C[s].style,
      amount: this.fmt(v * k),
      cls: i === 4 ? 'm-in' : '',
      rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 48px; color: inherit; text-decoration: none;' + (i === defs.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);')
    }));
    const month = defs.reduce((s, d) => s + d[2] * k, 0);
    return {
      title: eg ? 'الاشتراكات والفواتير' : 'الاشتراكات والفواتير',
      monthLabel: eg ? 'كل شهر' : 'شهريًا', monthText: this.fmt(month) + ' ' + cur,
      yearLabel: eg ? 'في السنة تقريبًا' : 'سنويًا تقريبًا', yearText: this.fmt(month * 12) + ' ' + cur,
      hasCandidate: this.state.cand === 'pending',
      candTitle: eg ? 'لقينا حاجة شكلها اشتراك' : 'وجدنا ما يشبه اشتراكًا',
      candName: eg ? 'خدمة أفلام' : 'خدمة بث',
      candWhy: eg ? 'نفس المبلغ 3 شهور ورا بعض، يوم 24' : 'المبلغ نفسه 3 أشهر متتالية، يوم 24',
      candAmount: this.fmt(4500 * k) + ' ' + cur,
      yesLabel: eg ? 'أيوه اشتراك' : 'نعم، اشتراك', noLabel: eg ? 'لأ' : 'لا',
      confirmCand: () => this.setState({ cand: 'yes' }),
      rejectCand: () => this.setState({ cand: 'no' }),
      subs,
      note: eg ? 'المدفوعات بتتحسب من عمليات نفس التاجر لوحدها.' : 'تُحسب المدفوعات تلقائيًا من عمليات التاجر نفسه.'
    };
  }
}
</script>
</body>
</html>
