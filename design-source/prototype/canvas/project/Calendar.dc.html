</helmet>

      if (x.flow === 'in') return [(eg ? 'هتستلمه' : 'ستستلمه') + money, '#13764D'];
      if (r != null) return ['محجوز ✓' + money, '#13764D'];
      if (x.amt == null) return [eg ? 'من غير مبلغ' : 'بلا مبلغ', '#637570'];
      return [(eg ? 'مش محجوز' : 'غير محجوز') + money, '#956000'];
    };
    const row = (x, last, card) => {
      const st = status(x), near = x.left >= 0 && x.left <= 3, col = T[x.kind];
      return {
        title: x.t, sub: dstr(x.date) + '، ' + x.type, icon: this.icon(x.icon, col), href: x.href + '.dc.html',
        aria: x.t + '، ' + dstr(x.date) + '، ' + st[0],
        when: x.left < 0 ? ago(-x.left) : after(x.left),
        whenStyle: 'font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; ' + (x.late ? 'color: #BE3D48; background: rgba(190,61,72,0.10)' : near ? 'color: #956000; background: #FBF0DD' : 'color: #637570; background: rgba(25,61,51,0.05)'),
        status: st[0], statusStyle: 'font-size: 11px; font-weight: 700; white-space: nowrap; color: ' + st[1],
        tile: 'width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); background: ' + col + '1F',
        rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 0; color: inherit; text-decoration: none;' + (last ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);'),
        cardStyle: 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 20px; color: inherit; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)' + (x.left < 0 && !x.late ? '; opacity: 0.7' : '')
      };
    };
    // ملخص الأحداث الجاية (الذكي): الأقرب · كام مش محجوز · الأسبوع الأزحم في المواعيد · اللي قبل الراتب على طول
    const next = items.filter((x) => x.left >= 0 || x.late), win = next.filter((x) => x.left <= 30);
    const shown = s.more ? next : win.slice(0, 6);
    const first = next.find((x) => x.left >= 0), unheld = win.filter((x) => x.left >= 0 && x.flow === 'out' && res(x) == null);
    const payLeft = this.dn(NEXT_PAY) - this.dn(TODAY), before = win.find((x) => x.flow === 'out' && x.left >= 0 && payLeft - x.left === 1);
    const smart = [
      first ? (eg ? 'الأقرب: ' : 'الأقرب: ') + first.t + ' ' + after(first.left) : '',
      win.length ? (eg ? 'في الـ٣٠ يوم الجايين ' : 'في الـ٣٠ يومًا القادمة ') + plural(win.filter((x) => x.left >= 0).length, W) + (unheld.length ? (eg ? '، منهم ' : '، منها ') + n(unheld.length) + (eg ? ' مش محجوزين' : ' غير محجوزة') : '') : '',
      before ? before.t + (eg ? ' قبل المرتب بيوم' : ' قبل الراتب بيوم') : ''
    ].filter(Boolean).join('. ') + '.';
    // الشهر المعروض في الشبكة واليوم المختار
    const ym = s.ym, inMonth = items.filter((x) => x.date.slice(0, 7) === ym);
    const marks = inMonth.map((x) => Number(x.date.slice(8)) + ':' + x.kind + ':' + (SHORT[x.id] ? SHORT[x.id][eg ? 1 : 0] : x.t.replace(/[:|]/g, ' ').split(' ')[0]) + ':' + (x.late ? 1 : 0)).join('|') || 'none';
    const mName = MN[Number(ym.slice(5)) - 1];
    const day = s.sel ? inMonth.filter((x) => Number(x.date.slice(8)) === s.sel) : [];
    const defDate = s.sel ? ym + '-' + String(s.sel).padStart(2, '0') : '';
    return {
      spaceName: eg ? 'مصر' : 'السعودية',
      showMain: !empty || s.added.length > 0, isEmpty: empty && !s.added.length,
      sumTitle: eg ? 'الأحداث الجاية' : 'الأحداث القادمة', smart,
      ups: shown.map((x, i) => row(x, i === shown.length - 1)),
      hasMore: next.length > win.slice(0, 6).length, toggleMore: () => this.setState((st) => ({ more: !st.more })),
      moreLabel: s.more ? (eg ? 'أقل' : 'عرض أقل') : (eg ? 'كل الجاي (' : 'كل القادم (') + n(next.length) + ')',
      emptyTitle: eg ? 'مفيش أحداث جاية' : 'لا أحداث قادمة',
      emptyBody: eg ? 'ضيف حدث، أو هتظهر هنا لوحدها مواعيد اشتراكاتك وأقساطك وجمعياتك ومناسبات أشخاصك.' : 'أضف حدثًا، أو تظهر هنا تلقائيًا مواعيد اشتراكاتك وأقساطك وجمعياتك ومناسبات أشخاصك.',
      defDate, onAdd: this.onAdd,
      ym, today: TODAY, marks, selText: s.sel ? String(s.sel) : '', noPrev: ym === MONTHS[0] ? '1' : '0', noNext: ym === MONTHS[MONTHS.length - 1] ? '1' : '0',
      onPick: this.onPick, onMonth: this.onMonth,
      dayTitle: s.sel ? (eg ? 'يوم ' : 'يوم ') + n(s.sel) + ' ' + mName : (eg ? 'دوس على يوم تشوف مواعيده' : 'اضغط يومًا لترى مواعيده'),
      hasSel: !!s.sel, allLabel: eg ? 'إلغاء الاختيار' : 'إلغاء الاختيار', clearSel: () => this.setState({ sel: 0 }),
      noDay: !!s.sel && day.length === 0, noDayText: eg ? 'مفيش مواعيد في اليوم ده — تقدر تضيف حدث فيه من الزرار اللي فوق.' : 'لا مواعيد في هذا اليوم — يمكنك إضافة حدث فيه من الزر أعلاه.',
      dayRows: day.map((x) => row(x, true)),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
