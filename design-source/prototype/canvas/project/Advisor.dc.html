<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التحليلات الذكية — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-in{animation:m-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
.m-toast{animation:m-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
.n-track{transition:background 220ms cubic-bezier(.2,.7,.3,1)}
.n-knob{transition:right 320ms cubic-bezier(.18,.9,.28,1.08)}
@keyframes m-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes m-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.m-press,.n-track,.n-knob{transition:none}.m-press:active{transform:none}.m-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="Investment.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{title}}</h1>
    </div>
    <span style="font-size: 13px; color: #637570">{{intro}}</span>

    <sc-if value="{{isApprox}}" hint-placeholder-val="{{ false }}">
      <div role="note" style="border-radius: 18px; padding: 12px 16px; font-size: 13px; color: #6B4600; background: #FBF0DD">{{approxText}}</div>
    </sc-if>

    <sc-if value="{{isQuietAll}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 8px; text-align: center">
        <div aria-label="مكان رسمة الشاشة الفاضية" style="width: 120px; height: 80px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed rgba(8,99,79,0.35); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #637570">رسمة بخط واحد</div>
        <span style="font-size: 14px; font-weight: 700; margin-top: 8px">{{quietTitle}}</span>
        <span style="font-size: 13px; color: #637570">{{quietBody}}</span>
      </div>
    </sc-if>

    <sc-if value="{{showCards}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">{{nowTitle}}</h2>
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
          <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
            <div style="display: flex; gap: 12px; align-items: flex-start">
              <div aria-hidden="true" style="{{c.iconBox}}">
                <sc-if value="{{c.icTrend}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg></sc-if>
                <sc-if value="{{c.icAlert}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg></sc-if>
                <sc-if value="{{c.icPiggy}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"></path><path d="M2 9v1c0 1.1.9 2 2 2h1"></path><path d="M16 11h.01"></path></svg></sc-if>
                <sc-if value="{{c.icReceipt}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17.5v-11"></path></svg></sc-if>
                <sc-if value="{{c.icCal}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></sc-if>
              </div>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 14px; font-weight: 700">{{c.title}}</span><sc-if value="{{c.approx}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; color: #956000; background: #FBF0DD">تقريبي</span></sc-if></span>
                <span style="font-size: 13px; color: #637570">{{c.body}}</span>
                <a href="{{c.href}}" data-keep="{{c.keep}}" onClick="{{c.prep}}" class="m-press" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 40px; font-size: 13px; font-weight: 700; color: #08634F; text-decoration: none">{{c.action}}</a>
              </div>
            </div>
            <button type="button" class="m-press" onClick="{{c.toggle}}" aria-expanded="{{c.open}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 12px; font-weight: 700; color: #4F625C; cursor: pointer; background: rgba(25,61,51,0.05)">{{c.whyLabel}}<span style="font-size: 11px; color: #637570">{{c.when}}</span></button>
            <sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}">
              <div class="m-in" style="border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; background: rgba(25,61,51,0.04)">
                <span style="font-size: 12px; font-weight: 700">{{c.why}}</span>
                <span style="font-size: 12px; color: #4F625C">{{c.basis}}</span>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 700; color: #4F625C">{{quietListTitle}}</h2>
        <div style="border-radius: 22px; padding: 4px 16px; background: rgba(25,61,51,0.04)">
          <sc-for list="{{quiet}}" as="q" hint-placeholder-count="3">
            <div style="{{q.rowStyle}}">
              <span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1 1 auto; font-size: 14px; font-weight: 700">{{q.title}}</span><span style="font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; color: #637570; background: rgba(25,61,51,0.06)">{{quietChip}}</span></span>
              <span style="font-size: 12px; color: #4F625C">{{q.rule}}</span>
              <span style="font-size: 12px; color: #637570">{{q.now}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isOff}}" hint-placeholder-val="{{ false }}">
      <div class="m-in" style="border-radius: 22px; padding: 14px 16px; font-size: 13px; color: #4F625C; background: rgba(25,61,51,0.05)">{{offText}}</div>
    </sc-if>

    <div style="border-radius: 22px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{groupTitle}}</span><span style="font-size: 12px; color: #637570">{{groupDesc}}</span></span>
      <button type="button" role="switch" aria-checked="{{groupOn}}" aria-label="{{groupTitle}}" onClick="{{toggleGroup}}" style="width: 56px; height: 48px; flex-shrink: 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <span class="n-track" style="{{track}}"><span class="n-knob" style="{{knob}}"></span></span>
      </button>
    </div>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 28px; z-index: 10; display: flex; justify-content: center; pointer-events: none">
      <div role="status" class="m-toast" style="max-width: 330px; padding: 12px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(25,61,51,0.92); box-shadow: 0 14px 30px rgba(16,45,53,0.25)">{{toast}}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","فاضي","تقريبي"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>

      [eg ? 'حجوزاتك أكتر من اللي معاك' : 'حجوزاتك أكثر مما معك', eg ? 'بيظهر لو اللي حجزته زاد عن الفلوس اللي معاك — في وقتك المعتاد.' : 'يظهر إذا زاد ما حجزته على ما معك — في وقتك المعتاد.', eg ? 'دلوقتي: حجزت ' + m(50000) + ' ومعاك ' + mx(735000, 2530000) + '.' : 'الآن: حجزت ' + m(50000) + ' ومعك ' + mx(735000, 2530000) + '.'],
      [eg ? 'المرتب قرّب' : 'الراتب قريب', eg ? 'آخر 5 أيام قبل المرتب، لو اللي معاك أقل من مستحقاتك وصرفك العادي لحده.' : 'في آخر 5 أيام قبل الراتب، إذا قلّ ما معك عن مستحقاتك وصرفك المعتاد حتى نزوله.', eg ? 'المرتب كمان 21 يوم.' : 'الراتب بعد 21 يومًا.'],
      [eg ? 'المرتب نزل' : 'نزل الراتب', eg ? 'لحد 3 أيام بعد المرتب: «حوّل ' + mx(153334, 460000) + ' لخطة «السفر» قبل ما تصرف».' : 'خلال 3 أيام من نزول الراتب: «حوّل ' + mx(153334, 460000) + ' لخطة «السفر» قبل أن تصرف».', eg ? 'آخر مرتب 28 سبتمبر — الفترة دي عدّت.' : 'آخر راتب 28 سبتمبر — انتهت مدته.'],
      [eg ? 'فاتورة أعلى من العادي' : 'فاتورة أعلى من المعتاد', eg ? 'لو فاتورة دورية جت 125% أو أكتر من وسيط آخر 3 دفعات.' : 'إذا جاءت فاتورة دورية بـ125% أو أكثر من وسيط آخر 3 دفعات.', eg ? 'فاتورة الكهربا لسه ما اتدفعتش الشهر ده.' : 'فاتورة الكهرباء لم تُدفع بعد هذا الشهر.'],
      [eg ? 'اشتراكات شبه بعض' : 'اشتراكات متشابهة', eg ? 'لو عندك اشتراكين أو أكتر في نفس التصنيف.' : 'إذا كان لديك اشتراكان أو أكثر في التصنيف نفسه.', eg ? 'اشتراكاتك دلوقتي كل واحد في تصنيف.' : 'اشتراكاتك الآن في تصنيفات مختلفة.']
    ];
    const cards = ACTIVE.map((c) => {
      const open = s.open === c.id;
      return { title: c.title, body: c.body, action: c.action, href: c.link[0], keep: c.link[1], prep: c.link[2] || (() => {}), approx: !!c.approx,
        icTrend: c.ic === 'trend', icAlert: c.ic === 'alert', icPiggy: c.ic === 'piggy', icReceipt: c.ic === 'receipt', icCal: c.ic === 'cal',
        iconBox: 'width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (c.good ? 'background: #DCEBD6; color: #08634F' : 'background: #FBF0DD; color: #956000'),
        open, toggle: () => this.setState({ open: open ? null : c.id }), whyLabel: eg ? 'ليه؟' : 'لماذا؟', when: '· ' + c.when, why: c.why, basis: c.basis };
    });
    const quiet = QUIET.map(([title, rule, now], i) => ({ title, rule, now, rowStyle: 'display: flex; flex-direction: column; gap: 2px; padding: 10px 0;' + (i === QUIET.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);') }));
    const on = s.on;
    return {
      title: eg ? 'التحليلات الذكية' : 'التحليلات الذكية',
      intro: eg ? 'المساعد المالي بيقرا عملياتك ويقيس على خططك. كل كارت بسببه ومصدره، والعدّ بالمرات.' : 'يقرأ المساعد المالي عملياتك ويقيس على خططك. لكل كارت سببه ومصدره، والعدّ بالمرات.',
      isApprox: approx && on, approxText: eg ? 'فيه أرقام تقريبية: رصيد «مصرف الإنماء» مش مطابق للكشف.' : 'بعض الأرقام تقريبية: رصيد «مصرف الإنماء» غير مطابق للكشف.',
      isQuietAll: quietAll && on, quietTitle: eg ? 'المساعد ساكت دلوقتي' : 'المساعد ساكت الآن', quietBody: eg ? 'مفيش حاجة تستاهل تنبيه. أول ما يظهر حاجة هتلاقيها هنا وفي الرئيسية.' : 'لا شيء يستحق التنبيه. ما يظهر ستجده هنا وفي الرئيسية.',
      showCards: !quietAll && on, nowTitle: eg ? 'دلوقتي' : 'الآن', cards,
      quietListTitle: eg ? 'ساكتين دلوقتي — وإمتى بيظهروا' : 'ساكتة الآن — ومتى تظهر', quietChip: eg ? 'ساكت' : 'ساكت', quiet,
      isOff: !on, offText: eg ? 'المساعد مقفول: كروته مش هتظهر في الرئيسية ولا في الإشعارات. أرقامك نفسها ما بتتغيرش.' : 'المساعد مغلق: لا تظهر كروته في الرئيسية ولا في الإشعارات. أرقامك نفسها لا تتغير.',
      groupTitle: eg ? 'المساعد المالي' : 'المساعد المالي', groupDesc: eg ? 'زرار واحد بيقفل الـ11 تنبيه كلهم' : 'زر واحد يغلق التنبيهات الـ11 كلها', groupOn: on ? 'true' : 'false',
      toggleGroup: () => { this.setState({ on: !on, open: null }); this.say(on ? (eg ? 'اتقفل المساعد — تقدر تفتحه من هنا أو من إعدادات الإشعارات' : 'أُغلق المساعد — افتحه من هنا أو من إعدادات الإشعارات') : (eg ? 'المساعد اشتغل تاني' : 'عاد المساعد للعمل')); },
      track: 'position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; ' + (on ? 'background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 2px rgba(0,47,48,0.25)' : 'background: rgba(25,61,51,0.16); box-shadow: inset 0 1px 2px rgba(25,61,51,0.12)'),
      knob: 'position: absolute; top: 2px; right: ' + (on ? 20 : 2) + 'px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(16,45,53,0.22)',
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
