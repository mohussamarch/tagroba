<style>
body{margin:0}
.c-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.c-press:active{transform:scale(.97)}
.c-veil{animation:c-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.c-rise{animation:c-rise 450ms cubic-bezier(.2,.7,.3,1) both}
.c-pop{animation:c-pop 420ms cubic-bezier(.18,.9,.28,1.08) both}
.c-dot{animation:c-dot 900ms cubic-bezier(.2,.7,.3,1) infinite alternate}
.c-dot:nth-child(2){animation-delay:150ms}.c-dot:nth-child(3){animation-delay:300ms}
.c-wave{animation:c-wave 700ms cubic-bezier(.2,.7,.3,1) infinite alternate;transform-origin:center}
.c-wave:nth-child(2){animation-delay:120ms}.c-wave:nth-child(3){animation-delay:240ms}.c-wave:nth-child(4){animation-delay:360ms}.c-wave:nth-child(5){animation-delay:480ms}
.c-scroll{scrollbar-width:none}.c-scroll::-webkit-scrollbar{display:none}.c-scroll>*{flex-shrink:0}
.c-box{transition:box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.c-box:focus-within{box-shadow:inset 0 0 0 2px #08634F,0 10px 26px rgba(8,99,79,0.18)!important}
.c-box input:focus-visible{box-shadow:none}
.c-box input::placeholder{color:#6E7F7A}
.c-toast{animation:c-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
@keyframes c-fade{from{opacity:0}to{opacity:1}}
@keyframes c-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes c-pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes c-dot{from{opacity:.3;transform:translateY(0)}to{opacity:1;transform:translateY(-3px)}}
@keyframes c-wave{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes c-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.c-press,.c-box{transition:none}.c-press:active{transform:none}.c-rise,.c-pop,.c-toast{animation:c-fade 150ms both}.c-dot,.c-wave{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>

<script type="text/x-dc" data-dc-script data-props='{"context":{"editor":"enum","options":["الرئيسية","العمليات","الأشخاص","الاستثمار","المزيد"],"default":"الرئيسية","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"listenFirst":{"editor":"boolean","default":false,"section":"الحالة"},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
// صفحة المحادثة مع المساعد (طلب المالك ٢٠٢٦-١٠-٠٩: «يكون شكله شات، فيه مستطيل واضح أكتب فيه وتحته الاقتراحات، ومكان لسجل المحادثات، ويتعلّم من اللي بسأله ويقترح، ويقترح عليّا حاجات لسه ما عملتهاش»)

const KEY = { cur: 'masroufy-ask-current', ses: 'masroufy-ask-sessions', learn: 'masroufy-ask-learned', done: 'masroufy-ask-done', main: 'masroufy-main-wallet', gone: 'masroufy-notif-gone', unk: 'masroufy-ask-unknown' };
const HOUR = 3600000, BANKS = { rajhi: 'مصرف الراجحي', ahli: 'البنك الأهلي السعودي', inma: 'مصرف الإنماء', nbe: 'البنك الأهلي المصري', qnb: 'QNB مصر' };

const RULES = [[/قسّ?م|تقسيم/, 'split', 'split'], [/أحمد|سارة/, 'owed', 'split'], [/خالد/, 'lak', 'debts'], [/فهد|اتأخر|تأخر|متأخر/, 'late', 'debts'], [/قهو|كافي|كوفي/, 'coffee', 'coffee'], [/مطعم|مطاعم|أكل|اكل|غدا|عشا/, 'food', 'food'], [/إيجار|ايجار/, 'rent', 'rent'], [/كهرب|مياه|المي[ةه]/, 'bills', 'bills'], [/ميزاني|خطة|سقف/, 'plan', 'budget'], [/حوّ?ش|ادّ?خار|هدف|السفر/, 'goal', 'goal'], [/راتب|مرتب|قبض/, 'salary', 'salary'], [/مرس[يى]|[آا]خر مر[ةه]|[آا]خر عملي[ةه]/, 'store', 'store'], [/قفل/, 'lock', '']];
// §78-١ فهرس الشاشات: الكلام بيتوحّد الأول (من غير تشكيل، أ/إ/آ⇒ا، ة⇒ه، ى⇒ي) وبعدين كلمة ⇒ شاشة [الكلمات بعد التوحيد، الملف، الاسم]
const NAV = [[/زكا/, 'Zakat', 'الزكاة'], [/ميزاني|سقف/, 'Budgets', 'الميزانيات'], [/محافظ|محفظ|رصيد|حساباتي/, 'Wallets', 'المحافظ'], [/اشتراك/, 'Subscriptions', 'الاشتراكات'], [/قسط|اقساط|تقسيط/, 'Installments', 'الأقساط'],
  [/ورث|ميراث|مواريث|تركه/, 'InheritanceCalculator', 'حاسبة الورث'], [/جمعي/, 'Roscas', 'الجمعيات'], [/كشف|استيراد/, 'StatementImport', 'كشف الحساب'], [/رسايل|رسائل|رساله/, 'BankSms', 'رسائل البنك'], [/نسخه|احتياط|باك ?اب/, 'Backup', 'النسخة الاحتياطية'],
  [/تصنيف/, 'Categories', 'التصنيفات'], [/اشعار|تنبيه/, 'Notifications', 'الإشعارات'], [/مشروع|مشاريع/, 'Projects', 'المشاريع'], [/تقاعد|معاش/, 'RetirementCalculator', 'حاسبة التقاعد'], [/مصادر|دخلي/, 'IncomeSources', 'مصادر الدخل'],
  [/استثمار|ذهب|اسهم/, 'Investment', 'الاستثمار'], [/تحويلات|حوالات/, 'Transfers', 'التحويلات'], [/قواعد|تجار/, 'Rules', 'القواعد والتجار'], [/مناسب|احداث/, 'Events', 'الأحداث'], [/ديون|دين|سلف/, 'DuesDebts', 'الديون'], [/ملفي|بروفايل/, 'Account', 'ملفك']];
// لو مفيش حروف مشتركة: أقرب الشاشات للصفحة اللي هو فيها
const NEAR = { 'الرئيسية': ['Budgets', 'Wallets', 'Notifications'], 'العمليات': ['Categories', 'BankSms', 'Rules'], 'الأشخاص': ['DuesDebts', 'Roscas', 'Events'], 'الاستثمار': ['Zakat', 'Investment', 'RetirementCalculator'], 'المزيد': ['Wallets', 'Backup', 'Account'] };
// نوع المصروف من الكلام: [كلمة، علامة، الاسم فصحى، مصري، التصنيف فصحى، مصري، الأيقونة، اللون، بيتدفع من البنك عادةً]
const CATS = [[/قهو|كافي|كوفي/, 'coffee', 'قهوة', 'قهوة', 'مطاعم وقهوة', 'أكل وقهوة', 'coffee', '#A36A21'], [/مطعم|غدا|عشا|أكل|اكل|فطور/, 'food', 'مطعم', 'أكل برّه', 'مطاعم وقهوة', 'أكل وقهوة', 'food', '#A36A21'],
  [/كهرب/, 'elec', 'فاتورة الكهرباء', 'فاتورة الكهربا', 'فواتير', 'فواتير', 'bill', '#956000', 1], [/مياه|المي[ةه]/, 'water', 'فاتورة المياه', 'فاتورة المية', 'فواتير', 'فواتير', 'bill', '#4D747C'],
  [/إيجار|ايجار/, 'rent', 'الإيجار', 'الإيجار', 'السكن', 'السكن', 'home', '#2469BA', 1], [/بنزين|وقود/, 'fuel', 'بنزين', 'بنزين', 'مواصلات', 'مواصلات', 'car', '#4D747C'], [/بقال|سوبر|خضار/, 'grocery', 'بقالة', 'بقالة', 'بقالة وسوبرماركت', 'بقالة وسوبرماركت', 'bag', '#3866A7']];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const c0 = this.read(KEY.cur, null), cur = c0 && c0.at && Date.now() - c0.at > HOUR ? null : c0; // ساعة من غير كلام ⇒ محادثة جديدة، واللي فاتت في السجل (قرار المالك)
    this.state = { cid: cur && cur.id ? cur.id : 'c' + Date.now(), msgs: cur && Array.isArray(cur.msgs) ? cur.msgs : [], typing: false, listening: false, draft: '', hist: false, toast: '', tk: 0, lv: 0 };

  }

  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }

  read(k, def) { try { const v = JSON.parse(window.sessionStorage.getItem(k) || 'null'); return v == null ? def : v; } catch (e) { return def; } }

  learned() { const v = this.read(KEY.learn, null); return v && v.topics ? v : { on: true, topics: { coffee: 3, rent: 2, split: 1 }, recent: [] }; }
