<style>
body{margin:0}
.h-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.h-press:active{transform:scale(.97)}

:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}

</helmet>
<a href="{{href}}" class="h-press" aria-label="{{aria}}" dir="rtl" style="display: flex; flex-direction: column; gap: 12px; border-radius: 22px; padding: 14px 16px; color: #193D33; text-decoration: none; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
  <span style="display: flex; align-items: center; gap: 12px">
    <span aria-hidden="true" style="{{iconBox}}">
      <sc-if value="{{isTop}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M8 17V9M13 17V5M18 17v-3"></path></svg></sc-if>
      <sc-if value="{{isGoals}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg></sc-if>
    </span>
    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{title}}</span><span style="font-size: 12px; color: #637570">{{sub}}</span></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
  </span>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
    <span style="display: flex; flex-direction: column; gap: 5px">
      <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px"><span style="font-weight: 700">{{r.name}}</span><span style="color: #4F625C">{{r.val}}</span></span>
      <span aria-hidden="true" style="height: 6px; border-radius: 3px; overflow: hidden; background: rgba(25,61,51,0.08)"><span style="{{r.bar}}"></span></span>
    </span>
  </sc-for>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["top","goals"],"default":"top","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":200}}'>
// كارتين في الرئيسية بنفس الشكل (اختيار المالك 2026-10-15): top «أكتر حاجة صرفت فيها» (أكبر 3 تصنيفات الشهر ده) · goals «أهدافك» (تقدّم الادخار)
// الأشرطة: top بالنسبة لأكبر تصنيف، goals بالنسبة لهدف كل واحد · الأرقام مخترعة بالوحدة الصغرى ومتسقة مع الرئيسية (القهوة 640 · مصر ×3)
// في التطبيق: حالات استخدام (TopCategories · GoalsProgress) — الشاشة ما بتحسبش
const withCur = (v, c) => (c === '⃁' ? '⁦⃁ ' + v + '⁩' : v + ' ' + c);
const TOP = [[['أكل', 'أكل'], 184000], [['مواصلات', 'مواصلات'], 92000], [['قهوة', 'قهوة'], 64000]];
const GOALS = [[['السفر', 'السفر'], 620000, 1000000], [['السيارة', 'العربية'], 900000, 5000000]];
class Component extends DCLogic {
  fmt(m) { const a = Math.abs(m); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a), cur = eg ? 'ج.م' : '⃁', x = eg ? 3 : 1, L = (p) => (eg ? p[1] : p[0]);
    const goals = this.props.kind === 'goals', bar = (pct, col) => 'display: block; height: 6px; border-radius: 3px; background: ' + col + '; width: ' + Math.max(3, pct) + '%';
    const max = TOP[0][1] * x;
    const rows = goals
      ? GOALS.map(([n, have, goal]) => { const pct = Math.floor((have * 100) / goal); return { name: L(n), val: withCur(this.fmt(have * x), cur) + T(' من ', ' من ') + this.fmt(goal * x) + ' · \u2066' + pct + '%\u2069', bar: bar(pct, '#27785B') }; })
      : TOP.map(([n, v]) => ({ name: L(n), val: withCur(this.fmt(v * x), cur), bar: bar(Math.round((v * x * 100) / max), '#2E7D5B') }));
    const title = goals ? T('أهدافك', 'أهدافك') : T('أكثر ما صرفت عليه', 'أكتر حاجة صرفت فيها');
    return {
      isTop: !goals, isGoals: goals, href: goals ? 'SavingsGoals.dc.html' : 'Categories.dc.html', rows, title,
      sub: goals ? T('ادخارك نحو أهدافك', 'فلوسك رايحة لأهدافك') : T('هذا الشهر', 'الشهر ده'),
      iconBox: 'width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (goals ? 'color: #13764D; background: #E3F1E6' : 'color: #3E5C9A; background: #E7EDF8'),
      aria: title + ': ' + rows.map((r) => r.name).join('، ')
    };
  }
}
</script>
