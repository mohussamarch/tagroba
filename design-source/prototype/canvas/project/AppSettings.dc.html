body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}

<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">

<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","غير متاح","خطأ"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // القفل مقفول في الأول (§21) · المحتوى الإسلامي ظاهر مبدئيًا (§62-د) · «خطأ» = أول تأكيد بيفشل والإعادة بتنجح
    this.state = { lock: false, confirm: null, failed: false, tries: 0, lang: 'ar', islamic: true, toast: '' };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  say(msg) { this.timers.push(setTimeout(() => this.setState({ toast: '' }), 2700)); this.setState({ toast: msg }); }
  renderVals() {
    const st = this.props.state ?? 'عادي';
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const s = this.state;
    const na = st === 'غير متاح';
    const sw = (on, dim) => ({
      track: 'position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; ' + (on ? 'background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 2px rgba(0,47,48,0.25)' : 'background: rgba(25,61,51,0.16); box-shadow: inset 0 1px 2px rgba(25,61,51,0.12)') + (dim ? '; opacity: 0.45' : ''),
      knob: 'position: absolute; top: 2px; right: ' + (on ? 20 : 2) + 'px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(16,45,53,0.22)'
    });
    const lk = sw(s.lock, na), isl = sw(s.islamic, false);
    // نصوص القفل من Texts*.kt: LOCK_CONFIRM_ENABLE/DISABLE · LOCK_UNLOCK_SUBTITLE · LOCK_FAILED · LOCK_CANCELLED · LOCK_UNAVAILABLE
    const T = {
      on: eg ? 'أكّد علشان تشغّل قفل مصروفي' : 'أكّد لتفعيل قفل مصروفي',
      off: eg ? 'أكّد علشان توقف قفل مصروفي' : 'أكّد لإيقاف قفل مصروفي',
      failed: eg ? 'ما اتأكدش إنك صاحب الجوال — ما اتغيّرش حاجة.' : 'تعذّر التحقق من أنك صاحب الجوال — لم يتغير شيء.',
      cancelled: eg ? 'اتلغى التأكيد — ما اتغيّرش حاجة.' : 'أُلغي التأكيد — لم يتغير شيء.'
    };
    const finish = () => {
      const want = s.confirm === 'on';
      if (st === 'خطأ' && s.tries === 0) { this.setState({ confirm: null, failed: true, tries: 1 }); return; }
      this.setState({ confirm: null, failed: false, lock: want });
      this.say(want ? (eg ? 'القفل اشتغل' : 'تم تفعيل القفل') : (eg ? 'القفل اتوقف' : 'تم إيقاف القفل'));
    };
    const arName = eg ? 'المصري' : 'الفصحى المختصرة';
    const langDefs = [
      ['ar', 'العربية', '', 'ar', eg ? 'لوحده حسب البلد: السعودية بالفصحى المختصرة، ومصر بالمصري. دلوقتي: ' + arName + '.' : 'تلقائيًا حسب البلد: السعودية بالفصحى المختصرة، ومصر باللهجة المصرية. الآن: ' + arName + '.'],
      ['en', 'English', eg ? 'الإنجليزي' : 'الإنجليزية', 'en', eg ? 'الشاشة بتتقلب وتبدأ من الشمال.' : 'تنقلب الشاشة فتبدأ من اليسار.']
    ];
    const langs = langDefs.map(([id, name, alt, code, desc], i) => {
      const on = s.lang === id;
      return {
        name, alt, code, desc, checked: on ? 'true' : 'false',
        pick: () => { if (s.lang === id) return; this.setState({ lang: id }); this.say(eg ? 'اللغة بتتطبق لما تفتح البرنامج تاني.' : 'تُطبَّق اللغة عند فتح التطبيق مرة أخرى.'); },
        rowStyle: 'width: 100%; border: 0; background: transparent; font: inherit; color: #193D33; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 0;' + (i === 0 ? ' border-bottom: 1px solid rgba(204,216,204,0.55);' : ''),
        dot: 'width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1.5px ' + (on ? '#08634F' : 'rgba(25,61,51,0.30)'),
        dotIn: 'width: 12px; height: 12px; border-radius: 6px; background: ' + (on ? '#08634F' : 'transparent')
      };
    });
    const ltr = s.lang === 'en';
    const row = 'display: flex; align-items: center; gap: 6px; flex-direction: ' + (ltr ? 'row-reverse' : 'row');
    const islDefs = [eg ? 'الزكاة في الاستثمار وميعادها وإشعاراتها' : 'الزكاة في الاستثمار وموعدها وتنبيهاتها', eg ? 'رمضان والعيدين في التقويم' : 'رمضان والعيدان في التقويم'];
    return {
      title: eg ? 'القفل واللغة والمحتوى' : 'القفل واللغة والمحتوى',
      lockHead: 'القفل',
      lockTitle: eg ? 'قفل البصمة' : 'قفل البصمة',
      lockDesc: eg ? 'بيتقفل لما تفتح البرنامج، وبعد 5 دقايق في الخلفية.' : 'يُقفل عند فتح التطبيق، وبعد 5 دقائق في الخلفية.',
      lockChecked: s.lock ? 'true' : 'false', lockOn: s.lock && !na, lockNA: na,
      lockBtn: 'width: 56px; height: 48px; flex-shrink: 0; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: ' + (na ? 'default' : 'pointer'),
      lockTrack: lk.track, lockKnob: lk.knob,
      lockTap: () => { if (na) return; this.setState({ confirm: s.lock ? 'off' : 'on' }); },
      lockFacts: eg
        ? ['الرجوع قبل 5 دقايق مش بيسأل.', 'لو البصمة ما نفعتش: رمز قفل الجوال.', 'البرنامج بيفضل متغطي ببلور لحد ما تتأكد.']
        : ['العودة قبل 5 دقائق لا تطلب البصمة.', 'إن تعذّرت البصمة: رمز قفل الجوال.', 'يبقى التطبيق خلف ضبابية حتى التحقق.'],
      naText: eg ? 'الجوال مالوش قفل شاشة ولا بصمة متسجلة. اعمل قفل شاشة من إعدادات الجوال الأول.' : 'لا قفل شاشة ولا بصمة مسجلة في الجوال. فعّل قفل الشاشة من إعدادات الجوال أولًا.',
      lockErr: s.failed && !na, errText: T.failed,
      retryLabel: eg ? 'جرّب تاني' : 'أعد المحاولة',
      retry: () => this.setState({ confirm: s.lock ? 'off' : 'on' }),
      langHead: 'اللغة', langs,
      dirNote: ltr ? (eg ? 'اتجاه الشاشة: من الشمال لليمين.' : 'اتجاه الشاشة: من اليسار إلى اليمين.') : (eg ? 'اتجاه الشاشة: من اليمين للشمال.' : 'اتجاه الشاشة: من اليمين إلى اليسار.'),
      dirRows: [row, row],
      islHead: eg ? 'المحتوى الإسلامي' : 'المحتوى الإسلامي',
      islTitle: eg ? 'اظهر المحتوى الإسلامي' : 'إظهار المحتوى الإسلامي',
      islDesc: s.islamic ? (eg ? 'ظاهر' : 'ظاهر') : (eg ? 'مخفي' : 'مخفي'),
      islChecked: s.islamic ? 'true' : 'false', islTrack: isl.track, islKnob: isl.knob,
      islTap: () => { const v = !s.islamic; this.setState({ islamic: v }); this.say(v ? (eg ? 'المحتوى الإسلامي ظاهر' : 'أصبح المحتوى الإسلامي ظاهرًا') : (eg ? 'المحتوى الإسلامي اتخفى' : 'أُخفي المحتوى الإسلامي')); },
      islListHead: s.islamic ? (eg ? 'بيظهر:' : 'يظهر:') : (eg ? 'مخفي دلوقتي:' : 'مخفي الآن:'),
      islItems: islDefs.map((label) => ({ label,
        style: 'display: flex; align-items: center; gap: 8px; font-size: 13px; color: ' + (s.islamic ? '#193D33' : '#637570') + (s.islamic ? '' : '; text-decoration: line-through'),
        dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + (s.islamic ? '#13764D' : 'rgba(25,61,51,0.25)') })),
      islNote: eg ? 'إخفا بس — مفيش حاجة بتتمسح، ولما ترجّعه بيرجع زي ما كان.' : 'إخفاء فقط — لا يُحذف شيء، ويعود كما كان عند إظهاره.',
      confirming: !!s.confirm,
      osNote: eg ? 'نافذة نظام الجوال — شكلها بيختلف من جهاز للتاني' : 'نافذة نظام الجوال — يختلف شكلها من جهاز لآخر',
      confirmTitle: s.confirm === 'off' ? T.off : T.on,
      confirmSub: 'بالبصمة أو برمز الجوال',
      touchLabel: eg ? 'المس الحساس' : 'المس المستشعر',
      touch: finish,
      cancelLabel: eg ? 'إلغاء' : 'إلغاء',
      cancelConfirm: () => { this.setState({ confirm: null }); this.say(T.cancelled); },
      closeConfirm: () => { this.setState({ confirm: null }); this.say(T.cancelled); },
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
