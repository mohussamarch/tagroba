<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>علامة التحميل — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: #F4F2EA">
  <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 19px; font-weight: 700">{{title}}</span><span style="font-size: 12px; color: #637570">{{sub}}</span></span>

  <div style="{{card}}">
    <span style="{{cap}}">{{t.screen}}</span>
    <div style="height: 196px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: rgba(25,61,51,0.03)"><dc-import name="CoinLoader" size="112" text="{{t.screenText}}" hint-size="170px,150px"></dc-import></div>
  </div>

  <div style="{{card}}">
    <span style="{{cap}}">{{t.pull}}</span>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{frames}}" as="fr" hint-placeholder-count="4">
        <div style="flex: 1 1 0; min-width: 0; height: 92px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(25,61,51,0.04)">
          <dc-import name="CoinLoader" size="38" count="{{fr.count}}" text="" hint-size="38px,38px"></dc-import>
          <span style="font-size: 11px; line-height: 1.4; color: #637570; text-align: center">{{fr.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="{{card}}">
    <span style="{{cap}}">{{t.button}}</span>
    <div style="height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)"><dc-import name="CoinLoader" size="28" row="{{ true }}" tone="على أخضر" text="{{t.buttonText}}" hint-size="120px,28px"></dc-import></div>
  </div>

  <div style="border-radius: 16px; padding: 10px 12px; font-size: 12px; line-height: 1.7; color: #193D33; background: rgba(166,222,193,0.35)">{{t.tryIt}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// علامة التحميل والتحديث «عملات بتترص» (اختيار المالك 2026-10-22) — المكوّن نفسه `CoinLoader` اللي متركّب في العمليات والرئيسية
// المالك: «محتاجها في كله» ⇐ أي شاشة بتحمّل · السحب للتحديث (العملات بتترص واحدة واحدة مع السحب، وبعد ما يسيب الحركة تشتغل) · أي زرار وهو بيحفظ
class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const t = eg ? {
      screen: 'الشاشة وهي بتحمّل', screenText: 'بنجهّز فلوسك…',
      pull: 'السحب للتحديث — بتترص وانت بتسحب',
      button: 'جوه الزرار وهو بيحفظ', buttonText: 'بيتحفظ…',
      tryIt: 'جرّبها في النموذج: افتح «العمليات» أو «الرئيسية» واسحب الصفحة لتحت بالماوس (دوس واسحب) أو لفّ عجلة الماوس لفوق وانت في أول الصفحة.'
    } : {
      screen: 'تحميل الشاشة', screenText: 'نجهّز أموالك…',
      pull: 'السحب للتحديث — تتراص أثناء السحب',
      button: 'داخل الزر أثناء الحفظ', buttonText: 'جارٍ الحفظ…',
      tryIt: 'جرّبها في النموذج: افتح «العمليات» أو «الرئيسية» واسحب الصفحة للأسفل بالفأرة، أو أدر العجلة للأعلى وأنت في أول الصفحة.'
    };
    const fl = eg ? ['اسحب…', 'اسحب كمان…', 'سيب', 'بنحدّث…'] : ['اسحب…', 'اسحب أكثر…', 'أفلت', 'جارٍ التحديث…'];
    return {
      t,
      title: eg ? 'علامة التحميل — عملات بتترص' : 'علامة التحميل — عملات تتراص',
      sub: eg ? 'نفس العلامة في كل مكان بيحمّل أو بيحدّث أو بيحفظ' : 'العلامة نفسها في كل تحميل وتحديث وحفظ',
      card: 'border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 1px 2px rgba(29,54,53,0.05), 0 12px 28px rgba(29,54,53,0.08)',
      cap: 'font-size: 13px; font-weight: 700; color: #637570',
      frames: [1, 2, 3, -1].map((count, i) => ({ count, label: fl[i] }))
    };
  }
}
</script>
</body>
</html>
