<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"مصر","section":"الحالة"},"bare":{"editor":"boolean","default":false,"section":"الحالة"},"$preview":{"width":390,"height":300}}'>
// «محتاجة مراجعة» (بند 7 · قرار المالك (و) 2026-10-17): مدخل واحد بدل 3 شرايط في العمليات
// التحويل اللي شكله اتأكد وطرفه مش معروف بيظهر هنا تحت «مين ده؟» وما بيتحسبش صرف لحد ما ترد — السطر الأصفر بيقول قد إيه مستني. كلام قصير
class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'مصر') === 'مصر', T = (sa, e) => (eg ? e : sa);
    const R = [['BankSms', T('رسائل بانتظار التأكيد', 'رسايل مستنية تأكيد'), 4, '#956000'], ['ReviewQueue', T('نوعها غير مؤكد', 'نوعها مش أكيد'), 8, '#2469BA'], ['Transfers', T('من هذا؟', 'مين ده؟'), 2, '#08634F']];
    const held = eg ? '⁦1,250.00⁩ ج.م' : '⁦⃁ 420.00⁩';
    return {
      rootStyle: "font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33" + (this.props.bare ? '' : '; padding: 16px; background: #EFF3ED'),
      title: T('بحاجة لمراجعة', 'محتاجة مراجعة'), count: String(R.reduce((t, r) => t + r[2], 0)),
      rows: R.map(([to, text, n, c], i) => ({ href: to + '.dc.html', text, n: String(n), dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + c,
        style: 'display: flex; align-items: center; gap: 10px; min-height: 48px; color: #193D33; text-decoration: none; ' + (i < R.length - 1 ? 'border-bottom: 1px solid rgba(204,216,204,0.55)' : '') })),
      hold: T('غير محسوب صرفًا حتى ترد: ', 'مش محسوب صرف لحد ما ترد: ') + held
    };
  }
}
</script>
