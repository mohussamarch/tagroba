<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: #F4F2EA">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 700; color: #637570">{{bgTitle}}</span>
    <div style="border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <span style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="{{op.icBox}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{op.icColor}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{op.ic}}"></path></svg></span><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{op.name}}</span><span style="font-size: 12px; color: #637570">{{op.when}}</span></span><span style="{{op.amtStyle}}">{{op.amount}}</span></span>
      <button type="button" class="cs-press" onClick="{{reopen}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: 0; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.04)">
        <span style="font-size: 13px; color: #637570">{{catLabel}}</span>
        <span style="{{curStyle}}">{{curName}}</span>
      </button>
    </div>
  </div>

  <sc-if value="{{hasStrip}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="cs-in" style="position: absolute; left: 16px; right: 16px; bottom: 28px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 18px; color: #FFFFFF; background: rgba(25,61,51,0.94); box-shadow: 0 12px 28px rgba(25,61,51,0.28)">
      <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.6">{{strip}}</span>
      <sc-if value="{{canUndo}}" hint-placeholder-val="{{ true }}"><button type="button" class="cs-press" onClick="{{undo}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #9FE0C8; cursor: pointer; background: rgba(255,255,255,0.10)">{{undoLabel}}</button></sc-if>
    </div>
  </sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; z-index: 9">
      <button type="button" class="cs-veil" onClick="{{close}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{title}}" class="cs-up" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 14px; background: #FBFAF4; box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <div style="position: sticky; top: 0; z-index: 2; margin: 0 -20px; padding: 10px 20px 10px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, #FFFFFF 0%, #FBFAF4 100%)">
          <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
          <span style="display: flex; align-items: center; gap: 10px">
            <sc-if value="{{hasBack}}" hint-placeholder-val="{{ false }}"><button type="button" class="cs-press" onClick="{{back}}" aria-label="{{backLabel}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(25,61,51,0.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#193D33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button></sc-if>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">{{title}}</span><span style="font-size: 12px; color: #637570">{{sub}}</span></span>
            <sc-if value="{{isBuy}}" hint-placeholder-val="{{ false }}"><button type="button" class="cs-press" onClick="{{skip}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; color: #637570; cursor: pointer; background: rgba(25,61,51,0.06)">{{skipLabel}}</button></sc-if>
          </span>
          <sc-if value="{{isBuy}}" hint-placeholder-val="{{ false }}"><span style="border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #6B4600; background: #FBF0DD">{{buyBody}}</span></sc-if>
          <sc-if value="{{showSearch}}" hint-placeholder-val="{{ true }}">
            <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="2" stroke-linecap="round"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16M21 21l-4.3-4.3"></path></svg><input type="search" autocomplete="off" aria-label="{{searchHint}}" placeholder="{{searchHint}}" value="{{q}}" onInput="{{typeQ}}" style="flex: 1 1 auto; min-width: 0; height: 44px; border: 0; padding: 0; font: inherit; font-size: 15px; color: #193D33; background: transparent; outline: none"></label>
          </sc-if>
        </div>

        <sc-if value="{{isWho}}" hint-placeholder-val="{{ false }}">
          <dc-import name="WithWho" bare="{{true}}" amount="{{whoAmt}}" dir="{{whoDir}}" cat="{{whoCat}}" space="{{spaceName}}" on-done="{{whoDone}}" on-later="{{whoLater}}" hint-size="350px,720px"></dc-import>
        </sc-if>

        <sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
              <button type="button" class="cs-press" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; border: 0; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.04)">
                <span aria-hidden="true" style="{{r.box}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.color}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.ic}}"></path></svg></span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; text-align: right"><span style="font-size: 15px; font-weight: 700">{{r.label}}</span><span style="font-size: 12px; color: #637570">{{r.path}}</span></span>
              </button>
            </sc-for>
            <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}"><span style="padding: 18px 8px; text-align: center; font-size: 14px; color: #637570">{{noResultsText}}</span></sc-if>
          </div>
        </sc-if>

        <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{sections}}" as="g" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 13px; font-weight: 700; color: #637570">{{g.title}}</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
                <sc-for list="{{g.tiles}}" as="t" hint-placeholder-count="4">
                  <button type="button" class="cs-press" onClick="{{t.pick}}" aria-label="{{t.aria}}" style="{{t.style}}">
                    <span aria-hidden="true" style="{{t.box}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.ic}}"></path></svg></span>
                    <span class="cs-lbl" style="font-size: 12px; line-height: 1.35; font-weight: 500; text-align: center">{{t.label}}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>

      if (this.norm(t.name).includes(q)) results.push({ label: t.name, path: gName, ic: t.ic, color: t.color, box: box(t, 40), pick: () => this.pick(t) });
      c[6].forEach((x, i) => { const st = this.tile(c, i); if (this.norm(st.name).includes(q)) results.push({ label: st.name, path: (eg ? 'في ' : 'ضمن ') + st.parent, ic: st.ic, color: st.color, box: box(st, 40), pick: () => this.pick(st) }); });
    });
    const isWho = s.step === 'who' && !!s.picked;
    const opIc = ICONS[OP[1]] || '';
    return {
      bgTitle: eg ? 'العملية' : 'العملية',
      op: { name: OP[0], when: eg ? 'النهارده 1:12 م' : 'اليوم 1:12 م', ic: opIc, icColor: '#08634F', icBox: 'width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #DCEBD6',
        amount: money(OP[2] * k, OP[3] ? '+' : '−'), amtStyle: 'flex-shrink: 0; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (OP[3] ? '#08634F' : '#BE3D48') },
      catLabel: eg ? 'التصنيف' : 'التصنيف',
      curName: s.cur ? s.cur.name : (eg ? 'من غير تصنيف — دوس تختار' : 'بلا تصنيف — اضغط للاختيار'),
      curStyle: 'flex: 1 1 auto; text-align: left; font-size: 14px; font-weight: 700; color: ' + (s.cur ? s.cur.color : '#956000'),
      reopen: () => this.setState({ open: true, strip: '', step: 'pick', main: null }),
      hasStrip: !!s.strip && !s.open, strip: s.strip,
      canUndo: !!s.cur, undoLabel: eg ? 'تراجع' : 'تراجع',
      undo: () => this.setState({ cur: s.prev, prev: null, strip: eg ? 'رجعت زي ما كانت' : 'عادت كما كانت' }),
      open: s.open,
      close: () => this.setState({ open: false, main: null, q: '', step: 'pick' }),
      title: isWho ? (eg ? 'مع مين؟' : 'مع من؟') : main ? this.tile(main).name : buy ? (eg ? 'إيه الصنف؟' : 'ما الصنف؟') : (eg ? 'تصنيف العملية' : 'تصنيف العملية'),
      sub: isWho ? '«' + s.picked.name + '» · ' + money(OP[2] * k, OP[3] ? '+' : '−') : main ? main[6].length + (eg ? ' فرعيات · أو «عام»' : ' فرعيات · أو «عام»') : OP[0] + ' · ' + money(OP[2] * k, OP[3] ? '+' : '−'),
      hasBack: !!main || isWho, backLabel: eg ? 'رجوع' : 'رجوع',
      back: () => this.setState(isWho ? { step: 'pick', picked: null } : { main: null }),
      isBuy: buy && !main && !isWho, skipLabel: eg ? 'تخطّي' : 'تخطَّ',
      skip: () => this.setState({ open: false, strip: eg ? 'اتسجلت «شراء» من غير صنف — تقدر تصنّفها بعدين' : 'سُجّلت «شراء» بلا صنف — يمكنك تصنيفها لاحقًا' }),
      buyBody: eg ? 'اخترت «شراء» — حدّد الصنف عشان يدخل ميزانيته.' : 'اخترت «شراء» — حدّد الصنف ليدخل ميزانيته.',
      showSearch: !isWho && !main, searchHint: eg ? 'دوّر على تصنيف' : 'ابحث عن تصنيف', q: s.q,
      typeQ: (e) => this.setState({ q: e.target.value }),
      isWho, whoDir: OP[3] ? 'وارد' : 'صادر', whoAmt: OP[2] * k, whoCat: isWho ? s.picked.name : '', spaceName: eg ? 'مصر' : 'السعودية',
      whoDone: this.whoDone, whoLater: this.whoLater,
      isResults: !isWho && !!q, results, noResults: !!q && !results.length, noResultsText: eg ? 'مفيش تصنيف بالاسم ده' : 'لا يوجد تصنيف بهذا الاسم',
      isGrid: !isWho && !q, sections
    };
  }
}
</script>
