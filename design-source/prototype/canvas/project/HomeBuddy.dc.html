<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":140}}'>
// كارت الرئيسية «شخصيتك بتكلمك» (اختيار المالك 2026-10-15): شخصيتك بتقولك جملة عن صرفك، وفاضلك قد إيه على المكافأة الجاية (CharacterRewards)
// لو لسه ما اتبنتش: دايرة «+» والجملة بتدعوك تبنيها · الدوسة بتفتح «ابني/عدّل شخصيتك»
// الأرقام مخترعة ومتسقة مع المكافآت (كل فلوسك 686,660 من مليون لطاقية الغني · مصر 4,937,950 من 10 مليون) — في التطبيق من حالة استخدام
const withCur = (v, c) => (c === '⃁' ? '⁦⃁ ' + v + '⁩' : v + ' ' + c);
const DATA = { sa: { net: 68666000, target: 100000000 }, eg: { net: 493795000, target: 1000000000 } };
class Component extends DCLogic {
  fmt(m) { const a = Math.abs(m); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a), cur = eg ? 'ج.م' : '⃁', d = eg ? DATA.eg : DATA.sa;
    let look = null; try { look = JSON.parse(window.sessionStorage.getItem('masroufy-character') || 'null'); } catch (e) {}
    const left = d.target - d.net, pct = Math.floor((d.net * 100) / d.target);
    const say = look ? T('أحسنت! صرفك هذا الأسبوع أقل من الأسبوع الماضي بـ 12%.', 'برافو! صرفك الأسبوع ده أقل من اللي فات بـ 12%.') : T('ابنِ شخصيتك لتكلمك هنا عن صرفك.', 'ابني شخصيتك عشان تكلمك هنا عن صرفك.');
    return {
      hasChar: !!look, noChar: !look, look: look || {}, say,
      goal: T('باقي لك ', 'فاضلك ') + withCur(this.fmt(left), cur) + T(' على طاقية الغني', ' على طاقية الغني'),
      bar: 'display: block; height: 6px; border-radius: 3px; background: #B7791F; width: ' + pct + '%',
      aria: say + (look ? ' ' + T('افتح شخصيتك', 'افتح شخصيتك') : '')
    };
  }
}
</script>
