<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شاشة القفل — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.l-app{transition:filter 600ms cubic-bezier(.2,.7,.3,1),transform 600ms cubic-bezier(.2,.7,.3,1)}
.l-fade{animation:l-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.l-up{animation:l-up 450ms cubic-bezier(.2,.7,.3,1) both}
.l-scan{animation:l-scan 700ms cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes l-fade{from{opacity:0}to{opacity:1}}
@keyframes l-up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes l-scan{from{opacity:1}to{opacity:.35}}
@media (prefers-reduced-motion: reduce){.m-press,.l-app{transition:none}.m-press:active{transform:none}.l-up{animation:l-fade 150ms both}.l-scan{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="l-app" aria-hidden="{{appHidden}}" style="{{appStyle}}"><dc-import name="Main" space="{{spaceName}}" hint-size="390px,844px"></dc-import></div>

  <sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">
    <div class="l-fade" style="position: absolute; inset: 0; z-index: 5; box-sizing: border-box; padding: 150px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; background: rgba(239,243,237,0.40)">
      <span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: #08634F; background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(227,239,230,0.70) 55%, rgba(201,230,212,0.80)); box-shadow: inset 1px 1px 2px #FFFFFF, inset -1px -2px 3px rgba(8,99,79,0.18), 0 8px 18px rgba(8,99,79,0.16)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700">مصروفي</h1>
      <sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}">
        <span role="alert" style="max-width: 320px; padding: 10px 14px; border-radius: 16px; font-size: 14px; color: #6B4600; background: #FBF0DD">{{msg}}</span>
      </sc-if>
      <sc-if value="{{showOpen}}" hint-placeholder-val="{{ false }}">
        <button type="button" class="m-press" onClick="{{openPrompt}}" style="min-width: 200px; height: 52px; padding: 0 24px; border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.25)">{{openLabel}}</button>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{prompt}}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-modal="true" aria-label="{{pTitle}}" class="l-up" style="position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 7; border-radius: 28px; padding: 18px 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; background: #FFFFFF; box-shadow: 0 24px 60px rgba(16,32,28,0.28)">
      <span style="align-self: flex-start; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #637570"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>مصروفي</span>
      <span style="font-size: 18px; font-weight: 700">{{pTitle}}</span>
      <span style="font-size: 13px; color: #637570">{{pSub}}</span>

      <sc-if value="{{bio}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 4px">
          <button type="button" class="m-press" onClick="{{touch}}" aria-label="بصمة" style="{{bioStyle}}">
            <sc-if value="{{bioOk}}" hint-placeholder-val="{{ false }}"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
            <sc-if value="{{bioIcon}}" hint-placeholder-val="{{ true }}"><svg class="{{scanClass}}" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg></sc-if>
          </button>
          <span role="status" style="{{hintStyle}}">{{bioHint}}</span>
        </div>
      </sc-if>

      <sc-if value="{{pin}}" hint-placeholder-val="{{ false }}">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 4px">
          <span aria-label="{{pinLabel}}" style="display: flex; gap: 14px; direction: ltr">
            <sc-for list="{{dots}}" as="dt" hint-placeholder-count="4"><span style="{{dt.style}}"></span></sc-for>
          </span>
          <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; direction: ltr">
            <sc-for list="{{keys}}" as="ky" hint-placeholder-count="12">
              <sc-if value="{{ky.isKey}}" hint-placeholder-val="{{ true }}"><button type="button" class="m-press" onClick="{{ky.press}}" style="height: 52px; border: 0; border-radius: 16px; font: inherit; font-size: 22px; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.05)">{{ky.label}}</button></sc-if>
              <sc-if value="{{ky.isDel}}" hint-placeholder-val="{{ false }}"><button type="button" class="m-press" onClick="{{ky.press}}" aria-label="حذف رقم" style="height: 52px; border: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #637570; cursor: pointer; background: transparent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"></path><path d="m12 9 6 6"></path><path d="m18 9-6 6"></path></svg></button></sc-if>
              <sc-if value="{{ky.isGap}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true"></span></sc-if>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <div style="width: 100%; display: flex; justify-content: space-between; gap: 8px; padding-top: 4px">
        <button type="button" class="m-press" onClick="{{switchWay}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: transparent">{{switchLabel}}</button>
        <button type="button" class="m-press" onClick="{{cancel}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; color: #637570; cursor: pointer; background: transparent">إلغاء</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{opened}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="l-up" style="position: absolute; left: 20px; right: 20px; bottom: 120px; z-index: 7; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: #DCEBD6; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 14px 32px rgba(29,54,53,0.16)">
      <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #13764D; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg></span>
      <span style="flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 700; color: #08634F">{{openedTitle}}</span>
      <a href="Main.dc.html" class="m-press" style="height: 44px; padding: 0 18px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #FFFFFF; text-decoration: none; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">{{continueLabel}}</a>
    </div>
  </sc-if>

  <sc-if value="{{released}}" hint-placeholder-val="{{ false }}">
    <div class="l-fade" style="position: absolute; inset: 0; z-index: 6; background: rgba(32,59,48,0.18)"></div>
    <div role="alertdialog" aria-label="{{relTitle}}" class="l-up" style="position: absolute; left: 20px; right: 20px; bottom: 120px; z-index: 7; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.16)">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: #956000"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>{{relTitle}}</span>
      <span style="font-size: 14px">{{relBody}}</span>
      <a href="Main.dc.html" class="m-press" style="height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #FFFFFF; text-decoration: none; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.25)">{{continueLabel}}</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","خطأ","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // القفل (§21 · §31): التطبيق ورا بلور لحد ما البصمة أو رمز الجوال يتأكد. نافذة النظام هنا تمثيل (أندرويد بيرسمها بنفسه)
  constructor(props) {
    super(props);
    this.timers = [];
    this.state = this.fresh(props);
  }
  fresh(p) {
    // غير متاح: الجوال مالوش قفل ولا بصمة ⇒ القفل بيتوقف ويتقال (releaseIfDeviceHasNoLock)
    const released = (p && p.state) === 'غير متاح';
    return { prompt: null, way: 'bio', bio: 'idle', pin: '', msg: null, unlocked: released, released, failedOnce: false };
  }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  componentDidMount() { if (!this.state.released) this.later(500, () => { if (!this.state.unlocked && !this.state.msg) this.openPrompt(); }); }
  componentDidUpdate(prev) {
    if (prev.state === this.props.state) return;
    this.timers.forEach(clearTimeout); this.timers = [];
    this.setState(this.fresh(this.props));
    if (this.props.state !== 'غير متاح') this.later(500, () => this.openPrompt());
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  openPrompt() { this.setState({ prompt: true, way: 'bio', bio: 'idle', pin: '', msg: null }); }
  unlock() { this.setState({ prompt: null, unlocked: true, msg: null }); }
  touch() {
    const s = this.state;
    if (!s.prompt || s.bio === 'scan' || s.bio === 'ok') return;
    this.setState({ bio: 'scan' });
    this.later(700, () => {
      // خطأ: أول محاولة ما بتتطابقش ⇒ النافذة بتقفل ورسالة LOCK_FAILED + «إعادة المحاولة»
      if (this.props.state === 'خطأ' && !this.state.failedOnce) {
        this.setState({ bio: 'fail', failedOnce: true });
        this.later(900, () => this.setState({ prompt: null, msg: 'failed' }));
      } else {
        this.setState({ bio: 'ok' });
        this.later(600, () => this.unlock());
      }
    });
  }
  press(d) {
    const s = this.state;
    if (!s.prompt || s.pin.length >= 4) return;
    const pin = s.pin + d;
    this.setState({ pin });
    // تمثيل بس: أي 4 أرقام بتفتح، والرقم مش بيتخزن
    if (pin.length === 4) this.later(300, () => this.unlock());
  }
  renderVals() {
    const s = this.state;
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const T = (msa, egy) => (eg ? egy : msa);
    const bio = s.way === 'bio';
    const locked = !s.unlocked;
    const tone = s.bio === 'fail' ? '#BE3D48' : s.bio === 'ok' ? '#13764D' : '#08634F';
    // نص النظام ثابت (لغة الجوال)، والعنوان والسطر من التطبيق (LOCK_UNLOCK_TITLE · LOCK_UNLOCK_SUBTITLE)
    const hint = { idle: 'المس مستشعر البصمة', scan: 'جارٍ التحقق…', fail: 'لم يتم التعرّف على البصمة', ok: 'تم التعرّف' }[s.bio];
    const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
    return {
      spaceName: eg ? 'مصر' : 'السعودية',
      appHidden: locked ? 'true' : 'false',
      appStyle: 'position: absolute; inset: 0; transform-origin: 50% 40%; ' + (locked ? 'filter: blur(24px) saturate(0.9); transform: scale(1.06); pointer-events: none' : 'filter: none; transform: none'),
      locked, hasMsg: locked && !!s.msg,
      msg: s.msg === 'failed' ? T('تعذّر التحقق من أنك صاحب الجوال.', 'ما اتأكدش إنك صاحب الجوال.') : T('أُلغي التأكيد.', 'اتلغى التأكيد.'),
      showOpen: locked && !s.prompt, openPrompt: () => this.openPrompt(),
      openLabel: s.msg === 'failed' ? T('إعادة المحاولة', 'جرّب تاني') : T('فتح', 'افتح'),
      prompt: locked && !!s.prompt,
      pTitle: bio ? 'افتح مصروفي' : 'أدخل رمز الجوال', pSub: bio ? T('بالبصمة أو برمز الجوال', 'بالبصمة أو برمز الجوال') : 'الرمز نفسه الذي تفتح به الجوال',
      bio, pin: !bio,
      touch: () => this.touch(), bioOk: s.bio === 'ok', bioIcon: s.bio !== 'ok', scanClass: s.bio === 'scan' ? 'l-scan' : '',
      bioStyle: 'width: 76px; height: 76px; border: 0; padding: 0; border-radius: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: ' + tone + '; background: ' + (s.bio === 'fail' ? 'rgba(190,61,72,0.08)' : 'rgba(8,99,79,0.08)'),
      bioHint: hint, hintStyle: 'font-size: 13px; font-weight: 700; color: ' + (s.bio === 'idle' || s.bio === 'scan' ? '#637570' : tone),
      pinLabel: 'أُدخل ' + s.pin.length.toLocaleString('en-US') + ' من 4',
      dots: [0, 1, 2, 3].map((i) => ({ style: 'width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; ' + (i < s.pin.length ? 'background: #193D33' : 'border: 1.5px solid rgba(25,61,51,0.35)') })),
      keys: digits.map((k) => ({ label: k, isKey: k !== '' && k !== 'del', isDel: k === 'del', isGap: k === '',
        press: () => (k === 'del' ? this.setState({ pin: s.pin.slice(0, -1) }) : k ? this.press(k) : null) })),
      switchLabel: bio ? 'رمز الجوال' : 'بصمة', switchWay: () => this.setState({ way: bio ? 'pin' : 'bio', bio: 'idle', pin: '' }),
      cancel: () => this.setState({ prompt: null, msg: 'cancelled' }),
      opened: s.unlocked && !s.released, openedTitle: T('تم فتح القفل', 'القفل اتفتح'), continueLabel: T('متابعة', 'كمّل'),
      released: s.released, relTitle: T('أُوقف قفل التطبيق', 'القفل اتوقف'),
      relBody: T('لا قفل شاشة ولا بصمة مسجلة في الجوال. فعّل قفل الشاشة من إعدادات الجوال أولًا، ثم شغّل القفل من جديد من الإعدادات.', 'الجوال مالوش قفل شاشة ولا بصمة متسجلة. اعمل قفل شاشة من إعدادات الجوال الأول، وبعدين شغّل القفل تاني من الإعدادات.')
    };
  }
}
</script>
</body>
</html>
