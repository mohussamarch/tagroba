<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رمز العملية — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<span style="display: flex; color: inherit">
  <sc-if value="{{isFood}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a3 3 0 0 0 3 3v7"></path><path d="M5 3v5M9 3v5"></path><path d="M17 3c-2 2-3 4-3 7s1 4 3 4v7"></path></svg></sc-if>
  <sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg></sc-if>
  <sc-if value="{{isCar}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5h11L19 16"></path><path d="M4 16h16v3H4z"></path><circle cx="7.5" cy="19.5" r="1"></circle><circle cx="16.5" cy="19.5" r="1"></circle></svg></sc-if>
  <sc-if value="{{isMove}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3"></path><path d="M20 16H6l3 3"></path></svg></sc-if>
  <sc-if value="{{isOwn}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg></sc-if>
  <sc-if value="{{isIncome}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M12 10v5M9.5 12.5L12 15l2.5-2.5"></path></svg></sc-if>
  <sc-if value="{{isCash}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["food","shop","car","move","own","income","cash"],"default":"food","section":"الحالة"},"$preview":{"width":24,"height":24}}'>
// رمز نوع العملية (اتفصل من «العمليات» عشان يتستعمل في الصف وفي القايمة السريعة ووضع التحديد — وعشان حد الـ300 سطر)
// food أكل · shop تسوق · car عربية · move تحويل · own بين محافظك (سهمين نص دايرة — طلب المالك: مش أحمر بناقص) · income دخل · cash كاش — الأيقونات لوسيد بسمك 1.5 واللون من الأم (currentColor)
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'food';
    return { isFood: k === 'food', isShop: k === 'shop', isCar: k === 'car', isMove: k === 'move', isOwn: k === 'own', isIncome: k === 'income', isCash: k === 'cash' };
  }
}
</script>
</body>
</html>
