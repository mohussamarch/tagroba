<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعدادات الإشعارات — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.n-track{transition:background 220ms cubic-bezier(.2,.7,.3,1)}
.n-knob{transition:right 320ms cubic-bezier(.18,.9,.28,1.08)}
.m-in{animation:m-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes m-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.m-press,.n-track,.n-knob{transition:none}.m-press:active{transform:none}.m-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="More.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{title}}</h1>
    </div>

    <sc-if value="{{permOff}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FBF0DD; color: #6B4600">
        <span style="font-size: 14px; font-weight: 700; color: #956000">{{permTitle}}</span>
        <span style="font-size: 13px">{{permBody}}</span>
        <button type="button" class="m-press" onClick="{{grant}}" style="align-self: flex-start; height: 44px; padding: 0 16px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(255,255,255,0.8)">{{permBtn}}</button>
      </div>
    </sc-if>

    <span style="font-size: 13px; color: #637570">{{intro}}</span>

    <div style="border-radius: 22px; padding: 4px 16px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
        <div style="{{g.rowStyle}}">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 700">{{g.title}}</span><sc-if value="{{g.isNew}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; color: #08634F; background: #DCEBD6">{{newLabel}}</span></sc-if></span>
              <span style="font-size: 12px; color: #637570">{{g.desc}}</span>
            </span>
            <button type="button" role="switch" aria-checked="{{g.checked}}" aria-label="{{g.title}}" onClick="{{g.toggle}}" style="width: 56px; height: 48px; flex-shrink: 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <span class="n-track" style="{{g.track}}"><span class="n-knob" style="{{g.knob}}"></span></span>
            </button>
          </div>
          <sc-if value="{{g.showFreq}}" hint-placeholder-val="{{ false }}">
            <div class="m-in" style="display: flex; flex-direction: column; gap: 8px; padding: 2px 0 6px">
              <div role="radiogroup" aria-label="{{freqLabel}}" style="display: flex; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{freqs}}" as="f" hint-placeholder-count="3">
                  <button type="button" role="radio" aria-checked="{{f.checked}}" class="m-press" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
                </sc-for>
              </div>
              <span style="font-size: 12px; color: #637570">{{freqNote}}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; background: rgba(25,61,51,0.04)">
      <span style="font-size: 13px; font-weight: 700; color: #637570">{{laterTitle}}</span>
      <span style="font-size: 12px; color: #637570">{{laterBody}}</span>
    </div>
    <span style="font-size: 12px; color: #637570">{{lockNote}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","الإذن مقفول"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // كل المجموعات شغالة افتراضيًا (رسايل البنك كمان — قرار المالك §72) ما عدا سؤال الكاش: مقفول لحد ما يفتحه بنفسه (قرار المالك §74)
    this.state = { off: { cash: true }, freq: 'week', granted: false };
  }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const permOff = (this.props.state ?? 'عادي') === 'الإذن مقفول' && !this.state.granted;
    const defs = [
      ['bank', 'رسايل البنك', 'رسائل البنك', 'بس لما فيه رسايل مستنية تأكيدك. اللي بيتسجل لوحده مالوش إشعار.', 'فقط عند وجود رسائل بانتظار تأكيدك. ما يُسجَّل تلقائيًا لا يصدر عنه إشعار.', true],
      ['dues', 'المستحقات', 'المستحقات', 'الأقساط والاشتراكات والديون: قبل الميعاد ويومه ولو عدّى', 'الأقساط والاشتراكات والديون: قبل الموعد ويومه وعند تجاوزه'],
      ['budget', 'الميزانية', 'الميزانية', 'لما تقرب من السقف أو تعدّيه، حتى لو بسبب عملية اتسجلت لوحدها', 'عند الاقتراب من السقف أو تجاوزه، ولو بسبب عملية سُجّلت تلقائيًا'],
      ['ask', 'الأسئلة', 'الأسئلة', 'سلفة ولا دعم؟ · ده سداد؟ · كام بالجنيه؟ · أطراف التحويلات · اختلاف الرصيد — ولو ما رديتش بتفضل في المراجعة', 'سلفة أم دعم؟ · هل هي سداد؟ · كم بالريال؟ · أطراف التحويلات · اختلاف الرصيد — وإن لم تردّ تبقى في المراجعة'],
      ['cash', 'سؤال الكاش', 'سؤال الكاش', 'يسألك «معاك كام كاش؟» عشان رصيد الكاش يفضل صح', 'يسألك «كم معك كاش؟» ليبقى رصيد الكاش صحيحًا'],
      ['income', 'الدخل', 'الدخل', 'لو المرتب اتأخر عن ميعاده', 'إذا تأخر الراتب عن موعده'],
      ['occ', 'المناسبات', 'المناسبات', 'أعياد ميلاد ومناسبات أشخاصك', 'أعياد ميلاد أشخاصك ومناسباتهم'],
      ['zakat', 'الزكاة', 'الزكاة', 'قبل ميعادها بـ١٠ أيام ويومه', 'قبل موعدها بـ١٠ أيام ويومه'],
      ['balance', 'الرصيد', 'الرصيد', 'لو رصيد محفظة ما طابقش الكشف', 'إذا لم يطابق رصيد محفظة الكشف'],
      ['advisor', 'المساعد', 'المساعد', 'التحليلات الذكية من المساعد المالي', 'التحليلات الذكية من المساعد المالي']
    ];
    const groups = defs.map(([id, tEg, tSa, dEg, dSa, isNew], i) => {
      const on = !this.state.off[id];
      return {
        title: eg ? tEg : tSa, isNew: !!isNew,
        // رسائل البنك المقفولة: السطر بيفضل في صفحة الإشعارات «مقفولة» ومن غير إشعار جوال (جلسة كوتلن، AlertGroup.BANK_SMS)
        desc: id === 'bank' && !on ? (eg ? 'مقفولة: الرسايل المستنية بتبان في صفحة الإشعارات بس، من غير إشعار جوال.' : 'مغلقة: الرسائل المنتظرة تظهر في صفحة الإشعارات فقط، بلا إشعار جوال.') : (eg ? dEg : dSa),
        checked: on ? 'true' : 'false',
        toggle: () => this.setState({ off: Object.assign({}, this.state.off, { [id]: on }) }),
        showFreq: id === 'cash' && on,
        rowStyle: 'display: flex; flex-direction: column; padding: 8px 0;' + (i === defs.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);'),
        track: 'position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; ' + (on ? 'background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 2px rgba(0,47,48,0.25)' : 'background: rgba(25,61,51,0.16); box-shadow: inset 0 1px 2px rgba(25,61,51,0.12)'),
        knob: 'position: absolute; top: 2px; right: ' + (on ? 20 : 2) + 'px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(16,45,53,0.22)'
      };
    });
    const freqDefs = [['week', eg ? 'كل أسبوع' : 'كل أسبوع'], ['2weeks', eg ? 'كل أسبوعين' : 'كل أسبوعين'], ['month', eg ? 'كل شهر' : 'كل شهر']];
    const freqs = freqDefs.map(([id, label]) => {
      const on = this.state.freq === id;
      return { label, checked: on ? 'true' : 'false', pick: () => this.setState({ freq: id }),
        style: 'height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)') };
    });
    return {
      title: eg ? 'إعدادات الإشعارات' : 'إعدادات الإشعارات',
      permOff,
      permTitle: eg ? 'إشعارات الجوال مقفولة' : 'إشعارات الجوال مغلقة',
      permBody: eg ? 'مفيش حاجة هتوصلك برا البرنامج. اللي يستاهل هتلاقيه في صفحة الإشعارات جوه.' : 'لن يصلك شيء خارج التطبيق. ستجد ما يهمك في صفحة الإشعارات داخله.',
      permBtn: eg ? 'افتح إعدادات الجوال' : 'افتح إعدادات الجوال',
      grant: () => this.setState({ granted: true }),
      intro: eg ? 'كل مجموعة بتتقفل لوحدها.' : 'أغلق أي مجموعة وحدها.',
      newLabel: 'جديد',
      groups,
      freqLabel: eg ? 'كل قد إيه' : 'كل كم',
      freqs,
      freqNote: eg ? 'يوم الجمعة الصبح (اقتراح). لو عدّيت الكاش بنفسك قبلها، السؤال بيتأجل.' : 'صباح الجمعة (مقترح). إن عددت الكاش بنفسك قبلها يتأجل السؤال.',
      laterTitle: eg ? 'بعدين' : 'لاحقًا',
      laterBody: eg ? 'الأمان · الحسابات المربوطة · الإيميل — بتيجي بعدين.' : 'الأمان · الحسابات المرتبطة · البريد الإلكتروني — تُضاف لاحقًا.',
      lockNote: eg ? 'شاشة القفل بتعرض نوع التنبيه بس: من غير مبالغ ولا أسامي ولا عدد.' : 'شاشة القفل تعرض نوع التنبيه فقط: بلا مبالغ ولا أسماء ولا أعداد.'
    };
  }
}
</script>
</body>
</html>
