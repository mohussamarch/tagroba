<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إضافة شخص — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ap-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.ap-press:active{transform:scale(.97)}
.ap-veil{animation:ap-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.ap-up{animation:ap-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.ap-up>*{flex-shrink:0}
.ap-in{animation:ap-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes ap-fade{from{opacity:0}to{opacity:1}}
@keyframes ap-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes ap-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ap-press{transition:none}.ap-press:active{transform:none}.ap-up,.ap-in{animation:ap-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
input::placeholder{color:#8A9A95}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <sc-if value="{{hasTrigger}}" hint-placeholder-val="{{ true }}">
    <button type="button" class="ap-press" onClick="{{openSheet}}" style="width: 100%; height: 52px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>{{openLabel}}</button>
  </sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="ap-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{title}}" class="ap-up" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
        <span style="font-size: 17px; font-weight: 700">{{title}}</span>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">{{nameLabel}}
          <input type="text" maxlength="80" value="{{name}}" onInput="{{typeName}}" placeholder="{{namePh}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 500; color: #193D33; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9); outline: none">
        </label>

        <span style="font-size: 13px; font-weight: 700; margin-top: 2px">{{circleLabel}}</span>
        <div role="radiogroup" aria-label="{{circleLabel}}" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{circles}}" as="cc" hint-placeholder-count="4">
            <button type="button" role="radio" aria-checked="{{cc.on}}" class="ap-press" onClick="{{cc.pick}}" style="{{cc.style}}">{{cc.label}}</button>
          </sc-for>
        </div>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">{{relLabel}}
          <input type="text" maxlength="30" value="{{rel}}" onInput="{{typeRel}}" placeholder="{{relPh}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 500; color: #193D33; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9); outline: none">
        </label>

        <button type="button" aria-expanded="{{occOpenA}}" class="ap-press" onClick="{{toggleOcc}}" style="{{moreStyle}}"><span>{{occToggle}}</span><span style="font-size: 12px; font-weight: 500; color: #637570">{{optional}}</span></button>
        <sc-if value="{{occOpen}}" hint-placeholder-val="{{ false }}">
          <div class="ap-in" style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
            <div role="radiogroup" aria-label="{{occToggle}}" style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{occKinds}}" as="ok" hint-placeholder-count="3">
                <button type="button" role="radio" aria-checked="{{ok.on}}" class="ap-press" onClick="{{ok.pick}}" style="{{ok.style}}">{{ok.label}}</button>
              </sc-for>
            </div>
            <div role="radiogroup" aria-label="{{monthLabel}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{months}}" as="mo" hint-placeholder-count="12">
                <button type="button" role="radio" aria-checked="{{mo.on}}" class="ap-press" onClick="{{mo.pick}}" style="{{mo.style}}">{{mo.label}}</button>
              </sc-for>
            </div>
            <div style="display: flex; gap: 8px">
              <label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">{{dayLabel}}
                <input type="text" inputmode="numeric" dir="ltr" maxlength="2" value="{{occDay}}" onInput="{{typeDay}}" placeholder="1–31" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 16px; font-weight: 700; color: #193D33; text-align: right; font-variant-numeric: tabular-nums; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9); outline: none">
              </label>
              <label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">{{yearLabel}}
                <input type="text" inputmode="numeric" dir="ltr" maxlength="4" value="{{occYear}}" onInput="{{typeYear}}" placeholder="{{yearPh}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 16px; font-weight: 700; color: #193D33; text-align: right; font-variant-numeric: tabular-nums; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9); outline: none">
              </label>
            </div>
            <span style="font-size: 12px; color: #637570">{{occNote}}</span>
          </div>
        </sc-if>

        <button type="button" aria-expanded="{{debtOpenA}}" class="ap-press" onClick="{{toggleDebt}}" style="{{moreStyle}}"><span>{{debtToggle}}</span><span style="font-size: 12px; font-weight: 500; color: #637570">{{optional}}</span></button>
        <sc-if value="{{debtOpen}}" hint-placeholder-val="{{ false }}">
          <div class="ap-in" style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
            <div role="radiogroup" aria-label="{{debtToggle}}" style="display: flex; gap: 8px">
              <sc-for list="{{sides}}" as="sd" hint-placeholder-count="2">
                <button type="button" role="radio" aria-checked="{{sd.on}}" class="ap-press" onClick="{{sd.pick}}" style="{{sd.style}}">{{sd.label}}</button>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; height: 52px; border-radius: 18px; padding: 0 16px; gap: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)">
              <input type="text" inputmode="decimal" dir="ltr" aria-label="{{amountLabel}}" value="{{amountText}}" onInput="{{typeAmount}}" placeholder="0.00" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 20px; font-weight: 700; color: #193D33; outline: none; text-align: right; font-variant-numeric: tabular-nums">
              <span style="font-size: 14px; color: #637570">{{cur}}</span>
            </div>
            <span style="font-size: 12px; color: #637570">{{debtNote}}</span>
          </div>
        </sc-if>

        <div style="position: sticky; bottom: -28px; z-index: 1; margin: 0 -20px -28px; padding: 14px 20px 28px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, rgba(251,250,244,0) 0, #FBFAF4 14px)">
          <span role="alert" style="font-size: 12px; font-weight: 700; line-height: 1.7; color: #BE3D48">{{err}}</span>
          <button type="button" class="ap-press" onClick="{{save}}" style="height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)">{{saveLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"autoOpen":{"editor":"boolean","default":false,"section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"names":{"editor":null},"onSave":{"editor":null},"onClose":{"editor":null},"$preview":{"width":350,"height":60}}'>
// إضافة شخص (spec/04 · ManagePeople.addPerson · ManagePersonCircles.setProfile · §27 · §64). الاسم إجباري (حد ٨٠ وما يتكررش)، والباقي اختياري.
// الحفظ بيرجّع للشاشة الأم: onSave({ name, circle: family|friend|work|other|null, relation: نص أو null,
//   occasion: { kind: birthday|wedding_anniversary|wedding, month, day, year أو null, yearly, leadDays: 7 } أو null (زي OccasionSheet),
//   openingDebt: { side: lak|alek, amountMinor } أو null })
// autoOpen = من غير زرار: اللوحة مفتوحة من الأول، والقفل من غير حفظ بينده onClose() (لزرار «إضافة» الدايري في الأشخاص و«+»)
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const auto = props.autoOpen === true || props.autoOpen === 'true';
    this.state = { open: auto, name: '', circle: null, rel: '', occ: false, occKind: 'birthday', occMonth: null, occDay: '', occYear: '', debt: false, side: null, amount: '', err: '', added: [] };
  }
  toMinor(text) { const t = String(text || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9.]/g, ''); if (!t) return null; const [w, f = ''] = t.split('.'); return parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const cur = eg ? 'ج.م' : 'ر.س', s = this.state;
    const auto = this.props.autoOpen === true || this.props.autoOpen === 'true';
    // مخترعة · نفس أسامي شاشة الأشخاص
    const BASE = ['ليلى', 'يوسف', 'سارة', 'خالد', 'أحمد', 'عمر', 'نورة', 'فهد', 'ريم', 'سلمان', 'سالم', 'هند', 'ماجد', 'لمى', 'بدر', 'دانة', 'تركي'];
    const given = String(this.props.names || '').split(/[،,]/).map((x) => x.trim()).filter(Boolean);
    const taken = (given.length ? given : BASE).concat(s.added);
    const clean = (x) => String(x || '').trim().replace(/\s+/g, ' ');
    const chip = (on, extra) => 'height: 44px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (extra || '') + (on ? 'font-weight: 700; color: #08634F; background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const CIRCLES = [['family', eg ? 'العيلة' : 'العائلة'], ['friend', eg ? 'الصحاب' : 'الأصدقاء'], ['work', eg ? 'الشغل' : 'الدوام'], ['other', eg ? 'تانيين' : 'آخرون']];
    const OCC = [['birthday', 'عيد ميلاد'], ['wedding_anniversary', eg ? 'عيد جواز' : 'ذكرى زواج'], ['wedding', eg ? 'فرح' : 'زواج']];
    const M = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    const num = (t) => { const x = String(t || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g, ''); return x ? parseInt(x, 10) : null; };
    const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
    const SIDES = [['lak', eg ? 'ليا عنده' : 'لي عنده'], ['alek', eg ? 'عليا ليه' : 'عليّ له']];
    const close = () => { this.setState({ open: false }); if (auto && typeof this.props.onClose === 'function') this.props.onClose(); };
    const nm = clean(s.name);
    return {
      hasTrigger: !auto,
      openLabel: eg ? 'ضيف شخص' : 'إضافة شخص',
      openSheet: () => this.setState({ open: true, name: '', circle: null, rel: '', occ: false, occKind: 'birthday', occMonth: null, occDay: '', occYear: '', debt: false, side: null, amount: '', err: '' }),
      open: s.open,
      title: eg ? 'شخص جديد' : 'شخص جديد',
      nameLabel: 'الاسم', namePh: eg ? 'زي ما بتناديه' : 'كما تناديه',
      name: s.name, typeName: (e) => this.setState({ name: e && e.target ? e.target.value : '', err: '' }),
      circleLabel: eg ? 'الدايرة (اختياري)' : 'الدائرة (اختياري)',
      circles: CIRCLES.map(([id, label]) => ({ label, on: s.circle === id ? 'true' : 'false', style: chip(s.circle === id), pick: () => this.setState({ circle: s.circle === id ? null : id }) })),
      relLabel: eg ? 'يقربلك إيه؟ (اختياري)' : 'صلته بك (اختياري)',
      relPh: eg ? 'مثلًا: أخويا، زميلي في الشغل' : 'مثلًا: أخي، زميل في الدوام',
      rel: s.rel, typeRel: (e) => this.setState({ rel: e && e.target ? e.target.value : '' }),
      optional: eg ? 'اختياري' : 'اختياري',
      moreStyle: 'display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; text-align: right; background: rgba(8,99,79,0.06)',
      occToggle: (s.occ ? '− ' : '+ ') + (eg ? 'مناسبة ليه' : 'مناسبة له'),
      occOpen: s.occ, occOpenA: s.occ ? 'true' : 'false',
      toggleOcc: () => this.setState({ occ: !s.occ, err: '' }),
      occKinds: OCC.map(([id, label]) => ({ label, on: s.occKind === id ? 'true' : 'false', style: chip(s.occKind === id), pick: () => this.setState({ occKind: id }) })),
      monthLabel: eg ? 'الشهر (ميلادي)' : 'الشهر (ميلادي)',
      months: M.map((label, i) => ({ label, on: s.occMonth === i + 1 ? 'true' : 'false', style: chip(s.occMonth === i + 1, 'padding: 0 4px; font-size: 13px; '), pick: () => this.setState({ occMonth: i + 1, err: '' }) })),
      dayLabel: 'اليوم', occDay: s.occDay, typeDay: (e) => this.setState({ occDay: e && e.target ? e.target.value : '', err: '' }),
      yearLabel: s.occKind === 'wedding' ? 'السنة' : (eg ? 'السنة (مش لازم)' : 'السنة (اختياري)'), yearPh: s.occKind === 'wedding' ? '' : (eg ? 'مش عارف' : 'غير معروفة'),
      occYear: s.occYear, typeYear: (e) => this.setState({ occYear: e && e.target ? e.target.value : '', err: '' }),
      occNote: s.occKind === 'wedding' ? (eg ? 'مرة واحدة، وهنفكّرك قبلها بأسبوع.' : 'مرة واحدة، ونذكّرك قبلها بأسبوع.') : (eg ? 'كل سنة، وهنفكّرك قبلها بأسبوع — وتقدر تغيّر ده من ملفه.' : 'كل سنة، ونذكّرك قبلها بأسبوع — ويمكنك تغيير ذلك من ملفه.'),
      debtToggle: (s.debt ? '− ' : '+ ') + (eg ? 'دين قديم بينكم' : 'دين قديم بينكما'),
      debtOpen: s.debt, debtOpenA: s.debt ? 'true' : 'false',
      toggleDebt: () => this.setState({ debt: !s.debt, err: '' }),
      sides: SIDES.map(([id, label]) => ({ label, on: s.side === id ? 'true' : 'false', style: chip(s.side === id, 'flex: 1 1 0; height: 48px; '), pick: () => this.setState({ side: id, err: '' }) })),
      amountLabel: 'المبلغ', amountText: s.amount, cur,
      typeAmount: (e) => this.setState({ amount: e && e.target ? e.target.value : '', err: '' }),
      debtNote: eg ? 'من غير عملية، وما بيلمسش أي محفظة ولا المصروف ولا الدخل.' : 'بلا عملية، ولا يمسّ أي محفظة ولا المصروف ولا الدخل.',
      err: s.err,
      saveLabel: eg ? 'ضيفه' : 'أضفه',
      save: () => {
        const say = (err) => this.setState({ err });
        if (!nm) return say(eg ? 'اكتب اسم الشخص.' : 'أدخل اسم الشخص.');
        if (taken.some((x) => clean(x) === nm)) return say(eg ? 'فيه شخص اسمه «' + nm + '» موجود قبل كده.' : 'يوجد شخص باسم «' + nm + '» سابقًا.');
        const od = num(s.occDay), oy = num(s.occYear);
        if (s.occ && !s.occMonth) return say(eg ? 'اختار شهر المناسبة، أو اقفل خانتها.' : 'اختر شهر المناسبة، أو أغلق خانتها.');
        if (s.occ && (!od || (oy != null && (oy < 1900 || oy > 2200)) || od > dim(oy || 2000, s.occMonth))) return say(eg ? 'تاريخ المناسبة مش صالح.' : 'تاريخ المناسبة غير صالح.');
        if (s.occ && s.occKind === 'wedding' && !oy) return say(eg ? 'المناسبة اللي مرة واحدة محتاجة السنة.' : 'المناسبة لمرة واحدة تحتاج السنة.');
        const amt = this.toMinor(s.amount);
        if (s.debt && !s.side) return say(eg ? 'اختار: ليك عنده ولا عليك ليه.' : 'اختر: لك عنده أم عليك له.');
        if (s.debt && (amt == null || amt <= 0)) return say(eg ? 'اكتب مبلغ الدين أكبر من صفر، أو اقفل خانته.' : 'اكتب مبلغ الدين أكبر من صفر، أو أغلق خانته.');
        const rel = clean(s.rel);
        const out = {
          name: nm, circle: s.circle, relation: rel || null,
          occasion: s.occ ? { kind: s.occKind, month: s.occMonth, day: od, year: oy, yearly: s.occKind !== 'wedding', leadDays: 7 } : null,
          openingDebt: s.debt ? { side: s.side, amountMinor: amt } : null
        };
        this.setState({ open: false, err: '', added: s.added.concat([nm]) });
        if (typeof this.props.onSave === 'function') this.props.onSave(out);
      },
      closeSheet: close
    };
  }
}
</script>
</body>
</html>
