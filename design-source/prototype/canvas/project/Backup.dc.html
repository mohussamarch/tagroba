        .map(([key, name, meta]) => ({ name, meta, pick: () => this.setState({ picking: false, file: key }) })),
      restoreTitle: eg ? 'معاينة الاسترجاع' : 'معاينة الاسترجاع',
      backLabel: eg ? 'رجوع للنسخة الاحتياطية' : 'رجوع إلى النسخة الاحتياطية',
      leaveRestore: () => this.setState({ file: null }),
      file: s.file || '', netFlag: noNet ? 'لا' : 'نعم', onDone: this.onDone, onCancel: this.onCancel,
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
