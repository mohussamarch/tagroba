      sub: ty ? T('التفاصيل المعروفة لهذا النوع', 'التفاصيل المعروفة للنوع ده') : T('اختر النوع، وإن لم تجده اختر «شيء آخر»', 'اختار النوع، ولو مش لاقيه اختار «حاجة تانية»'),
      backLabel: T('رجوع للأنواع', 'رجوع للأنواع'),
      back: () => this.setState({ type: null, f: {}, tried: false }),
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      groups: TYPES.filter((t) => !this.props.only || t[0] === this.props.only).map(([g, a, b, list]) => ({ title: T(a, b), types: list.map(([id, la, lb]) => ({ label: T(la, lb), icon: I[id], pick: () => this.setState({ type: id, f: {}, purpose: DEF[id], kind: 'bars', karat: id === 'silver' ? 999 : 21, rented: false, tried: false }),
        style: 'border: 0; border-radius: 16px; padding: 10px 4px; min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; cursor: pointer; color: #193D33; background: rgba(25,61,51,0.04)',
        box: 'width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #08634F; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,54,53,0.08)' })) })),
      chipRows,
      fields: fields.map((x) => { const bad = s.tried && x.k === need && !ok; return Object.assign({}, x, { value: s.f[x.k] || '', type: set(x.k), bad: bad ? 'true' : 'false', hasHint: !!x.hint, box: 'display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 ' + (bad ? '2px #BE3D48' : '1px rgba(204,216,204,0.9)') }); }),
      hasPreview: ty === 'gold' && goldNow != null, previewLabel: T('قيمته اليوم', 'قيمته النهارده'), previewText: goldNow != null ? '≈ ' + withCur(this.fmt(goldNow), cur) : '',
      note, hasErr: s.tried && !ok, err: metal ? T('اكتب الوزن بالجرام', 'اكتب الوزن بالجرام') : ty === 'stk' ? T('اكتب عدد الأسهم', 'اكتب عدد الأسهم') : T('اكتب القيمة التقريبية', 'اكتب القيمة التقريبية'),
      saveLabel: T('حفظ', 'حفظ'), save: done
    };
  }
}
</script>
