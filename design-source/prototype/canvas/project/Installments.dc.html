<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الأقساط — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.m-press{transition:none}.m-press:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="Operations.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">{{title}}</h1>
    </div>

    <div style="border-radius: 28px; padding: 18px 20px; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px; background: radial-gradient(90% 70% at 88% 0%, rgba(255,255,255,0.20), transparent 55%), radial-gradient(70% 60% at 0% 100%, rgba(150,243,204,0.18), transparent 60%), linear-gradient(125deg, #064B40 0%, #08705A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 20px 44px rgba(6,75,64,0.30), 0 4px 10px rgba(6,75,64,0.18)">
      <span style="font-size: 14px; color: #DCEBD6">{{leftLabel}}</span>
      <span dir="ltr" style="text-align: right; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">{{leftText}}</span>
      <span style="font-size: 12px; color: #DCEBD6">{{monthLine}}</span>
    </div>

    <sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
      <div style="border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{p.name}}</span><span style="font-size: 12px; color: #637570">{{p.kind}}</span></span>
          <span dir="ltr" style="font-size: 16px; font-weight: 700; color: #BE3D48; font-variant-numeric: tabular-nums">{{p.inst}}</span>
        </div>
        <span style="display: flex; justify-content: space-between; font-size: 12px; color: #637570"><span>{{p.progress}}</span><span>{{p.next}}</span></span>
        <span role="progressbar" aria-valuenow="{{p.pct}}" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 4px; overflow: hidden; background: rgba(25,61,51,0.08)"><span style="{{p.bar}}"></span></span>
        <span style="display: flex; justify-content: space-between; font-size: 13px"><span>{{receivedLabel}}</span><span style="{{p.receivedStyle}}">{{p.received}}</span></span>
        <sc-if value="{{p.hasProfit}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; color: #637570">{{p.profit}}</span>
        </sc-if>
      </div>
    </sc-for>
    <span style="font-size: 12px; color: #637570">{{note}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fmt(minor) { const a = Math.abs(minor); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const k = eg ? 3 : 1, cur = eg ? 'ج.م' : 'ر.س';
    const n = (x) => x.toLocaleString('ar-EG');
    // مخترعة: total = عدد الأقساط · done = اللي اتدفع · received = مبلغ التمويل المستلم (null = لسه ما اتربطش، مش صفر)
    const defs = [
      { name: 'قسط السيارة', kind: eg ? 'تمويل من البنك · فيه أرباح' : 'تمويل بنكي · بأرباح', inst: 145000, total: 36, done: 12, next: '٢٧ أكتوبر', received: 4860000, profit: 360000 },
      { name: eg ? 'تقسيط الموبايل' : 'تقسيط الجوال', kind: eg ? 'تقسيط مشتريات' : 'تقسيط مشتريات', inst: 25000, total: 12, done: 8, next: '٥ نوفمبر', received: null, profit: null }
    ];
    const plans = defs.map((d) => {
      const pct = Math.floor((d.done * 100) / d.total);
      return {
        name: d.name, kind: d.kind,
        inst: this.fmt(d.inst * k) + ' ' + cur,
        progress: (eg ? 'دفعت ' : 'دفعت ') + n(d.done) + (eg ? ' من ' : ' من ') + n(d.total),
        next: (eg ? 'الجاي ' : 'القادم ') + d.next,
        pct: String(pct),
        bar: 'display: block; height: 8px; border-radius: 4px; width: ' + pct + '%; background: #4D747C',
        received: d.received == null ? (eg ? 'لسه ما اتربطش' : 'لم يُربط بعد') : this.fmt(d.received * k) + ' ' + cur,
        receivedStyle: 'font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (d.received == null ? '#956000' : '#193D33'),
        hasProfit: d.profit != null,
        profit: d.profit == null ? '' : (eg ? 'أرباح التمويل ' : 'أرباح التمويل ') + this.fmt(d.profit * k) + ' ' + cur + (eg ? ' — معلومة بس' : ' — للعلم فقط')
      };
    });
    const left = defs.reduce((s, d) => s + (d.total - d.done) * d.inst * k, 0);
    const month = defs.reduce((s, d) => s + d.inst * k, 0);
    return {
      title: 'الأقساط',
      leftLabel: eg ? 'الباقي عليك في الأقساط' : 'المتبقي عليك في الأقساط',
      leftText: this.fmt(left) + ' ' + cur,
      monthLine: (eg ? 'كل شهر ' : 'شهريًا ') + this.fmt(month) + ' ' + cur + ' · ' + n(defs.length) + (eg ? ' خطط' : ' خطط'),
      plans,
      receivedLabel: eg ? 'المبلغ اللي استلمته' : 'المبلغ المستلم',
      note: eg ? 'القسط كله بيتحسب مصروف وقت ما بيتدفع.' : 'يُحسب القسط كاملًا مصروفًا عند دفعه.'
    };
  }
}
</script>
</body>
</html>
