<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":200}}'>
// كارت الرئيسية «تقدر تصرف النهارده» (اختيار المالك 2026-10-15): اللي معاك ناقص الالتزامات الجاية لحد الراتب، مقسوم على الأيام الفاضلة
// الرقم ليه مصدر مكتوب تحته (قاعدة 10) · بالوحدة الصغرى، والقسمة بتنزل لأقرب ريال/جنيه تحت (ما نقولش رقم أكبر من الحقيقة)
// في التطبيق: حالة استخدام (DailyAllowance) من المحافظ والمستحقات ويوم الراتب — الأرقام هنا مخترعة ومتسقة مع الرئيسية (7,350 · الراتب بعد 21 يوم)
const withCur = (v, c) => (c === '⃁' ? '⁦⃁ ' + v + '⁩' : v + ' ' + c);
const DATA = { sa: { have: 735000, dues: 220000, left: 21, month: 30 }, eg: { have: 2530000, dues: 660000, left: 21, month: 30 } };
class Component extends DCLogic {
  fmt(m) { const a = Math.abs(m); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a), cur = eg ? 'ج.م' : '⃁', d = eg ? DATA.eg : DATA.sa;
    const raw = Math.floor((d.have - d.dues) / d.left), per = raw - (raw % 100), passed = d.month - d.left;
    return {
      title: T('تستطيع أن تصرف اليوم', 'تقدر تصرف النهارده'), sub: T('حتى الراتب بعد ' + d.left + ' يومًا', 'لحد المرتب بعد ' + d.left + ' يوم'),
      perDay: withCur(this.fmt(per), cur), unit: T('في اليوم', 'في اليوم'),
      bar: 'display: block; height: 8px; border-radius: 4px; background: #27785B; width: ' + Math.round((passed * 100) / d.month) + '%',
      passed: T('مضى ' + passed + ' أيام', 'فات ' + passed + ' أيام'), left: T('باقي ' + d.left + ' يومًا', 'فاضل ' + d.left + ' يوم'),
      basis: T('معك ' + this.fmt(d.have) + '، ناقص التزامات قادمة ' + this.fmt(d.dues) + '، مقسومة على ' + d.left + ' يومًا.', 'معاك ' + this.fmt(d.have) + '، ناقص التزامات جاية ' + this.fmt(d.dues) + '، على ' + d.left + ' يوم.'),
      aria: T('تستطيع أن تصرف ', 'تقدر تصرف ') + this.fmt(per) + T(' في اليوم حتى الراتب', ' في اليوم لحد المرتب')
    };
  }
}
</script>
