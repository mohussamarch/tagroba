<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بنوك «معك الآن» — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.h-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.h-press:active{transform:scale(.95)}
.h-veil{animation:h-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.h-pop{transform-origin:16% 0;animation:h-pop 420ms cubic-bezier(.18,.9,.28,1.08) both}
@keyframes h-fade{from{opacity:0}to{opacity:1}}
@keyframes h-pop{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.h-press{transition:none}.h-press:active{transform:none}.h-pop{animation:h-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="position: relative; display: flex; font-family: 'Noto Sans Arabic', Tahoma, sans-serif">
  <button type="button" class="h-press" onClick="{{toggle}}" aria-label="{{groupLabel}}" aria-expanded="{{expanded}}" aria-haspopup="dialog" style="border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; display: flex; min-height: 48px; align-items: center">
    <sc-for list="{{lenses}}" as="b" hint-placeholder-count="3">
      <span style="{{b.style}}">
        <span aria-hidden="true" style="position: absolute; top: 2px; left: 16%; width: 52%; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent); transform: rotate(-8deg)"></span>
        <span style="font-size: 15px; font-weight: 700; color: #DAF8E9">{{b.mark}}</span>
      </span>
    </sc-for>
  </button>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 20">
      <button type="button" class="h-veil" onClick="{{close}}" aria-label="{{closeLabel}}" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.14); backdrop-filter: blur(6px) saturate(0.9); -webkit-backdrop-filter: blur(6px) saturate(0.9)"></button>
      <div role="dialog" aria-label="{{title}}" class="h-pop" style="position: absolute; top: 162px; left: 20px; width: 310px; box-sizing: border-box; border-radius: 28px; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 4px; color: #193D33; background: linear-gradient(125deg, rgba(246,251,245,0.95), rgba(236,244,233,0.88) 55%, rgba(214,236,219,0.92)); backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3); box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8), inset -1px -1px 3px rgba(59,113,102,0.16), 0 22px 48px rgba(16,45,53,0.24)">
        <span style="font-size: 16px; font-weight: 700; padding: 0 6px 4px">{{title}}</span>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div style="{{r.rowStyle}}">
            <span aria-hidden="true" style="{{r.mini}}">{{r.mark}}</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: #637570">{{r.sub}}</span></span>
            <span dir="ltr" style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0">{{r.amount}}</span>
          </div>
        </sc-for>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 6px 2px; border-top: 1px solid rgba(25,61,51,0.12); margin-top: 4px">
          <span style="font-size: 14px; font-weight: 700">{{totalLabel}}</span>
          <span dir="ltr" style="font-size: 18px; font-weight: 700; color: #08634F; font-variant-numeric: tabular-nums">{{totalText}}</span>
        </div>
        <span style="font-size: 11px; color: #637570; padding: 0 6px">{{logoNote}}</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"cash":{"editor":"text","default":"","section":"الحالة"},"$preview":{"width":120,"height":48}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; }
  fmt(minor) { const a = Math.abs(minor), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const cur = eg ? 'ج.م' : 'ر.س';
    // الشخص الافتراضي في النموذج: ٥ حسابات بنك — ٣ في السعودية و٢ في مصر (طلب المالك 2026-10-08).
    // المبالغ مخترعة وبالوحدة الصغرى، ومجموعها = رصيد البنك في الرئيسية (645000 / 2260000).
    // mark = مكان لوجو البنك لحد ما بحث اللوجوهات يخلص ويتعتمد.
    const banks = eg
      ? [['البنك الأهلي المصري', 'أ', 1640000], ['QNB مصر', 'Q', 620000]]
      : [['مصرف الراجحي', 'ر', 412000], ['البنك الأهلي السعودي', 'أ', 183000], ['مصرف الإنماء', 'إ', 50000]];
    const cashRaw = parseInt(String(this.props.cash || ''), 10);
    const cash = Number.isFinite(cashRaw) ? cashRaw : (eg ? 270000 : 90000);
    const total = banks.reduce((t, b) => t + b[2], 0) + cash;
    const lensBase = 'position: relative; width: 42px; height: 42px; box-sizing: border-box; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, rgba(255,255,255,0.26), rgba(255,255,255,0.05) 48%, rgba(150,243,204,0.18)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: inset 1px 1px 2px rgba(200,255,235,0.45), inset -1px -2px 3px rgba(0,47,48,0.28), 0 6px 12px rgba(0,42,53,0.16), 0 0 0 1.5px rgba(6,75,64,0.55)';
    const mini = 'width: 34px; height: 34px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #08634F; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)';
    const s = this.state;
    const rows = banks.map(([name, mark, amt]) => ({ name, mark, sub: eg ? 'حساب بنك' : 'حساب بنكي', amount: this.fmt(amt) + ' ' + cur, mini }))
      .concat([{ name: 'الكاش', mark: '', sub: eg ? 'اللي في جيبك' : 'الذي معك', amount: this.fmt(cash) + ' ' + cur, mini: mini + '; background: #DCEBD6' }]);
    rows.forEach((r, i) => { r.rowStyle = 'display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 2px 6px;' + (i === rows.length - 1 ? '' : ' border-bottom: 1px solid rgba(25,61,51,0.06);'); });
    return {
      // أول بنك (الأكبر) على اليمين والباقي ورا بعض ناحية الشمال
      lenses: banks.map(([name, mark], i) => ({ mark, style: lensBase + (i ? '; margin-inline-start: -10px' : '') + '; z-index: ' + (banks.length - i) })),
      groupLabel: (eg ? 'البنوك اللي في «معاك دلوقتي»: ' : 'البنوك المشمولة في «معك الآن»: ') + banks.map((b) => b[0]).join('، '),
      expanded: s.open ? 'true' : 'false',
      toggle: () => this.setState({ open: !s.open }),
      close: () => this.setState({ open: false }),
      closeLabel: eg ? 'اقفل' : 'إغلاق',
      open: s.open,
      title: eg ? 'معاك دلوقتي فين؟' : 'أين ما معك الآن؟',
      rows,
      totalLabel: eg ? 'معاك دلوقتي' : 'معك الآن',
      totalText: this.fmt(total) + ' ' + cur,
      logoNote: eg ? 'لوجو كل بنك هيتحط مكان الحرف بعد ما بحث اللوجوهات يتعتمد.' : 'يحل شعار كل بنك محل الحرف بعد اعتماد بحث الشعارات.'
    };
  }
}
</script>
</body>
</html>
