<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نافذة الإشعارات — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.b-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.b-press:active{transform:scale(.96)}
.b-veil{animation:b-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.b-pop{transform-origin:24% 0;animation:b-pop 420ms cubic-bezier(.18,.9,.28,1.08) both}
.b-dot{transition:opacity 260ms cubic-bezier(.2,.7,.3,1),transform 260ms cubic-bezier(.2,.7,.3,1)}
@keyframes b-fade{from{opacity:0}to{opacity:1}}
@keyframes b-pop{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.b-press,.b-dot{transition:none}.b-press:active{transform:none}.b-pop{animation:b-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 48px; height: 48px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <button type="button" class="b-press" onClick="{{toggle}}" aria-label="{{bellLabel}}" aria-expanded="{{expanded}}" aria-haspopup="dialog" style="{{bellStyle}}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    <span aria-hidden="true" class="b-dot" style="{{dotStyle}}"></span>
  </button>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 20">
      <button type="button" class="b-veil" onClick="{{close}}" aria-label="{{closeLabel}}" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.06)"></button>
      <div role="dialog" aria-label="{{title}}" class="b-pop" style="position: absolute; top: 80px; left: 20px; width: 320px; box-sizing: border-box; border-radius: 28px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(125deg, rgba(246,251,245,0.94), rgba(236,244,233,0.86) 55%, rgba(214,236,219,0.90)); backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3); box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8), inset -1px -1px 3px rgba(59,113,102,0.16), 0 22px 48px rgba(16,45,53,0.22)">
        <span aria-hidden="true" style="position: absolute; top: -7px; left: 69px; width: 14px; height: 14px; transform: rotate(45deg); border-radius: 3px; background: rgba(246,251,245,0.96)"></span>
        <span style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px"><span style="font-size: 16px; font-weight: 700">{{title}}</span><span style="font-size: 12px; color: #637570">{{countLine}}</span></span>
        <sc-for list="{{items}}" as="n" hint-placeholder-count="4">
          <div style="{{n.style}}">
            <span aria-hidden="true" style="{{n.dot}}"></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span><span style="font-size: 12px; color: #637570">{{n.when}}</span></span>
          </div>
        </sc-for>
        <div style="display: flex; gap: 8px; padding-top: 4px">
          <button type="button" class="b-press" onClick="{{markRead}}" disabled="{{allRead}}" style="{{readStyle}}">{{readLabel}}</button>
          <a href="Notifications.dc.html" class="b-press" style="flex: 1 1 0; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #FFFFFF; text-decoration: none; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.22)">{{allLabel}}</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let read = false;
    // «تم القراءة» بيفضل طول الجلسة، وصفحة الإشعارات الكاملة بتقراه هي كمان
    try { read = window.sessionStorage.getItem('masroufy-notif-read') === '1'; } catch (e) {}
    this.state = { open: false, read };
  }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const s = this.state;
    // نفس سطور صفحة الإشعارات (مخترعة) — النافذة عرض سريع بس، والأفعال في الصفحة الكاملة
    const defs = [
      ['#08634F', eg ? 'رسايل من البنك مستنية تأكيدك' : 'رسائل من البنك بانتظار تأكيدك', eg ? 'من ١٠ دقايق' : 'قبل ١٠ دقائق', true],
      ['#2469BA', eg ? 'حوالة من طرف جديد' : 'حوالة من طرف جديد', eg ? 'النهارده' : 'اليوم', true],
      ['#BE3D48', eg ? 'التسوق عدّى السقف' : 'التسوق تجاوز السقف', eg ? 'النهارده' : 'اليوم', true],
      ['#956000', eg ? 'اشتراك الجيم بعد يومين' : 'اشتراك النادي بعد يومين', eg ? 'امبارح' : 'أمس', false]
    ];
    const unread = s.read ? 0 : defs.filter((d) => d[3]).length;
    return {
      bellLabel: (eg ? 'الإشعارات' : 'الإشعارات') + (unread ? (eg ? ' — فيه جديد' : ' — يوجد جديد') : ''),
      expanded: s.open ? 'true' : 'false',
      toggle: () => this.setState({ open: !s.open }),
      close: () => this.setState({ open: false }),
      closeLabel: eg ? 'اقفل الإشعارات' : 'إغلاق الإشعارات',
      bellStyle: 'border: 0; width: 48px; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; position: relative; color: #193D33; cursor: pointer; ' + (s.open ? 'z-index: 21; ' : '') + (s.open ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)'),
      dotStyle: 'position: absolute; top: 12px; left: 13px; width: 6px; height: 6px; border-radius: 3px; background: #BE3D48; ' + (unread ? 'opacity: 1' : 'opacity: 0; transform: scale(0.4)'),
      open: s.open,
      title: 'الإشعارات',
      countLine: unread ? unread.toLocaleString('ar-EG') + (eg ? ' جديد' : ' جديدة') : (eg ? 'كله مقروء' : 'كلها مقروءة'),
      items: defs.map(([c, title, when, isNew], i) => {
        const fresh = isNew && !s.read;
        return {
          title, when,
          dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + (fresh ? c : 'transparent') + '; box-shadow: inset 0 0 0 1.5px ' + c,
          style: 'display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 10px; border-radius: 16px; ' + (fresh ? 'background: rgba(255,255,255,0.75)' : 'background: transparent; opacity: 0.72')
        };
      }),
      allRead: unread === 0,
      readLabel: unread ? (eg ? 'علّم الكل مقروء' : 'تعليم الكل كمقروء') : (eg ? 'كله مقروء' : 'كلها مقروءة'),
      readStyle: 'flex: 1 1 0; height: 48px; border: 0; border-radius: 18px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: #08634F; background: rgba(255,255,255,0.8); box-shadow: inset 0 0 0 1px rgba(8,99,79,0.18);' + (unread ? '' : ' opacity: 0.5; cursor: default'),
      markRead: () => { if (!unread) return; try { window.sessionStorage.setItem('masroufy-notif-read', '1'); } catch (e) {} this.setState({ read: true }); },
      allLabel: eg ? 'كل الإشعارات' : 'كل الإشعارات'
    };
  }
}
</script>
</body>
</html>
