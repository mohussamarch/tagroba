<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شريط القادم — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.u-strip{scrollbar-width:none;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.u-strip::-webkit-scrollbar{display:none}
.u-card{scroll-snap-align:start;transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.u-card:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.u-card{transition:none}.u-card:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; margin: 0 -20px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div class="u-strip" role="list" aria-label="{{listLabel}}" style="display: flex; gap: 12px; overflow-x: auto; padding: 6px 20px 22px; scroll-padding: 0 20px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <a href="{{c.href}}" role="listitem" class="u-card" aria-label="{{c.aria}}" style="{{c.style}}">
        <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <span style="{{c.inStyle}}">{{c.inText}}</span>
          <span style="font-size: 12px; color: #637570">{{c.date}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 4px 0 2px">
          <span aria-hidden="true" style="{{c.iconStyle}}">
            <sc-if value="{{c.i.gem}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9Z"></path><path d="M11 3 8 9l4 13 4-13-3-6"></path><path d="M2 9h20"></path></svg></sc-if>
            <sc-if value="{{c.i.gift}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"></path></svg></sc-if>
            <sc-if value="{{c.i.car}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.5-5h11L19 16"></path><path d="M4 16h16v3H4z"></path><circle cx="7.5" cy="19.5" r="1"></circle><circle cx="16.5" cy="19.5" r="1"></circle></svg></sc-if>
            <sc-if value="{{c.i.sub}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17.5v-11"></path></svg></sc-if>
            <sc-if value="{{c.i.pay}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg></sc-if>
          </span>
          <span style="font-size: 16px; font-weight: 700; line-height: 1.4">{{c.title}}</span>
        </span>
        <span aria-hidden="true" style="height: 1px; background: rgba(25,61,51,0.08)"></span>
        <span style="{{c.statusStyle}}"><span>{{c.state}}</span><sc-if value="{{c.hasAmt}}" hint-placeholder-val="{{ true }}"><span dir="ltr" style="font-variant-numeric: tabular-nums">{{c.amt}}</span></sc-if></span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":230}}'>
class Component extends DCLogic {
  fmt(minor) { const a = Math.abs(minor); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  // بالعربي الكروت بتبدأ من اليمين والتمرير بيكشف اللي على الشمال؛ النسخة الإنجليزي هتبقى بالعكس لوحدها من اتجاه الصفحة
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const cur = eg ? 'ج.م' : 'ر.س';
    const n = (x) => x.toLocaleString('en-US');
    // مخترعة (النهارده 7 أكتوبر) · بالوحدة الصغرى · نفس أرقام الرئيسية والمستحقات
    // st: held محجوز · open غير محجوز · none من غير مبلغ (§65: المناسبة ويوم المرتب) · in فلوس جاية
    const defs = [
      { t: eg ? 'اشتراك الجيم' : 'اشتراك النادي', d: 9, days: 2, icon: 'sub', st: 'held', amt: eg ? 59700 : 19900, to: 'Subscriptions' },
      { t: eg ? 'عيد ميلاد ليلى' : 'عيد ميلاد ليلى', d: 14, days: 7, icon: 'gift', st: 'none', to: 'PersonProfile' },
      { t: eg ? 'فرح خالد' : 'زواج خالد', d: 18, days: 11, icon: 'gem', st: 'held', amt: eg ? 150000 : 50000, to: 'PersonProfile' },
      { t: 'قسط السيارة', d: 27, days: 20, icon: 'car', st: 'open', amt: eg ? 435000 : 145000, to: 'Installments' },
      { t: eg ? 'يوم المرتب' : 'يوم الراتب', d: 28, days: 21, icon: 'pay', st: 'in', to: 'Main' }
    ];
    const tint = { sub: ['#956000', 'rgba(149,96,0,0.10)'], gift: ['#A55060', 'rgba(165,80,96,0.10)'], gem: ['#A55060', 'rgba(165,80,96,0.10)'], car: ['#4D747C', 'rgba(77,116,124,0.12)'], pay: ['#13764D', 'rgba(19,118,77,0.10)'] };
    const after = (d) => d === 1 ? (eg ? 'بكرة' : 'غدًا') : d === 2 ? (eg ? 'بعد يومين' : 'بعد يومين') : (eg ? 'بعد ' : 'بعد ') + n(d) + (d <= 10 ? (eg ? ' أيام' : ' أيام') : (eg ? ' يوم' : ' يومًا'));
    const status = (c) => ({
      held: [eg ? 'محجوز' : 'محجوز', '#13764D'],
      open: [eg ? 'مش محجوز' : 'غير محجوز', '#BE3D48'],
      none: [eg ? 'من غير مبلغ' : 'بلا مبلغ', '#637570'],
      in: [eg ? 'فلوس جاية' : 'دخل متوقع', '#13764D']
    })[c.st];
    return {
      listLabel: eg ? 'المواعيد الجاية' : 'المواعيد القادمة',
      cards: defs.map((c) => {
        const [txt, col] = status(c), amt = c.amt ? this.fmt(c.amt) + ' ' + cur : '';
        const soon = c.days <= 3;
        return {
          href: c.to + '.dc.html', title: c.t, date: n(c.d) + ' أكتوبر', i: { [c.icon]: true },
          aria: c.t + '، ' + after(c.days) + '، ' + n(c.d) + ' أكتوبر، ' + txt + (amt ? ' ' + amt : ''),
          inText: after(c.days),
          inStyle: 'font-size: 12px; font-weight: 700; color: ' + (soon ? '#956000' : '#193D33'),
          iconStyle: 'width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: ' + tint[c.icon][0] + '; background: ' + tint[c.icon][1],
          state: txt, amt, hasAmt: !!amt, statusStyle: 'display: flex; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: ' + col,
          style: 'flex: 0 0 196px; box-sizing: border-box; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #193D33; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)'
        };
      })
    };
  }
}
</script>
</body>
</html>
