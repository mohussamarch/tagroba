<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طرف التحويل — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.p-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.p-press:active{transform:scale(.97)}
.p-veil{animation:p-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.p-up{animation:p-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.p-in{position:relative;overflow:hidden;animation:p-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
.p-sheen{position:absolute;top:0;bottom:0;left:100%;width:60%;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(166,222,193,0.75) 50%,transparent 70%);animation:p-sheen 1200ms cubic-bezier(.3,.7,.4,1) 200ms both}
@keyframes p-sheen{from{transform:translateX(0)}to{transform:translateX(-270%)}}
@keyframes p-fade{from{opacity:0}to{opacity:1}}
@keyframes p-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes p-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.p-press{transition:none}.p-press:active{transform:none}.p-sheen{display:none}.p-up,.p-in{animation:p-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; display: flex; flex-direction: column; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FBF0DD">
      <span style="font-size: 13px; font-weight: 700; color: #956000">{{askTitle}}</span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{partyLine}}</span><span style="font-size: 12px; color: #6B4600">{{partyFrom}}</span></span>
      <button type="button" class="p-press" onClick="{{openWho}}" style="height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.22)">{{personLabel}}</button>
      <div style="display: flex; gap: 8px">
        <button type="button" class="p-press" onClick="{{markOwn}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #6B4600; cursor: pointer; background: rgba(255,255,255,0.7)">{{ownLabel}}</button>
        <button type="button" class="p-press" onClick="{{markNot}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #6B4600; cursor: pointer; background: rgba(255,255,255,0.7)">{{notLabel}}</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{decided}}" hint-placeholder-val="{{ false }}">
    <div class="p-in" style="{{doneStyle}}">
      <span style="font-size: 13px; font-weight: 700">{{doneTitle}}</span>
      <span style="font-size: 13px; color: #193D33">{{doneBody}}</span>
      <button type="button" class="p-press" onClick="{{undo}}" style="align-self: flex-start; height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(255,255,255,0.75)">{{undoLabel}}</button>
      <span class="p-sheen" aria-hidden="true"></span>
    </div>
  </sc-if>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="p-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{sheetTitle}}" class="p-up" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
        <span style="font-size: 17px; font-weight: 700">{{sheetTitle}}</span>
        <sc-if value="{{stepWho}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="{{newBox}}">
              <span style="font-size: 12px; font-weight: 700; color: #08634F">{{newTitle}}</span>
              <input type="text" aria-label="{{nameLabel}}" value="{{newName}}" onInput="{{typeName}}" onFocus="{{pickNew}}" maxlength="80" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700; color: #193D33; background: #FFFFFF; outline: none; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)">
              <div style="display: flex; gap: 6px">
                <sc-for list="{{circles}}" as="c" hint-placeholder-count="3">
                  <button type="button" class="p-press" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
                </sc-for>
              </div>
            </div>
            <span style="font-size: 12px; font-weight: 700; color: #637570">{{orLabel}}</span>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
                <button type="button" role="radio" aria-checked="{{p.on}}" class="p-press" onClick="{{p.pick}}" style="{{p.style}}">
                  <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #08634F; background: #DCEBD6">{{p.initial}}</span>
                  <span style="flex: 1 1 auto; text-align: right; font-size: 15px; font-weight: 700">{{p.name}}</span>
                </button>
              </sc-for>
            </div>
            <button type="button" class="p-press" onClick="{{toKind}}" disabled="{{noWho}}" style="{{nextStyle}}">{{nextLabel}}</button>
          </div>
        </sc-if>
        <sc-if value="{{stepKind}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 14px; color: #637570">{{kindQ}}</span>
            <div role="radiogroup" aria-label="{{kindQ}}" style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
                <button type="button" role="radio" aria-checked="{{k.on}}" class="p-press" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button>
              </sc-for>
            </div>
            <button type="button" class="p-press" onClick="{{save}}" disabled="{{noKind}}" style="{{saveStyle}}">{{saveLabel}}</button>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":360}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // مخترعة: الاسم من سطر «من:» في رسالة البنك، وآخر ٤ أرقام بس (ممنوع الرقم كامل)
    this.state = { mode: 'ask', sheet: false, step: 'who', who: null, newName: 'سالم', circle: null, kind: null };
  }
  tell(kind) { if (typeof this.props.onKind === 'function') this.props.onKind(kind); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const s = this.state;
    const chip = (on) => 'height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const primary = (ok) => 'height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%);' + (ok ? '' : ' opacity: 0.45; cursor: default');
    const isNew = s.who === 'new';
    const name = isNew ? (s.newName.trim() || 'سالم') : s.who;
    const circles = [['family', eg ? 'عيلة' : 'عائلة'], ['friends', eg ? 'صحاب' : 'أصدقاء'], ['work', eg ? 'شغل' : 'عمل']].map(([id, label]) => ({
      label, on: s.circle === id ? 'true' : 'false', pick: () => this.setState({ circle: s.circle === id ? null : id, who: 'new' }), style: chip(s.circle === id)
    }));
    const people = ['ليلى', 'يوسف', 'خالد', 'أحمد', 'نورة'].map((p) => ({
      name: p, initial: p.slice(0, 1), on: s.who === p ? 'true' : 'false', pick: () => this.setState({ who: p }),
      style: 'display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 12px; border: 0; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; ' + (s.who === p ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: rgba(25,61,51,0.04)')
    }));
    // §42: الوارد من شخص بيتسأل نوعه من القايمة دي
    const kindDefs = eg ? ['هدية', 'مساعدة', 'تحصيل دين', 'سلفة جاتلي', 'أمانة', 'دور جمعية'] : ['هدية', 'مساعدة', 'تحصيل دين', 'قرض مستلم', 'أمانة', 'دور جمعية'];
    const kinds = kindDefs.map((label) => ({ label, on: s.kind === label ? 'true' : 'false', pick: () => this.setState({ kind: label }), style: chip(s.kind === label) }));
    const tone = { person: ['#08634F', '#DCEBD6'], own: ['#2469BA', 'rgba(36,105,186,0.10)'], not: ['#637570', 'rgba(25,61,51,0.06)'] }[s.mode] || ['#637570', '#FFFFFF'];
    const done = {
      person: [(eg ? 'اتربط ب' : 'رُبط ب') + name + (s.kind ? ' · ' + s.kind : ''),
        (s.made ? (eg ? name + ' اتضاف لأشخاصك. ' : 'أُضيف ' + name + ' إلى أشخاصك. ') : '') + (eg ? 'أي تحويل من الحساب ٤٨٢١ أو ليه هيتسجل عليه لوحده، وهنسألك نوعه كل مرة (سلفة ولا دعم…).' : 'أي تحويل من الحساب ٤٨٢١ أو إليه يُسجَّل عليه تلقائيًا، ونسألك نوعه كل مرة (سلفة أو دعم…).')],
      own: [eg ? 'تحويل بين محافظك' : 'تحويل بين محافظك', eg ? 'مش دخل ولا مصروف. واتصلّح كمان تحويلين قدام من نفس الحساب.' : 'ليس دخلًا ولا مصروفًا. وصُحّح تحويلان سابقان من الحساب نفسه.'],
      not: [eg ? 'تمام' : 'تم', eg ? 'مش هنسألك عن الحساب ده تاني. التحويل فاضل دخل من غير شخص.' : 'لن نسألك عن هذا الحساب مجددًا. يبقى التحويل دخلًا بلا شخص.']
    }[s.mode] || ['', ''];
    return {
      asking: s.mode === 'ask', decided: s.mode !== 'ask',
      askTitle: eg ? 'مين ده؟' : 'من هذا؟',
      partyLine: eg ? 'الاسم في كشف الحساب: سالم' : 'الاسم في الرسالة: سالم',
      partyFrom: eg ? 'حساب آخره ٤٨٢١، أول مرة يحوّلك' : 'حساب ينتهي بـ ٤٨٢١، أول تحويل منه',
      personLabel: eg ? 'شخص أعرفه' : 'شخص أعرفه',
      ownLabel: eg ? 'حسابي التاني' : 'حسابي الآخر', notLabel: eg ? 'مش ده' : 'ليس هذا',
      openWho: () => this.setState({ sheet: true, step: 'who' }),
      markOwn: () => { this.setState({ mode: 'own' }); this.tell(eg ? 'تحويل بين محافظك' : 'تحويل بين محافظك'); },
      markNot: () => { this.setState({ mode: 'not' }); this.tell(eg ? 'دخل' : 'دخل'); },
      doneStyle: 'border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; color: ' + tone[0] + '; background: ' + tone[1],
      doneTitle: done[0], doneBody: done[1],
      undoLabel: eg ? 'تراجع' : 'تراجع',
      undo: () => { this.setState({ mode: 'ask', kind: null, who: null, made: false }); this.tell(null); },
      sheet: s.sheet,
      sheetTitle: s.step === 'who' ? (eg ? 'مين صاحب الحساب ٤٨٢١؟' : 'من صاحب الحساب ٤٨٢١؟') : (eg ? 'الفلوس دي من ' : 'هذا المبلغ من ') + name,
      stepWho: s.step === 'who', stepKind: s.step === 'kind',
      newBox: 'display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px; ' + (isNew ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: rgba(25,61,51,0.04)'),
      newTitle: eg ? 'شخص جديد (الاسم من الكشف)' : 'شخص جديد (الاسم من الرسالة)',
      nameLabel: eg ? 'اسم الشخص' : 'اسم الشخص', newName: s.newName,
      typeName: (e) => this.setState({ newName: e.target.value, who: 'new' }),
      pickNew: () => this.setState({ who: 'new' }),
      circles,
      orLabel: eg ? 'أو واحد من أشخاصك' : 'أو أحد أشخاصك',
      people,
      noWho: !s.who || (isNew && !s.newName.trim()),
      nextLabel: eg ? 'التالي' : 'التالي', nextStyle: primary(!!s.who && !(isNew && !s.newName.trim())),
      toKind: () => { if (s.who) this.setState({ step: 'kind' }); },
      kindQ: eg ? 'الفلوس دي إيه؟' : 'ما نوع هذا المبلغ؟',
      kinds, noKind: !s.kind,
      saveLabel: eg ? 'اربط وسجّل' : 'اربط وسجّل', saveStyle: primary(!!s.kind),
      save: () => { if (!s.kind) return; this.setState({ sheet: false, mode: 'person', made: isNew }); this.tell(s.kind); },
      closeSheet: () => this.setState({ sheet: false })
    };
  }
}
</script>
</body>
</html>
