<div dir="rtl" style="width: 100%; min-width: 350px; display: flex; flex-direction: column; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #FBF0DD">
      <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 700; color: #956000">{{askTitle}}</span><span style="{{amtStyle}}">{{amount}}</span></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{partyLine}}</span><span style="font-size: 12px; color: #6B4600">{{partyFrom}}</span></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="6">
          <button type="button" class="p-press" onClick="{{o.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 92px; padding: 10px 12px; border: 0; border-radius: 16px; font: inherit; text-align: right; color: #193D33; cursor: pointer; background: rgba(255,255,255,0.78)">
            <span aria-hidden="true" style="{{o.box}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{o.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{o.ic}}"></path></svg></span>
            <span style="font-size: 14px; font-weight: 700; line-height: 1.35">{{o.label}}</span>
            <span style="font-size: 11px; line-height: 1.45; color: #637570">{{o.hint}}</span>
          </button>
        </sc-for>
      </div>
      <button type="button" class="p-press" onClick="{{ignore}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #6B4600; cursor: pointer; background: transparent"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B4600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{eyeOff}}"></path></svg>{{ignoreLabel}}</button>
    </div>
  </sc-if>

  <sc-if value="{{ignoring}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="p-in" style="border-radius: 18px; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px; color: #FFFFFF; background: rgba(25,61,51,0.94)">
      <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.6">{{ignoreStrip}}</span>
      <span aria-hidden="true" style="flex-shrink: 0; font-size: 12px; color: #9FE0C8; font-variant-numeric: tabular-nums">{{secs}}</span>
      <button type="button" class="p-press" onClick="{{undo}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #9FE0C8; cursor: pointer; background: rgba(255,255,255,0.10)">{{undoLabel}}</button>
    </div>
  </sc-if>

  <sc-if value="{{decided}}" hint-placeholder-val="{{ false }}">
    <div class="p-in" style="{{doneStyle}}">
      <span style="font-size: 14px; font-weight: 700">{{doneTitle}}</span>
      <span style="font-size: 13px; line-height: 1.7; color: #193D33">{{doneBody}}</span>
      <button type="button" class="p-press" onClick="{{undo}}" style="align-self: flex-start; height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(255,255,255,0.75)">{{doneBtn}}</button>
    </div>
  </sc-if>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="p-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{sheetTitle}}" class="p-up" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">

        <sc-if value="{{subPerson}}" hint-placeholder-val="{{ false }}">
          <dc-import name="WithWho" bare="{{true}}" amount="{{wwAmt}}" dir="{{wwDir}}" cat="{{wwCat}}" suggest="{{partyName}}" space="{{spaceName}}" on-done="{{onPerson}}" on-later="{{onLater}}" hint-size="350px,640px"></dc-import>
        </sc-if>
        <sc-if value="{{subChips}}" hint-placeholder-val="{{ true }}">
          <div role="radiogroup" aria-label="{{sheetTitle}}" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{c.on}}" class="p-press" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{subLabel}}" hint-placeholder-val="{{ false }}">
          <input type="text" autocomplete="off" aria-label="{{sheetTitle}}" placeholder="{{labelHint}}" value="{{labelText}}" onInput="{{typeLabel}}" maxlength="60" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700; color: #193D33; background: #FFFFFF; outline: none; box-shadow: inset 0 0 0 1.5px #08634F">
        </sc-if>
        <sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}"><span style="border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #08634F; background: #DCEBD6">{{note}}</span></sc-if>
        <sc-if value="{{hasSave}}" hint-placeholder-val="{{ true }}"><button type="button" class="p-press" onClick="{{save}}" disabled="{{cantSave}}" style="{{saveStyle}}">{{saveLabel}}</button></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dir":{"editor":"enum","options":["وارد","صادر"],"default":"وارد","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":470}}'>

    const name = 'سالم';

      person: [(eg ? 'اتربط بـ' : 'رُبط بـ') + (x.person || name) + (x.meaning ? ' · ' + x.meaning : ''), (x.isNew ? (eg ? (x.person || name) + ' اتضاف لأشخاصك. ' : 'أُضيف ' + (x.person || name) + ' إلى أشخاصك. ') : '') + (eg ? 'أي تحويل من الحساب 4821 أو ليه هيتسجّل عليه لوحده، وهنسألك معناه كل مرة.' : 'أي تحويل من الحساب 4821 أو إليه يُسجَّل عليه تلقائيًا، ونسألك معناه كل مرة.'), '#08634F', '#DCEBD6'],
      own: [eg ? 'تحويل بين محافظك' : 'تحويل بين محافظك', eg ? 'مش دخل ولا مصروف. واتصلّح كمان تحويلين قدام من نفس الحساب.' : 'ليس دخلًا ولا مصروفًا. وصُحّح تحويلان سابقان من الحساب نفسه.', '#2469BA', 'rgba(36,105,186,0.10)'],
      salary: [eg ? 'تمام — اتسجّل مرتب' : 'تم — سُجّل راتبًا', eg ? 'أي تحويل جاي من الحساب 4821 هيتسجّل مرتب لوحده، والتوقع بيتحسب منه.' : 'أي تحويل يصل من الحساب 4821 يُسجَّل راتبًا تلقائيًا، ويُحسب منه التوقع.', '#956000', '#FBF0DD'],
      company: [(eg ? 'تمام — جهة: ' : 'تم — جهة: ') + name, (eg ? 'المبلغ ده «' : 'هذا المبلغ «') + (x.what || '') + (eg ? '». الجاي منها هسألك عن نوعه.' : '». سنسألك عن نوع ما يصل منها لاحقًا.'), '#5B5BA8', 'rgba(91,91,168,0.10)'],
      dues: [(eg ? 'تمام — كل تحويل من الحساب ده بيسدّد اللي على ' : 'تم — كل تحويل من هذا الحساب يسدّد ما على ') + (x.who || ''), eg ? 'اتسجل سداد من تحويل واحد. توقّف القاعدة من صفحة الشخص.' : 'سُجّل سداد من تحويل واحد. توقف القاعدة من صفحة الشخص.', '#B0466A', 'rgba(176,70,106,0.10)'],
      label: [(eg ? 'تمام — «' : 'تم — «') + (x.what || '') + '»', (eg ? 'أي تحويل جاي من ' : 'أي تحويل يصل من ') + name + (eg ? ' هيتسجل «' : ' يُسجَّل «') + (x.what || '') + '».', '#637570', 'rgba(25,61,51,0.06)'],
      ignored: [eg ? 'الحساب 4821 متجاهَل' : 'الحساب 4821 متجاهَل', eg ? 'التحويل فاضل من غير طرف. ترجّعه من «إعداد القراية» › «حسابات متجاهَلة».' : 'يبقى التحويل بلا طرف. تستعيده من «إعداد القراءة» › «حسابات متجاهَلة».', '#637570', 'rgba(25,61,51,0.06)']
    }[s.mode] || ['', '', '#637570', '#FFFFFF'];
    return {
      asking: s.mode === 'ask', ignoring: s.mode === 'ignoring', decided: !['ask', 'ignoring'].includes(s.mode),
      askTitle: eg ? 'مين ده؟' : 'من هذا؟',
      amount: money, amtStyle: 'font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (out ? '#BE3D48' : '#08634F'),
      partyLine: (eg ? 'الاسم في الرسالة: ' : 'الاسم في الرسالة: ') + name,
      partyFrom: out ? (eg ? 'حساب آخره 4821، أول مرة تحوّله' : 'حساب ينتهي بـ 4821، أول تحويل إليه') : (eg ? 'حساب آخره 4821، أول مرة يحوّلك' : 'حساب ينتهي بـ 4821، أول تحويل منه'),
      options, eyeOff: 'M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49M14.084 14.158a3 3 0 0 1-4.242-4.242M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143M2 2l20 20',
      ignoreLabel: eg ? 'تجاهل الحساب ده' : 'تجاهل هذا الحساب',
      ignore: () => {
        this.stop();
        this.setState({ mode: 'ignoring', secs: 8 });
        this.timers.push(setInterval(() => { const n = this.state.secs - 1; if (n <= 0) { this.stop(); this.setState({ mode: 'ignored', secs: 0 }); this.tell(null); } else this.setState({ secs: n }); }, 1000));
      },
      ignoreStrip: (eg ? 'اتجاهل ' : 'تجاهلنا ') + name + (eg ? ' — مش هسألك عنه تاني' : ' — لن نسألك عنه مجددًا'), secs: s.secs ? s.secs.toLocaleString('en-US') : '',
      undoLabel: eg ? 'تراجع' : 'تراجع',
      undo: () => { this.stop(); this.setState({ mode: 'ask', pick: null, label: '', extra: null }); this.tell(null); },
      doneStyle: 'border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; color: ' + done[2] + '; background: ' + done[3],
      doneTitle: done[0], doneBody: done[1], doneBtn: s.mode === 'ignored' ? (eg ? 'رجّعه' : 'استعِده') : (eg ? 'تراجع' : 'تراجع'),
      sheet: !!s.sheet, sheetTitle: sheets[0], sheetSub: sheets[1],
      subPerson: s.sheet === 'person', subChips: s.sheet === 'company' || s.sheet === 'dues', subLabel: s.sheet === 'label',
      wwDir: out ? 'صادر' : 'وارد', wwAmt: amt, wwCat: eg ? 'تحويل' : 'تحويل', partyName: name, spaceName: eg ? 'مصر' : 'السعودية',
      onPerson: this.onPerson, onLater: this.onLater,
      chips, labelHint: eg ? 'مثلًا: إيجار الشقة' : 'مثلًا: إيجار الشقة', labelText: s.label,
      typeLabel: (e) => this.setState({ label: e.target.value }),
      hasNote: !!note, note,
      hasSave: s.sheet !== 'person', cantSave: !ok,
      saveLabel: s.sheet === 'dues' ? (eg ? 'احفظ القاعدة' : 'احفظ القاعدة') : (eg ? 'احفظ' : 'احفظ'),
      saveStyle: 'height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%);' + (ok ? '' : ' opacity: 0.45; cursor: default'),
      save: saveIt,
      closeSheet: () => this.setState({ sheet: null })
    };
  }
}
</script>
