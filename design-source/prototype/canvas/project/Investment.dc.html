<style>
body{margin:0}
a{color:#08634F}a:hover{color:#064B40}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-rise{animation:m-rise 450ms cubic-bezier(.2,.7,.3,1) backwards}
.m-skel{animation:m-pulse 1.4s cubic-bezier(.2,.7,.3,1) infinite alternate}
@keyframes m-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes m-pulse{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.m-press{transition:none}.m-press:active{transform:none}.m-skel{animation:none}.m-rise{animation:m-fade 150ms both}}
@keyframes m-fade{from{opacity:0}to{opacity:1}}

<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 156px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.5">الاستثمار</h1>
      <a href="More.dc.html" class="m-press" aria-label="المزيد والإعدادات" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </a>
    </div>


    <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
      <div aria-busy="true" aria-label="جارٍ التحميل" style="display: flex; flex-direction: column; gap: 14px">
        <div class="m-skel" style="height: 132px; border-radius: 28px; background: rgba(25,61,51,0.08)"></div>
        <div class="m-skel" style="height: 210px; border-radius: 22px; background: rgba(25,61,51,0.06)"></div>
        <div class="m-skel" style="height: 112px; border-radius: 22px; background: rgba(25,61,51,0.06)"></div>
      </div>
    </sc-if>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; background: #FBF0DD; color: #956000">
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 700">تعذّر تحديث الأسعار</span>
          <span style="font-size: 12px">المعروض بأسعار آخر تحديث ناجح.</span>
        </div>
        <button type="button" class="m-press" style="border: 0; height: 48px; padding: 0 14px; border-radius: 16px; flex-shrink: 0; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 6px 14px rgba(29,54,53,0.08)">أعد المحاولة</button>
      </div>
    </sc-if>

    <sc-if value="{{showFuture}}" hint-placeholder-val="{{ true }}">
      <dc-import name="InvestFuture" state="{{futureState}}" age="{{age}}" income="{{income}}" space="{{spaceName}}" holdings-state="{{holdState}}" extra="{{added}}" on-add="{{openAdd}}" hint-size="350px,2000px"></dc-import>
      <dc-import name="InvestTipCard" situation="{{situation}}" space="{{spaceName}}" hint-size="350px,200px"></dc-import>
    </sc-if>
    <sc-if value="{{onlyHoldings}}" hint-placeholder-val="{{ false }}">
      <dc-import name="InvestHoldings" state="{{holdState}}" space="{{spaceName}}" extra="{{added}}" on-add="{{openAdd}}" hint-size="350px,560px"></dc-import>
    </sc-if>
    <sc-if value="{{showContent}}" hint-placeholder-val="{{ true }}">
      <dc-import name="InvestIncomeRope" space="{{spaceName}}" hint-size="350px,420px"></dc-import>
    </sc-if>
    <sc-if value="{{showContent}}" hint-placeholder-val="{{ true }}">
      <dc-import name="InvestReturns" space="{{spaceName}}" hint-size="350px,360px"></dc-import>
    </sc-if>

    <div style="border-radius: 22px; padding: 4px 16px; display: flex; flex-direction: column; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <sc-for list="{{tools}}" as="tl" hint-placeholder-count="3">
        <a href="{{tl.href}}" class="m-press" style="{{tl.style}}"><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{tl.label}}</span><span style="font-size: 12px; color: #637570">{{tl.hint}}</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">الحاسبات</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <a href="SavingsCalculator.dc.html" class="m-press" style="box-sizing: border-box; text-decoration: none; min-height: 84px; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #193D33; cursor: pointer; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#08634F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"></path></svg>
          <span style="font-size: 14px; font-weight: 700">الادخار</span></a>
        <a href="RetirementCalculator.dc.html" class="m-press" style="box-sizing: border-box; text-decoration: none; min-height: 84px; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #193D33; cursor: pointer; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#08634F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="font-size: 14px; font-weight: 700">التقاعد</span></a>
        <a href="InheritanceCalculator.dc.html" class="m-press" style="box-sizing: border-box; text-decoration: none; min-height: 84px; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #193D33; cursor: pointer; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#08634F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 7h14"></path><path d="M5 7l-3 7a3 3 0 0 0 6 0z"></path><path d="M19 7l-3 7a3 3 0 0 0 6 0z"></path></svg>
          <span style="font-size: 14px; font-weight: 700">الورث</span></a>
      </div>
    </div>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 148px; z-index: 7; border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 700; color: #FFFFFF; background: rgba(25,61,51,0.92); box-shadow: 0 10px 24px rgba(16,45,53,0.25)">{{toast}}</div></sc-if>
  <div style="position: absolute; inset: 0; z-index: 6; pointer-events: none">
    <dc-import name="BottomBar" active="Investment" context="الاستثمار" space="{{spaceName}}" nav-style="{{navStyle}}" hint-size="390px,844px"></dc-import>
  </div>
  <sc-if value="{{addOpen}}" hint-placeholder-val="{{ false }}"><dc-import name="AssetAddSheet" space="{{spaceName}}" on-close="{{closeAdd}}" on-save="{{saveAdd}}" hint-size="390px,844px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"navStyle":{"editor":"enum","options":["زرار في النص","اسحب لفوق","زرار جنب الشريط","بدون زرار"],"default":"زرار في النص","section":"زرار الإضافة"},"state":{"editor":"enum","options":["عادي","لسه ما بدأتش أحوّش","فاضي","بيحمّل","خطأ","غير متاح","المتوسطات غير متاحة"],"default":"عادي","section":"الحالة"},"age":{"editor":"enum","options":["معروف","مش مكتوب"],"default":"معروف","section":"الحالة"},"income":{"editor":"enum","options":["معروف","مش معروف"],"default":"معروف","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// شاشة الاستثمار (§87 + §89 + فكرة المالك 13 عند جلسة كوتلن، واختياراته 2026-10-15): كله جوه الشاشة دي، من غير قسم ولا اسم «مستقبلي»
// من فوق لتحت: الرقم الكبير ثم حاجاتي على طول (جوه InvestFuture، طلب المالك 2026-10-15) ثم الطرق والتشارت · نصيحة واحدة · حبل مصادر دخلك · اللي رجعلك · الأدوات والحاسبات
// «غير متاح» = سعر الدهب النهارده مش موجود (الدهب برّه الإجمالي) · «المتوسطات غير متاحة» = مفيش حساب أرباح خالص
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { addOpen: false, added: [], toast: '' };
    this.timers = [];
    this.openAdd = () => this.setState({ addOpen: true });
    this.closeAdd = () => this.setState({ addOpen: false });
    this.saveAdd = (it) => {
      if (!it || !it.type) return;
      const eg = (this.props.space ?? 'السعودية') === 'مصر';
      this.setState({ addOpen: false, added: (Array.isArray(this.state.added) ? this.state.added : []).concat([Object.assign({ id: 'new' + Date.now() }, it)]), toast: (eg ? 'اتضافت «' : 'أُضيف «') + it.name + (eg ? '» لحاجاتك' : '» إلى ممتلكاتك') });
      this.timers.push(setTimeout(() => this.setState({ toast: '' }), 2700));
    };
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  renderVals() {
    const st = this.props.state ?? 'عادي', eg = (this.props.space ?? 'السعودية') === 'مصر';
    const low = st === 'لسه ما بدأتش أحوّش', normal = st === 'عادي' || low || st === 'خطأ' || st === 'غير متاح' || st === 'المتوسطات غير متاحة';
    return {
      tools: [['Zakat', 'الزكاة', eg ? 'إرشادية حسب دار الإفتاء' : 'إرشادية حسب هيئة الزكاة'], ['Advisor', 'التحليلات الذكية', eg ? 'أفكار من صرفك، وليه ظهرت' : 'أفكار من صرفك، ولماذا ظهرت'], ['SavingsGoals', 'خطط الادخار', eg ? '3 خطط' : '3 خطط'], ['InvestTips', eg ? 'النصايح' : 'النصائح', eg ? 'من جهات رسمية' : 'من جهات رسمية']].map(([to, label, hint], i, a) => ({ href: to + '.dc.html', label, hint, style: 'display: flex; align-items: center; gap: 12px; min-height: 56px; color: inherit; text-decoration: none;' + (i < a.length - 1 ? ' border-bottom: 1px solid rgba(204,216,204,0.55);' : '') })),
      navStyle: this.props.navStyle ?? 'زرار في النص',
      spaceName: eg ? 'مصر' : 'السعودية',
      isLoading: st === 'بيحمّل', isError: st === 'خطأ',
      showFuture: normal, onlyHoldings: st === 'فاضي', showContent: normal,
      futureState: low ? 'لسه ما بدأتش أحوّش' : st === 'المتوسطات غير متاحة' ? 'المتوسطات غير متاحة' : 'عادي',
      holdState: st === 'فاضي' ? 'فاضي' : st === 'غير متاح' ? 'سعر الدهب غير متاح' : 'عادي',
      situation: low ? 'لسه ما بدأتش' : 'كله في نوع واحد',
      age: this.props.age ?? 'معروف', income: this.props.income ?? 'معروف',
      added: Array.isArray(this.state.added) ? this.state.added : [], openAdd: this.openAdd, closeAdd: this.closeAdd, saveAdd: this.saveAdd,
      addOpen: !!this.state.addOpen, hasToast: !!this.state.toast, toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
