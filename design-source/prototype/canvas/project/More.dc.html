                <sc-if value="{{it.i.export}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M8 8l4-4 4 4"></path><path d="M4 19h16"></path></svg></sc-if>
                <sc-if value="{{it.i.bell}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></sc-if>
                <sc-if value="{{it.i.lock}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></sc-if>
                <sc-if value="{{it.i.lang}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10"></path><path d="M9 4v2c0 4-2 8-5 10"></path><path d="M6 10c1.5 3 4 5 7 6"></path><path d="M14 20l4-9 4 9"></path><path d="M15.5 17h5"></path></svg></sc-if>
                <sc-if value="{{it.i.moon}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
              </span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 15px; font-weight: 500">{{it.label}}</span>
                <sc-if value="{{it.hasHint}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #637570">{{it.hint}}</span></sc-if>
              </span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>

    <a href="People.dc.html" class="m-press" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 56px; min-height: 56px; text-decoration: none; color: #637570; font-size: 11px">

      <span style="width: 40px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg></span>الاستثمار</a>

<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const item = (icon, label, hint, last) => ({
      label, hint: hint || '', hasHint: !!hint,
      i: { [icon]: true },
      style: 'width: 100%; border: 0; background: transparent; font: inherit; color: #193D33; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px; border-radius: 16px;' + (last ? '' : ' box-shadow: 0 1px 0 rgba(204,216,204,0.55);')
    });
    const groups = [
      { title: 'حسابك', items: [
        item('user', 'ملفك', 'مكتمل ٦٠٪'),
        item('income', 'مصادر الدخل', 'الراتب يوم ٢٨'),
        item('globe', 'البلدان', eg ? 'مصر · السعودية' : 'السعودية · مصر', true)
      ] },
      { title: 'بياناتك', items: [
        item('wallet', 'المحافظ'),
        item('tag', 'التصنيفات والقواعد'),
        item('import', 'الاستيراد', 'رسائل البنك وكشف الحساب'),
        item('backup', 'النسخة الاحتياطية'),
        item('export', 'التصدير', '', true)
      ] },
      { title: 'الإعدادات', items: [
        item('bell', 'الإشعارات'),
        item('lock', 'القفل'),
        item('lang', 'اللغة'),
        item('moon', 'المحتوى الإسلامي', '', true)
      ] }
    ];
    return {
      spaceLine: eg ? 'المساحة الحالية: مصر · ج.م' : 'المساحة الحالية: السعودية · ر.س',
      groups
    };
  }
}
</script>
