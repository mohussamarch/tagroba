<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // علم البلد جنب كارت الملف (رد المالك 2026-10-23: «علم البلد واضح شوية جنب الملف الشخصي وأدوس عليه أبدّل بينهم») — بدل سطر «البلدان»
  constructor(props) { super(props); this.state = { sp: null }; }
  renderVals() {
    const eg = (this.state.sp ?? this.props.space ?? 'السعودية') === 'مصر';
    const item = (icon, label, hint, last, to) => ({
      label, hint: hint || '', hasHint: !!hint,
      href: to ? to + '.dc.html' : '#',
      go: (e) => { if (!to && e && e.preventDefault) e.preventDefault(); },
      i: { [icon]: true },
      style: 'box-sizing: border-box; text-decoration: none; width: 100%; border: 0; background: transparent; font: inherit; color: #193D33; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px; border-radius: 16px;' + (last ? '' : ' box-shadow: 0 1px 0 rgba(204,216,204,0.55);')
    });
    // إعادة ترتيب «المزيد» (طلب المالك 2026-10-23: «بتجمع حاجات بتتكرر وملهاش لازمة، وحاجات ممكن نختصرها») — من 16 سطر لـ6
    // اتشال: «ملفك» (نفس كارت الاسم فوق) · «البلدان» (العلم فوق اللوجو + جوه الإعدادات) · «المشاريع» (اتنقلت: بيكسب ⇐ الاستثمار، مصاريف ⇐ الميزانيات)
    // اتدمج: رسايل البنك + كشف الحساب + دفعات الاستيراد ⇐ «الاستيراد» · النسخة + التصدير ⇐ «النسخة والتصدير» · التصنيفات + القواعد والتجار ⇐ سطر واحد
    // والإشعارات والقفل واللغة والمحتوى الإسلامي (كانوا 3 منهم بيفتحوا نفس الصفحة) ⇐ سطر «الإعدادات» واحد
    const groups = [
      { title: eg ? 'فلوسك' : 'أموالك', items: [
        item('wallet', 'المحافظ', eg ? 'البنوك والكاش' : 'البنوك والنقد', false, 'Wallets'),
        item('tag', eg ? 'التصنيفات والقواعد' : 'التصنيفات والقواعد', eg ? 'واللي البرنامج فاكره عن التجار' : 'وما يتذكره التطبيق عن التجار', true, 'Categories')
      ] },
      { title: eg ? 'بياناتك' : 'بياناتك', items: [
        item('import', 'الاستيراد', eg ? 'رسايل البنك · كشف حساب — 4 مستنية تأكيدك' : 'رسائل البنك · كشف حساب — 4 بانتظار تأكيدك', false, 'BankSms'),
        item('backup', eg ? 'النسخة والتصدير' : 'النسخة والتصدير', eg ? 'آخر نسخة النهارده' : 'آخر نسخة اليوم', true, 'Backup')
      ] },
      { title: '', items: [
        item('gear', 'الإعدادات', eg ? 'الإشعارات · القفل · المظهر · اللغة · سجل المشكلات' : 'الإشعارات · القفل · المظهر · اللغة · سجل المشكلات', true, 'AppSettings')
      ] }
    ];
    return {
      spaceName: eg ? 'مصر' : 'السعودية', isSa: !eg, isEg: eg, spaceShort: eg ? 'مصر' : 'السعودية',
      swap: () => this.setState({ sp: eg ? 'السعودية' : 'مصر' }), swapLabel: eg ? 'بدّل للسعودية' : 'بدّل لمصر',
      spaceLine: eg ? 'المساحة الحالية: مصر · ج.م' : 'المساحة الحالية: السعودية · ⃁',
      groups
    };
  }
}
</script>
