<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تفاصيل المحفظة — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.w-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.w-press:active{transform:scale(.97)}
.w-skel{animation:w-pulse 1.4s cubic-bezier(.2,.7,.3,1) infinite alternate}
@keyframes w-pulse{from{opacity:.5}to{opacity:1}}
.w-in{animation:w-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes w-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.w-toast{animation:w-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
@keyframes w-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.w-press{transition:none}.w-press:active{transform:none}.w-skel,.w-in,.w-toast{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; display: flex; flex-direction: column; gap: 14px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div style="border-radius: 26px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; color: #FFFFFF; background: radial-gradient(90% 70% at 88% 0%, rgba(255,255,255,0.20), transparent 55%), linear-gradient(125deg, #064B40 0%, #08705A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 20px 44px rgba(6,75,64,0.28)">
    <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 18px; font-weight: 700">{{name}}</span><span dir="ltr" style="font-size: 13px; color: #DCEBD6">{{last4}}</span></span>
    <span style="display: flex; align-items: center; gap: 8px; margin-top: 6px"><span style="font-size: 13px; color: #DCEBD6">{{balanceLabel}}</span><sc-if value="{{approx}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; color: #064B40; background: #F3C96B">{{approxLabel}}</span></sc-if></span>
    <sc-if value="{{hasBalance}}" hint-placeholder-val="{{ true }}"><span dir="ltr" style="text-align: right; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums">{{balance}}</span></sc-if>
    <sc-if value="{{noBalance}}" hint-placeholder-val="{{ false }}"><span style="font-size: 26px; font-weight: 700">غير متاح</span></sc-if>
    <span style="font-size: 12px; color: #DCEBD6">{{balanceSub}}</span>
  </div>

  <div style="border-radius: 22px; padding: 4px 16px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
    <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
      <div style="{{f.rowStyle}}"><span style="font-size: 13px; color: #637570">{{f.label}}</span><span dir="{{f.dir}}" style="font-size: 14px; font-weight: 700; text-align: left">{{f.value}}</span></div>
    </sc-for>
  </div>
  <dc-import name="WalletAddSheet" space="{{spaceName}}" mode="edit" wallet-name="{{name}}" wallet-kind="{{walletKind}}" last4="{{last4Digits}}" opening="{{openMinor}}" opening-date="{{openDate}}" balance="{{balMinor}}" on-save="{{onOpening}}" hint-size="350px,48px"></dc-import>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 700">{{movesTitle}}</h2>
    <div style="border-radius: 22px; padding: 4px 16px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <sc-for list="{{moves}}" as="m" hint-placeholder-count="4">
        <div style="{{m.rowStyle}}">
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{m.name}}</span><span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 12px; color: #637570">{{m.date}}</span><span style="{{m.srcStyle}}">{{m.src}}</span></span></span>
          <span dir="ltr" style="{{m.amountStyle}}">{{m.amount}}</span>
        </div>
      </sc-for>
      <sc-if value="{{noMoves}}" hint-placeholder-val="{{ false }}">
        <span style="display: block; padding: 14px 0; font-size: 13px; color: #637570">{{noMovesText}}</span>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{isBank}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 700">{{recTitle}}</span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; color: #637570; background: rgba(25,61,51,0.06)">{{optionalChip}}</span></span>
      <span style="font-size: 12px; color: #637570">{{recBody}}</span>
      <sc-if value="{{recLoading}}" hint-placeholder-val="{{ false }}">
        <div aria-busy="true" aria-label="جارٍ المطابقة" style="display: flex; flex-direction: column; gap: 8px"><div class="w-skel" style="height: 22px; width: 60%; border-radius: 8px; background: rgba(25,61,51,0.08)"></div><div class="w-skel" style="height: 56px; border-radius: 14px; background: rgba(25,61,51,0.06)"></div></div>
      </sc-if>
      <sc-if value="{{recDone}}" hint-placeholder-val="{{ false }}">
        <div class="w-in" style="display: flex; flex-direction: column; gap: 8px">
          <span style="{{recStatusStyle}}">{{recStatus}}</span>
          <sc-for list="{{recLines}}" as="rl" hint-placeholder-count="3">
            <span style="{{rl.style}}">{{rl.text}}</span>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{canRun}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="w-press" onClick="{{run}}" style="height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.08)">{{runLabel}}</button>
      </sc-if>
      <sc-if value="{{recNa}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled="{{true}}" aria-describedby="rec-na" style="height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #08634F; background: rgba(8,99,79,0.08); opacity: 0.45; cursor: default">{{runLabel}}</button>
        <span id="rec-na" style="font-size: 12px; color: #637570">{{recNaBody}}</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{isCash}}" hint-placeholder-val="{{ false }}">
    <div style="border-radius: 18px; padding: 12px 16px; font-size: 12px; color: #637570; background: rgba(25,61,51,0.04)">{{cashNote}}</div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; left: 0; right: 0; bottom: 28px; z-index: 10; display: flex; justify-content: center; pointer-events: none">
      <div role="status" class="w-toast" style="max-width: 330px; padding: 12px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(25,61,51,0.92); box-shadow: 0 14px 30px rgba(16,45,53,0.25)">{{toast}}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","بيحمّل","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rec: {}, edits: {}, toast: '' }; this.timers = []; }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  say(msg) { this.timers.push(setTimeout(() => this.setState({ toast: '' }), 2700)); this.setState({ toast: msg }); }
  fmt(minor) { const a = Math.abs(minor), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const cur = eg ? 'ج.م' : 'ر.س';
    const n = (x) => x.toLocaleString('ar-EG');
    const plural = (x, w) => x === 1 ? w[0] : x === 2 ? w[1] : n(x) + ' ' + (x <= 10 ? w[2] : w[3]);
    // الشاشة الأب بتبعت المحفظة (wallet) و«غير متاح» (na = '1'). من غيرهم (معاينة اللوحة) أول بنك، و«الحالة» بتحكم
    const tweak = this.props.wallet ? 'عادي' : (this.props.state ?? 'عادي');
    const na = this.props.na === '1' || tweak === 'غير متاح';
    // مخترعة · بالوحدة الصغرى · الرصيد = نفس أرقام «معك الآن» في الرئيسية (HeroBanks) · آخر ٤ أرقام بس
    const W = eg ? {
      nbe: { name: 'البنك الأهلي المصري', last4: '٧٢١٤', bal: 1640000, open: [900000, '١٢ مايو ٢٠٢٦'], mv: [['النهارده', 'مطعم الفول', -18500, 'sms'], ['٥ أكتوبر', 'إيجار شقة المعادي', 900000, 'both'], ['٣ أكتوبر', 'سوبرماركت الحي', -95520, 'stmt'], ['١ أكتوبر', 'عائد شهادة الادخار', 225000, 'stmt']], rec: { ok: true, until: '٣٠ سبتمبر ٢٠٢٦', count: 41, checked: 41, unassigned: 0 } },
      qnb: { name: 'QNB مصر', last4: '٦٠٨٣', bal: 620000, open: [300000, '١٢ مايو ٢٠٢٦'], mv: [['٦ أكتوبر', 'بنزينة', -27000, 'sms'], ['٢ أكتوبر', 'كافيه المرسى', -6900, 'sms'], ['٢٨ سبتمبر', 'تحويل من البنك الأهلي المصري', 300000, 'stmt', 1]], rec: { gap: '٢٨ سبتمبر ٢٠٢٦', day: 1, calc: 650000, stated: 620000, count: 22, checked: 22, unassigned: 0 } },
      cash: { name: 'الكاش', cash: true, bal: 270000, open: [300000, '١٢ مايو ٢٠٢٦'], mv: [['٥ أكتوبر', 'سايس', -2000, 'manual'], ['٣ أكتوبر', 'صرف كاش مش متسجّل', -18000, 'count'], ['٢ أكتوبر', 'عيش وفول', -4500, 'manual']] }
    } : {
      rajhi: { name: 'مصرف الراجحي', last4: '٤٤٠٧', bal: 412000, open: [215000, '١ يناير ٢٠٢٥'], mv: [['اليوم', 'مطعم الريف', -4200, 'sms'], ['٥ أكتوبر', 'سحب من الصرّاف — إلى الكاش', -50000, 'sms', 1], ['٣ أكتوبر', 'حوالة من «الريادة القابضة»', 320000, 'sms'], ['٢٨ سبتمبر', 'راتب — شركة الريادة للحلول', 1250000, 'both']], rec: { ok: true, until: '٢٧ سبتمبر ٢٠٢٦', count: 284, checked: 260, unassigned: 3 } },
      ahli: { name: 'البنك الأهلي السعودي', last4: '٩١٢٦', bal: 183000, open: [50000, '١ مارس ٢٠٢٥'], mv: [['٦ أكتوبر', 'مكتبة الفجر', -4500, 'sms'], ['٢ أكتوبر', 'مقهى المرسى', -2300, 'sms'], ['١ أكتوبر', 'تحويل من مصرف الراجحي', 100000, 'stmt', 1], ['١٤ سبتمبر', 'صيدلية', -6700, 'stmt']], rec: { gap: '١٤ سبتمبر ٢٠٢٦', day: 3, calc: 241500, stated: 237000, count: 96, checked: 90, unassigned: 3 } },
      inma: { name: 'مصرف الإنماء', last4: '٣٣٥٨', bal: 50000, open: [0, '١٠ أغسطس ٢٠٢٦'], mv: [['١ أكتوبر', 'مكتب الواحة للتصميم', 80000, 'sms'], ['٢٤ سبتمبر', 'مكتب الواحة للتصميم', 80000, 'sms'], ['٢٠ سبتمبر', 'اشتراك خدمة بث', -4500, 'sms']], rec: { none: true } },
      cash: { name: 'الكاش', cash: true, bal: 90000, open: [120000, '٢٨ أغسطس ٢٠٢٦'], mv: [['٥ أكتوبر', 'من سحب الصرّاف', 50000, 'sms', 1], ['٤ أكتوبر', 'بقالة الحي', -3500, 'manual'], ['٣ أكتوبر', 'صرف كاش غير مسجّل', -6000, 'count'], ['١ أكتوبر', 'هدية لخالد', -20000, 'manual']] }
    };
    // محفظة اتضافت من «أضف محفظة» في المحافظ (info) — من غير حركات لسه
    let info = null;
    try { if (this.props.info) info = typeof this.props.info === 'string' ? JSON.parse(this.props.info) : this.props.info; } catch (e) { info = null; }
    const id = info ? 'new:' + info.name : W[this.props.wallet] ? this.props.wallet : Object.keys(W)[0];
    const s = this.state, ed = s.edits[id];
    const base = info ? { name: info.name, last4: info.last4 || '', kind: info.kind, cash: info.kind === 'cash', bal: info.open, open: [info.open, info.at], mv: [], rec: { none: true } } : W[id];
    // تعديل رصيد البداية محلي هنا (WalletAddSheet بـ mode="edit"): نفس التاريخ ⇒ الرصيد بيتحرك بالفرق بالظبط، تاريخ تاني ⇒ «غير متاح» لحد ما يتحسب
    const w = ed ? Object.assign({}, base, { open: ed.open, bal: ed.bal }) : base;
    const openKnown = ed ? true : w.open[0] != null && !(na && !info && !w.cash);
    const balKnown = openKnown && w.bal != null;
    const bankNa = !openKnown;
    const rs = tweak === 'بيحمّل' && !s.rec[id] ? 'loading' : (s.rec[id] || 'idle');
    const SRC = { sms: ['رسالة البنك', '#08634F', '#DCEBD6'], stmt: ['كشف الحساب', '#2469BA', 'rgba(36,105,186,0.10)'], both: [eg ? 'رسالة + كشف' : 'رسالة + كشف', '#08634F', '#DCEBD6'], manual: [eg ? 'بإيدك' : 'يدوي', '#637570', 'rgba(25,61,51,0.06)'], count: ['عدّ الكاش', '#BE3D48', 'rgba(190,61,72,0.08)'] };
    const moves = w.mv.map(([date, name, amt, src, move], i) => ({
      date, name, src: SRC[src][0],
      srcStyle: 'font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; color: ' + SRC[src][1] + '; background: ' + SRC[src][2],
      amount: (amt < 0 ? '−' : '+') + this.fmt(amt),
      amountStyle: 'flex-shrink: 0; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (move ? '#2469BA' : amt < 0 ? '#BE3D48' : '#13764D'),
      rowStyle: 'display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 6px 0;' + (i === w.mv.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);')
    }));
    const fact = (label, value, ltr, last) => ({ label, value, dir: ltr ? 'ltr' : 'rtl', rowStyle: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px;' + (last ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);') });
    const facts = [
      fact('النوع', w.cash ? (eg ? 'كاش' : 'كاش') : w.kind === 'digital_wallet' ? 'محفظة إلكترونية' : (eg ? 'حساب بنك' : 'حساب بنكي')),
      fact('العملة', eg ? 'جنيه مصري · ج.م' : 'ريال سعودي · ر.س'),
      bankNa ? fact(eg ? 'رصيد البداية' : 'رصيد البداية', eg ? 'لسه ما اتحددش' : 'لم يُحدَّد بعد', false, true) : fact(eg ? 'رصيد البداية' : 'رصيد البداية', this.fmt(w.open[0]) + ' ' + cur + ' في ' + w.open[1], false, true)
    ];
    const r = w.rec || {};
    const RW = eg ? ['حركة واحدة', 'حركتين', 'حركات', 'حركة'] : ['حركة واحدة', 'حركتان', 'حركات', 'حركة'];
    const OW = eg ? ['عملية واحدة', 'عمليتين', 'عمليات', 'عملية'] : ['عملية واحدة', 'عمليتان', 'عمليات', 'عملية'];
    const muted = 'font-size: 12px; color: #637570';
    const recLines = [];
    if (rs === 'done' && !r.none) {
      // RECONCILE_FIRST_GAP_ONE / _MANY — بصيغة عدد صح بدل «{1} حركة»
      if (!r.ok) recLines.push({ text: (eg ? 'أول فرق في ' + r.gap + '، واليوم ده فيه ' : 'أول فرق في ' + r.gap + '، وفي ذلك اليوم ') + plural(r.day, RW) + (r.day > 1 ? (eg ? '. ترتيب حركات اليوم الواحد مش مثبت في الكشف، فمش أكيد إن دي بالذات أول عملية فيها مشكلة.' : '. ترتيب حركات اليوم الواحد غير مثبت في الكشف، فقد لا تكون هذه أول عملية فيها خلل.') : (eg ? '، فالفرق يخصها هي.' : '، فالفرق يخصها.')), style: 'font-size: 13px; color: #193D33' });
      if (!r.ok) recLines.push({ text: (eg ? 'المحسوب ' : 'المحسوب ') + this.fmt(r.calc) + (eg ? ' والمكتوب في الكشف ' : ' والمكتوب في الكشف ') + this.fmt(r.stated) + ' — ' + (eg ? 'الفرق ' : 'الفرق ') + this.fmt(r.calc - r.stated) + ' ' + cur, style: 'font-size: 13px; font-weight: 700; color: #956000' });
      // «،» مش «·» جنب الأرقام: النقطة النص بتتقري «٠» جنب الأرقام العربي
      recLines.push({ text: plural(r.count, RW) + (eg ? '، اتقارن منها ' : '، قُورن منها ') + n(r.checked) + (r.count > r.checked ? (eg ? '، و' + plural(r.count - r.checked, RW) + ' من غير رصيد مكتوب' : '، و' + plural(r.count - r.checked, RW) + ' بلا رصيد معلن') : ''), style: muted });
      if (r.unassigned) recLines.push({ text: plural(r.unassigned, OW) + (eg ? ' مش منسوبة لأي محفظة — بنذكرها ومش بننسبها بالتخمين.' : ' غير منسوبة لأي محفظة — تُذكر ولا تُنسب بالتخمين.'), style: muted });
    }
    const recNone = !!r.none || bankNa;
    return {
      name: w.name, last4: w.last4 ? '•••• ' + w.last4 : '',
      balanceLabel: eg ? 'الرصيد' : 'الرصيد', approx: !!w.cash && balKnown, approxLabel: 'تقريبي',
      hasBalance: balKnown, noBalance: !balKnown, balance: balKnown ? this.fmt(w.bal) + ' ' + cur : '',
      balanceSub: bankNa ? (w.cash ? (eg ? 'مفيش رصيد بداية — حدّده من تحت.' : 'لا رصيد بداية — حدّده من الزر أدناه.') : (eg ? 'مفيش رصيد بداية — رسالة بنك جديدة أو كشف بيحدده.' : 'لا رصيد بداية — تحدده رسالة بنك جديدة أو كشف.')) : !balKnown ? (eg ? 'بيتحسب من جديد من رصيد البداية والحركات من ' : 'يُعاد حسابه من رصيد البداية والحركات منذ ') + w.open[1] + '.' : w.cash ? (eg ? 'الكاش اللي اتصرف ومااتسجلش مش باين فيه.' : 'لا يظهر فيه الكاش الذي صُرف ولم يُسجَّل.') : (eg ? 'من رصيد البداية والحركات اللي بعده' : 'من رصيد البداية والحركات بعده'),
      facts, movesTitle: eg ? 'آخر الحركات ومصدرها' : 'آخر الحركات ومصدرها', moves, noMoves: !moves.length, noMovesText: eg ? 'مفيش حركات لسه.' : 'لا حركات بعد.',
      isBank: !w.cash, isCash: !!w.cash,
      cashNote: info ? (eg ? 'الكاش مالوش كشف يتطابق عليه — لما تعدّه، عدّل رصيد البداية من فوق.' : 'لا كشف للكاش يُطابق عليه — حين تعدّه، عدّل رصيد البداية من الزر أعلاه.') : eg ? 'الكاش مالوش كشف يتطابق عليه — بيتظبط لما تعدّه من كارت الكاش في الرئيسية.' : 'لا كشف للكاش يُطابق عليه — يُضبط حين تعدّه من بطاقة الكاش في الرئيسية.',
      recTitle: eg ? 'مطابقة الرصيد' : 'مطابقة الرصيد', optionalChip: eg ? 'اختيارية' : 'اختيارية',
      recBody: eg ? 'بتقارن رصيد كل حركة بالرصيد المكتوب في الكشف. مفيش حاجة مستنياها.' : 'تقارن رصيد كل حركة بالرصيد المكتوب في الكشف. لا شيء ينتظرها.',
      recLoading: rs === 'loading', recDone: rs === 'done' && !r.none,
      recStatus: r.ok ? (eg ? 'مطابق لحد ' : 'مطابق حتى ') + r.until : (eg ? 'فيه فرق' : 'يوجد فرق'),
      recStatusStyle: 'font-size: 16px; font-weight: 700; color: ' + (r.ok ? '#13764D' : '#956000'),
      recLines,
      canRun: !recNone && rs !== 'loading', runLabel: rs === 'done' ? (eg ? 'طابق تاني' : 'أعد المطابقة') : (eg ? 'طابق الرصيد' : 'شغّل المطابقة'),
      run: () => { this.setState({ rec: Object.assign({}, this.state.rec, { [id]: 'loading' }) }); this.timers.push(setTimeout(() => this.setState({ rec: Object.assign({}, this.state.rec, { [id]: 'done' }) }), 1200)); },
      recNa: recNone, recNaBody: bankNa ? (eg ? 'محتاجة رصيد بداية الأول.' : 'تحتاج رصيد بداية أولًا.') : (eg ? 'مفيش حركات برصيد مكتوب لسه — استورد كشف عشان تشتغل.' : 'لا حركات برصيد معلن بعد — استورد كشفًا لتعمل.'),
      // لوحة رصيد البداية (WalletAddSheet) — فاضي = لسه ما اتحددش
      spaceName: eg ? 'مصر' : 'السعودية', walletKind: w.cash ? 'cash' : 'bank', last4Digits: w.last4 || '',
      openMinor: openKnown ? w.open[0] : '', openDate: openKnown ? w.open[1] : '', balMinor: balKnown ? w.bal : '',
      onOpening: (p) => {
        if (!p || p.openingMinor == null) return;
        // محفظة لسه من غير حركات ⇒ رصيدها = رصيد البداية بالظبط
        const bal = p.balanceMinor != null ? p.balanceMinor : !w.mv.length ? p.openingMinor : null;
        this.setState({ edits: Object.assign({}, this.state.edits, { [id]: { open: [p.openingMinor, p.openingDateText], bal } }) });
        this.say((eg ? 'اتحفظ رصيد البداية: ' : 'حُفظ رصيد البداية: ') + this.fmt(p.openingMinor) + ' ' + cur + ' في ' + p.openingDateText);
      },
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
