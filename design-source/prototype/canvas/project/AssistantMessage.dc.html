<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رسالة في المحادثة — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.g-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.g-press:active{transform:scale(.97)}
.g-pop{animation:g-pop 420ms cubic-bezier(.18,.9,.28,1.08) both}
@keyframes g-pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes g-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.g-press{transition:none}.g-press:active{transform:none}.g-pop{animation:g-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="{{rowStyle}}">
  <div class="g-pop" style="{{wrap}}">
    <sc-if value="{{hasText}}" hint-placeholder-val="{{ true }}"><span style="white-space: pre-line">{{text}}</span></sc-if>

    <sc-if value="{{isTxn}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.55)">
          <span style="{{txTile}}"><img src="{{txIcon}}" width="20" height="20" alt=""></span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{txTitle}}</span><span style="font-size: 12px; color: #637570">{{txSub}}</span></span>
          <span dir="ltr" style="font-size: 16px; font-weight: 700; color: #BE3D48; font-variant-numeric: tabular-nums; white-space: nowrap">{{txAmount}}</span>
        </div>
        <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 8px">
            <button type="button" class="g-press" onClick="{{confirm}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.24)">{{confirmLabel}}</button>
            <button type="button" class="g-press" onClick="{{edit}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(8,99,79,0.20)">{{editLabel}}</button>
          </div>
        </sc-if>
        <sc-if value="{{settled}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{settledColor}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>{{settledText}}</span>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{isSplit}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
        <div style="border-radius: 16px; padding: 4px 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.55)">
          <sc-for list="{{shares}}" as="sh" hint-placeholder-count="3">
            <div style="{{sh.style}}">
              <span style="width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: #DCEBD6; color: #08634F">{{sh.initial}}</span>
              <span style="flex: 1 1 auto; font-size: 14px; font-weight: 500">{{sh.name}}</span>
              <span dir="ltr" style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{sh.amount}}</span>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="g-press" onClick="{{confirm}}" style="height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.24)">{{confirmLabel}}</button>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{isPick}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <sc-for list="{{picks}}" as="pk" hint-placeholder-count="2">
          <button type="button" class="g-press" onClick="{{pk.go}}" aria-pressed="{{pk.on}}" style="{{pk.style}}">{{pk.label}}</button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{hasLink}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px"><sc-for list="{{links}}" as="ln" hint-placeholder-count="1"><a href="{{ln.href}}" data-keep="{{ln.keep}}" class="g-press" style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 14px; font-size: 13px; font-weight: 700; color: #08634F; text-decoration: none; background: rgba(8,99,79,0.08)">{{ln.label}}</a></sc-for></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sample":{"editor":"enum","options":["عملية","تقسيم","اختيار المحفظة","رسالتي"],"default":"عملية","section":"المعاينة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":220}}'>
// فقاعة واحدة في محادثة المساعد — بترسم بس، والفهم والحفظ في AssistantChat.
// الرسالة: { from: 'me'|'bot', text, txn?: { title, cat, wallet, amount (هللة/قرش), icon, color }, kind?: 'split', shares?: [{ name, initial, amount }], pick?: { ci, amt, lead, opts: [[المعرّف، الاسم]] }, picked?, link?: [href, keep, label], links?: [[href, keep, label]] (أقرب الشاشات), done?, dropped? }
// الأفعال بترجع للأم: on-confirm · on-edit · on-pick(المحفظة) — «اختيار المحفظة» بيظهر مرة واحدة لما لسه مفيش محفظة أساسية (قرار المالك ٢٠٢٦-١٠-٠٩)
const ICON = {
  coffee: '<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
  food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  bill: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'
};
class Component extends DCLogic {
  eg() { return (this.props.space ?? 'السعودية') === 'مصر'; }
  fmt(minor) { const a = Math.abs(minor), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  icon(name, col) { return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + col + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + (ICON[name] || ICON.bill) + '</svg>'); }
  sample() {
    const eg = this.eg(), k = eg ? 3 : 1;
    const S = {
      'عملية': { from: 'bot', text: eg ? 'فهمت: قهوة بـ25.00 ج.م من الكاش، النهارده. أسجّلها؟' : 'فهمت: قهوة بـ25.00 ر.س من الكاش، اليوم. أسجّلها؟', txn: { title: 'قهوة', cat: eg ? 'أكل وقهوة' : 'مطاعم وقهوة', wallet: 'الكاش', amount: 2500, icon: 'coffee', color: '#A36A21' } },
      'تقسيم': { from: 'bot', kind: 'split', text: eg ? 'قسمت فاتورة العشا 1,080 ج.م عليكم انتم التلاتة:' : 'قسمت فاتورة العشاء 360 ر.س بينكم أنتم الثلاثة:', shares: [[eg ? 'إنت' : 'أنت', 'م'], ['أحمد', 'أ'], ['سارة', 'س']].map((p) => ({ name: p[0], initial: p[1], amount: 12000 * k })) },
      'اختيار المحفظة': { from: 'bot', text: eg ? 'قبل ما أسجّلها: بتصرف عادةً منين؟ هسجّل عليها على طول، وتقدر تغيّرها في أي عملية.' : 'قبل أن أسجّلها: من أين تصرف عادةً؟ سأسجّل عليها دائمًا، ويمكنك تغييرها في أي عملية.', pick: { opts: [[eg ? 'nbe' : 'rajhi', eg ? 'البنك الأهلي المصري' : 'مصرف الراجحي'], ['cash', 'الكاش']] } },
      'رسالتي': { from: 'me', text: eg ? 'صرفت 25 قهوة' : 'صرفت 25 قهوة' }
    };
    return S[this.props.sample ?? 'عملية'] || S['عملية'];
  }
  renderVals() {
    const eg = this.eg(), m = this.props.msg || this.sample(), me = m.from === 'me', tx = m.txn || null;
    const rich = !!(tx || m.kind || m.pick), lk = Array.isArray(m.links) ? m.links : Array.isArray(m.link) ? [m.link] : [];
    const call = (name) => () => { if (typeof this.props[name] === 'function') this.props[name](m.id); };
    const shares = (m.shares || []).map((p, i, a) => ({ name: p.name, initial: p.initial, amount: this.fmt(p.amount),
      style: 'display: flex; align-items: center; gap: 10px; min-height: 48px;' + (i === a.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);') }));
    return {
      rowStyle: 'width: 100%; min-width: 0; display: flex; justify-content: ' + (me ? 'flex-end' : 'flex-start') + "; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33",
      wrap: me
        ? 'max-width: 80%; border-radius: 18px 18px 6px 18px; padding: 10px 14px; font-size: 14px; line-height: 1.7; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: 0 8px 18px rgba(8,99,79,0.22)'
        : 'width: ' + (rich ? '88%' : 'auto') + '; max-width: 88%; box-sizing: border-box; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.7; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 10px 22px rgba(29,54,53,0.08)',
      hasText: !!m.text, text: m.text || '',
      isTxn: !!tx && !me, isSplit: m.kind === 'split', isPick: !!m.pick && !me, pending: !m.done,
      txTitle: tx ? tx.title : '', txSub: tx ? tx.cat + ' · ' + tx.wallet + ' · ' + (eg ? 'النهارده' : 'اليوم') : '',
      txAmount: tx ? '−' + this.fmt(tx.amount) : '', txIcon: this.icon(tx ? tx.icon : 'bill', tx ? tx.color : '#637570'),
      txTile: 'width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + (tx ? tx.color : '#637570') + '1F',
      settled: !!tx && !!m.done, settledColor: m.dropped ? '#637570' : '#13764D',
      settledText: m.dropped ? (eg ? 'اتعدّلت تحت' : 'عُدّلت في الأسفل') : (eg ? 'اتسجّلت' : 'سُجّلت'),
      confirmLabel: m.kind === 'split' ? 'سجّل التقسيم' : (eg ? 'سجّلها' : 'احفظ'), editLabel: eg ? 'عدّل' : 'تعديل',
      confirm: call('onConfirm'), edit: call('onEdit'), shares,
      picks: ((m.pick && m.pick.opts) || []).map(([id, label]) => { const on = m.picked === id; return { label, on: on ? 'true' : 'false', go: () => { if (!m.done && typeof this.props.onPick === 'function') this.props.onPick(id); },
        style: 'flex: 1 1 0; min-width: 0; height: 44px; border: 0; padding: 0 10px; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: ' + (m.done ? 'default' : 'pointer') + '; ' + (on ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(8,99,79,0.25)' + (m.done ? '; opacity: 0.45' : '')) }; }),
      hasLink: lk.length > 0 && !me, links: lk.map((l) => ({ href: l[0], keep: l[1] ? JSON.stringify(l[1]) : '', label: l[2] }))
    };
  }
}
</script>
</body>
</html>
