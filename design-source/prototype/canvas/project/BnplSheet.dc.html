<div dir="rtl" style="width: 390px; height: 844px; position: absolute; inset: 0; z-index: 9; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">

        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" class="m-press" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for>

      <div role="radiogroup" aria-label="{{splitLabel}}" style="display: flex; gap: 8px">

      <button type="button" class="m-press" onClick="{{later}}" style="flex: 1 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.07)">{{laterLabel}}</button>
    </div>
  </div>
  <sc-if value="{{isSplit}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 0; z-index: 10"><dc-import name="BnplSplit" provider="{{provider}}" space="{{spaceName}}" debit="{{debitMinor}}" on-back="{{backToWhich}}" on-done="{{splitDone}}" hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>

      whatLabel: T('ماذا اشتريت من ', 'اشتريت إيه من ') + prov + '؟', whatHint: T('مثل: سماعة لاسلكية', 'مثلًا: سماعة لاسلكية'), what: s.what, typeWhat: (e) => this.setState({ what: e.target.value }),
      catLabel: T('التصنيف', 'التصنيف'), cats: CATS.map(([id, label]) => ({ label, on: s.cat === id ? 'true' : 'false', style: chip(s.cat === id), pick: () => this.setState({ cat: id }) })),
      splitLabel: T('قسّمتها على كم دفعة؟', 'قسمتها على كام؟'), splits: [2, 3, 4, 6].map((x) => ({ label: n(x), on: s.split === x ? 'true' : 'false', style: chip(s.split === x, true), pick: () => this.setState({ split: x, at: Math.min(s.at, x) }) })),
      everyLabel: T('كل كم؟', 'كل قد إيه؟'), everys: [['month', T('كل شهر', 'كل شهر')], ['two', T('كل أسبوعين', 'كل أسبوعين')]].map(([id, label]) => ({ label, on: s.every === id ? 'true' : 'false', style: chip(s.every === id, true), pick: () => this.setState({ every: id }) })),
      planTitle: T('خطتك', 'خطتك'), planTotal: T('الإجمالي ', 'الإجمالي ') + money(debit * s.split, cur) + T(' · الباقي ', ' · الباقي ') + money(debit * (s.split - at), cur), steps,
      atLabel: T('هذه الدفعة رقم كم؟', 'الدفعة دي رقم كام؟'), ats: Array.from({ length: s.split }, (x, i) => i + 1).map((v) => ({ label: n(v), on: at === v ? 'true' : 'false', style: chip(at === v, true), pick: () => this.setState({ at: v }) })),
      remindTitle: T('ذكّرني قبل كل دفعة بيوم', 'فكّرني قبل كل دفعة بيوم'), remindSub: T('تظهر في «القادم» وفي الإشعارات', 'بتظهر في «القادم» وفي الإشعارات'), remindOn: s.remind ? 'true' : 'false', toggleRemind: () => this.setState({ remind: !s.remind }),
      track: 'position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; ' + (s.remind ? 'background: ' + green : 'background: rgba(25,61,51,0.16)'), knob: 'position: absolute; top: 2px; right: ' + (s.remind ? 20 : 2) + 'px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(16,45,53,0.22)',
      autoNote: T('الخصومات القادمة من ', 'الخصومات الجاية من ') + prov + T(' بالمبلغ نفسه تُعلَّم «دُفعت» تلقائيًا من هذه الخطة.', ' بنفس المبلغ بتتعلّم «اتدفعت» لوحدها من الخطة دي.') + (cut ? T(' والدفعات السابقة تُعلَّم «دُفعت قبل ذلك» فقط دون تسجيل عمليات جديدة.', ' والدفعات اللي قبلها بتتعلّم «اتدفعت قبل كده» بس، من غير ما تتسجل عمليات جديدة.') : ''), plans,
      saveLabel: setup ? T('اعمل الخطة', 'اعمل الخطة') : T('تأكيد', 'تأكيد'), saveOff,
      saveStyle: 'flex: 2 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; background: ' + green + '; ' + (saveOff ? 'opacity: 0.45; cursor: default' : 'cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.25)'),
      save: () => { if (saveOff) return; if (!setup && s.pick === 'new') { this.setState({ mode: 'أول خصم', pick: null }); return; } done(setup ? { what: s.what.trim() || prov, cat: s.cat, split: s.split, at, every: s.every, remind: s.remind } : { plan: s.pick }); },
      laterLabel: setup ? T('تخطَّ', 'تخطّي') : T('لاحقًا', 'بعدين'), later: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
