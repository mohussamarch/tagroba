<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مقارنة تكرار محتمل — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.d-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.d-press:active{transform:scale(.97)}
.d-veil{animation:d-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.d-up{animation:d-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
@keyframes d-fade{from{opacity:0}to{opacity:1}}
@keyframes d-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.d-press{transition:none}.d-press:active{transform:none}.d-up{animation:d-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div style="position: fixed; inset: 0; z-index: 9">
    <button type="button" class="d-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
    <div role="dialog" aria-modal="true" aria-label="{{title}}" class="d-up" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 17px; font-weight: 700; flex: 1 1 auto">{{title}}</span><span style="{{chipStyle}}">{{chip}}</span></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sides}}" as="sd" hint-placeholder-count="2">
          <span style="{{sd.box}}">
            <span style="font-size: 11px; font-weight: 700; color: #637570">{{sd.label}}</span>
            <span style="font-size: 14px; font-weight: 700">{{sd.name}}</span>
            <span dir="ltr" style="{{sd.amountStyle}}">{{sd.amount}}</span>
            <span style="{{sd.whenStyle}}">{{sd.when}}</span>
            <span style="font-size: 11px; color: #637570">{{sd.src}}</span>
          </span>
        </sc-for>
      </div>
      <sc-if value="{{hasDiff}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 12px; font-weight: 700; color: #956000">{{diffLine}}</span>
      </sc-if>
      <span style="font-size: 13px; line-height: 1.7; padding: 10px 12px; border-radius: 14px; color: #193D33; background: rgba(25,61,51,0.04)">{{reason}}</span>
      <sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 12px; color: #637570">{{note}}</span>
      </sc-if>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{acts}}" as="ac" hint-placeholder-count="2">
          <button type="button" class="d-press" onClick="{{ac.go}}" style="{{ac.style}}">{{ac.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["شبيه","تعارض","يندمج مع رسالة","مكرر"],"default":"شبيه","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // قطعة مشتركة: ImportReview بتفتحها بـ line (السطر ومقابله) و on-decide و on-close.
  // لوحدها (من غير line) بتعرض مثال من الخاصية kind عشان المراجعة.
  fmt(minor) { const a = Math.abs(minor), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  sample(eg) {
    const k = eg ? 3 : 1, cur = eg ? 'ج.م' : 'ر.س';
    const amt = (m) => '−' + this.fmt(m * k) + ' ' + cur;
    const K = { 'شبيه': 'sim', 'تعارض': 'conf', 'يندمج مع رسالة': 'merge', 'مكرر': 'dup' }[this.props.kind ?? 'شبيه'] || 'sim';
    const base = { id: 'x', kind: K, newSide: { name: eg ? 'مطعم الفول' : 'مطعم الريف', amount: amt(4200), when: '14 سبتمبر', src: eg ? 'سطر 8 في الكشف' : 'الصف 8 في الكشف' }, oldSide: { name: eg ? 'مطعم الفول' : 'مطعم الريف', amount: amt(4200), when: '14 سبتمبر', src: eg ? 'سجّلتها بإيدك' : 'سجّلتها يدويًا' } };
    if (K === 'conf') return Object.assign(base, { diff: 'amount', oldSide: Object.assign({}, base.oldSide, { amount: amt(14900), src: eg ? 'من كشف قبل كده' : 'من كشف سابق' }), newSide: Object.assign({}, base.newSide, { amount: amt(15900) }) });
    if (K === 'merge') return Object.assign(base, { diff: 'when', oldSide: Object.assign({}, base.oldSide, { when: '13 سبتمبر', src: eg ? 'رسالة البنك' : 'رسالة البنك' }) });
    if (K === 'dup') return Object.assign(base, { oldSide: Object.assign({}, base.oldSide, { src: eg ? 'من كشف قبل كده' : 'من كشف سابق' }) });
    return base;
  }
  tell(action) {
    const line = this.props.line;
    if (typeof this.props.onDecide === 'function' && line) this.props.onDecide(line.id, action);
    else if (typeof this.props.onClose === 'function') this.props.onClose();
  }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const L = this.props.line || this.sample(eg);
    const K = L.kind;
    const T = {
      sim: [eg ? 'شبه عملية موجودة' : 'تشبه عملية موجودة', 'شبيه', '#956000', '#FBF0DD'],
      conf: [eg ? 'نفس المرجع بتفاصيل مختلفة' : 'المرجع نفسه بتفاصيل مختلفة', 'تعارض', '#BE3D48', 'rgba(190,61,72,0.10)'],
      merge: [eg ? 'هي نفس عملية الرسالة' : 'هي عملية الرسالة نفسها', eg ? 'عملية واحدة بمصدرين' : 'عملية واحدة بمصدرين', '#2469BA', 'rgba(36,105,186,0.10)'],
      dup: [eg ? 'متسجلة قبل كده' : 'مسجلة سابقًا', 'مكرر', '#637570', 'rgba(99,117,112,0.12)']
    }[K];
    // السبب: جملة جاهزة من المنطق (DEDUPE_*). «يندمج» = قرار المالك §75-10 (فرق يومين بالكتير) — مالوش مفتاح نص لسه
    const R = {
      sim: eg ? 'نفس التاجر والمبلغ والتاريخ والاتجاه، ومفيش مرجع بنكي يأكد. ممكن تكون نفس العملية وممكن تكون عملية تانية حقيقية — محتاجة قرارك.' : 'التاجر والمبلغ والتاريخ والاتجاه نفسها، ولا مرجع بنكي يؤكد. قد تكون العملية نفسها أو عملية أخرى فعلية — القرار لك.',
      conf: eg ? 'نفس المرجع «882014» بس المبلغ مختلف. مش هنكتب فوق القديم من غير قرارك.' : 'المرجع «882014» نفسه لكن المبلغ مختلف. لن نستبدل القديم دون قرارك.',
      merge: eg ? 'نفس المبلغ والاتجاه والمحفظة، والفرق بين الرسالة والكشف يوم واحد (يومين بالكتير). بتبقى عملية واحدة بمصدرين، ومش بتتحسب مرتين.' : 'المبلغ والاتجاه والمحفظة نفسها، والفرق بين الرسالة والكشف يوم واحد (يومان كحد أقصى). تبقى عملية واحدة بمصدرين ولا تُحسب مرتين.',
      dup: eg ? 'نفس سطر الكشف: نفس اليوم والمبلغ والاتجاه والرصيد بعد العملية في نفس الحساب — متسجلة قبل كده حتى لو الاسم مقروء بشكل مختلف.' : 'سطر الكشف نفسه: اليوم والمبلغ والاتجاه والرصيد بعد العملية في الحساب نفسه — مسجلة سابقًا ولو قُرئ الاسم بشكل مختلف.'
    }[K];
    const diffName = { amount: eg ? 'المبلغ' : 'المبلغ', when: eg ? 'التاريخ' : 'التاريخ' }[L.diff] || '';
    const side = (label, d, isNew) => ({
      label, name: d.name, amount: d.amount, when: d.when, src: d.src,
      box: 'display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; ' + (isNew ? 'background: rgba(8,99,79,0.06)' : 'background: rgba(25,61,51,0.04)'),
      amountStyle: 'text-align: right; font-size: 15px; font-weight: 700; color: #BE3D48; font-variant-numeric: tabular-nums;' + (L.diff === 'amount' ? ' align-self: flex-start; padding: 0 6px; border-radius: 8px; background: #FBF0DD' : ''),
      whenStyle: 'font-size: 12px; color: #637570;' + (L.diff === 'when' ? ' align-self: flex-start; padding: 0 6px; border-radius: 8px; font-weight: 700; color: #956000; background: #FBF0DD' : '')
    });
    const btn = (strong) => 'flex: 1 1 0; min-height: 48px; padding: 6px 10px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (strong ? 'color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const A = {
      sim: [[eg ? 'هي نفسها — تجاهلها' : 'هي نفسها — تجاهلها', 'skip', false], [eg ? 'لأ، ضيفها' : 'لا، أضفها', 'add', true]],
      conf: [[eg ? 'سيب القديم' : 'أبقِ القديم', 'keep', true]],
      merge: [[eg ? 'لأ، عمليتين' : 'لا، عمليتان منفصلتان', 'split', false], [eg ? 'تمام، عملية واحدة' : 'نعم، عملية واحدة', 'merge', true]],
      dup: [[eg ? 'تمام' : 'حسنًا', 'ok', true]]
    }[K];
    return {
      title: T[0], chip: T[1],
      chipStyle: 'font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; color: ' + T[2] + '; background: ' + T[3],
      sides: [side(eg ? 'الجديدة من الكشف' : 'الجديدة من الكشف', L.newSide, true), side(eg ? 'الموجودة عندك' : 'الموجودة لديك', L.oldSide, false)],
      hasDiff: !!diffName, diffLine: (eg ? 'الفرق: ' : 'الفرق: ') + diffName,
      reason: L.reason || R,
      hasNote: K === 'conf', note: eg ? 'لو القديم غلط، افتحه من العمليات وعدّل مبلغه بإيدك.' : 'إن كان القديم خطأ فافتحه من العمليات وعدّل مبلغه يدويًا.',
      acts: A.map(([label, action, strong]) => ({ label, style: btn(strong), go: () => this.tell(action) })),
      closeSheet: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
