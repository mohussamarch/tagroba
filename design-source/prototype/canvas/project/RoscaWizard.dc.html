<!doctype html>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1),color 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.wz-bar{transition:width 450ms cubic-bezier(.2,.7,.3,1)}
.wz-in{animation:wz-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
.wz-toast{animation:wz-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
@keyframes wz-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} @keyframes wz-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.m-press,.wz-bar{transition:none}.m-press:active{transform:none}.wz-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
input::placeholder{color:#8A9A95}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 116px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">

    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","خطأ"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.timers = []; this.state = this.init(props.state ?? 'عادي', props.space === 'مصر'); this.st = props.state ?? 'عادي'; }

  init(st, eg) {
    const base = { d: {}, q: 'name', nameIn: '', amountIn: '', payoutIn: '', count: 10, freq: 'm1', share: 'one', first: null, cal: [2026, 10], turns: [], err: '', saved: false, toast: '', n: 0 };

  renderVals() {
    const st = this.props.state ?? 'عادي';
    if (this.st !== st) { this.st = st; Object.assign(this.state, this.init(st, this.props.space === 'مصر')); }
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const cur = eg ? 'ج.م' : 'ر.س';
    const n = (x) => x.toLocaleString('ar-EG'), ny = (x) => x.toLocaleString('ar-EG', { useGrouping: false });
    const plural = (x, w) => x === 1 ? w[0] : x === 2 ? w[1] : n(x) + ' ' + (x <= 10 ? w[2] : w[3]);
    const QW = eg ? ['قسط واحد', 'قسطين', 'أقساط', 'قسط'] : ['قسط واحد', 'قسطان', 'أقساط', 'قسطًا'];
    const s = this.state, d = s.d;
    const MO = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
    const dt = (a) => n(a[2]) + ' ' + MO[a[1] - 1] + (a[0] !== 2026 ? ' ' + ny(a[0]) : '');
    // الدورية (RoscaFrequency): أسبوع أو شهر × كل كام
    const FREQ = [['w1', 'كل أسبوع', 'w', 1], ['w2', 'كل أسبوعين', 'w', 2], ['m1', 'كل شهر', 'm', 1], ['m2', 'كل شهرين', 'm', 2], ['m3', eg ? 'كل ٣ شهور' : 'كل ٣ أشهر', 'm', 3]];
    const SHARE = [['half', eg ? 'نص سهم' : 'نصف سهم', 1, 2, 1], ['one', 'سهم واحد', 1, 1, 1], ['two', eg ? 'سهمين' : 'سهمان', 2, 1, 2]];
    const fq = (id) => FREQ.find((f) => f[0] === id), sh = (id) => SHARE.find((x) => x[0] === id);

    const total = order.length, onSum = s.q === 'sum';

    const ERR = {

    };
    const Q = {
      name: [eg ? 'اسم الجمعية إيه؟' : 'ما اسم الجمعية؟', eg ? 'مثلًا: جمعية الشغل' : 'مثلًا: جمعية الدوام'],
      count: [eg ? 'الجمعية كام دور؟' : 'كم دورًا في الجمعية؟', eg ? 'غالبًا نفس عدد الأعضاء' : 'غالبًا بعدد الأعضاء'],

      freq: [eg ? 'بتدفعوا كل قد إيه؟' : 'كل كم تدفعون؟', ''],
      first: [eg ? 'أول دفعة كانت أو هتكون إمتى؟' : 'متى أول دفعة؟', eg ? 'ميعاد أول دفعة هو نفسه ميعاد قبض الدور الأول.' : 'موعد أول دفعة هو موعد قبض الدور الأول.'],
      share: [eg ? 'إنت داخل بكام سهم؟' : 'كم سهمًا لك؟', ''],

    // الإجابة بتتفحص وبتمسح اللي بقى متعارض بس (applyRoscaAnswer)
    const answer = () => {
      const x = Object.assign({}, d);

      if (s.q === 'amount') { const v = this.toMinor(s.amountIn); if (v == null || v <= 0) return this.setState({ err: 'amount' }); if (x.share && contrib(v, x.share) == null) return this.setState({ err: 'half' }); x.amount = v; x.payout = null; }

      if (s.q === 'first') { if (!s.first) return this.setState({ err: 'first' }); x.first = s.first; }
      if (s.q === 'share') { if (contrib(x.amount, s.share) == null) return this.setState({ err: 'half' }); if (x.turns && x.turns.length && x.turns.length !== sh(s.share)[4]) { x.turns = null; cleared = true; } x.share = s.share; x.payout = null; }
      if (s.q === 'turn') { if (s.turns === 'unknown') { x.turns = []; x.payout = null; } else { if (!s.turns.length) return this.setState({ err: 'turn' }); if (s.turns.length !== sh(x.share)[4]) return this.setState({ err: 'two' }); x.turns = s.turns.slice().sort((a, b) => a - b); x.payout = null; } }
      if (s.q === 'payout') { const v = this.toMinor(s.payoutIn); if (v == null || v <= 0) return this.setState({ err: 'payout' }); x.payout = v; }
      if (cleared) this.say(eg ? 'اتمسح دورك لأنه ما بقاش ماشي مع التغيير — اختاره تاني.' : 'مُسح دورك لأنه لم يعد يناسب التغيير — اختره مجددًا.');
      go(nextQ(x), { d: x, turns: x.turns === null ? [] : s.turns });
    };
    const radio = (on) => 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border: 0; border-radius: 18px; font: inherit; color: #193D33; cursor: pointer; ' + (on ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)');
    const dot = (on) => 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; flex-shrink: 0; ' + (on ? 'border: 7px solid #08634F; background: #FFFFFF' : 'border: 1.5px solid #9AA9A4');
    const choices = s.q === 'freq' ? FREQ.map((f) => ({ label: f[1], sub: f[0] === 'm1' ? (eg ? 'الأشهر في الجمعيات' : 'الأكثر شيوعًا') : '', on: s.freq === f[0] ? 'true' : 'false', style: radio(s.freq === f[0]), dot: dot(s.freq === f[0]), pick: () => this.setState({ freq: f[0], err: '' }) }))
      : SHARE.map((x) => { const c = d.amount != null ? contrib(d.amount, x[0]) : null; return { label: x[1], sub: c == null ? (eg ? 'نص القسط مش بيطلع بالقرش' : 'نصف القسط لا يخرج بالهللة') : (eg ? 'قسطك ' : 'قسطك ') + this.fmt(c) + ' ' + cur + ' · ' + (x[4] === 2 ? (eg ? 'دورين' : 'دوران') : (eg ? 'دور واحد' : 'دور واحد')), on: s.share === x[0] ? 'true' : 'false', style: radio(s.share === x[0]), dot: dot(s.share === x[0]), pick: () => this.setState({ share: x[0], err: '' }) }; });
    const [cy, cm] = s.cal;
    const days = [];
    for (let i = 1; i <= dim(cy, cm); i++) {
      const on = !!s.first && s.first[0] === cy && s.first[1] === cm && s.first[2] === i, today = cy === 2026 && cm === 10 && i === 7;
      days.push({ label: n(i), on: on ? 'true' : 'false', pick: () => this.setState({ first: [cy, cm, i], err: '' }), style: 'height: 40px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: #08634F' : today ? 'font-weight: 700; color: #08634F; background: rgba(8,99,79,0.08)' : 'color: #193D33; background: transparent') });
    }
    const shiftCal = (x) => { const t = cy * 12 + cm - 1 + x, M = t % 12; this.setState({ cal: [(t - M) / 12, M + 1] }); };
    const picked = s.turns === 'unknown' ? [] : s.turns;
    const need = d.share ? sh(d.share)[4] : 1;
    const turnChips = [];
    for (let t = 1; t <= (d.count || 0); t++) {
      const on = picked.indexOf(t) >= 0, w = d.first && d.freq ? dueOf(d, t) : null;
      const when = w ? (fq(d.freq)[2] === 'w' ? n(w[2]) + ' ' + MO[w[1] - 1] : MO[w[1] - 1]) : '';
      turnChips.push({ num: n(t), when, aria: (eg ? 'دور ' : 'الدور ') + n(t) + (when ? ' · ' + when : ''), on: on ? 'true' : 'false',
        pick: () => { const cur2 = picked.slice(); const i = cur2.indexOf(t); if (i >= 0) cur2.splice(i, 1); else { if (cur2.length >= need) cur2.shift(); cur2.push(t); } this.setState({ turns: cur2, err: '' }); },
        style: 'height: 56px; border: 0; border-radius: 16px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; ' + (on ? 'color: #FFFFFF; background: linear-gradient(125deg, #064B40 0%, #08705A 100%)' : 'color: #193D33; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)') });
    }
    // التحليل قبل الحفظ (RoscaForecast)
    let facts = [], answers = [], heroLabel = '', heroValue = '', heroSub = '';
    if (onSum) {
      const c = contrib(d.amount, d.share), known = d.turns.length > 0, pay = c * d.count, recv = known ? d.payout * d.turns.length : null;
      let run = 0, pS = 0, pO = 0;
      for (let x = 1; x <= d.count; x++) { run += c - (d.turns.indexOf(x) >= 0 ? d.payout : 0); pS = Math.max(pS, run); pO = Math.max(pO, -run); }
      const gain = known ? recv - pay : null, NA = 'غير متاح';
      heroLabel = known ? (eg ? 'هتقبض' : 'ستقبض') : (eg ? 'ميعاد قبضك' : 'موعد قبضك');
      heroValue = known ? d.turns.map((t) => dt(dueOf(d, t))).join(' و') : NA;
      heroSub = known ? this.fmt(d.payout) + ' ' + cur + (d.turns.length > 1 ? (eg ? ' في كل دور' : ' في كل دور') : '') : (eg ? 'لما دورك يتعرف هيبان الميعاد والمكسب.' : 'يظهر الموعد والربح حين يُعرف دورك.');
      const F = [
        [eg ? 'إجمالي اللي هتدفعه' : 'إجمالي ما تدفعه', this.fmt(pay) + ' ' + cur],
        [eg ? 'إجمالي اللي هتقبضه' : 'إجمالي ما تقبضه', known ? this.fmt(recv) + ' ' + cur : NA],
        [eg ? 'المكسب لو حوّشت لوحدك' : 'الربح مقارنة بالادخار وحدك', !known ? NA : gain === 0 ? (eg ? 'ولا حاجة' : 'لا شيء') : (gain > 0 ? '+' : '−') + this.fmt(gain) + ' ' + cur, gain > 0 ? '#13764D' : gain < 0 ? '#BE3D48' : null],
        [eg ? 'أقساط قبل القبض' : 'أقساط قبل القبض', known ? plural(d.turns[0] - 1, QW) : NA],
        [eg ? 'أقساط بعد القبض' : 'أقساط بعد القبض', known ? plural(d.count - d.turns[d.turns.length - 1], QW) : NA],
        [eg ? 'أكبر مبلغ شايلاهولك' : 'أكبر مبلغ تحفظه لك', known ? this.fmt(pS) + ' ' + cur : NA, '#13764D'],
        [eg ? 'أكبر دين عليك' : 'أكبر دين عليك', known ? this.fmt(pO) + ' ' + cur : NA, '#BE3D48'],
        [eg ? 'آخر قسط' : 'آخر قسط', dt(dueOf(d, d.count))]
      ];
      facts = F.map(([label, value, color], i) => ({ label, value, dir: /[0-9]/.test(value) && value.indexOf(cur) >= 0 ? 'ltr' : 'rtl',
        valueStyle: 'font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (value === NA ? '#637570' : color || '#193D33'),
        rowStyle: 'display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; font-size: 14px;' + (i === F.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);') }));
      const A = [['name', 'الاسم', d.name], ['count', eg ? 'الأدوار' : 'الأدوار', n(d.count)], ['amount', eg ? 'القسط' : 'القسط', this.fmt(d.amount) + ' ' + cur], ['freq', eg ? 'كل قد إيه' : 'الدورية', fq(d.freq)[1]], ['first', eg ? 'أول دفعة' : 'أول دفعة', dt(d.first)], ['share', eg ? 'الأسهم' : 'الأسهم', sh(d.share)[1]], ['turn', 'دورك', known ? d.turns.map(n).join(' و') : (eg ? 'لسه ما اتعرفش' : 'غير معروف بعد')]];
      if (known) A.push(['payout', eg ? 'قيمة الدور' : 'قيمة الدور', this.fmt(d.payout) + ' ' + cur]);
      answers = A.map(([q, label, value], i) => ({ label, value, editLabel: (eg ? 'غيّر ' : 'غيّر ') + label, edit: () => go(q, q === 'turn' ? { turns: d.turns.length ? d.turns.slice() : 'unknown' } : null),
        rowStyle: 'width: 100%; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: #193D33; cursor: pointer; text-align: right;' + (i === A.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);') }));
    }
    const pct = Math.floor(((onSum ? total : idx - 1) * 100) / total);
    const prevQ = onSum ? order[order.length - 1] : order[order.indexOf(s.q) - 1];
    const sugg = s.q === 'payout' ? suggested(d) : null, isMoney = s.q === 'amount' || s.q === 'payout';
    return {
      title: 'جمعية جديدة', cur,
      stepLabel: onSum ? (eg ? 'التحليل قبل الحفظ' : 'التحليل قبل الحفظ') : (eg ? 'سؤال ' : 'السؤال ') + n(idx) + (eg ? ' من ' : ' من ') + n(total),
      pct: String(pct), bar: 'display: block; height: 8px; border-radius: 4px; background: #08634F; width: ' + pct + '%',
      asking: !onSum, onSummary: onSum, stepCls: 'wz-in s' + s.n,
      qText: onSum ? '' : Q[s.q][0],
      qHint: s.q === 'payout' ? (sugg != null ? (eg ? 'المحسوب: ' : 'المحسوب: ') + this.fmt(sugg) + ' ' + cur : (eg ? 'قيمة الدور مش بتتقسم بالظبط على أدوارك — اكتبها بنفسك.' : 'قيمة الدور لا تنقسم بالتساوي على أدوارك — أدخلها بنفسك.')) : onSum ? '' : Q[s.q][1],
      isName: s.q === 'name', nameHint: Q.name[1], nameIn: s.nameIn, typeName: (e) => this.setState({ nameIn: e.target.value, err: '' }),
      isCount: s.q === 'count', countText: n(s.count),
      countUp: () => this.setState({ count: Math.min(60, s.count + 1), err: '' }), countDown: () => this.setState({ count: Math.max(2, s.count - 1), err: '' }),
      isMoney, moneyIn: s.q === 'payout' ? s.payoutIn : s.amountIn,
      typeMoney: (e) => this.setState(s.q === 'payout' ? { payoutIn: e.target.value, err: '' } : { amountIn: e.target.value, err: '' }),
      isChoice: s.q === 'freq' || s.q === 'share', choices,
      isDate: s.q === 'first', monthTitle: MO[cm - 1] + ' ' + ny(cy), days,
      monthPrev: () => shiftCal(-1), monthNext: () => shiftCal(1), prevMonthLabel: eg ? 'الشهر اللي فات' : 'الشهر السابق', nextMonthLabel: eg ? 'الشهر الجاي' : 'الشهر التالي',
      isTurn: s.q === 'turn', turnChips, unknownOn: s.turns === 'unknown' ? 'true' : 'false', unknownLabel: eg ? 'لسه ما اتعرفش' : 'غير معروف بعد',
      pickUnknown: () => this.setState({ turns: s.turns === 'unknown' ? [] : 'unknown', err: '' }),
      unknownStyle: 'height: 52px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ' + (s.turns === 'unknown' ? 'color: #08634F; background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'color: #193D33; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(204,216,204,0.9)'),
      hasErr: !!s.err, err: s.err ? ERR[s.err] : '',
      heroLabel, heroValue, heroSub, facts, answers, answersTitle: eg ? 'إجاباتك — دوس على أي واحدة تغيّرها' : 'إجاباتك — اضغط أيًّا منها لتغييرها',
      hasPrev: !!prevQ && !s.saved, prevLabel: eg ? 'اللي قبله' : 'السابق',
      prev: () => { if (prevQ) go(prevQ, prevQ === 'turn' && d.turns ? { turns: d.turns.length ? d.turns.slice() : 'unknown' } : null); },
      notSaved: !s.saved, saved: s.saved, nextLabel: onSum ? (eg ? 'احفظ الجمعية' : 'احفظ الجمعية') : (eg ? 'التالي' : 'التالي'),
      next: () => { if (!onSum) return answer(); this.setState({ saved: true }); this.say((eg ? 'اتحفظت «' : 'حُفظت «') + d.name + (eg ? '» — هتلاقيها في الجمعيات' : '» — تجدها في الجمعيات')); },
      doneLabel: eg ? 'روح للجمعيات' : 'إلى الجمعيات',
      hasToast: !!s.toast, toast: s.toast
