<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.a-tab{animation:a-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.a-push{animation:a-push 450ms cubic-bezier(.2,.7,.3,1) both}
.a-pop{animation:a-pop 450ms cubic-bezier(.2,.7,.3,1) both}
@keyframes a-fade{from{opacity:.4;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes a-push{from{transform:translateX(-100%)}to{transform:none}}
@keyframes a-pop{from{opacity:.5;transform:translateX(30%)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a-tab,.a-push,.a-pop{animation:a-only 150ms both}}
@keyframes a-only{from{opacity:0}to{opacity:1}}
</style>
</helmet>
<div dir="rtl" ref="{{setRoot}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFF3ED">
  <sc-if value="{{s.Main}}" hint-placeholder-val="{{ true }}">

<script type="text/x-dc" data-dc-script data-props='{"navStyle":{"editor":"enum","options":["زرار في النص","اسحب لفوق","زرار جنب الشريط","بدون زرار"],"default":"زرار في النص","section":"زرار الإضافة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // التطبيق كله في لوحة واحدة: كل شاشة لوحة لوحدها، وهنا بنعرض واحدة بس ونمسك الروابط جواها.
  // رابط لتبويب = تبديل تبويب (الرجوع يتمسح) · رابط لشاشة تانية = دخول · رابط عليه data-back = رجوع للي قبله.
  constructor(props) {
    super(props);
    this.TABS = ['Main', 'Operations', 'People', 'Investment'];
    this.SCREENS = this.TABS.concat(['More', 'PersonProfile', 'OwedToYou', 'YouOwe', 'Roscas', 'Installments', 'Subscriptions', 'Notifications', 'NotificationSettings', 'BankSms', 'OperationDetail', 'OperationFilters', 'ReviewQueue', 'Transfers']);
    this.state = { screen: 'Main', stack: [], anim: 'a-tab', n: 0 };
    this.onClick = (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      const href = a.getAttribute('href') || '';
      const m = href.match(/([A-Za-z]+)\.dc\.html$/);
      if (!m) return;
      e.preventDefault();
      e.stopPropagation();
      // الرابط ممكن يشيل اختيار للشاشة الجاية (أنهي عملية اتداست مثلًا) — بنكتبه قبل ما نفتحها
      const keep = a.getAttribute('data-keep');
      if (keep) { try { const o = JSON.parse(keep); Object.keys(o).forEach((k) => window.sessionStorage.setItem(k, o[k])); } catch (err) {} }
      this.go(m[1], a.hasAttribute('data-back'));
    };
    this.setRoot = (el) => {
      if (this.root === el) return;
      if (this.root) this.root.removeEventListener('click', this.onClick, true);
      this.root = el;
      if (el) el.addEventListener('click', this.onClick, true);
    };
  }
  go(name, back) {
    if (this.SCREENS.indexOf(name) < 0) return;
    const { screen, stack } = this.state;
    if (back) {
      const prev = stack.length ? stack[stack.length - 1] : name;
      this.setState({ screen: prev, stack: stack.slice(0, -1), anim: 'a-pop' });
    } else if (this.TABS.indexOf(name) >= 0) {
      if (name === screen && !stack.length) return;
      this.setState({ screen: name, stack: [], anim: 'a-tab' });
    } else {
      this.setState({ screen: name, stack: stack.concat([screen]), anim: 'a-push' });
    }
  }
  componentWillUnmount() { if (this.root) this.root.removeEventListener('click', this.onClick, true); }
  renderVals() {
    const s = {};
    this.SCREENS.forEach((k) => { s[k] = this.state.screen === k; });
    return { s, anim: this.state.anim, setRoot: this.setRoot, space: this.props.space ?? 'السعودية', navStyle: this.props.navStyle ?? 'زرار في النص' };
  }
}
</script>
