<script type="text/x-dc" data-dc-script data-props='{"navStyle":{"editor":"enum","options":["زرار في النص","اسحب لفوق","زرار جنب الشريط","بدون زرار"],"default":"زرار في النص","section":"زرار الإضافة"},"state":{"editor":"enum","options":["عادي","فاضي","بيحمّل","بيحدّث","خطأ","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let tab = 'ops';
    try { tab = window.sessionStorage.getItem('masroufy-ops-tab') || 'ops'; } catch (e) {}
    let seen = null;
    try { seen = window.sessionStorage.getItem('masroufy-ops-sheen'); window.sessionStorage.setItem('masroufy-ops-sheen', '1'); } catch (e) {}
    this.sheenOnce = !seen;
    this.state = { tab, menu: null, quick: [], sel: null, edits: {}, undo: null }; // edits: id ⇒ { gone, sub } من وضع التحديد // quick: اللي اتسجل من «متوقعة الشهر ده» بيظهر فوق في النهارده
    this.onQuick = (q) => { if (q && q.name) this.setState((st) => ({ quick: [q].concat(st.quick) })); };
    this.setRoot = (el) => { this.root = el; };
    this.hold = null;
  }
  componentWillUnmount() { this.holdCancel(); clearTimeout(this.undoT); }
  holdCancel() { if (this.hold && this.hold.t) clearTimeout(this.hold.t); this.hold = null; }
  openMenu(row, el) {
    let top = 300, h = 56;
    if (el && this.root && el.getBoundingClientRect) {
      const rr = this.root.getBoundingClientRect(), r = el.getBoundingClientRect();
      const k = rr.height / (this.root.offsetHeight || 844) || 1;
      top = (r.top - rr.top) / k; h = r.height / k;
    }
    this.setState({ menu: { row, top, h } });
  }
  bulk(b, eg) {
    if (!b || !Array.isArray(b.ids)) return;
    const prev = this.state.edits || {}, next = Object.assign({}, prev), word = b.count === 1 ? (eg ? 'عملية' : 'عملية') : b.count === 2 ? (eg ? 'عمليتين' : 'عمليتان') : b.count + (eg ? ' عمليات' : ' عمليات');
    b.ids.forEach((id) => { next[id] = b.action === 'delete' ? { gone: true } : { sub: (b.action === 'project' ? (eg ? 'مشروع «' : 'مشروع «') + b.label + '»' : b.label) + (eg ? ' · اتغيّرت مع غيرها' : ' · تغيّرت مع غيرها') }; });
    const text = b.action === 'delete' ? (eg ? 'اتمسحت ' : 'حُذفت ') + word : b.action === 'project' ? (eg ? 'اتضافت ' : 'أُضيفت ') + word + (eg ? ' لـ«' : ' إلى «') + b.label + '»' : (eg ? 'اتغيّرت ' : 'تغيّرت ') + word + ' ⇐ ' + b.label;
    clearTimeout(this.undoT); this.undoT = setTimeout(() => this.setState({ undo: null }), 5000);
    this.setState({ edits: next, sel: null, undo: { text, prev } });
  }
  renderVals() {
    const st = this.props.state ?? 'عادي';

        dots: (e) => { self.openMenu(r, e && e.currentTarget && e.currentTarget.parentElement); },

      { label: 'أمس', rows: [row('food', 'مطعم السمك', 'أكل وقهوة · الأصلي 360.00', '180.00', 'out', false, false, false, { gross: 36000, items: [{ id: 'c1', name: 'حوالة من أحمد', when: 'أمس · من حساب آخره 7710', amt: 18000 }] }), row('move', 'حوالة من أحمد', 'تابعة لـ«مطعم السمك» · مش داخلة في الدخل', '180.00', 'tied'), row('shop', 'سوبرماركت الحي', 'بقالة وسوبرماركت', '1,240.50', 'out'), row('car', 'بنزينة', 'بنزين', '600.00', 'out', true)] }
    ] : [
      { label: 'اليوم', rows: [row('food', 'مطعم الريف', 'مطاعم وقهوة · من رسالة البنك', '42.00', 'out', false, false, true), row('move', 'حوالة واردة', 'من حساب ينتهي بـ 4821', '1,500.00', 'in'), row('cash', 'صرف كاش غير مسجّل', 'من عدّ الكاش · بلا تصنيف', '60.00', 'out', false, true), row('own', 'بين محافظك', 'من البنك ← إلى الكاش', '1,000.00', 'move', true)] },
      { label: 'أمس', rows: [row('food', 'مطعم الشاطئ', 'مطاعم وقهوة · الأصلي 120.00', '60.00', 'out', false, false, false, { gross: 12000, items: [{ id: 'c1', name: 'حوالة من أحمد', when: 'أمس · من حساب ينتهي بـ 7710', amt: 6000 }] }), row('move', 'حوالة من أحمد', 'تابعة لـ«مطعم الشاطئ» · لا تُحسب دخلًا', '60.00', 'tied'), row('shop', 'سوبرماركت الحي', 'بقالة وسوبرماركت', '318.40', 'out'), row('car', 'محطة وقود', 'بنزين', '90.00', 'out'), row('income', 'راتب', 'دخل · مصدر الدخل الأساسي', '12,500.00', 'in', true)] }

    const E = this.state.edits || {};

    const tabs = tabDefs.map(([id, label]) => {

    const menu = this.state.menu;
    return {

      filterLabel: eg ? 'فلترة العمليات' : 'تصفية العمليات',

      menuItems: [

        { label: eg ? 'كل الإجراءات ←' : 'كل الإجراءات ←', go: () => this.setState({ menu: null }), strong: true }

      spaceName: (this.props.space ?? "السعودية") === "مصر" ? "مصر" : "السعودية",
      tabs,
      onOps: this.state.tab === 'ops',
      onBudgets: this.state.tab === 'budgets',
      onDues: this.state.tab === 'dues',
      stateName: st,
      isRefreshing: st === 'بيحدّث', loadText: eg ? 'بنجهّز فلوسك…' : 'نجهّز أموالك…',
      isError: st === 'خطأ', isLoading: st === 'بيحمّل', isEmpty: st === 'فاضي', isNA: st === 'غير متاح',
