<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="More.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">{{title}}</h1>
    </div>
    <div style="border-radius: 22px; padding: 4px 16px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <sc-for list="{{qs}}" as="q" hint-placeholder-count="1">
        <div style="{{q.wrap}}">
          <button type="button" class="m-press" onClick="{{q.toggle}}" aria-expanded="{{q.open}}" style="width: 100%; min-height: 56px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; gap: 10px; font: inherit; font-size: 15px; font-weight: 700; color: #193D33; text-align: right; cursor: pointer"><span style="flex: 1 1 auto">{{q.q}}</span><span aria-hidden="true" style="{{q.chev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></button>
          <sc-if value="{{q.isOpen}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px"><sc-for list="{{q.lines}}" as="l" hint-placeholder-count="4"><span style="font-size: 13px; line-height: 1.7; color: #4F625C">{{l.t}}</span></sc-for></div></sc-if>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #637570">{{note}}</span>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// الأسئلة الشائعة في الإعدادات (طلب المالك 2026-10-15: «على ماذا بُني الحساب» تتنقل هنا من شاشة الاستثمار، «نبقى نظبطها بعدين»)
// أول سؤال بس دلوقتي، والصياغة لسه هتتراجع مع المالك
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 0 }; }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a);
    const Q = [{
      q: T('على ماذا بُني حساب «كم سيصبح معك» في الاستثمار؟', 'حساب «هيبقى معاك كام» في الاستثمار مبني على إيه؟'),
      lines: [
        T('كل مالك = الحسابات والكاش + الأصول − الديون. السيارة والجوال وأشياء الاستخدام الشخصي والأصول المؤرشفة ليست داخل الحساب.', 'كل فلوسك = الحسابات والكاش + الأصول − الديون. العربية والموبايل وحاجات الاستخدام الشخصي والأصول المتأرشفة مش داخلة في الحساب.'),
        T('ادخارك = متوسط آخر 3 أشهر (دخلك − صرفك).', 'تحويشك = متوسط آخر 3 شهور (دخلك − صرفك).'),
        T('الذهب يزيد بمتوسط سعره في آخر 10 سنوات من البنك الدولي (رسمي). والأسهم بمتوسط مؤشر السوق من مزوّد مؤشرات (ليس رسميًا). والعقار يزيد مثل الغلاء الرسمي.', 'الدهب بيزيد بمتوسط سعره في آخر 10 سنين من البنك الدولي (رسمي). والأسهم بمتوسط مؤشر السوق من مزوّد مؤشرات (مش رسمي). والعقار بيزيد زي الغلاء الرسمي.'),
        T('«بقيمة اليوم» = نخصم التضخم الرسمي (الهيئة العامة للإحصاء عبر البنك الدولي).', '«بفلوس النهارده» = بنخصم التضخم الرسمي (الجهاز المركزي للتعبئة العامة والإحصاء عبر البنك الدولي).'),
        T('«كما أنت»: ادخارك يبقى كاشًا دون أرباح، والأقساط تنتهي في مواعيدها.', '«زي ما إنت»: تحويشك بيفضل كاش من غير أرباح، والأقساط بتخلص في مواعيدها.'),
        T('هذا متوسط ما مضى، وليس وعدًا بما سيأتي.', 'ده متوسط اللي فات، مش وعد باللي جاي.')
      ]
    }];
    return {
      title: T('الأسئلة الشائعة', 'الأسئلة الشائعة'), note: T('سنضيف أسئلة أخرى لاحقًا.', 'هنضيف أسئلة تانية بعدين.'),
      qs: Q.map((x, i) => { const open = this.state.open === i; return { q: x.q, open: open ? 'true' : 'false', isOpen: open, lines: x.lines.map((t) => ({ t })), toggle: () => this.setState({ open: open ? -1 : i }),
        chev: 'display: flex; transition: transform 220ms cubic-bezier(.2,.7,.3,1); transform: rotate(' + (open ? 180 : 0) + 'deg)', wrap: i < Q.length - 1 ? 'border-bottom: 1px solid rgba(204,216,204,0.55)' : '' }; })
    };
  }
}
</script>
