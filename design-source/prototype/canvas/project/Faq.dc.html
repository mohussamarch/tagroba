<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الأسئلة الشائعة — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.fq-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.fq-press:active{transform:scale(.98)}
.fq-in{animation:fq-in 240ms cubic-bezier(.2,.8,.2,1) both}
@keyframes fq-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fq-chips{scrollbar-width:none}.fq-chips::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.fq-press{transition:none}.fq-press:active{transform:none}.fq-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: #EFF3ED">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="More.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{title}}</h1>
  </div>
  <dc-import name="TipStrip" text="{{tip}}" space="{{spaceName}}" hint-size="358px,60px"></dc-import>
  <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 16px; background: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" value="{{q}}" onInput="{{typeQ}}" placeholder="{{searchPh}}" aria-label="{{searchPh}}" style="flex: 1 1 auto; height: 44px; border: 0; font: inherit; font-size: 15px; color: #193D33; background: transparent; outline: none"></label>
  <div class="fq-chips" role="tablist" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
    <sc-for list="{{secs}}" as="c" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{c.on}}" class="fq-press" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="border-radius: 22px; padding: 6px 14px; display: flex; flex-direction: column; background: #FFFFFF">
      <span style="font-size: 13px; font-weight: 700; color: #637570; padding: 8px 0 2px">{{g.title}}</span>
      <sc-for list="{{g.qs}}" as="x" hint-placeholder-count="3">
        <div style="{{x.row}}">
          <button type="button" class="fq-press" onClick="{{x.toggle}}" aria-expanded="{{x.openAria}}" style="width: 100%; min-height: 52px; border: 0; padding: 8px 0; display: flex; align-items: center; gap: 8px; font: inherit; text-align: right; color: #193D33; cursor: pointer; background: transparent"><span style="flex: 1 1 auto; font-size: 15px; font-weight: 700; line-height: 1.5">{{x.q}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="{{x.chev}}"><path d="m6 9 6 6 6-6"></path></svg></button>
          <sc-if value="{{x.open}}" hint-placeholder-val="{{ false }}"><span class="fq-in" style="display: block; padding: 0 0 12px; font-size: 14px; line-height: 1.8; color: #3C5650">{{x.a}}</span></sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><span style="text-align: center; padding: 24px; font-size: 14px; color: #637570">{{emptyText}}</span></sc-if>
  <a href="AssistantChat.dc.html" style="min-height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #08634F; text-decoration: none; background: rgba(8,99,79,0.08)">{{askLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"مصر","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// الأسئلة الشائعة (طلب المالك 2026-10-17: «تصميم لصفحة الأسئلة الشائعة مع زيادة عددها … وتقسيمها لأقسام» — اتفتح 2026-10-23): في «المزيد»
// بحث + أقسام + سؤال بيفتح إجابته (سطرين بالكتير — قاعدة الكلام القصير) + «مالقيتش إجابتك؟ اسأل مصروفي»
const D = [
  ['basics', 'الأساسيات', [['الشهر عندي بيبدأ إمتى؟', 'يوم المرتب. غيّره من «حسابك».'], ['إيه الفرق بين المصروف الحقيقي والمدين؟', 'المدين كل اللي خرج. المصروف الحقيقي من غير التحويلات بين محافظك والسداد.'], ['أرجّع عملية مسحتها إزاي؟', 'من «تراجع» اللي بيظهر تحت بعد المسح.']]],
  ['balance', 'الرصيد والكاش', [['يعني إيه «تقدر تصرف»؟', 'رصيدك ناقص المحجوز لخططك.'], ['أحجز فلوس لخطة إزاي؟', 'من الخطة ⇐ إيداع ⇐ «حجز من رصيدي».'], ['الكاش بيتحسب منين؟', 'من آخر عدّ ليك، وناقص اللي سجلته كاش بعده.']]],
  ['sms', 'رسايل البنك', [['ليه رسالة ما اتسجلتش لوحدها؟', 'شكلها جديد. أكّده مرة وبعدها هيتسجل لوحده.'], ['يعني إيه «فيه رسايل فاتته»؟', 'الجوال وقّف البرنامج عشان البطارية. دوس «اقراهم دلوقتي».'], ['البرنامج بيقرا رسايلي الشخصية؟', 'لأ، رسايل البنوك بس.']]],
  ['people', 'الديون والأشخاص', [['أسجّل إن حد سدّدلي إزاي؟', 'من صفحته ⇐ «تحصيل» ⇐ اربطها بالتحويل أو كاش.'], ['دفعت أكتر من اللي عليا؟', 'الزيادة تبقى سلفة جديدة أو هدية — إنت تختار.']]],
  ['bnpl', 'التقسيط', [['خصم تابي فيه قسطين مع بعض؟', '«مجموع أكتر من قسط» ووزّعه.'], ['بدأت أسجّل من القسط التالت؟', 'اختار «الدفعة دي رقم 3»، واللي قبلها «تم الدفع».']]],
  ['privacy', 'الخصوصية والنسخة', [['أخفي الأرقام إزاي؟', 'دوس العين في الكارت الرئيسي.'], ['بياناتي محفوظة فين؟', 'على جوالك، والنسخة الاحتياطية في حسابك بس.'], ['أرقام حساباتي بتتحفظ كاملة؟', 'لأ، آخر 4 أرقام بس.']]]
];
const norm = (t) => String(t || '').replace(/[إأآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sec: 'all', open: 'basics-0', q: '' }; }
  renderVals() {
    const eg = (this.props.space ?? 'مصر') === 'مصر', s = this.state, q = norm(s.q);
    const chip = (on) => 'flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: #FFFFFF');
    const groups = D.filter(([id]) => s.sec === 'all' || s.sec === id).map(([id, title, qs]) => ({ title, qs: qs.map(([qq, a], i) => ({ q: qq, a, key: id + '-' + i })).filter((x) => !q || norm(x.q + ' ' + x.a).includes(q)) }))
      .filter((g) => g.qs.length).map((g) => ({ title: g.title, qs: g.qs.map((x, i) => {
        const open = s.open === x.key || !!q;
        return { q: x.q, a: x.a, open, openAria: open ? 'true' : 'false', toggle: () => this.setState({ open: s.open === x.key ? null : x.key }),
          chev: 'flex-shrink: 0; transition: transform 220ms; transform: rotate(' + (open ? 180 : 0) + 'deg)', row: i < g.qs.length - 1 ? 'border-bottom: 1px solid rgba(204,216,204,0.55)' : '' };
      }) }));
    return {
      title: eg ? 'الأسئلة الشائعة' : 'الأسئلة الشائعة', spaceName: eg ? 'مصر' : 'السعودية',
      tip: eg ? 'دوّر بكلمة، أو اختار قسم.' : 'ابحث بكلمة، أو اختر قسمًا.',
      searchPh: eg ? 'دوّر في الأسئلة' : 'ابحث في الأسئلة', q: s.q, typeQ: (e) => this.setState({ q: e && e.target ? e.target.value : '' }),
      secs: [['all', eg ? 'الكل' : 'الكل']].concat(D.map(([id, t]) => [id, t])).map(([id, label]) => ({ label, on: s.sec === id ? 'true' : 'false', style: chip(s.sec === id), pick: () => this.setState({ sec: id }) })),
      groups, empty: !groups.length, emptyText: eg ? 'مفيش سؤال بالكلمة دي.' : 'لا يوجد سؤال بهذه الكلمة.',
      askLabel: eg ? 'مالقيتش إجابتك؟ اسأل مصروفي' : 'لم تجد إجابتك؟ اسأل مصروفي'
    };
  }
}
</script>
</body>
</html>
