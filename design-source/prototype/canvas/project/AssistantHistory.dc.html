<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سجل المحادثات — مصروفي</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.h-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.h-press:active{transform:scale(.97)}
.h-scroll{scrollbar-width:none}.h-scroll::-webkit-scrollbar{display:none}.h-scroll>*{flex-shrink:0}
.h-veil{animation:h-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.h-up{animation:h-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.h-toast{animation:h-toast 5200ms cubic-bezier(.2,.7,.3,1) both}
.n-track{transition:background 220ms cubic-bezier(.2,.7,.3,1)}.n-knob{transition:right 320ms cubic-bezier(.18,.9,.28,1.08)}
@keyframes h-fade{from{opacity:0}to{opacity:1}}
@keyframes h-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes h-toast{0%{opacity:0;transform:translateY(10px)}6%{opacity:1;transform:none}92%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.h-press,.n-track,.n-knob{transition:none}.h-press:active{transform:none}.h-up,.h-toast{animation:h-fade 150ms both}}
.h-search{transition:box-shadow 220ms cubic-bezier(.2,.7,.3,1)}.h-search:focus-within{box-shadow:inset 0 0 0 2px #08634F}.h-search input:focus-visible{box-shadow:none}.h-search input::-webkit-search-cancel-button{-webkit-appearance:none}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div aria-hidden="true" style="{{baseStyle}}"></div>
  <button type="button" class="h-veil" onClick="{{closeIt}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>

      <h2 style="flex: 1 1 auto; margin: 0; font-size: 18px; font-weight: 700">{{title}}</h2>
      <button type="button" class="h-press" onClick="{{closeIt}}" aria-label="{{closeLabel}}" style="width: 44px; height: 44px; border: 0; padding: 0; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #08634F; background: rgba(8,99,79,0.08)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div class="h-search" style="height: 48px; box-sizing: border-box; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 8px; color: #637570; background: rgba(25,61,51,0.05)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" aria-label="{{searchHint}}" placeholder="{{searchHint}}" value="{{q}}" onInput="{{typeQ}}" style="flex: 1 1 auto; min-width: 0; height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #193D33; outline: none">
    </div>

    <div class="h-scroll" style="height: 600px; overflow-y: auto; margin: 0 -20px; padding: 2px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
      <sc-if value="{{showLearn}}" hint-placeholder-val="{{ true }}">
        <div style="border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: rgba(220,235,214,0.55)">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #08634F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path></svg>{{learnTitle}}</span>
          <span style="font-size: 12px; color: #637570">{{syncNote}}</span>
          <sc-for list="{{facts}}" as="fc" hint-placeholder-count="4">

          <div style="display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(8,99,79,0.12); padding-top: 4px">

            <button type="button" role="switch" aria-checked="{{onAttr}}" aria-label="{{switchTitle}}" onClick="{{toggle}}" style="width: 56px; height: 48px; flex-shrink: 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <span class="n-track" style="{{track}}"><span class="n-knob" style="{{knob}}"></span></span>
            </button>
          </div>

              </div>
            </div>

          <sc-if value="{{showClearBtn}}" hint-placeholder-val="{{ true }}">
            <button type="button" class="h-press" onClick="{{startClear}}" disabled="{{noFacts}}" style="{{clearStyle}}">{{clearLabel}}</button>
          </sc-if>
        </div>
      </sc-if>

      <sc-for list="{{groups}}" as="gr" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h3 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; color: #637570">{{gr.label}}</h3>
          <div style="border-radius: 20px; padding: 0 4px 0 2px; background: #FFFFFF; box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 10px 24px rgba(29,54,53,0.07)">
            <sc-for list="{{gr.rows}}" as="rw" hint-placeholder-count="2">

                    <span style="flex-shrink: 0; font-size: 12px; color: #637570">{{rw.time}}</span>
                  </span>
                  <span style="width: 100%; font-size: 12px; color: #637570; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{rw.first}}</span>
                </button>
                <button type="button" class="h-press" onClick="{{rw.del}}" aria-label="{{rw.delLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #637570; background: transparent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 28px 12px; text-align: center; font-size: 14px; color: #637570">{{emptyText}}</div>
      </sc-if>
    </div>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 0; right: 0; bottom: 24px; z-index: 3; display: flex; justify-content: center; pointer-events: none">
        <div role="status" class="h-toast" style="max-width: 340px; padding: 6px 6px 6px 16px; border-radius: 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #FFFFFF; pointer-events: auto; background: rgba(25,61,51,0.92); box-shadow: 0 14px 30px rgba(16,45,53,0.25)">
          <span style="padding: 6px 0">{{toast}}</span>
          <sc-if value="{{canUndo}}" hint-placeholder-val="{{ false }}">
            <button type="button" class="h-press" onClick="{{undo}}" style="height: 40px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #A6DEC1; cursor: pointer; background: rgba(255,255,255,0.10)">{{undoLabel}}</button>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"onOpen":{"editor":null},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
// سجل المحادثات (لوحة من تحت): بحث · «اللي اتعلمته عنك» (المفتاح + المسح بتأكيد) · المحادثات متجمعة النهارده · امبارح · الأسبوع ده · أقدم
// المحادثات القديمة مخترعة (النهارده الأربعاء ٧ أكتوبر، والأسبوع من السبت) · محادثات الجلسة جاية من الأم (sessions) وبتطلع فوق
// الفتح ⇒ on-open({ id, msgs }) · الحذف ⇒ مخفية في sessionStorage «masroufy-ask-deleted» + رسالة فيها «تراجع» ⇒ on-deleted(id)
// اللي اتعلمه جاي من الأم (learned) والتغيير بيرجع on-learn({ on, topics, recent })
// المواضيع اللي بتسأل عنها كتير (بالعدد) — نفس مواضيع RULES في AssistantChat
const FACT = { coffee: ['تسأل عن القهوة', 'بتسأل عن القهوة'], rent: ['تسأل عن الإيجار', 'بتسأل عن الإيجار'], split: ['تسأل عن تقسيم الفواتير', 'بتسأل عن تقسيم الفواتير'], food: ['تسأل عن صرف المطاعم', 'بتسأل عن صرف الأكل برّه'], bills: ['تسأل عن فواتير البيت', 'بتسأل عن فواتير البيت'], debts: ['تسأل عن فلوسك عند الناس', 'بتسأل عن فلوسك عند الناس'], budget: ['تسأل عن ميزانية الشهر', 'بتسأل عن ميزانية الشهر'], goal: ['تسأل عن هدف «السفر»', 'بتسأل عن هدف «السفر»'], salary: ['تسأل عن موعد الراتب', 'بتسأل عن ميعاد المرتب'], store: ['تسأل عن «المرسى»', 'بتسأل عن «المرسى»'] };
// حاجات إنت أكدتها بنفسك في شاشاتها (§78-٤: يوم الراتب ومصدر الدخل · المحل الأكتر · الأشخاص · الأهداف) — مخترعة ومن نفس الشاشات
const KNOWN = { sa: [['pay', 'راتبك يوم ٢٨ من «شركة الريادة للحلول»', 'من مصادر الدخل'], ['shop', 'أكثر محل تشتري منه: «مقهى المرسى»', 'من عملياتك'], ['ppl', 'تقسّم الفواتير مع أحمد وسارة', 'من التقسيم'], ['goal', 'خطتك المميّزة بنجمة: «السفر»', 'من خطط الادخار']],
  eg: [['pay', 'دخلك: عائد الشهادة يوم ١ وإيجار شقة المعادي يوم ٥', 'من مصادر الدخل'], ['shop', 'أكتر محل: «كافيه المرسى»', 'من عملياتك'], ['ppl', 'بتقسّم الفواتير مع أحمد وسارة', 'من التقسيم'], ['goal', 'خطتك اللي عليها النجمة: «السفر»', 'من خطط الادخار']] };
const DEL = 'masroufy-ask-deleted';
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let gone = [];
    try { gone = JSON.parse(window.sessionStorage.getItem(DEL) || '[]') || []; } catch (e) {}
    this.state = { q: '', gone, L: null, askClear: false, toast: '', undoId: null, tk: 0 };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  eg() { return (this.props.space ?? 'السعودية') === 'مصر'; }
  whole(minor) { const a = Math.abs(minor); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  keep(gone) { this.setState({ gone }); try { window.sessionStorage.setItem(DEL, JSON.stringify(gone)); } catch (e) {} }
  say(toast, undoId) { this.timers.forEach(clearTimeout); this.timers = [setTimeout(() => this.setState({ toast: '', undoId: null }), 5300)]; this.setState((s) => ({ toast, undoId: undoId || null, tk: s.tk + 1 })); }
  learned() { return this.state.L || (this.props.learned && this.props.learned.topics ? this.props.learned : { on: true, topics: { coffee: 3, rent: 2, split: 1 }, recent: [] }); }
  setLearned(L) { this.setState({ L }); if (typeof this.props.onLearn === 'function') this.props.onLearn(L); }
  seeds() {
    const eg = this.eg(), T = (a, b) => (eg ? b : a), k = eg ? 3 : 1, cur = eg ? 'ج.م' : 'ر.س', m = (x) => this.whole(x * k) + '\u00A0' + cur;
    const bank = T('مصرف الراجحي', 'البنك الأهلي المصري'), rent = T('سجّل الإيجار ', 'سجّل الإيجار ') + this.whole(250000 * k);
    return [
      ['h1', 'today', T('٩:٢٠ ص', '٩:٢٠ ص'), T('كم صرفت على القهوة؟', 'صرفت كام على القهوة؟'), T('القهوة هذا الشهر ' + m(64000) + ' في ٦ مرات — أعلى من معتادك (' + m(48000) + '). بهذا المعدل قد تتأخر خطة «السفر».', 'القهوة الشهر ده ' + m(64000) + ' في ٦ مرات — أعلى من العادي (' + m(48000) + '). بالمعدل ده خطة «السفر» ممكن تتأخر.')],
      ['h2', 'yday', T('٨:٤٥ م', '٨:٤٥ م'), T('كم لي عند خالد؟', 'ليّا كام عند خالد؟'), T('لك عند خالد ' + m(50000) + ' من سلفة قبل ٤٤ يومًا، بلا موعد.', 'ليك عند خالد ' + m(50000) + ' من سلفة من ٤٤ يوم، من غير ميعاد.')],
      ['h3', 'week', T('الأحد', 'الحد'), T('قسّم فاتورة العشاء مع أحمد', 'قسّم فاتورة العشا مع أحمد'), T('قسمت ' + m(37000) + ' بينك وبين أحمد: على أحمد ' + m(18500) + '، ويظهر في «لك».', 'قسمت ' + m(37000) + ' بينك وبين أحمد: أحمد عليه ' + m(18500) + '، وهيبان في «ليك».')],
      ['h4', 'week', 'السبت', T('هل أنا على الخطة؟', 'أنا ماشي على الخطة؟'), T('أنت على الخطة تقريبًا، لكن «القهوة» أعلى من معتادها هذا الشهر.', 'إنت ماشي على الخطة تقريبًا، بس «القهوة» أعلى من العادي الشهر ده.')],
      ['h5', 'old', '٢٤ سبتمبر', T('أين أغيّر القفل؟', 'فين أغيّر القفل؟'), 'القفل في «المزيد ← الإعدادات ← القفل».'],
      ['h6', 'old', '١ سبتمبر', rent, T('سُجّل إيجار سبتمبر ' + m(250000) + ' من ' + bank + '.', 'اتسجّل إيجار سبتمبر ' + m(250000) + ' من ' + bank + '.')],
      ['h7', 'old', '١ أغسطس', rent, T('سُجّل إيجار أغسطس ' + m(250000) + ' من ' + bank + '.', 'اتسجّل إيجار أغسطس ' + m(250000) + ' من ' + bank + '.')]
    ].map(([id, g, time, title, first]) => ({ id, g, time, title, first, msgs: [{ from: 'me', id: id + 'q', text: title }, { from: 'bot', id: id + 'a', text: first }] }));
  }
  renderVals() {
    const eg = this.eg(), T = (a, b) => (eg ? b : a), s = this.state, n = (x) => x.toLocaleString('ar-EG');
    const L = this.learned(), on = L.on !== false;
    const times = (x) => (x === 1 ? 'مرة واحدة' : x === 2 ? 'مرتين' : n(x) + (x <= 10 ? ' مرات' : ' مرة'));
    const forgot = L.forgot || [], forget = (id, t, text) => { const tp = Object.assign({}, L.topics); if (t) tp[t] = 0;
      this.setLearned(Object.assign({}, L, { forgot: id ? forgot.concat([id]) : forgot, topics: tp, recent: (L.recent || []).filter((r) => r !== t) })); this.say(T('حُذف: ', 'اتمسح: ') + text); };
    const facts = KNOWN[eg ? 'eg' : 'sa'].filter((f) => forgot.indexOf(f[0]) < 0).map(([id, text, src]) => ({ text, src, delLabel: T('احذف: ', 'امسح: ') + text, del: () => forget(id, null, text) }))
      .concat(Object.keys(L.topics || {}).filter((t) => FACT[t] && L.topics[t] > 0).sort((a, b) => L.topics[b] - L.topics[a]).slice(0, 3)
        .map((t) => { const text = eg ? FACT[t][1] : FACT[t][0]; return { text, src: 'سألت ' + times(L.topics[t]), delLabel: T('احذف: ', 'امسح: ') + text, del: () => forget(null, t, text) }; }));
    const ses = (Array.isArray(this.props.sessions) ? this.props.sessions : []).filter((c) => c && c.id && Array.isArray(c.msgs))
      .map((c) => ({ id: c.id, g: 'today', time: T('الآن', 'دلوقتي'), title: c.title, first: c.first, msgs: c.msgs }));
    const ids = ses.map((c) => c.id), q = s.q.trim();
    const all = ses.concat(this.seeds().filter((c) => ids.indexOf(c.id) < 0)).filter((c) => s.gone.indexOf(c.id) < 0)
      .filter((c) => !q || (c.title + ' ' + c.first).indexOf(q) >= 0);
    const G = [['today', T('اليوم', 'النهارده')], ['yday', T('أمس', 'امبارح')], ['week', T('هذا الأسبوع', 'الأسبوع ده')], ['old', 'أقدم']];
    const groups = G.map(([g, label]) => {
      const rows = all.filter((c) => c.g === g);
      return { label, rows: rows.map((c, i) => ({
        title: c.title, first: c.first, time: c.time, isCurrent: c.id === this.props.current,
        rowStyle: 'display: flex; align-items: center; gap: 2px;' + (i === rows.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);'),
        open: () => { if (typeof this.props.onOpen === 'function') this.props.onOpen({ id: c.id, msgs: c.msgs }); else this.say(T('فُتحت «', 'اتفتحت «') + c.title + '»'); },
        del: () => { this.keep(s.gone.concat([c.id])); this.say(T('حُذفت «', 'اتمسحت «') + c.title + '»', c.id); if (typeof this.props.onDeleted === 'function') this.props.onDeleted(c.id); },
        delLabel: T('احذف «', 'امسح «') + c.title + '»'
      })) };
    }).filter((g) => g.rows.length);
    return {
      baseStyle: 'position: absolute; inset: 0; background: ' + (typeof this.props.onClose === 'function' ? 'transparent' : 'radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)'),
      title: 'سجل المحادثات', closeLabel: T('إغلاق السجل', 'اقفل السجل'),
      closeIt: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      searchHint: T('ابحث في محادثاتك', 'دوّر في محادثاتك'), q: s.q, typeQ: (e) => this.setState({ q: e.target.value }),
      showLearn: !q, learnTitle: T('ما تعلّمته عنك', 'اللي اتعلمته عنك'), facts,
      // قرار المالك ٢٠٢٦-١٠-٠٩: «مع حسابي» — اللي اتعلمه والسجل بيتزامنوا وبيوصلوا لأي موبايل
      syncNote: T('ما تعلّمته وسجل محادثاتك محفوظان مع حسابك، ويصلان معك إلى أي جهاز.', 'اللي اتعلمته وسجل محادثاتك محفوظين مع حسابك، وبيوصلوا معاك لأي موبايل.'), noFacts: facts.length === 0,
      noFactsText: T('لم أتعلّم شيئًا عنك بعد.', 'لسه ما اتعلمتش حاجة عنك.'),
      switchTitle: T('التعلّم من أسئلتي', 'يتعلّم من أسئلتي'),
      switchSub: on ? T('أرتّب الاقتراحات حسب ما تسأل عنه', 'برتّب الاقتراحات حسب اللي بتسأل عنه') : T('متوقف — الاقتراحات حسب الصفحة فقط', 'واقف — الاقتراحات حسب الصفحة بس'),
      onAttr: on ? 'true' : 'false',
      track: 'position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; ' + (on ? 'background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 2px rgba(0,47,48,0.25)' : 'background: rgba(25,61,51,0.16); box-shadow: inset 0 1px 2px rgba(25,61,51,0.12)'),
      knob: 'position: absolute; top: 2px; right: ' + (on ? 20 : 2) + 'px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(16,45,53,0.22)',
      toggle: () => { this.setLearned(Object.assign({}, L, { on: !on })); this.say(on ? T('أوقفت التعلّم من أسئلتك', 'وقفت التعلّم من أسئلتك') : T('عاد التعلّم من أسئلتك', 'رجع التعلّم من أسئلتك')); },
      askClear: s.askClear, showClearBtn: !s.askClear,
      clearLabel: T('امسح ما تعلّمته', 'امسح اللي اتعلمته'),
      clearStyle: 'align-self: flex-start; height: 44px; border: 0; padding: 0 14px; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #BE3D48; background: rgba(255,255,255,0.75); cursor: ' + (facts.length ? 'pointer' : 'default') + '; opacity: ' + (facts.length ? 1 : 0.45),
      startClear: () => { if (facts.length) this.setState({ askClear: true }); },
      clearQ: T('تمسح كل ما تعلّمته عنك؟ المحادثات نفسها تبقى.', 'تمسح كل اللي اتعلمته عنك؟ المحادثات نفسها هتفضل.'),
      clearYes: T('امسح', 'امسح'), clearNo: T('إلغاء', 'لأ'),
      doClear: () => { this.setLearned({ on, topics: {}, recent: [], forgot: ['pay', 'shop', 'ppl', 'goal'] }); this.setState({ askClear: false }); this.say(T('مُسح ما تعلّمته عنك', 'اتمسح اللي اتعلمته عنك')); },
      cancelClear: () => this.setState({ askClear: false }),
      groups, currentTag: T('الحالية', 'الحالية'),
      empty: groups.length === 0, emptyText: q ? T('لا توجد محادثات بهذا البحث.', 'مفيش محادثات بالبحث ده.') : T('لا توجد محادثات بعد.', 'لسه مفيش محادثات.'),
      hasToast: !!s.toast, toast: s.toast, canUndo: !!s.undoId, undoLabel: T('تراجع', 'رجّعها'),
      undo: () => { if (!s.undoId) return; this.keep(s.gone.filter((x) => x !== s.undoId)); this.say(T('رجعت المحادثة', 'المحادثة رجعت')); }
    };
  }
}
</script>
</body>
</html>
