<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-skel{animation:m-pulse 1.4s cubic-bezier(.2,.7,.3,1) infinite alternate}
@keyframes m-pulse{from{opacity:.5}to{opacity:1}}
.s-sheen{position:absolute;top:0;bottom:0;left:100%;width:60%;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(166,222,193,0.75) 50%,transparent 70%);animation:s-sheen 1200ms cubic-bezier(.3,.7,.4,1) 250ms both}

.s-in{animation:s-in 450ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes s-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.s-veil{animation:s-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.s-up{animation:s-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.s-toast{animation:s-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
@keyframes s-fade{from{opacity:0}to{opacity:1}}
@keyframes s-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes s-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.s-sheen{display:none}.m-press{transition:none}.m-press:active{transform:none}.m-skel{animation:none}.s-in,.s-up{animation:s-fade 150ms both}}

</style>
</helmet>

            </div>
          </sc-for>

  <sc-if value="{{catOpen}}" hint-placeholder-val="{{ false }}">

      <div role="dialog" aria-modal="true" aria-label="{{catTitle}}" class="s-up" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">

      <div role="status" class="s-toast" style="max-width: 330px; padding: 12px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(25,61,51,0.92); box-shadow: 0 14px 30px rgba(16,45,53,0.25)">{{toast}}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","فاضي","بيحمّل","خطأ","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>

        { id: 'a', name: 'مطعم الريف', cat: 'food', amt: 4200, t: '١٢:٤٠ م', st: 'ok', sheen: true },
        { id: 'b', name: 'سوبرماركت الحي', cat: 'shop', amt: 31840, t: '١٠:١٥ ص', st: 'sug' },

        { id: 'd', name: 'محطة وقود', cat: 'car', amt: 9000, t: '٨:٣٠ ص', st: 'ok' }

      cat: null, toast: '', toastKey: 0

  renderVals() {
    const st = this.props.state ?? 'عادي';
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const C = {
      food: [eg ? 'أكل وقهوة' : 'مطاعم وقهوة', '#A36A21', 'rgba(163,106,33,0.12)'], shop: [eg ? 'بقالة' : 'بقالة وسوبرماركت', '#3866A7', 'rgba(56,102,167,0.12)'],
      car: ['بنزين', '#4D747C', 'rgba(77,116,124,0.12)'], bake: [eg ? 'عيش وحلويات' : 'مخبوزات', '#A55060', 'rgba(165,80,96,0.12)'],

      statusTitle: status[0], statusBody: status[1],

      cats, askPick: true,
      closeCat: () => this.setState({ cat: null }),
      hasToast: !!this.state.toast, toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
