    const active = all.filter((p) => !p.archived).map((p) => { const m = sum(p); return {
      name: p.name, kind: KIND[p.kind], question: Q[p.kind], big: p.ops.length ? big(p, m) : '—', line: statLine(m, p), when: when(p.deadline),
      bigStyle: 'font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: ' + (p.ops.length ? bigColor(p, m) : '#637570'),
      kindStyle: 'flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; ' + (p.kind === 'work' ? 'color: #2469BA; background: rgba(36,105,186,0.10)' : 'color: #08634F; background: #DCEBD6'),
      approx: m.unsure > 0, approxText: 'تقريبي · ' + plural(m.unsure, eg ? ['عملية واحدة', 'عمليتين', 'عمليات', 'عملية'] : ['عملية واحدة', 'عمليتان', 'عمليات', 'عملية']) + (eg ? ' مستنية تأكيد النوع' : ' بانتظار تأكيد النوع'),
      card: 'border: 0; width: 100%; font: inherit; color: inherit; text-align: right; cursor: pointer; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)',
      open: () => this.setState({ open: p.id }) }; });
    const archived = all.filter((p) => p.archived).map((p) => { const m = sum(p); return { name: p.name,
      line: KIND[p.kind] + ' · ' + Q[p.kind] + ' ' + (p.ops.length ? big(p, m) : '—'),
      restore: () => { this.patch(p.id, { archived: false }); this.say(eg ? '«' + p.name + '» رجع للنشطة' : 'عاد «' + p.name + '» إلى النشطة'); } }; });
    const cp = s.open ? all.find((p) => p.id === s.open) : null;
    const cm = cp ? sum(cp) : null;
    // نافذة الإنشاء (أول سؤال: شخصي ولا شغل) والتعديل (الاسم والميعاد)
    const nm = s.fName.trim();
    const dup = nm && all.some((p) => p.name === nm && (!cp || s.sheet !== 'edit' || p.id !== cp.id));
    const err = dup ? (eg ? 'فيه مشروع بنفس الاسم.' : 'يوجد مشروع بالاسم نفسه.') : '';
    const cantSave = !nm || !!err;
    return {
      spaceName: eg ? 'مصر' : 'السعودية',
      title: 'المشاريع', newLabel: eg ? 'مشروع جديد' : 'مشروع جديد',
      intro: eg ? 'المشروع علامة زيادة على العملية: تصنيفها زي ما هو، ومفيش مجموع عام بيتغير.' : 'المشروع وسم إضافي: تبقى العملية بتصنيفها، ولا يتغير أي مجموع عام.',
      inList: !cp, inDetail: !!cp,
      isEmpty: !active.length, emptyTitle: eg ? 'مفيش مشاريع' : 'لا مشاريع بعد',
      emptyBody: eg ? 'سفرية أو تجهيز أو شغلانة جنب: اعمل مشروع واعرف كلّفك كام أو كسبت كام.' : 'رحلة أو تجهيز أو عمل جانبي: أنشئ مشروعًا لتعرف كم كلّفك أو كم كسبت.',
      active, archived, hasArchived: archived.length > 0, archOpen: s.archOpen,
      archTitle: (eg ? 'المؤرشفة (' : 'المؤرشفة (') + n(archived.length) + ')',
      archChev: 'flex-shrink: 0; transform: rotate(' + (s.archOpen ? 180 : 0) + 'deg)',
      toggleArch: () => this.setState({ archOpen: !s.archOpen }),
      restoreLabel: eg ? 'رجّعه' : 'إرجاع',
      archNote: eg ? 'المؤرشف مقفول: قواعده واقفة، ومفيش مسح.' : 'المؤرشف مغلق: قواعده متوقفة، ولا حذف.',
      toListLabel: eg ? 'رجوع للمشاريع' : 'رجوع إلى المشاريع',
      closeDetail: () => this.setState({ open: null }),
      dName: cp ? cp.name : '', dSub: cp ? KIND[cp.kind] + ' · ' + (cp.deadline ? (eg ? 'لحد ' : 'حتى ') + when(cp.deadline).split(' · ')[0] : when('')) : '',
      detail: cp ? Object.assign({}, cp, { approxOn, out: cm.out, inn: cm.inn, net: cm.net, unsure: cm.unsure }) : null,
      onChange: this.onChange,
      editLabel: eg ? 'عدّل الاسم والميعاد' : 'تعديل الاسم والموعد',
      openEdit: () => cp && this.setState({ sheet: 'edit', kind: cp.kind, fName: cp.name, fDate: cp.deadline }),
      archiveLabel: eg ? 'أرشف المشروع' : 'أرشفة المشروع',
      archive: () => { if (!cp) return; this.patch(cp.id, { archived: true }); this.setState({ open: null }); this.say(eg ? 'اتأرشف «' + cp.name + '» — مفيش حاجة اتمسحت' : 'أُرشف «' + cp.name + '» — لم يُحذف شيء'); },
      sheetOpen: !!s.sheet, askKind: s.sheet === 'new' && !s.kind, askName: !!s.sheet && !!s.kind,
      sheetTitle: s.sheet === 'edit' ? (eg ? 'تعديل المشروع' : 'تعديل المشروع') : !s.kind ? (eg ? 'المشروع ده شخصي ولا شغل؟' : 'هل المشروع شخصي أم عمل؟') : (eg ? 'مشروع جديد' : 'مشروع جديد'),
      kinds: ['personal', 'work'].map((key) => ({ name: KIND[key], q: Q[key],
        ex: key === 'personal' ? (eg ? 'فرح، سفر، تجهيز بيت — اللي جالك بيقلل الكلفة' : 'زواج، سفر، تجهيز منزل — الوارد يُنقص الكلفة') : (eg ? 'عميل، بارت تايم، شغلانة جنب — الصافي ممكن يطلع بالسالب' : 'عميل، دوام جزئي، عمل جانبي — الصافي قد يكون سالبًا'),
        pick: () => this.setState({ kind: key }) })),
      kindChosen: s.kind ? KIND[s.kind] + ' · ' + Q[s.kind] : '',
      nameLabel: 'الاسم', namePh: eg ? 'مثلًا: سفرية العيد' : 'مثلًا: رحلة العيد', fName: s.fName,
      typeName: (e) => this.setState({ fName: String(e.target.value || '').slice(0, 60) }),
      hasErr: !!err, err,
      nameStyle: 'height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; color: #193D33; outline: none; background: ' + (err ? 'rgba(190,61,72,0.06); box-shadow: inset 0 0 0 1.5px rgba(190,61,72,0.45)' : 'rgba(25,61,51,0.05)'),
      dateLabel: eg ? 'آخر ميعاد (اختياري)' : 'آخر موعد (اختياري)', fDate: s.fDate,
      typeDate: (e) => this.setState({ fDate: /^\d{4}-\d{2}-\d{2}$/.test(String(e.target.value)) ? e.target.value : '' }),
      dateNote: eg ? 'لو حطيته، المشروع بيظهر في التقويم يومها.' : 'إن حدّدته يظهر المشروع في التقويم يومها.',
      cantSave, saveLabel: s.sheet === 'edit' ? (eg ? 'احفظ' : 'احفظ') : (eg ? 'اعمل المشروع' : 'أنشئ المشروع'),
      saveStyle: 'height: 48px; margin-top: 4px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); ' + (cantSave ? 'opacity: 0.45; cursor: default' : 'cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)'),
      saveSheet: () => {
        if (cantSave || !s.kind) return;
        if (s.sheet === 'edit' && cp) { this.patch(cp.id, { name: nm, deadline: s.fDate }); this.setState({ sheet: null }); this.say(eg ? 'اتحفظ' : 'حُفظ'); return; }
        const id = 'n' + (all.length + 1);
        this.setState({ projects: all.concat([{ id, name: nm, kind: s.kind, deadline: s.fDate, archived: false, excluded: 0, rules: [], ops: [] }]), sheet: null, open: id });
        this.say(eg ? 'اتعمل «' + nm + '»' : 'أُنشئ «' + nm + '»');
      },
      openNew: () => this.setState({ sheet: 'new', kind: null, fName: '', fDate: '' }),
      closeSheet: () => this.setState({ sheet: null }),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
