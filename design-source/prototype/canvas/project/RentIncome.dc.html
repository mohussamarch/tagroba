<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإيجار كدخل — مصروفي</title>

</head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ri-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.ri-press:active{transform:scale(.97)}
.ri-in{animation:ri-in 300ms cubic-bezier(.2,.8,.2,1) both}
@keyframes ri-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ri-press{transition:none}.ri-press:active{transform:none}.ri-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: #EFF3ED">
  <sc-if value="{{isSuggest}}" hint-placeholder-val="{{ false }}">
    <span style="font-size: 13px; font-weight: 700; color: #637570">{{sugCap}}</span>
    <div class="ri-in" style="border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px rgba(8,99,79,0.25)">
      <span style="font-size: 16px; font-weight: 700">{{sugTitle}}</span>
      <span style="font-size: 13px; color: #637570">{{sugWhy}}</span>
      <div style="display: flex; gap: 8px"><button type="button" class="ri-press" onClick="{{sugYes}}" style="flex: 1.4 1 0; height: 46px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">{{sugYesLabel}}</button><button type="button" class="ri-press" style="flex: 1 1 0; height: 46px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.06)">{{sugNoLabel}}</button></div>
    </div>
    <span style="font-size: 13px; font-weight: 700; color: #637570; padding-top: 6px">{{homeCap}}</span>
    <div style="border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: #FBF0DD"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: #956000"></span><span style="flex: 1 1 auto; font-size: 13px; font-weight: 700; color: #6B4600">{{homeAlert}}</span><span style="font-size: 12px; font-weight: 700; color: #08634F">{{homeGo}}</span></div>
  </sc-if>

  <sc-if value="{{isPage}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 6px; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">
      <span style="font-size: 13px; color: #DCEBD6">{{kind}}</span>
      <span style="font-size: 20px; font-weight: 700">{{name}}</span>
      <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #DCEBD6">{{tenant}}</span><span style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">{{rent}}</span></span>
      <span style="font-size: 12px; color: #DCEBD6">{{yearLine}}</span>
    </div>
    <div style="border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF">
      <span style="font-size: 13px; font-weight: 700; color: #637570">{{everyCap}}</span>
      <div role="radiogroup" aria-label="{{everyCap}}" style="display: flex; gap: 8px"><sc-for list="{{everys}}" as="e" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{e.on}}" class="ri-press" onClick="{{e.pick}}" style="{{e.style}}">{{e.label}}</button></sc-for></div>
    </div>
    <div style="border-radius: 22px; padding: 6px 14px; display: flex; flex-direction: column; background: #FFFFFF">
      <span style="font-size: 13px; font-weight: 700; color: #637570; padding: 8px 0 4px">{{monthsCap}}</span>
      <sc-for list="{{months}}" as="m" hint-placeholder-count="6">
        <div style="{{m.row}}">
          <span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{m.name}}</span><span style="font-size: 12px; color: #637570">{{m.sub}}</span></span>
          <span style="{{m.tagStyle}}">{{m.tag}}</span>
          <sc-if value="{{m.canPay}}" hint-placeholder-val="{{ false }}"><a href="LinkPay.dc.html" class="ri-press" style="min-height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #08634F; text-decoration: none; background: rgba(8,99,79,0.08)">{{payLabel}}</a></sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["صفحة الإيجار","الاقتراح والتنبيه"],"default":"صفحة الإيجار","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"مصر","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// الإيجار كدخل (بند 8 · طلب المالك + منطق 2026-10-22): مصدر دخل «إيجار …» مربوط بعقار، كل شهر يتعلّم «تم الدفع» لما تحويل أو كاش يتربط بيه
// الاقتراح: تحويل بنفس المبلغ من نفس الشخص كل شهر ⇐ «شكلها إيجار؟» · التنبيه في الرئيسية: الشهر عدّى ميعاده وما اتربطش. الإيجار يومي أو شهري أو سنوي. الأرقام مخترعة
const fmt = (m) => { const a = Math.abs(m), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { every: 'month' }; }
  renderVals() {
    const eg = (this.props.space ?? 'مصر') === 'مصر', T = (sa, e) => (eg ? e : sa), s = this.state;
    const money = (m) => (eg ? '⁦' + fmt(m) + '⁩ ج.م' : '⁦⃁ ' + fmt(m) + '⁩');
    const R = eg ? 800000 : 350000;
    const unit = { day: T('يوميًا', 'في اليوم'), month: T('شهريًا', 'في الشهر'), year: T('سنويًا', 'في السنة') }[s.every];
    const amt = s.every === 'day' ? (eg ? 27000 : 12000) : s.every === 'year' ? R * 12 : R;
    const chip = (on) => 'flex: 1 1 0; height: 44px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const M = [['أكتوبر', 'late'], ['سبتمبر', 'paid', 'تحويل · 2 سبتمبر'], ['أغسطس', 'paid', 'كاش · 1 أغسطس'], ['يوليو', 'paid', 'تحويل · 3 يوليو'], ['يونيو', 'paid', 'تحويل · 1 يونيو']];
    const tag = { paid: [T('تم الدفع', 'تم الدفع'), '#13764D', '#DCEBD6'], late: [T('متأخر', 'متأخر'), '#B0466A', 'rgba(176,70,106,0.10)'] };
    return {
      isPage: (this.props.view ?? 'صفحة الإيجار') === 'صفحة الإيجار', isSuggest: this.props.view === 'الاقتراح والتنبيه',
      kind: T('مصدر دخل · إيجار', 'مصدر دخل · إيجار'), name: T('شقة العليا', 'شقة المعادي'), tenant: T('المستأجر: أحمد', 'المستأجر: أحمد'),
      rent: money(amt) + ' ' + unit, yearLine: T('هذا العام: ', 'السنة دي: ') + money(R * 9) + T(' من ', ' من ') + money(R * 10),
      everyCap: T('الإيجار', 'الإيجار'),
      everys: [['day', T('يومي', 'يومي')], ['month', T('شهري', 'شهري')], ['year', T('سنوي', 'سنوي')]].map(([id, label]) => ({ label, on: s.every === id ? 'true' : 'false', style: chip(s.every === id), pick: () => this.setState({ every: id }) })),
      monthsCap: T('الشهور', 'الشهور'), payLabel: T('سجّل الدفع', 'سجّل الدفع'),
      months: M.map(([name, st, how], i) => ({ name, sub: st === 'late' ? T('موعده 1 أكتوبر', 'ميعاده 1 أكتوبر') : how, tag: tag[st][0], canPay: st === 'late',
        tagStyle: 'font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 9px; color: ' + tag[st][1] + '; background: ' + tag[st][2],
        row: 'display: flex; align-items: center; gap: 8px; min-height: 56px; ' + (i < M.length - 1 ? 'border-bottom: 1px solid rgba(204,216,204,0.55)' : '') })),
      sugCap: T('في مصادر الدخل', 'في مصادر الدخل'), sugTitle: T('يبدو أنه إيجار؟', 'شكلها إيجار؟'),
      sugWhy: T('تحويل ', 'تحويل ') + money(R) + T(' من «أحمد» كل شهر قرب يوم 1', ' من «أحمد» كل شهر قرب يوم 1'),
      sugYesLabel: T('نعم، إيجار', 'أيوه، إيجار'), sugNoLabel: T('لا', 'لأ'), sugYes: () => {},
      homeCap: T('في الرئيسية', 'في الرئيسية'), homeAlert: T('إيجار أكتوبر لم يصل', 'إيجار أكتوبر لسه ما وصلش'), homeGo: T('افتح', 'افتح')
    };
  }
}
</script>
</body>
</html>
