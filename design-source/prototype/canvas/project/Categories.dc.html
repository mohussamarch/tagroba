<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>التصنيفات — مصروفي</title>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-row:active{background:#DCEBD6}
.c-chev{transition:transform 320ms cubic-bezier(.18,.9,.28,1.08)}
.c-tile{transition:background 160ms cubic-bezier(.2,.7,.3,1),color 160ms cubic-bezier(.2,.7,.3,1)}
.m-in{animation:m-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes m-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.c-veil{animation:c-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.c-up{animation:c-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.c-toast{animation:c-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
@keyframes c-fade{from{opacity:0}to{opacity:1}}
@keyframes c-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes c-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.m-press,.c-chev,.c-tile{transition:none}.m-press:active{transform:none}.m-in{animation:none}.c-up{animation:c-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>

      <a href="More.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{title}}</h1>
    </div>
    <span style="font-size: 13px; color: #637570">{{intro}}</span>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FBF0DD; color: #6B4600">
        <span style="font-size: 14px; font-weight: 700; color: #956000">{{errTitle}}</span>
        <span style="font-size: 13px">{{errBody}}</span>
        <button type="button" class="m-press" onClick="{{retry}}" style="align-self: flex-start; height: 44px; padding: 0 16px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(255,255,255,0.8)">{{retryLabel}}</button>

    <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #637570"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.ic}}"></path></svg>{{g.name}}</h2>
            <div style="border-radius: 22px; padding: 4px 8px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
              <sc-for list="{{g.mains}}" as="m" hint-placeholder-count="3">
                <div style="{{m.wrap}}">
                  <div style="display: flex; align-items: center; gap: 2px">
                    <button type="button" class="m-press" onClick="{{m.toggle}}" aria-expanded="{{m.open}}" style="flex: 1 1 auto; min-width: 0; min-height: 60px; border: 0; padding: 0 8px; border-radius: 16px; background: transparent; font: inherit; color: inherit; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 12px">
                      <span class="c-tile" aria-hidden="true" style="{{m.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.ic}}"></path></svg></span>
                      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{m.name}}</span><span style="font-size: 12px; color: #637570">{{m.sub}}</span></span>
                      <svg class="c-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{m.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
                    </button>
                    <button type="button" class="m-press" onClick="{{m.edit}}" aria-label="{{m.editLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #08634F; background: rgba(8,99,79,0.06)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497zM15 5l4 4"></path></svg></button>
                  </div>
                  <sc-if value="{{m.open}}" hint-placeholder-val="{{ false }}">
                    <div class="m-in" style="display: flex; flex-direction: column; gap: 2px; padding: 0 28px 10px 0">
                      <sc-for list="{{m.subs}}" as="sb" hint-placeholder-count="3">
                        <button type="button" class="m-press m-row" onClick="{{sb.edit}}" aria-label="{{sb.editLabel}}" style="min-height: 48px; border: 0; padding: 0 8px; border-radius: 14px; background: transparent; font: inherit; color: inherit; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 10px">

                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#637570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497zM15 5l4 4"></path></svg>

</div>

        why: where + (c.active ? REQ[c.req] : (eg ? 'إنت اللي خفيته' : 'أخفيته بنفسك')),
        canShow: !c.active, show: () => this.flag(c.id, true),
        row: 'display: flex; align-items: center; gap: 10px; min-height: 60px;' + (i === arr.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);')
      };
    });
    // بيانات اللوحة (CategoryEditSheet)
    const e = s.edit, cur = e && e.id ? byId[e.id] : null;
    const parentId = e ? (cur ? cur.parent : e.parent) : null;
    const usedHsl = mainsAll.map((c) => String(c.hsl));
    const SW = [[2, 70, 44], [22, 78, 46], [40, 90, 38], [60, 80, 28], [85, 65, 30], [135, 55, 34], [158, 65, 30], [174, 70, 29], [190, 80, 33], [210, 70, 42], [250, 55, 50], [268, 40, 40], [285, 50, 48], [305, 50, 42], [322, 62, 40], [340, 65, 48], [200, 22, 32], [210, 8, 45]];
    const sheetData = e ? {
      mode: e.mode, id: cur ? cur.id : null, name: cur ? cur.name : '', icon: cur ? cur.icon : '',
      hsl: cur && !cur.parent ? cur.hsl : (SW.find((x) => usedHsl.indexOf(String(x)) < 0) || SW[0]),
      group: cur ? (cur.parent ? byId[cur.parent].group : cur.group) : 'personal',
      parent: parentId, hasSubs: !!(cur && !cur.parent && kids(cur.id).length), active: cur ? cur.active : true,
      subIndex: cur && cur.parent ? kids(cur.parent).indexOf(cur) : (parentId ? kids(parentId).length : 0),
      mains: mainsAll.filter((c) => vis(c) && (!cur || c.id !== cur.id)).map((c) => ({ id: c.id, name: c.name, hsl: c.hsl, group: c.group })),
      groups: G.map(([key, sa, egn]) => ({ key, name: eg ? egn : sa })),
      taken: cats.filter((c) => !cur || c.id !== cur.id).map((c) => c.name.trim())
    } : null;
    return {
      spaceName: eg ? 'مصر' : 'السعودية',
      title: 'التصنيفات',
      intro: eg ? 'مجموعة ← تصنيف أساسي ← فرعي. لون الفرعي درجة من لون أبوه.' : 'مجموعة ← تصنيف رئيسي ← فرعي. لون الفرعي درجة من لون رئيسه.',
      isError: isErr, showList: !isErr,
      errTitle: eg ? 'التصنيفات ما اتحمّلتش' : 'تعذّر تحميل التصنيفات',
      errBody: eg ? 'الأرقام والعمليات زي ما هي. جرّب تاني.' : 'الأرقام والعمليات كما هي. أعد المحاولة.',
      retryLabel: eg ? 'جرّب تاني' : 'أعد المحاولة', retry: () => this.setState({ loaded: true }),
      groups, addSubLabel: eg ? 'فرعي جديد' : 'فرع جديد',
      hasHidden: hidden.length > 0, hidden,
      hiddenTitle: 'المخفية',
      hiddenIntro: eg ? 'مش بتظهر وإنت بتختار تصنيف. اللي ليه شرط بيظهر لوحده لما تجاوب سؤاله في ملفك.' : 'لا تظهر عند اختيار التصنيف. ما له شرط يظهر وحده عندما تجيب عن سؤاله في ملفك.',
      showLabel: eg ? 'اظهره' : 'إظهار',
      addMainLabel: eg ? 'تصنيف أساسي جديد' : 'تصنيف رئيسي جديد',
      addMain: () => open('new-main'),
      rulesLink: eg ? 'القواعد والتجار' : 'القواعد والتجار',
      rulesHint: eg ? 'إزاي العمليات بتاخد تصنيفها لوحدها' : 'كيف تأخذ العمليات تصنيفها تلقائيًا',
      editing: !!e, sheetData, onSave: this.onSave, onHide: this.onHide,
      sheetLabel: e && e.mode === 'edit' ? (eg ? 'تعديل تصنيف' : 'تعديل تصنيف') : (eg ? 'تصنيف جديد' : 'تصنيف جديد'),
      closeSheet: () => this.setState({ edit: null }),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
