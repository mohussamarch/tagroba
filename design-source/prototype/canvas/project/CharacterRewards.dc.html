<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.r-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.r-press:active{transform:scale(.97)}
.r-in{animation:r-in 260ms cubic-bezier(.2,.7,.3,1) both}
@keyframes r-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.r-press{transition:none}.r-press:active{transform:none}.r-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 10px; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <span style="font-size: 12px; color: #637570; line-height: 1.6">{{intro}}</span>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <button type="button" class="r-press" onClick="{{it.pick}}" aria-pressed="{{it.on}}" aria-label="{{it.aria}}" style="{{it.style}}">
        <span style="{{it.thumb}}"><dc-import name="CharacterArt" look="{{it.look}}" mode="{{it.mode}}" size="{{72}}" hint-size="72px,72px"></dc-import>
          <sc-if value="{{it.locked}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(247,247,240,0.55)"><span style="width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: rgba(25,61,51,0.82)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span></span></sc-if>
        </span>
        <span style="font-size: 13px; font-weight: 700">{{it.name}}</span>
        <span style="{{it.chip}}">{{it.state}}</span>
        <span aria-hidden="true" style="width: 100%; height: 6px; border-radius: 3px; overflow: hidden; background: rgba(25,61,51,0.08)"><span style="{{it.bar}}"></span></span>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{hasInfo}}" hint-placeholder-val="{{ false }}">
    <div class="r-in" role="status" style="border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: rgba(183,121,31,0.10)">
      <span style="font-size: 14px; font-weight: 700">{{infoTitle}}</span>
      <span style="font-size: 13px; line-height: 1.6; color: #4F625C">{{infoBody}}</span>
      <a href="Investment.dc.html" class="r-press" style="align-self: flex-start; min-height: 36px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #08634F; text-decoration: none">{{infoLink}}</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":520}}'>
// مكافآت الكاركتر (طلب المالك 2026-10-16): «حجات معينة في اللبس يقدر يحطها بس لو معاها فلوس معينة او لو نجح في استثمار معين»، «زي مثلا طاقية لونها اخضر كبيرة عليها علامة الدولار (أن بقا غني يعني)»
// كل مكافأة: شرط فلوس (كل فلوسك أو استثماراتك توصل رقم) أو شرط استثمار (استثمار كسب نسبة) · المفتوحة: دوسة تلبسها ودوسة تقلعها · المقفولة: دوسة توريك الشرط وفاضلك قد إيه
// props: look (الشكل الحالي) · on-set({ key, value }) · الأرقام مخترعة بالهللة، وفي التطبيق جاية من حسابات الاستثمار (حالة استخدام) مش من الشاشة
// [المفتاح، القيمة، الاسم سعودي/مصري، نوع الشرط، الهدف سعودي/مصري، الشكل في المعاينة]
const R = [
  ['hat', 1, ['طاقية الغني', 'طاقية الغني'], 'net', [100000000, 1000000000], 'head'],
  ['glasses', 4, ['نظارة الذهب', 'نضارة الدهب'], 'gain', [2000, 2000], 'head'],
  ['bling', 1, ['سلسلة الذهب', 'سلسلة الدهب'], 'inv', [10000000, 100000000], 'bust'],
  ['outfit', 4, ['البشت', 'البشت'], 'net', [50000000, 500000000], 'bust']
];
// اللي معاك دلوقتي (نفس أرقام شاشة الاستثمار المخترعة): كل فلوسك · استثماراتك (أسهم + دهب) · أحسن مكسب لاستثمار (نقطة أساس)
const NOW = { sa: { net: 68666000, inv: 14156000, gain: 2300, gainName: 'الذهب' }, eg: { net: 493795000, inv: 81750000, gain: 4100, gainName: 'الدهب' } };
const withCur = (v, c) => (c === '\u20C1' ? '\u2066\u20C1\u00A0' + v + '\u2069' : v + ' ' + c); // رمز الريال الرسمي على شمال الرقم بمسافة (البنك المركزي السعودي) — الجنيه بعد الرقم زي ما هو
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { info: null }; }
  fmt(m) { const a = Math.abs(m); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a), cur = eg ? 'ج.م' : '\u20C1', N = eg ? NOW.eg : NOW.sa;
    const look = this.props.look && typeof this.props.look === 'object' ? this.props.look : {};
    const cond = (kind, target) => kind === 'net' ? T('حين يصل كل مالك إلى ', 'لما كل فلوسك توصل ') + withCur(this.fmt(target), cur) : kind === 'inv' ? T('حين تصل استثماراتك إلى ', 'لما استثماراتك توصل ') + withCur(this.fmt(target), cur) : T('حين يكسب أحد استثماراتك ', 'لما استثمار من استثماراتك يكسب ') + (target / 100) + T('% أو أكثر', '% أو أكتر');
    const info = R.find((r) => r[0] + r[1] === this.state.info);
    return {
      intro: T('حاجات تُفتح حين تصل لرقم معيّن أو ينجح استثمار — المفتوحة تلبسها بضغطة.', 'حاجات بتتفتح لما توصل لرقم معيّن أو استثمار ينجح — المفتوحة تلبسها بدوسة.'),
      items: R.map(([key, val, name, kind, tg, mode]) => {
        const target = eg ? tg[1] : tg[0], have = kind === 'gain' ? N.gain : N[kind], pct = Math.min(100, Math.floor((have * 100) / target)), open = have >= target, on = Number(look[key]) === val;
        const nm = key === 'outfit' && Number(look.gender) === 1 ? ['عباية مطرزة بالذهب', 'عباية مطرزة دهب'] : name;
        return { name: T(nm[0], nm[1]), locked: !open, on: on ? 'true' : 'false', mode, look: Object.assign({}, look, { [key]: val }),
          aria: T(nm[0], nm[1]) + ' — ' + (open ? (on ? T('تلبسها الآن', 'لابسها') : T('مفتوحة', 'مفتوحة')) : T('مقفلة ', 'مقفولة ') + pct + '%'),
          state: open ? (on ? T('تلبسها الآن ✓', 'لابسها ✓') : T('مفتوحة · البسها', 'مفتوحة · البسها')) : T('مقفلة · ', 'مقفولة · ') + pct + '%',
          pick: () => { if (!open) { this.setState({ info: this.state.info === key + val ? null : key + val }); return; } this.setState({ info: null }); if (typeof this.props.onSet === 'function') this.props.onSet({ key, value: on ? 0 : val }); },
          style: 'border: 0; padding: 10px 8px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 5px; font: inherit; color: #193D33; cursor: pointer; background: ' + (on ? '#DCEBD6' : 'rgba(255,255,255,0.8)') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #08634F' : 'inset 0 0 0 1px rgba(204,216,204,0.7)'),
          thumb: 'position: relative; width: 72px; height: 72px; border-radius: 36px; overflow: hidden; background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(227,239,230,0.70) 55%, rgba(201,230,212,0.80))',
          chip: 'font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; color: ' + (open ? '#08634F' : '#956000') + '; background: ' + (open ? 'rgba(8,99,79,0.10)' : '#FBF0DD'),
          bar: 'display: block; height: 6px; border-radius: 3px; width: ' + pct + '%; background: ' + (open ? '#13764D' : '#B7791F') };
      }),
      hasInfo: !!info,
      infoTitle: info ? T(info[2][0], info[2][1]) + T(' مقفلة', ' مقفولة') : '',
      infoBody: info ? (() => { const target = eg ? info[4][1] : info[4][0], have = info[3] === 'gain' ? N.gain : N[info[3]];
        return T('تُفتح ', 'بتتفتح ') + cond(info[3], target) + '. ' + (info[3] === 'gain' ? T('أفضل استثمار عندك الآن كسب ', 'أحسن استثمار عندك دلوقتي كسب ') + (have / 100) + '%.' : T('معك الآن ', 'معاك دلوقتي ') + withCur(this.fmt(have), cur) + T('، باقٍ ', '، فاضلك ') + withCur(this.fmt(target - have), cur) + '.'); })() : '',
      infoLink: T('شاهد استثماراتك ←', 'شوف استثماراتك ←')
    };
  }
}
</script>
</body>
</html>
