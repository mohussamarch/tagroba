<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رسائل بانتظار التأكيد — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.w-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.w-press:active{transform:scale(.97)}
.w-veil{animation:w-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.w-up{animation:w-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.w-in{animation:w-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes w-fade{from{opacity:0}to{opacity:1}}
@keyframes w-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes w-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.w-press{transition:none}.w-press:active{transform:none}.w-up,.w-in{animation:w-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; display: flex; flex-direction: column; gap: 10px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <span style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 15px; font-weight: 700">{{title}}</h2><span style="{{countStyle}}">{{countText}}</span></span>

  <sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
    <div class="w-in" style="border-radius: 18px; padding: 12px 14px; font-size: 13px; font-weight: 700; color: #08634F; background: #DCEBD6">{{doneText}}</div>
  </sc-if>

  <sc-if value="{{bankWaiting}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FBF0DD">
      <span style="font-size: 13px; font-weight: 700; color: #956000">{{bankTitle}}</span>
      <span style="font-size: 14px; color: #193D33">{{bankBody}}</span>
      <div style="border-radius: 14px; padding: 4px 12px; background: rgba(255,255,255,0.65)">
        <sc-for list="{{bankMsgs}}" as="m" hint-placeholder-count="2">
          <span style="{{m.style}}"><span>{{m.name}}</span><span dir="ltr" style="font-weight: 700; font-variant-numeric: tabular-nums">{{m.amount}}</span></span>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #6B4600">{{bankOnce}}</span>
      <button type="button" class="w-press" onClick="{{openSheet}}" style="height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.22)">{{pickWallet}}</button>
    </div>
  </sc-if>

  <sc-if value="{{dupWaiting}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <span style="font-size: 13px; font-weight: 700; color: #956000">{{dupTitle}}</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{dupSides}}" as="d" hint-placeholder-count="2">
          <span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 14px; background: rgba(25,61,51,0.04)">
            <span style="font-size: 11px; color: #637570">{{d.label}}</span>
            <span style="font-size: 14px; font-weight: 700">{{d.name}}</span>
            <span dir="ltr" style="text-align: right; font-size: 15px; font-weight: 700; color: #BE3D48; font-variant-numeric: tabular-nums">{{d.amount}}</span>
            <span style="font-size: 11px; color: #637570">{{d.when}}</span>
          </span>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #637570">{{dupWhy}}</span>
      <div style="display: flex; gap: 8px">
        <button type="button" class="w-press" onClick="{{dupSame}}" style="flex: 1 1 0; height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.06)">{{dupSameLabel}}</button>
        <button type="button" class="w-press" onClick="{{dupNew}}" style="flex: 1 1 0; height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">{{dupNewLabel}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{unclearWaiting}}" hint-placeholder-val="{{ true }}">
    <div style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
      <span style="font-size: 13px; font-weight: 700; color: #956000">{{unTitle}}</span>
      <span style="font-size: 13px; line-height: 1.7; padding: 10px 12px; border-radius: 14px; color: #637570; background: rgba(25,61,51,0.04)">{{unText}}</span>
      <span style="font-size: 12px; color: #637570">{{unWhy}}</span>
      <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
        <div class="w-in" style="display: flex; gap: 8px; align-items: center">
          <input type="text" inputmode="decimal" dir="ltr" aria-label="{{amountLabel}}" placeholder="0.00" value="{{amount}}" onInput="{{typeAmount}}" style="flex: 1 1 auto; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 18px; font-weight: 700; text-align: right; color: #193D33; background: rgba(25,61,51,0.06); outline: none">
          <button type="button" class="w-press" onClick="{{saveManual}}" disabled="{{cantSave}}" style="{{saveStyle}}">{{saveLabel}}</button>
        </div>
      </sc-if>
      <sc-if value="{{notTyping}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 8px">
          <button type="button" class="w-press" onClick="{{unDrop}}" style="flex: 1 1 0; height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.06)">{{unDropLabel}}</button>
          <button type="button" class="w-press" onClick="{{unType}}" style="flex: 1 1 0; height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.10)">{{unTypeLabel}}</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="w-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{sheetTitle}}" class="w-up" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
        <span style="font-size: 17px; font-weight: 700">{{sheetTitle}}</span>
        <span style="font-size: 13px; color: #637570">{{sheetBody}}</span>
        <div role="radiogroup" aria-label="{{sheetTitle}}" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{wallets}}" as="w" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{w.checked}}" class="w-press" onClick="{{w.pick}}" style="{{w.style}}">
              <span style="flex: 1 1 auto; display: flex; flex-direction: column; text-align: right"><span style="font-size: 15px; font-weight: 700">{{w.name}}</span><span style="font-size: 12px; color: #637570">{{w.sub}}</span></span>
              <span aria-hidden="true" style="{{w.dot}}"></span>
            </button>
          </sc-for>
        </div>
        <button type="button" class="w-press" onClick="{{saveWallet}}" disabled="{{noWallet}}" style="{{walletSaveStyle}}">{{walletSave}}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bank: 'wait', dup: 'wait', unclear: 'wait', amount: '', sheet: false, wallet: null };
  }
  fmt(minor) { const f = minor % 100; return String((minor - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  toMinor(text) {
    const t = String(text || '').replace(/[^0-9.]/g, '');
    if (!t) return null;
    const [w, f = ''] = t.split('.');
    return parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  }
  record(rows, msg) { if (typeof this.props.onRecord === 'function') this.props.onRecord(rows, msg); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const k = eg ? 3 : 1, cur = eg ? 'ج.م' : 'ر.س';
    // مخترعة: بنك وهمي باسم «بنك الواحة» · المبالغ بالوحدة الصغرى
    const bankName = 'بنك الواحة';
    const msgs = [
      { id: 'w1', name: eg ? 'مكتبة الفجر' : 'مكتبة الفجر', cat: 'shop', amt: 4500 * k, t: '١:٣٠ م' },
      { id: 'w2', name: eg ? 'كافيه المرسى' : 'مقهى المرسى', cat: 'food', amt: 2300 * k, t: '١:١٢ م' }
    ];
    const dupRow = { id: 'dp', name: eg ? 'كافيه الشاطئ' : 'مقهى الشاطئ', cat: 'food', amt: 1800 * k, t: '١:٠٥ م' };
    const s = this.state;
    const n = (s.bank === 'wait' ? 2 : 0) + (s.dup === 'wait' ? 1 : 0) + (s.unclear !== 'gone' ? 1 : 0);
    const minor = this.toMinor(s.amount);
    const okAmount = minor != null && minor > 0;
    const walletDefs = [
      ['salary', eg ? 'حساب المرتب' : 'حساب الراتب', eg ? 'بنك · رسايله بتتسجل فيه' : 'بنك · تُسجَّل فيه رسائله'],
      ['saving', eg ? 'حساب التوفير' : 'حساب التوفير', 'بنك'],
      ['new', (eg ? 'محفظة جديدة: ' : 'محفظة جديدة: ') + bankName, eg ? 'نعملها دلوقتي برصيد «غير معروف»' : 'تُنشأ الآن برصيد «غير معروف»']
    ];
    const wallets = walletDefs.map(([id, name, sub]) => {
      const on = s.wallet === id;
      return { name, sub, checked: on ? 'true' : 'false', pick: () => this.setState({ wallet: id }),
        style: 'display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; ' + (on ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: rgba(25,61,51,0.05)'),
        dot: 'width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; flex-shrink: 0; ' + (on ? 'border: 6px solid #08634F; background: #FFFFFF' : 'border: 1.5px solid #9AA9A4') };
    });
    const picked = walletDefs.find((w) => w[0] === s.wallet);
    const primary = 'height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%);';
    return {
      title: eg ? 'مستنية تأكيدك' : 'بانتظار تأكيدك',
      countText: n.toLocaleString('ar-EG'),
      countStyle: 'font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; ' + (n ? 'color: #FFFFFF; background: #956000' : 'color: #08634F; background: #DCEBD6'),
      allDone: n === 0,
      doneText: eg ? 'مفيش حاجة مستنية — كله اتسجّل.' : 'لا شيء بانتظارك — سُجّل كل شيء.',
      bankWaiting: s.bank === 'wait',
      bankTitle: eg ? 'رسايل من بنك جديد' : 'رسائل من بنك جديد',
      bankBody: (eg ? '«' + bankName + '» بعتلك رسالتين. تتسجل في أنهي محفظة؟' : 'وصلتك رسالتان من «' + bankName + '». في أي محفظة تُسجَّل؟'),
      bankMsgs: msgs.map((m, i) => ({ name: m.name, amount: '−' + this.fmt(m.amt), style: 'display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0;' + (i ? ' border-top: 1px solid rgba(149,96,0,0.15);' : '') })),
      bankOnce: eg ? 'هتختار مرة واحدة بس. بعد كده رسايل البنك ده بتتسجل لوحدها.' : 'تختار مرة واحدة فقط، ثم تُسجَّل رسائل هذا البنك تلقائيًا.',
      pickWallet: eg ? 'اختار المحفظة' : 'اختر المحفظة',
      openSheet: () => this.setState({ sheet: true }),
      dupWaiting: s.dup === 'wait',
      dupTitle: eg ? 'شبه عملية موجودة' : 'تشبه عملية موجودة',
      dupSides: [
        { label: eg ? 'من الرسالة' : 'من الرسالة', name: dupRow.name, amount: '−' + this.fmt(dupRow.amt), when: dupRow.t },
        { label: eg ? 'موجودة عندك' : 'موجودة لديك', name: eg ? 'قهوة' : 'قهوة', amount: '−' + this.fmt(dupRow.amt), when: eg ? '١:٠٠ م · سجّلتها بإيدك' : '١:٠٠ م · سجّلتها يدويًا' }
      ],
      dupWhy: eg ? 'نفس المبلغ وبينهم ٥ دقايق.' : 'المبلغ نفسه وبينهما ٥ دقائق.',
      dupSameLabel: eg ? 'هي نفسها — شيلها' : 'هي نفسها — احذفها',
      dupNewLabel: eg ? 'لأ، سجّلها' : 'لا، سجّلها',
      dupSame: () => this.setState({ dup: 'gone' }),
      dupNew: () => { this.setState({ dup: 'gone' }); this.record([dupRow], eg ? 'اتسجّلت عملية لوحدها' : 'سُجّلت عملية مستقلة'); },
      unclearWaiting: s.unclear !== 'gone',
      unTitle: eg ? 'رسالة ما اتفهمتش' : 'رسالة لم تُفهم',
      unText: eg ? '«تمت عملية على بطاقتك المنتهية بـ ٢٢ لدى متجر إلكتروني. للاستفسار اتصل بنا.»' : '«تمت عملية على بطاقتك المنتهية بـ ٢٢ لدى متجر إلكتروني. للاستفسار اتصل بنا.»',
      unWhy: eg ? 'السبب: مفيهاش مبلغ.' : 'السبب: لا مبلغ فيها.',
      typing: s.unclear === 'typing', notTyping: s.unclear === 'wait',
      unDropLabel: eg ? 'شيلها' : 'احذفها', unTypeLabel: eg ? 'سجّلها بإيدك' : 'سجّلها يدويًا',
      unDrop: () => this.setState({ unclear: 'gone' }),
      unType: () => this.setState({ unclear: 'typing' }),
      amountLabel: (eg ? 'المبلغ بالـ' : 'المبلغ بـ') + cur, amount: s.amount,
      typeAmount: (e) => this.setState({ amount: e.target.value }),
      cantSave: !okAmount,
      saveLabel: eg ? 'سجّل' : 'سجّل',
      saveStyle: primary + ' padding: 0 18px; flex-shrink: 0;' + (okAmount ? '' : ' opacity: 0.45; cursor: default'),
      saveManual: () => { if (!okAmount) return; this.setState({ unclear: 'gone' }); this.record([{ id: 'um', name: eg ? 'عملية بطاقة' : 'عملية بطاقة', cat: 'none', amt: minor, t: '١٢:٥٥ م', st: 'new' }], eg ? 'اتسجّلت — فاضل تصنّفها' : 'سُجّلت — بقي تصنيفها'); },
      sheet: s.sheet,
      sheetTitle: (eg ? 'رسايل «' : 'رسائل «') + bankName + (eg ? '» تتسجل فين؟' : '» أين تُسجَّل؟'),
      sheetBody: eg ? 'مرة واحدة بس. الرسالتين المستنيين هيتسجلوا أول ما تختار.' : 'مرة واحدة فقط. تُسجَّل الرسالتان المنتظرتان فور اختيارك.',
      wallets,
      noWallet: !s.wallet,
      walletSave: eg ? 'سجّلهم هنا' : 'سجّلهما هنا',
      walletSaveStyle: primary + (s.wallet ? '' : ' opacity: 0.45; cursor: default'),
      saveWallet: () => {
        if (!picked) return;
        this.setState({ sheet: false, bank: 'done' });
        this.record(msgs, (eg ? 'اتسجّلت الرسالتين في «' : 'سُجّلت الرسالتان في «') + picked[1] + '»');
      },
      closeSheet: () => this.setState({ sheet: false })
    };
  }
}
</script>
</body>
</html>
