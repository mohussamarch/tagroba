<style>

.cb-scroll{scrollbar-width:none}.cb-scroll::-webkit-scrollbar{display:none}.cb-col>*{flex-shrink:0}

.cb-swap{animation:cb-swap 450ms cubic-bezier(.2,.7,.3,1)}
.cb-open{animation:cb-open 320ms cubic-bezier(.2,.7,.3,1)}
@keyframes cb-swap{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes cb-open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
