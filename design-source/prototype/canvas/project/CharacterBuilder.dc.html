<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ابني شكلك — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.cb-scroll{scrollbar-width:none}.cb-scroll::-webkit-scrollbar{display:none}
.cb-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.cb-press:active{transform:scale(.95)}
.cb-swap{animation:cb-swap 450ms cubic-bezier(.2,.7,.3,1)}
@keyframes cb-swap{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.cb-press{transition:none}.cb-press:active{transform:none}.cb-swap{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="cb-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="Account.dc.html" data-back="1" class="cb-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.4">{{title}}</h1><span style="font-size: 12px; color: #637570">{{sub}}</span></span>
    </div>

    <div style="display: flex; gap: 12px; align-items: stretch">
      <div class="cb-swap" style="position: relative; flex: 1 1 auto; min-width: 0; height: 216px; border-radius: 26px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(227,239,230,0.70) 55%, rgba(201,230,212,0.80)); box-shadow: inset 1px 1px 2px #FFFFFF, inset -1px -2px 3px rgba(8,99,79,0.18), 0 14px 32px rgba(29,54,53,0.10)">
        <dc-import name="CharacterArt" look="{{look}}" mode="{{bigMode}}" size="{{bigSize}}" label="{{title}}" hint-size="176px,176px"></dc-import>
        <div role="radiogroup" aria-label="{{viewLabel}}" style="position: absolute; top: 8px; right: 8px; display: flex; padding: 3px; border-radius: 13px; background: rgba(255,255,255,0.8)"><sc-for list="{{views}}" as="v" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{v.on}}" class="cb-press" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button></sc-for></div>
      </div>
      <div style="width: 112px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="flex: 1 1 0; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.7)">
          <dc-import name="MeAvatar" size="{{46}}" pct="{{60}}" char="{{look}}" hint-size="46px,46px"></dc-import>
          <span style="font-size: 11px; color: #637570">{{inHome}}</span>
        </div>
        <div style="flex: 1 1 0; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; background: linear-gradient(125deg, #064B40 0%, #08705A 100%)">
          <span style="height: 82px; overflow: hidden; display: flex; justify-content: center; padding-top: 4px"><dc-import name="CharacterArt" look="{{look}}" mode="الجسم كله" size="{{188}}" hint-size="85px,188px"></dc-import></span>
          <span style="font-size: 11px; color: #DCEBD6; padding-bottom: 4px">{{inPeople}}</span>
        </div>
      </div>
    </div>

    <div class="cb-scroll" role="tablist" aria-label="{{partsLabel}}" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{t.on}}" class="cb-press" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>

    <div role="radiogroup" aria-label="{{tabLabel}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
        <button type="button" role="radio" aria-checked="{{o.on}}" aria-label="{{o.label}}" class="cb-press" onClick="{{o.pick}}" style="{{o.style}}">
          <span style="{{o.thumbBox}}"><dc-import name="CharacterArt" look="{{o.look}}" mode="{{o.mode}}" size="{{60}}" hint-size="60px,60px"></dc-import></span>
          <span style="font-size: 11px; font-weight: 700; line-height: 1.3">{{o.label}}</span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{hasColors}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700">{{colorLabel}}</span>
        <div role="radiogroup" aria-label="{{colorLabel}}" style="display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{colors}}" as="c" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{c.on}}" aria-label="{{c.label}}" class="cb-press" onClick="{{c.pick}}" style="{{c.style}}"></button></sc-for>
        </div>
      </div>
    </sc-if>
    <span style="font-size: 12px; line-height: 1.6; color: #637570">{{note}}</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 14px 20px 26px; display: flex; gap: 10px; align-items: center; background: linear-gradient(180deg, rgba(239,243,237,0), rgba(239,243,237,0.96) 30%)">
    <button type="button" class="cb-press" onClick="{{save}}" style="flex: 1 1 auto; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)">{{saveLabel}}</button>
    <a href="Account.dc.html" data-back="1" class="cb-press" style="height: 52px; padding: 0 18px; border-radius: 18px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: #08634F; text-decoration: none; background: rgba(8,99,79,0.08)">{{cancelLabel}}</a>
    <a data-done="1" href="Account.dc.html" data-back="1" aria-hidden="true" tabindex="-1" style="display: none"></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"tab":{"editor":"enum","options":["الوش","البشرة","الشعر","العيون","الحواجب","المناخير","البق","الدقن","النضارة","غطا الراس","اللبس"],"default":"الوش","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// «ابني شكلك» (أول نسخة بدائية بطلب المالك 2026-10-15): تبويب لكل جزء، والاختيار بيبان لحظيًا في الكبير وفي دايرتك 46 بالشريط وفي كارت الأشخاص البترولي
// «احفظ» الفعل الأساسي الوحيد + «إلغاء» · بيتحفظ في masroufy-character (النموذج) — في التطبيق مع الحساب ويتزامن · الرسم نفسه في CharacterArt
const START = { v: 1, face: 0, skin: 2, hair: 1, hairColor: 0, eyes: 0, brows: 0, nose: 0, mouth: 1, beard: 0, glasses: 0, head: 0, wrap: 0, outfit: 0, outfitColor: 0 };
const SKIN = ['#F3D5C0', '#E8BE9C', '#D4A07A', '#B57E58', '#8C5A3C', '#5E3C28'];
const HAIRC = ['#1E1916', '#3A2A1F', '#6A4A2F', '#A47A4E', '#C8A46C', '#9B9A95'];
const WRAP = ['#26364A', '#5E4634', '#1E1E1E', '#7E8C88', '#8E4A57'];
const OUTC = ['#F4F3EE', '#2E5E8C', '#3D4A45', '#8A6A4A', '#0E6B57', '#7A4655'];
// [المفتاح، اسم التبويب سعودي/مصري، الاختيارات سعودي/مصري، الألوان]
const TABS = [
  ['face', ['الوجه', 'الوش'], [['بيضاوي', 'بيضاوي'], ['مستدير', 'مدوّر'], ['طويل', 'طويل'], ['مربع', 'مربع']]],
  ['skin', ['البشرة', 'البشرة'], null, ['skin', SKIN, ['لون البشرة', 'لون البشرة']]],
  ['hair', ['الشعر', 'الشعر'], [['بلا شعر', 'من غير'], ['قصير', 'قصير'], ['مفروق', 'مفروق'], ['طويل', 'طويل'], ['مجعّد', 'مجعّد'], ['خفيف', 'خفيف']], ['hairColor', HAIRC, ['لون الشعر', 'لون الشعر']]],
  ['eyes', ['العينان', 'العينين'], [['نقطتان', 'نقط'], ['لوزية', 'لوز'], ['هادئة', 'هادية'], ['واسعة', 'واسعة']]],
  ['brows', ['الحاجبان', 'الحواجب'], [['مستقيمة', 'مستقيمة'], ['مقوّسة', 'مقوّسة'], ['عريضة', 'عريضة'], ['رفيعة', 'رفيعة']]],
  ['nose', ['الأنف', 'المناخير'], [['صغير', 'صغيرة'], ['مستقيم', 'مستقيمة'], ['عريض', 'عريضة']]],
  ['mouth', ['الفم', 'البق'], [['عادي', 'عادي'], ['ابتسامة خفيفة', 'ابتسامة خفيفة'], ['ابتسامة', 'ابتسامة'], ['صغير', 'صغير']]],
  ['beard', ['اللحية', 'الدقن'], [['بلا لحية', 'من غير'], ['خفيفة', 'خفيفة'], ['قصيرة', 'قصيرة'], ['كاملة', 'كاملة'], ['سكسوكة', 'سكسوكة'], ['شارب فقط', 'شنب بس']], ['hairColor', HAIRC, ['اللون (نفس الشعر)', 'اللون (نفس الشعر)']]],
  ['glasses', ['النظارة', 'النضارة'], [['بلا نظارة', 'من غير'], ['مستديرة', 'مدوّرة'], ['مربعة', 'مربعة'], ['رفيعة', 'رفيعة']]],
  ['head', ['غطاء الرأس', 'غطا الراس'], [['بلا غطاء', 'من غير'], ['شماغ', 'شماغ'], ['غترة', 'غترة'], ['طاقية', 'طاقية'], ['حجاب', 'حجاب']], ['wrap', WRAP, ['لون الحجاب', 'لون الحجاب']]],
  ['outfit', ['الملابس', 'اللبس'], [['ثوب', 'جلابية/ثوب'], ['قميص', 'قميص'], ['جاكيت', 'جاكيت'], ['بلوزة', 'بلوزة']], ['outfitColor', OUTC, ['لون الملابس', 'لون اللبس']]]
];
const TAB_IDX = { 'الوش': 0, 'البشرة': 1, 'الشعر': 2, 'العيون': 3, 'الحواجب': 4, 'المناخير': 5, 'البق': 6, 'الدقن': 7, 'النضارة': 8, 'غطا الراس': 9, 'اللبس': 10 };
const KEY = 'masroufy-character';
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let saved = null; try { saved = JSON.parse(window.sessionStorage.getItem(KEY) || 'null'); } catch (e) {}
    this.state = { look: Object.assign({}, START, saved && typeof saved === 'object' ? saved : {}), tab: TAB_IDX[props.tab] || 0, fresh: !saved, view: null };
    this.root = null;
  }
  set(k, v) { this.setState({ look: Object.assign({}, this.state.look, { [k]: v }) }); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a), L = (p) => (eg ? p[1] : p[0]);
    const s = this.state, look = s.look, ti = Math.max(0, Math.min(TABS.length - 1, s.tab)), [key, tname, opts, col] = TABS[ti];
    const chip = (on) => 'flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: 0 6px 14px rgba(8,99,79,0.25)' : 'color: #193D33; background: #FFFFFF; box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 6px 14px rgba(29,54,53,0.06)');
    // الحجاب والشماغ والغترة بيخبّوا الشعر، فتبويب الشعر بيقول كده بدل ما يبان إن الاختيار مش شغال
    const hidden = key === 'hair' && [1, 2, 4].indexOf(Number(look.head)) >= 0;
    const showCol = col && (key !== 'head' || Number(look.head) === 4);
    // المعاينة الكبيرة: «قريب» (الراس والكتاف) أو «الجسم كله» — لوحدها بتبقى الجسم كله في تبويب اللبس، والزرار بيثبّت اختيارك
    const full = s.view ? s.view === 'full' : key === 'outfit';
    return {
      title: T('ابنِ شكلك', 'ابني شكلك'), sub: T('اختر كل جزء، والمعاينة تتغير فورًا', 'اختار كل جزء، والمعاينة بتتغير على طول'),
      inHome: T('في الرئيسية', 'في الرئيسية'), inPeople: T('في الأشخاص', 'في الأشخاص'), partsLabel: T('الأجزاء', 'الأجزاء'), look,
      tabs: TABS.map((t, i) => ({ label: L(t[1]), on: i === ti ? 'true' : 'false', style: chip(i === ti), pick: () => this.setState({ tab: i }) })),
      tabLabel: L(tname), bigMode: full ? 'الجسم كله' : 'راس وكتاف', bigSize: full ? 170 : 196, viewLabel: T('شكل المعاينة', 'شكل المعاينة'),
      views: [['bust', T('قريب', 'قريب')], ['full', T('الجسم كله', 'الجسم كله')]].map(([v, label]) => { const on = (v === 'full') === full; return { label, on: on ? 'true' : 'false', pick: () => this.setState({ view: v }), style: 'height: 30px; padding: 0 10px; border: 0; border-radius: 10px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; ' + (on ? 'color: #FFFFFF; background: #08634F' : 'color: #4F625C; background: transparent') }; }),
      opts: (opts || []).map((o, i) => {
        const on = Number(look[key]) === i;
        return { label: L(o), on: on ? 'true' : 'false', look: Object.assign({}, look, { [key]: i }), mode: key === 'outfit' ? 'الجسم كله' : 'راس', pick: () => this.set(key, i),
          style: 'border: 0; padding: 6px 2px 8px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; color: #193D33; cursor: pointer; background: ' + (on ? '#DCEBD6' : 'rgba(255,255,255,0.75)') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #08634F' : 'inset 0 0 0 1px rgba(204,216,204,0.7)'),
          thumbBox: 'width: 60px; height: 60px; border-radius: ' + (key === 'outfit' ? 16 : 30) + 'px; overflow: hidden; display: flex; justify-content: center; background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(227,239,230,0.70) 55%, rgba(201,230,212,0.80))' };
      }),
      hasColors: !!showCol, colorLabel: showCol ? L(col[2]) : '',
      colors: showCol ? col[1].map((hex, i) => { const on = Number(look[col[0]]) === i; return { label: L(col[2]) + ' ' + (i + 1), on: on ? 'true' : 'false', pick: () => this.set(col[0], i), style: 'width: 44px; height: 44px; border: 0; border-radius: 22px; cursor: pointer; background: ' + hex + '; box-shadow: ' + (on ? '0 0 0 3px #FFFFFF, 0 0 0 5px #08634F' : 'inset 0 0 0 1px rgba(25,61,51,0.15)') }; }) : [],
      note: hidden ? T('الشعر مخفي تحت غطاء الرأس. اختر «بلا غطاء» لتراه.', 'الشعر مستخبي تحت غطا الراس. اختار «من غير» عشان تشوفه.') : T('أول نسخة من الكاركتر، وسنطوّرها لاحقًا.', 'دي أول نسخة من الكاركتر، وهنطوّرها بعدين.'),
      saveLabel: T('احفظ', 'احفظ'), cancelLabel: T('إلغاء', 'إلغاء'),
      save: (e) => {
        try { window.sessionStorage.setItem(KEY, JSON.stringify(look)); } catch (err) {}
        const btn = e && e.currentTarget, link = btn && btn.parentNode && btn.parentNode.querySelector ? btn.parentNode.querySelector('a[data-done]') : null;
        if (link && typeof link.click === 'function') link.click();
      }
    };
  }
}
</script>
</body>
</html>
