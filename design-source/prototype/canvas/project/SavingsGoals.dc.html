<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-fill{transition:width 450ms cubic-bezier(.2,.7,.3,1)}
.m-in{animation:m-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
.m-toast{animation:m-toast 2600ms cubic-bezier(.2,.7,.3,1) both}
@keyframes m-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes m-toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.m-press,.m-fill{transition:none}.m-press:active{transform:none}.m-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">

      <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex: 1 1 auto">{{title}}</h1>
      <button type="button" class="m-press" onClick="{{openNew}}" aria-label="{{newLabel}}" style="width: 48px; height: 48px; border: 0; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>

        <span style="font-size: 13px; color: #637570">{{emptyBody}}</span>

              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{g.name}}</span><span style="font-size: 12px; color: #637570">{{g.sub}}</span></span>

              </div>
            </sc-if>
          </div>
        </sc-if>
        <span style="font-size: 12px; color: #637570">{{method}}</span>

    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","فاضي","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>

    this.onDeposit = (v) => this.deposit(v);
    this.onRemove = (id) => this.edit((g) => Object.assign({}, g, { deps: g.deps.filter((d) => d[0] !== id) }), this.eg() ? 'اتشال الإيداع' : 'حُذف الإيداع');
    this.onArchive = () => { const g = this.cur(); if (!g) return; this.edit((x) => Object.assign({}, x, { archived: true }), (this.eg() ? 'اتأرشفت «' : 'أُرشفت «') + g.name + (this.eg() ? '» — ما بتتمسحش، وموجودة في المتأرشفة' : '» — لا تُحذف، وتبقى في المؤرشفة')); this.setState({ open: null }); };

  componentWillUnmount() { this.timers.forEach(clearTimeout); }

  defaults() {
    const eg = this.eg(), k = eg ? 3 : 1;
    const DM = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر'];
    const dep = (ids, months, amts) => amts.map((a, i) => [ids + (i + 1), '٢٨ ' + months[i], a * k]).reverse();
    return [
      { id: 'g1', name: 'السفر', target: 1200000 * k, from: '١ يناير ٢٠٢٦', end: '٣١ ديسمبر ٢٠٢٦', total: 364, elapsed: 279, months: 3, starred: true, deps: dep('d', DM, [120000, 100000, 80000, 100000, 65000, 70000, 60000, 70000, 75000]) },
      { id: 'g2', name: 'جوال جديد', target: 300000 * k, from: '١ يونيو ٢٠٢٦', end: '٣١ ديسمبر ٢٠٢٦', total: 213, elapsed: 128, months: 3, deps: dep('e', DM.slice(5), [80000, 70000, 66000, 60000]) },
      { id: 'g3', name: 'الطوارئ', target: 2000000 * k, from: '١ سبتمبر ٢٠٢٦', end: '١ يونيو ٢٠٢٧', total: 273, elapsed: 36, months: 8, start: eg ? 400000 : 30000, deps: [],
        wallet: eg ? { name: 'QNB مصر', last4: '٥٥٢٠', balance: 620000 } : { name: 'مصرف الإنماء', last4: '٧٧٣١', balance: 50000 } }
    ];
  }
  list() { const key = this.eg() ? 'eg' : 'sa'; return this.state.data[key] || ((this.props.state ?? 'عادي') === 'فاضي' ? [] : this.defaults()); }
  save(list) { const key = this.eg() ? 'eg' : 'sa'; this.setState({ data: Object.assign({}, this.state.data, { [key]: list }) }); }
  cur() { return this.list().find((g) => g.id === this.state.open) || null; }
  edit(fn, msg) { const id = this.state.open; this.save(this.list().map((g) => (g.id === id ? fn(g) : g))); if (msg) this.say(msg); }
  calc(g) {
    const unknown = !!g.wallet && (this.props.state ?? 'عادي') === 'غير متاح';
    const start = g.wallet ? g.start : 0;
    const saved = g.wallet ? g.wallet.balance : g.deps.reduce((t, d) => t + d[2], 0);
    // المفروض النهارده: خط مستقيم بالأيام من المدّخر يوم البداية للهدف · المطلوب في الشهر لفوق · «هتوصل لكام» بعد ٣٠ يوم بس (§68)
    const should = start + this.md(g.target - start, g.elapsed, g.total);

  deposit(v) {

  create(n) {

    const g = { id: 'n' + seq, name: n.name, target: n.target, from: eg ? 'النهارده' : 'اليوم', end: n.end, total: n.total, elapsed: 0, months: n.months, deps: [], wallet: n.wallet, start: n.wallet ? n.wallet.balance : 0 };
    this.save(this.list().concat([g])); this.setState({ open: null, seq });

  }
  renderVals() {

    const all = this.list(), live = all.filter((g) => !g.archived), arch = all.filter((g) => g.archived);
    const NA = 'غير متاح';
    const chipS = (c, b) => 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; flex-shrink: 0; color: ' + c + '; background: ' + b;
    const statsOf = (g, c) => [
      [eg ? 'المفروض النهارده' : 'المفروض اليوم', c.unknown ? NA : this.fmt(c.should), ''],
      [c.diff === 0 ? (eg ? 'في الميعاد' : 'في الموعد') : c.diff > 0 ? (eg ? 'قدّام بـ' : 'متقدّمة بـ') : (eg ? 'ورا بـ' : 'متأخرة بـ'), c.unknown ? NA : this.fmt(c.diff), c.unknown ? '#637570' : c.diff > 0 ? '#13764D' : c.diff < 0 ? '#BE3D48' : ''],
      [eg ? 'المطلوب في الشهر' : 'المطلوب شهريًا', c.unknown ? NA : this.fmt(c.per), ''],
      [eg ? 'هتوصل لكام' : 'ستصل إلى', c.unknown ? NA : c.reach == null ? (eg ? 'بعد ٣٠ يوم' : 'بعد ٣٠ يومًا') : this.fmt(c.reach), c.reach != null && c.reach < g.target ? '#956000' : '']
    ];

    const goals = live.map((g) => {
      const c = this.calc(g);
      const chip = c.unknown ? [NA, '#637570', 'rgba(25,61,51,0.06)'] : c.reached ? [eg ? 'كملت' : 'اكتملت', '#13764D', '#DCEBD6'] : g.elapsed < 30 ? [eg ? 'جديدة' : 'جديدة', '#2469BA', 'rgba(36,105,186,0.10)'] : c.diff >= 0 ? [eg ? 'قدّام' : 'متقدّمة', '#13764D', '#DCEBD6'] : [eg ? 'ورا' : 'متأخرة', '#BE3D48', 'rgba(190,61,72,0.10)'];
      return { name: g.name, sub: sub(g), starred: g.starred ? 'true' : 'false', starFill: g.starred ? 'currentColor' : 'none',
        starLabel: g.starred ? (eg ? 'شيل النجمة' : 'أزل النجمة') : (eg ? 'حط النجمة على الخطة دي' : 'ضع النجمة على هذه الخطة'),
        starStyle: 'width: 44px; height: 44px; border: 0; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; ' + (g.starred ? 'color: #956000; background: #FBF0DD' : 'color: #9AA9A4; background: rgba(25,61,51,0.04)'),

        openLabel: g.wallet ? (eg ? 'التفاصيل' : 'التفاصيل') : (eg ? 'التفاصيل والإيداعات' : 'التفاصيل والإيداعات'),

      pct: oc.unknown ? 0 : oc.pct, reached: oc.reached, linked: !!og.wallet, deps: og.deps,
      link: og.wallet ? (eg ? 'مربوطة بـ«' : 'مربوطة بـ«') + og.wallet.name + ' \u2066••••\u00A0' + og.wallet.last4 + '\u2069' + (eg ? '» — الخطة مربوطة بحساب، المتحوّش بيتحسب من رصيده كله.' : '» — الخطة مربوطة بحساب، والمدّخر يُحسب من رصيده كله.') : '',

      title: eg ? 'خطط الادخار' : 'خطط الادخار', newLabel: eg ? 'خطة جديدة' : 'خطة جديدة', openNew: () => this.setState({ open: 'new' }),
      isEmpty, hasGoals: !isEmpty,
      emptyTitle: eg ? 'مفيش خطط ادخار' : 'لا توجد خطط ادخار', emptyBody: eg ? 'اعمل خطة بهدف وميعاد، وهنقولك المفروض تكون فين النهارده.' : 'أنشئ خطة بهدف وموعد، ونخبرك أين يُفترض أن تكون اليوم.',
      intro: eg ? 'النجمة على خطة واحدة بس — عليها المساعد بيقيس عادات الصرف.' : 'النجمة على خطة واحدة فقط — عليها يقيس المساعد عادات الصرف.',
      goals, hasArchived: arch.length > 0, archivedOpen: s.archivedOpen,
      archivedLabel: (eg ? 'المتأرشفة (' : 'المؤرشفة (') + arch.length.toLocaleString('ar-EG') + ')', toggleArchived: () => this.setState({ archivedOpen: !s.archivedOpen }),
      archivedList: arch.map((g) => ({ name: g.name, text: this.fmt(this.calc(g).saved) + ' / ' + this.fmt(g.target) })),
      method: eg ? 'المفروض النهارده = خط مستقيم بالأيام من البداية للميعاد. «هتوصل لكام» بمعدلك من البداية، وبيظهر بعد ٣٠ يوم.' : 'المفروض اليوم = خط مستقيم بالأيام من البداية إلى الموعد. «ستصل إلى» بمعدلك منذ البداية، ويظهر بعد ٣٠ يومًا.',
      sheetOpen: !!s.open && (s.open === 'new' || !!og), sheetMode: s.open === 'new' ? 'new' : 'detail', sheetGoal, celebrating: !!og && s.celebrate === og.id,
      onDeposit: this.onDeposit, onRemove: this.onRemove, onArchive: this.onArchive, onCreate: this.onCreate, closeSheet: this.closeSheet,
      spaceName: eg ? 'مصر' : 'السعودية', hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
