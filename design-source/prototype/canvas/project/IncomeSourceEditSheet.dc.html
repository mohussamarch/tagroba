<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تعديل مصدر الدخل — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ie-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.ie-press:active{transform:scale(.97)}
.ie-veil{animation:ie-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.ie-up{animation:ie-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.ie-up>*{flex-shrink:0}
.ie-in{animation:ie-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
.ie-scroll{scrollbar-width:none}.ie-scroll::-webkit-scrollbar{display:none}
@keyframes ie-fade{from{opacity:0}to{opacity:1}}
@keyframes ie-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes ie-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ie-press{transition:none}.ie-press:active{transform:none}.ie-up,.ie-in{animation:ie-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
input::placeholder{color:#8A9A95}
.ie-box:focus-within{box-shadow:0 0 0 3px #956000 !important}.ie-box input:focus-visible{box-shadow:none}
input:disabled{opacity:.45;cursor:default}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 0; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <button type="button" class="ie-press" onClick="{{openSheet}}" style="width: 100%; height: 44px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.08)">{{triggerLabel}}</button>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="ie-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{title}}" class="ie-up ie-scroll" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
        <span style="font-size: 17px; font-weight: 700">{{title}}</span>
        <span style="font-size: 13px; color: #637570; margin-top: -6px">{{sub}}</span>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">{{nameLabel}}
          <input type="text" maxlength="80" value="{{name}}" onInput="{{typeName}}" style="{{nameStyle}}">
        </label>
        <span role="alert" style="{{nameErrStyle}}">{{nameErr}}</span>

        <sc-if value="{{isMonthly}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">{{dayLabel}}
              <input type="text" inputmode="numeric" dir="ltr" maxlength="2" value="{{day}}" onInput="{{typeDay}}" placeholder="{{dayPh}}" style="{{dayStyle}}">
            </label>
            <span role="alert" style="{{dayErrStyle}}">{{dayErr}}</span>
            <span style="font-size: 12px; line-height: 1.7; color: #637570">{{dayNote}}</span>
          </div>
        </sc-if>
        <sc-if value="{{isWeekly}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 700">{{weekLabel}}</span>
            <div role="radiogroup" aria-label="{{weekLabel}}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{weekdays}}" as="wd" hint-placeholder-count="7">
                <button type="button" role="radio" aria-checked="{{wd.on}}" class="ie-press" onClick="{{wd.pick}}" style="{{wd.style}}">{{wd.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{showMonth}}" hint-placeholder-val="{{ false }}">
          <div class="ie-in" style="{{monthBox}}">
            <span style="{{monthHeadStyle}}">{{monthHead}}</span>
            <sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
              <div role="radiogroup" aria-label="{{monthHead}}" style="display: flex; gap: 8px">
                <sc-for list="{{answers}}" as="an" hint-placeholder-count="2">
                  <button type="button" role="radio" aria-checked="{{an.on}}" class="ie-press" onClick="{{an.pick}}" style="{{an.style}}">{{an.label}}</button>
                </sc-for>
              </div>
            </sc-if>
            <span style="{{monthNoteStyle}}">{{monthNote}}</span>
          </div>
        </sc-if>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; margin-top: 2px">{{expLabel}}
          <span class="ie-box" style="{{expBox}}">
            <input type="text" inputmode="decimal" dir="ltr" aria-label="{{expLabel}}" value="{{expected}}" onInput="{{typeExp}}" placeholder="{{expPh}}" style="flex: 1 1 auto; min-width: 0; height: 46px; border: 0; padding: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 700; color: #193D33; text-align: right; font-variant-numeric: tabular-nums; outline: none">
            <span style="font-size: 12px; font-weight: 500; color: #637570">{{currency}}</span>
          </span>
        </label>
        <span role="alert" style="{{expErrStyle}}">{{expErr}}</span>
        <span style="font-size: 12px; line-height: 1.7; color: #637570">{{expNote}}</span>

        <sc-if value="{{isPast}}" hint-placeholder-val="{{ false }}">
          <div style="border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; background: rgba(25,61,51,0.05)">
            <span style="font-size: 13px; font-weight: 700">{{pastHead}}</span>
            <span style="font-size: 12px; line-height: 1.7; color: #637570">{{pastNote}}</span>
          </div>
        </sc-if>

        <div style="position: sticky; bottom: -28px; z-index: 1; margin: 0 -20px -28px; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, rgba(251,250,244,0) 0, #FBFAF4 14px)">
          <span role="alert" style="font-size: 12px; font-weight: 700; line-height: 1.7; color: #BE3D48">{{err}}</span>
          <button type="button" class="ie-press" onClick="{{save}}" aria-disabled="{{saveOff}}" style="{{saveStyle}}">{{saveLabel}}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"source":{"editor":"enum","options":["الأول","الثاني","المنتهي"],"default":"الأول","section":"الحالة"},"sheet":{"editor":"enum","options":["مقفولة","مفتوحة"],"default":"مقفولة","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"info":{"editor":null},"monthStart":{"editor":null},"onSave":{"editor":null},"$preview":{"width":350,"height":44}}'>
// زرار «تعديل» في تفاصيل المصدر (IncomeSources) ولوحته — ManageIncomeSources.edit (+ applyMonthStart لو وافق). §48 §64 §65.
// info = نفس JSON اللي IncomeSourceDetail بياخده · month-start = بداية الشهر المالي (واحدة للحساب كله، §64 رد 1 — المبدئي 28)
// onSave({ id, name, day|null, weekday|null, expectedMinor|null, monthStart|null }) — النهاية مش من هنا: «إنهاء المصدر» (close)، زي ManageIncomeSources.edit اللي ما بيغيّرش النهاية
// المتوقع فاضي = «غير متاح» مش صفر (§48) · «تغيّر بداية شهرك المالي؟» للوظيفة بس · القفل من غير أي كلمة (§64)
// النهارده 7 أكتوبر 2026 (period تحت)
const M = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: null, d: null, tried: false }; }
  eg() { return (this.props.space ?? 'السعودية') === 'مصر'; }
  fmt(m) { const a = Math.abs(m), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; }
  en(t) { return String(t == null ? '' : t).replace(/[٠-٩۰-۹]/g, (d) => String(('٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹'.indexOf(d) % 10))); }
  toMinor(t) {
    const s = this.en(t).replace(/٫/g, '.').replace(/[,٬\s]/g, '');
    if (!/\d/.test(s) || !/^\d*\.?\d{0,2}$/.test(s)) return null;
    const [w, f = ''] = s.split('.');
    return parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  }
  ar(x) { return String(x).replace(/\d/g, (d) => '0123456789'[d]); }
  // المصدر من الشاشة الأم؛ لو اللوحة لوحدها: نفس مصادر IncomeSources المخترعة (الأول · التاني · المنتهي)
  src() {
    try { const i = this.props.info; if (i) return typeof i === 'string' ? JSON.parse(i) : i; } catch (e) { /* المبدئي */ }
    const k = ['الأول', 'الثاني', 'المنتهي'].indexOf(this.props.source ?? 'الأول');
    return (this.eg() ? [
      { id: 'maadi', name: 'شقة المعادي', kind: 'rent', start: '1 يناير 2026', end: null, freq: 'monthly', day: 5, expected: 900000 },
      { id: 'ahly', name: 'شهادة ادخار — البنك الأهلي المصري', kind: 'investment', start: '1 يوليو 2026', end: null, freq: 'monthly', day: 1, expected: 225000 },
      { id: 'delta', name: 'شركة الدلتا للمقاولات', kind: 'job', start: '1 سبتمبر 2021', end: '29 فبراير 2024', freq: 'monthly', day: 25, expected: null }
    ] : [
      { id: 'rayada', name: 'شركة الريادة للحلول', kind: 'job', start: '28 أبريل 2026', end: null, freq: 'monthly', day: 28, expected: 1250000 },
      { id: 'waha', name: 'مكتب الواحة للتصميم', kind: 'part_time', start: '10 أغسطس 2026', end: null, freq: 'weekly', weekday: 4, expected: 80000 },
      { id: 'sahm', name: 'مجموعة السهم التجارية', kind: 'job', start: '1 مارس 2025', end: '27 أبريل 2026', freq: 'monthly', day: 27, expected: 980000 }
    ])[Math.max(0, k)];
  }
  fresh(x) { return { name: x.name || '', day: x.day ? String(x.day) : '', weekday: x.weekday || null, expected: x.expected ? this.fmt(x.expected) : '', answer: null }; }
  renderVals() {
    const eg = this.eg(), s = this.state, x = this.src(), d = s.d || this.fresh(x);
    const cur = eg ? 'ج.م' : 'ر.س', ms = Number(this.en(this.props.monthStart)) || 28;
    const open = s.open === null ? this.props.sheet === 'مفتوحة' : s.open;
    const set = (o) => this.setState({ d: Object.assign({}, d, o) });
    const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
    const K = { job: 'وظيفة', part_time: eg ? 'بارت تايم' : 'دوام جزئي', client: 'عميل', rent: 'إيجار', investment: 'استثمار', pension: 'معاش', other: eg ? 'غيره' : 'أخرى' };
    const chip = (on, extra) => 'height: 44px; padding: 0 8px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (extra || '') + (on ? 'font-weight: 700; color: #08634F; background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const field = (bad) => 'height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 500; color: #193D33; background: #FFFFFF; outline: none; box-shadow: inset 0 0 0 ' + (bad ? '1.5px #BE3D48' : '1px rgba(204,216,204,0.9)');
    const errS = (t) => t ? 'font-size: 12px; font-weight: 700; line-height: 1.7; color: #BE3D48; margin-top: -4px' : 'display: none';
    const weekly = x.freq === 'weekly', active = !x.end;
    const name = String(d.name || '').trim().replace(/\s+/g, ' ');
    const dayText = this.en(d.day).replace(/[^0-9]/g, '');
    const day = dayText ? parseInt(dayText, 10) : null;
    const expText = String(d.expected || '').trim();
    const exp = expText ? this.toMinor(expText) : null;
    // يوم الراتب واحد للحساب كله (§64 رد 1) — السؤال للوظيفة الشغالة بس لو اليوم الجديد غير بداية الشهر
    const job = x.kind === 'job' && active && !weekly;
    const dayChanged = !weekly && day !== (x.day || null);
    const ask = job && dayChanged && day != null && day >= 1 && day <= 31 && day !== ms;
    // الشهر المالي الحالي في النموذج: 28 سبتمبر – 27 أكتوبر (النهارده 7 أكتوبر). تغيير البداية «للجديد بس» (رد المالك):
    // الشهور اللي فاتت زي ما هي، والجديد بيبدأ أول يوم D بعد ما الحالي يخلص (29–31 بيتقيد بآخر الشهر)
    const CUR = eg ? '28 سبتمبر لـ27 أكتوبر' : '28 سبتمبر إلى 27 أكتوبر';
    const nextStart = (D) => { const oct = Math.min(D, dim(2026, 10)); return oct >= 28 ? this.ar(oct) + ' ' + M[9] : this.ar(Math.min(D, dim(2026, 11))) + ' ' + M[10]; };
    const later = ms !== 28 ? (eg ? ' من الشهر الجاي' : ' من الشهر القادم') : '';
    const E = {
      name: !name ? (eg ? 'اكتب اسم المصدر.' : 'اكتب اسم المصدر.') : '',
      day: dayText && (day < 1 || day > 31) ? (eg ? 'اليوم من 1 لـ31.' : 'اليوم من 1 إلى 31.') : '',
      exp: expText && (exp == null || exp <= 0) ? (eg ? 'اكتب مبلغ أكبر من صفر، أو سيبه فاضي.' : 'اكتب مبلغًا أكبر من صفر، أو اتركه فارغًا.') : '',
      month: ask && d.answer == null ? (eg ? 'اختار: بداية شهرك المالي تتغيّر ولا لأ؟' : 'اختر: هل تتغيّر بداية شهرك المالي؟') : ''
    };
    const first = E.name || E.day || E.month || E.exp;
    const changed = name !== x.name || dayChanged || (weekly && d.weekday !== (x.weekday || null)) || exp !== (x.expected || null);
    const valid = !first && changed;
    const shown = (k) => (k === 'name' || k === 'month') && !s.tried ? '' : E[k];
    // كارت بداية الشهر: معلومة لما ما فيش تغيير، وسؤال لما اليوم يتغير
    let monthHead = '', monthNote = '';
    if (ask) {
      monthHead = (eg ? 'تغيّر بداية شهرك المالي ليوم ' : 'هل تغيّر بداية شهرك المالي إلى يوم ') + this.ar(day) + '؟';
      monthNote = d.answer === true ? (eg ? 'الشهور اللي فاتت زي ما هي — التغيير من الشهر الجاي: من ' + nextStart(day) + '، والأيام اللي قبله بتتضم للشهر الحالي.' : 'الشهور السابقة تبقى كما هي — يبدأ التغيير من الشهر القادم: من ' + nextStart(day) + '، وتُضم الأيام التي قبله إلى الشهر الحالي.')
        : d.answer === false ? (eg ? 'بداية شهرك المالي تفضل يوم ' + this.ar(ms) + '، والمرتب هيتستنى يوم ' + this.ar(day) + '.' : 'تبقى بداية شهرك المالي يوم ' + this.ar(ms) + '، ويُنتظر الراتب يوم ' + this.ar(day) + '.')
        : (eg ? 'يوم المرتب واحد للحساب كله، والشهر الحالي من ' + CUR + '.' : 'يوم الراتب واحد للحساب كله، والشهر الحالي من ' + CUR + '.');
    } else if (job && day === ms) {
      monthHead = 'يوم ' + this.ar(ms) + (ms !== 28 ? (eg ? ' هو بداية شهرك المالي من الشهر الجاي' : ' هو بداية شهرك المالي من الشهر القادم') : (eg ? ' هو كمان بداية شهرك المالي' : ' هو أيضًا بداية شهرك المالي'));
      monthNote = ms !== 28 ? (eg ? 'الشهر الحالي زي ما هو من ' + CUR + '، والجديد بيبدأ ' + nextStart(ms) + '.' : 'الشهر الحالي باقٍ من ' + CUR + '، والجديد يبدأ ' + nextStart(ms) + '.')
        : (eg ? 'للحساب كله في البلدين. لو غيّرت يوم القبض هنسألك تغيّرها معاه ولا لأ.' : 'للحساب كله في البلدين. إن غيّرت يوم القبض نسألك هل تتغيّر معه.');
    } else if (job) {
      monthHead = (eg ? 'شهرك المالي بيبدأ يوم ' : 'يبدأ شهرك المالي يوم ') + this.ar(ms) + later;
      monthNote = eg ? 'للحساب كله في البلدين — ومش بيتغيّر من هنا غير لو وافقت.' : 'للحساب كله في البلدين — ولا يتغيّر من هنا إلا بموافقتك.';
    }
    const WD = [[6, 'السبت'], [7, 'الأحد'], [1, 'الاثنين'], [2, 'الثلاثاء'], [3, 'الأربعاء'], [4, 'الخميس'], [5, 'الجمعة']];
    const btn = 'height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)';
    return {
      triggerLabel: eg ? 'تعديل' : 'تعديل',
      openSheet: () => this.setState({ open: true, d: this.fresh(x), tried: false }),
      open, closeSheet: () => this.setState({ open: false }),
      title: eg ? 'تعديل المصدر' : 'تعديل المصدر',
      sub: K[x.kind] + ' · ' + (x.end ? 'من ' + x.start + (eg ? ' لـ' : ' إلى ') + x.end : (eg ? 'من ' : 'منذ ') + x.start),
      nameLabel: eg ? 'اسم الشركة أو الجهة' : 'اسم الشركة أو الجهة', name: d.name,
      typeName: (e) => { if (e && e.target) set({ name: e.target.value }); },
      nameStyle: field(!!shown('name')), nameErr: shown('name'), nameErrStyle: errS(shown('name')),
      isMonthly: !weekly, isWeekly: weekly,
      dayLabel: eg ? 'يوم القبض في الشهر (مش لازم)' : 'يوم القبض في الشهر (اختياري)', dayPh: '1–31', day: d.day,
      typeDay: (e) => { if (e && e.target) set({ day: e.target.value, answer: null }); },
      dayStyle: field(!!shown('day')) + '; text-align: right; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums',
      dayErr: shown('day'), dayErrStyle: errS(shown('day')),
      dayNote: day == null ? (eg ? 'فاضي = من غير ميعاد ثابت، ومفيش تنبيه لو اتأخر.' : 'فارغ = بلا موعد ثابت، ولا تنبيه إن تأخر.') : (eg ? '29–31 في الشهور الأقصر = آخر يوم فيها.' : '29–31 في الشهور الأقصر = آخر يوم فيها.') + (x.kind === 'job' || x.kind === 'part_time' ? (eg ? ' لو المرتب اتأخر 3 أيام بننبّهك.' : ' إن تأخر الراتب 3 أيام ننبّهك.') : ''),
      weekLabel: eg ? 'يوم القبض في الأسبوع' : 'يوم القبض في الأسبوع',
      weekdays: WD.map(([n, label]) => ({ label, on: d.weekday === n ? 'true' : 'false', style: chip(d.weekday === n, 'font-size: 13px; padding: 0 2px; '), pick: () => set({ weekday: n }) })),
      showMonth: job, asking: ask, monthHead, monthNote,
      monthBox: 'border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: ' + (ask ? '#FBF0DD' : 'rgba(8,99,79,0.06)') + (shown('month') ? '; box-shadow: inset 0 0 0 1.5px #BE3D48' : ''),
      monthHeadStyle: 'font-size: 14px; font-weight: 700; color: ' + (ask ? '#6B4600' : '#08634F'),
      monthNoteStyle: 'font-size: 12px; line-height: 1.7; color: ' + (ask ? '#6B4600' : '#4F625C'),
      answers: [[true, eg ? 'أيوه، غيّرها' : 'نعم، غيّرها'], [false, (eg ? 'لأ، تفضل ' : 'لا، تبقى ') + this.ar(ms)]].map(([v, label]) => ({ label, on: d.answer === v ? 'true' : 'false', style: chip(d.answer === v, 'flex: 1 1 0; height: 48px; ' + (d.answer === v ? '' : 'background: rgba(255,255,255,0.7); ')), pick: () => set({ answer: v }) })),
      expLabel: eg ? 'المتوقع (مش لازم)' : 'المتوقع (اختياري)', expPh: eg ? 'مش معروف' : 'غير معروف', expected: d.expected, currency: cur,
      typeExp: (e) => { if (e && e.target) set({ expected: e.target.value }); },
      expBox: 'height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 16px; display: flex; align-items: center; gap: 6px; background: #FFFFFF; box-shadow: inset 0 0 0 ' + (shown('exp') ? '1.5px #BE3D48' : '1px rgba(204,216,204,0.9)'),
      expErr: shown('exp'), expErrStyle: errS(shown('exp')),
      expNote: exp == null ? (eg ? 'فاضي = «غير متاح» — مش بنكتب صفر مكانه.' : 'فارغ = «غير متاح» — لا نكتب صفرًا مكانه.') : (eg ? 'للمعلومة بس — مش بنقارنه بأي إيداع.' : 'للمعلومة فقط — لا نقارنه بأي إيداع.'),
      isPast: !active,
      pastHead: (eg ? 'خلص في ' : 'انتهى في ') + x.end,
      pastNote: eg ? 'الرجوع لنفس الجهة بيتسجل فترة جديدة بنفس الاسم — من «ضيف مصدر دخل».' : 'الرجوع إلى الجهة نفسها يُسجَّل فترة جديدة بالاسم نفسه — من «أضف مصدر دخل».',
      err: s.tried && !changed ? (eg ? 'مفيش حاجة اتغيرت.' : 'لم يتغيّر شيء.') : s.tried && first ? first : '',
      saveOff: valid ? 'false' : 'true', saveStyle: btn + (valid ? '' : '; opacity: 0.45; cursor: default'),
      saveLabel: !changed ? (eg ? 'مفيش تغيير' : 'لم يتغيّر شيء') : (eg ? 'احفظ التعديل' : 'احفظ التعديل'),
      save: () => {
        if (!valid) { this.setState({ tried: true }); return; }
        this.setState({ open: false, d: null, tried: false });
        if (typeof this.props.onSave === 'function') this.props.onSave({ id: x.id, name, day: weekly ? null : day, weekday: weekly ? d.weekday : null, expectedMinor: exp, monthStart: ask && d.answer === true ? day : null });
      }
    };
  }
}
</script>
</body>
</html>
