<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">

        <sc-if value="{{isEdit}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 8px">
            <sc-if value="{{canUnlink}}" hint-placeholder-val="{{ true }}"><button type="button" class="m-press" onClick="{{unlink}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.06)">{{unlinkLabel}}</button></sc-if>
            <button type="button" class="m-press" onClick="{{remove}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 700; color: #A8323C; cursor: pointer; background: rgba(190,61,72,0.08)">{{removeLabel}}</button>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

    <div style="position: absolute; left: 0; right: 0; bottom: 28px; z-index: 10; display: flex; justify-content: center; pointer-events: none">
      <div role="status" class="e-toast" style="max-width: 330px; padding: 12px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: rgba(25,61,51,0.92); box-shadow: 0 14px 30px rgba(16,45,53,0.25)">{{toast}}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","خطأ"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>

    const W = eg ? [['w1', 'البنك الأهلي المصري · حساب المرتب'], ['w2', 'QNB مصر']] : [['w1', 'مصرف الراجحي · حساب الراتب'], ['w2', 'البنك الأهلي السعودي'], ['w3', 'مصرف الإنماء']];
    const base = eg
      ? [{ id: 'nbe', name: 'البنك الأهلي المصري', w: 'w1', last4: '٥٥١٨' }, { id: 'qnb', name: 'QNB مصر', w: 'w2', last4: '٣٣٠٧' }, { id: 'waha', raw: 'ALWAHA', w: null, waiting: 2 }]
      : [{ id: 'rajhi', name: 'مصرف الراجحي', w: 'w1', last4: '٤٨٢١' }, { id: 'snb', name: 'البنك الأهلي السعودي', w: 'w2', last4: '٢٢٠٥' }, { id: 'inma', name: 'مصرف الإنماء', w: 'w3', last4: '٧٢١٠' }, { id: 'waha', raw: 'ALWAHA', w: null, waiting: 2 }];

    const senders = list.map((x, i, a) => {
      const wait = !x.w;
      return {

        sub: wait ? (x.waiting ? two(x.waiting) + (eg ? ' مستنيين تختار المحفظة' : ' بانتظار اختيار المحفظة') : (eg ? 'لسه ما اخترتش المحفظة' : 'لم تُختر المحفظة بعد')) : (eg ? 'بتتسجل في: ' : 'تُسجَّل في: ') + wName(x.w),
        subStyle: 'font-size: 12px; ' + (wait ? 'font-weight: 700; color: #956000' : 'color: #637570'),
        tile: 'width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (wait ? 'color: #956000; background: #FBF0DD' : 'color: #08634F; background: rgba(8,99,79,0.10)'),
        open: () => this.setState({ sheet: { mode: 'edit', id: x.id }, pick: x.w, tried: false }),
        rowStyle: 'box-sizing: border-box; width: 100%; border: 0; background: transparent; font: inherit; color: #193D33; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px; border-radius: 16px;' + (i === a.length - 1 ? '' : ' box-shadow: 0 1px 0 rgba(204,216,204,0.55);')

      return { name, sub: id === 'new' ? (eg ? 'نعملها دلوقتي برصيد «غير معروف»' : 'تُنشأ الآن برصيد «غير معروف»') : (eg ? 'حساب بنك' : 'حساب بنكي'), checked: on ? 'true' : 'false', pick: () => this.setState({ pick: id }),
        style: 'display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; border-radius: 16px; font: inherit; color: #193D33; cursor: pointer; ' + (on ? 'background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'background: rgba(25,61,51,0.05)'),

      addStyle: 'height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.08);' + (full ? ' opacity: 0.5; cursor: default' : ''),
      openAdd: () => { if (!full) this.setState({ sheet: { mode: 'add' }, pick: null, newName: '', tried: false }); },
      rulesNote: eg ? 'لو في البلد حساب بنك واحد، رسايله بتتسجل فيه على طول. ولو عندك حسابين في نفس البنك، بنفرّق بينهم بآخر ٤ أرقام في الرسالة. البنك اللي مالوش محفظة رسايله بتستنى لحد ما تختار.' : 'إن كان في البلد حساب بنكي واحد تُسجَّل رسائله فيه مباشرة. وإن كان لك حسابان في البنك نفسه نفرّق بينهما بآخر ٤ أرقام في الرسالة. والبنك الذي بلا محفظة تنتظر رسائله حتى تختار.',
      notifLink: eg ? 'إشعارات رسايل البنك' : 'إشعارات رسائل البنك',
      sheetOpen: !!sh && (isAdd || !!target),
      isAdd, isEdit: !!target, canUnlink: !!(target && target.w),
      sheetTitle: isAdd ? (eg ? 'مرسل جديد' : 'مرسل جديد') : target ? (eg ? 'رسايل «' : 'رسائل «') + label(target) + (eg ? '» تتسجل فين؟' : '» أين تُسجَّل؟') : '',
      sheetBody: isAdd ? (eg ? 'اكتب اسم المرسل زي ما بيظهر في الرسايل، واختار محفظته.' : 'اكتب اسم المرسل كما يظهر في الرسائل، واختر محفظته.') : (eg ? 'مرة واحدة بس. أي رسالة مستنية من البنك ده بتتسجل لوحدها بعد ما تختار.' : 'مرة واحدة فقط. ما ينتظر من رسائل هذا البنك يُسجَّل تلقائيًا بعد اختيارك.'),
      nameLabel: eg ? 'اسم المرسل' : 'اسم المرسل', newName: s.newName, typeName: (e) => this.setState({ newName: e.target.value }),
      hasNameErr: nameErr, nameErr: eg ? 'اكتب اسم مرسل البنك زي ما بيظهر في الرسايل' : 'اكتب اسم مرسل البنك كما يظهر في الرسائل',
      wallets, cantSave,
      saveLabel: isAdd ? (eg ? 'ضيفه' : 'أضفه') : (eg ? 'احفظ' : 'احفظ'),
      saveStyle: primary + (cantSave ? ' opacity: 0.45; cursor: default' : ''),
      save: () => {
        if (!s.pick) return;
        if (isAdd) {
          if (!nm) { this.setState({ tried: true }); return; }
          this.setState({ extra: s.extra.concat([{ id: 'x' + (s.extra.length + 1), raw: nm, w: s.pick }]), sheet: null });
          this.say((eg ? 'اتضاف «' : 'أُضيف «') + nm + '»');
          return;
        }
        if (!target) return;
        this.setState({ map: Object.assign({}, s.map, { [target.id]: s.pick }), sheet: null });
        this.say((eg ? 'اتربط «' : 'رُبط «') + label(target) + (eg ? '» بـ«' : '» بـ«') + wName(s.pick) + '»' + (!target.w && target.waiting ? (eg ? ' — المستني هيتسجل لوحده' : ' — يُسجَّل المنتظر تلقائيًا') : ''));
      },
      unlinkLabel: eg ? 'شيل الربط' : 'فك الربط',
      unlink: () => { if (!target) return; this.setState({ map: Object.assign({}, s.map, { [target.id]: null }), sheet: null }); this.say(eg ? 'اتشال الربط — رسايله هتستنى لحد ما تختار' : 'فُك الربط — تنتظر رسائله حتى تختار'); },
      removeLabel: eg ? 'شيل المرسل' : 'احذف المرسل',
      remove: () => { if (!target) return; this.setState({ gone: Object.assign({}, s.gone, { [target.id]: true }), sheet: null }); this.say((eg ? 'مش هنقرا رسايل «' : 'لن نقرأ رسائل «') + label(target) + '»'); },
      closeSheet: () => this.setState({ sheet: null }),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
