<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعادة تعيين كلمة المرور — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.rp-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.rp-press:active{transform:scale(.97)}
.rp-veil{animation:rp-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.rp-up{animation:rp-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
.rp-up>*{flex-shrink:0}
.rp-in{animation:rp-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
.rp-spin{animation:rp-spin 900ms cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes rp-fade{from{opacity:0}to{opacity:1}}
@keyframes rp-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes rp-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rp-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.rp-press{transition:none}.rp-press:active{transform:none}.rp-up,.rp-in{animation:rp-fade 150ms both}.rp-spin{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
input::placeholder{color:#8A9A95}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 0; display: flex; flex-direction: column; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <sc-if value="{{isLink}}" hint-placeholder-val="{{ true }}"><button type="button" class="rp-press" onClick="{{openSheet}}" aria-haspopup="dialog" style="align-self: flex-start; height: 44px; padding: 0; border: 0; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; background: transparent; cursor: pointer">{{trigger}}</button></sc-if>
  <sc-if value="{{isRow}}" hint-placeholder-val="{{ false }}"><button type="button" class="rp-press" onClick="{{openSheet}}" aria-haspopup="dialog" disabled="{{offline}}" style="{{rowStyle}}"><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">{{trigger}}</span><span style="font-size: 12px; color: #637570">{{rowHint}}</span></span></button></sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 9">
      <button type="button" class="rp-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
      <div role="dialog" aria-modal="true" aria-label="{{formTitle}}" class="rp-up" style="position: absolute; left: 0; right: 0; bottom: 0; min-height: 440px; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>

        <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-size: 17px; font-weight: 700">{{formTitle}}</span>
            <span style="font-size: 13px; line-height: 1.7; color: #637570">{{formBody}}</span>
            <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
              <div role="alert" class="rp-in" style="border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: #FBF0DD; color: #6B4600">
                <span style="display: flex; align-items: flex-start; gap: 8px; font-size: 13px; font-weight: 700; color: #956000"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 20h.01"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path><path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path><path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path><path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path><path d="m2 2 20 20"></path></svg>{{offlineText}}</span>
                <button type="button" class="rp-press" onClick="{{retry}}" style="align-self: flex-start; height: 44px; padding: 0 16px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(255,255,255,0.8)">{{retryLabel}}</button>
              </div>
            </sc-if>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="rp-email" style="font-size: 13px; font-weight: 700">{{emailLabel}}</label>
              <input id="rp-email" type="email" dir="ltr" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" value="{{email}}" onInput="{{typeEmail}}" disabled="{{busy}}" aria-invalid="{{emailInvalid}}" aria-describedby="rp-email-err" style="{{emailStyle}}">
              <sc-if value="{{emailBad}}" hint-placeholder-val="{{ false }}">
                <span id="rp-email-err" role="alert" class="rp-in" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #BE3D48"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>{{emailErr}}</span>
              </sc-if>
            </div>
            <button type="button" class="rp-press" onClick="{{send}}" disabled="{{sendOff}}" aria-busy="{{busyAttr}}" style="{{sendStyle}}">
              <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><svg class="rp-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
              <span>{{sendLabel}}</span>
            </button>
            <span style="font-size: 12px; line-height: 1.7; color: #637570">{{privacyNote}}</span>
          </div>
        </sc-if>

        <sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
          <div role="status" class="rp-in" style="display: flex; flex-direction: column; gap: 12px">
            <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #13764D; background: #DCEBD6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"></path><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path><path d="m16 19 2 2 4-4"></path></svg></span>
            <span style="font-size: 17px; font-weight: 700">{{sentTitle}}</span>
            <span style="font-size: 14px; line-height: 1.8">{{sentA}} <bdi dir="ltr" style="font-weight: 700; overflow-wrap: anywhere">{{sentTo}}</bdi> {{sentB}}</span>
            <span style="font-size: 12px; line-height: 1.7; color: #637570">{{spamNote}}</span>
            <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 12px; font-weight: 700; color: #956000">{{offlineShort}}</span></sc-if>
            <div style="display: flex; gap: 8px">
              <button type="button" class="rp-press" onClick="{{resend}}" disabled="{{resendOff}}" aria-describedby="rp-wait" style="{{resendStyle}}">{{resendLabel}}</button>
              <button type="button" class="rp-press" onClick="{{changeEmail}}" style="flex: 1 1 0; min-width: 0; height: 48px; padding: 0 10px; border: 0; border-radius: 16px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.08)">{{changeLabel}}</button>
            </div>
            <span id="rp-wait" role="status" style="font-size: 12px; color: #637570; min-height: 20px">{{waitNote}}</span>
            <button type="button" class="rp-press" onClick="{{finish}}" style="height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.25)">{{finishLabel}}</button>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":false,"section":"الحالة"},"kind":{"editor":"enum","options":["نسيت","تغيير"],"default":"نسيت","section":"الحالة"},"email":{"editor":"text","default":"","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"onSend":{"editor":null},"$preview":{"width":350,"height":44}}'>
// «نسيت كلمة المرور؟» ولوحته — في SignInEmail · ونوع «تغيير» في Account (قرار المالك ٢٠٢٦-١٠-٠٩: «تغيير كلمة السر» يبعت رابط على الإيميل بنفس اللوحة). AuthPort.sendPasswordReset(email) ⇒ this.props.onSend({ email })
// نفس الرسالة سواء البريد متسجل ولا لأ (ما بنكشفش مين عنده حساب) · إعادة الإرسال بعد ٦٠ ثانية · من غير نت: ممنوع الإرسال
// شاشة الدخول فصحى دايمًا (§66): الشاشة الأم ما تبعتش space، والمصري موجود لو اللوحة اتستعملت جوه حساب مصري
const WAIT = 60;
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, email: '', err: '', busy: false, sentTo: '', left: 0, netBack: false, again: false }; this.timers = []; }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  stop() { this.timers.forEach(clearTimeout); this.timers = []; }
  tick() {
    this.timers.push(setTimeout(() => { const left = Math.max(0, this.state.left - 1); this.setState({ left }); if (left > 0) this.tick(); }, 1000));
  }
  // الإرسال نفسه: الشاشة الأم بتستلم البريد، والنموذج بيستنى شوية كأنه بيكلم النظام
  dispatch(email, again) {
    this.stop();
    this.setState({ busy: true, err: '', email });
    if (typeof this.props.onSend === 'function') this.props.onSend({ email });
    this.timers.push(setTimeout(() => { this.setState({ busy: false, sentTo: email, left: WAIT, again }); this.tick(); }, 900));
  }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', s = this.state;
    const offline = (this.props.offline === true || this.props.offline === 'true') && !s.netBack;
    const ar = (x) => String(x).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const plural = (x, w) => x === 1 ? w[0] : x === 2 ? w[1] : ar(x) + ' ' + (x <= 10 ? w[2] : w[3]);
    const secs = plural(s.left, eg ? ['ثانية', 'ثانيتين', 'ثواني', 'ثانية'] : ['ثانية', 'ثانيتين', 'ثوانٍ', 'ثانية']);
    const sent = !!s.sentTo;
    const field = (bad) => 'height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; color: #193D33; outline: none; background: #FFFFFF; box-shadow: inset 0 0 0 ' + (bad ? '1.5px #BE3D48' : '1px rgba(204,216,204,0.9)');
    const sendOff = s.busy || offline;
    const waiting = s.left > 0, change = this.props.kind === 'تغيير';
    return {
      isLink: !change, isRow: change, rowStyle: (this.props.triggerStyle || '') + (offline ? ' opacity: 0.45; cursor: default;' : ''),
      rowHint: offline ? (eg ? 'محتاج نت' : 'يحتاج اتصالًا بالإنترنت') : (eg ? 'هنبعتلك لينك على الإيميل' : 'نرسل رابطًا إلى بريدك'),
      trigger: change ? 'تغيير كلمة السر' : eg ? 'نسيت كلمة السر؟' : 'نسيت كلمة المرور؟',
      openSheet: () => this.setState({ open: true, err: '', email: s.sentTo || String(this.props.email || '').trim() }),
      open: s.open,
      closeSheet: () => this.setState({ open: false }),
      isForm: !sent, isSent: sent,
      formTitle: change ? 'تغيير كلمة السر' : eg ? 'نسيت كلمة السر' : 'إعادة تعيين كلمة المرور',
      formBody: change ? (eg ? 'هنبعت على إيميلك لينك تغيّر منه كلمة السر.' : 'سنرسل إلى بريدك رابطًا تغيّر منه كلمة المرور.') : eg ? 'اكتب إيميلك وهنبعتلك عليه لينك تعمل بيه كلمة سر جديدة.' : 'أدخل بريدك، وسنرسل إليه رابطًا لتعيين كلمة مرور جديدة.',
      offline, offlineText: eg ? 'مفيش إنترنت. اتأكد من الاتصال وجرّب تاني' : 'لا اتصال بالإنترنت. تحقق من الاتصال وأعد المحاولة',
      offlineShort: eg ? 'إعادة الإرسال محتاجة نت.' : 'إعادة الإرسال تحتاج اتصالًا بالإنترنت.',
      retryLabel: eg ? 'جرّب تاني' : 'أعد المحاولة', retry: () => this.setState({ netBack: true }),
      emailLabel: eg ? 'الإيميل' : 'البريد الإلكتروني',
      email: s.email, typeEmail: (e) => this.setState({ email: e && e.target ? e.target.value : '', err: '' }),
      busy: s.busy, busyAttr: s.busy ? 'true' : 'false',
      emailBad: !!s.err, emailInvalid: s.err ? 'true' : 'false', emailErr: s.err, emailStyle: field(!!s.err),
      send: () => {
        if (sendOff) return;
        const email = String(s.email || '').trim();
        if (!email) { this.setState({ err: eg ? 'اكتب الإيميل' : 'أدخل بريدك الإلكتروني' }); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { this.setState({ err: eg ? 'الإيميل مش مكتوب صح' : 'البريد الإلكتروني غير صحيح' }); return; }
        this.dispatch(email, false);
      },
      sendOff,
      sendLabel: s.busy ? (eg ? 'بيتبعت…' : 'جارٍ الإرسال…') : change ? (eg ? 'ابعت اللينك' : 'أرسل الرابط') : (eg ? 'ابعت لينك التغيير' : 'أرسل رابط إعادة التعيين'),
      sendStyle: 'height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); ' + (sendOff ? 'opacity: 0.45; cursor: default' : 'cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.25)'),
      privacyNote: change ? '' : eg ? 'علشان نحمي الحسابات، مش بنقول إذا كان الإيميل متسجل عندنا ولا لأ.' : 'حمايةً للحسابات، لا نُظهر إن كان البريد مسجّلًا لدينا أم لا.',
      sentTitle: eg ? 'بص على إيميلك' : 'راجع بريدك',
      sentA: eg ? 'لو' : 'إن كان', sentTo: s.sentTo,
      sentB: eg ? 'متسجل عندنا، هيوصله لينك تعمل بيه كلمة سر جديدة خلال دقايق.' : 'مسجّلًا لدينا، فسيصله رابط لتعيين كلمة مرور جديدة خلال دقائق.',
      spamNote: eg ? 'موصلش؟ بص في الرسايل المزعجة، أو ابعته تاني.' : 'لم يصل؟ افحص الرسائل غير المرغوب فيها، أو أعد الإرسال.',
      resendOff: waiting || offline || s.busy,
      resendLabel: s.busy ? (eg ? 'بيتبعت…' : 'جارٍ الإرسال…') : (eg ? 'ابعته تاني' : 'أعد الإرسال'),
      resendStyle: 'flex: 1 1 0; min-width: 0; height: 48px; padding: 0 10px; border: 0; border-radius: 16px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; background: rgba(8,99,79,0.08); ' + (waiting || offline || s.busy ? 'opacity: 0.45; cursor: default' : 'cursor: pointer'),
      resend: () => { if (!waiting && !offline && !s.busy && s.sentTo) this.dispatch(s.sentTo, true); },
      waitNote: (s.again && !s.busy ? (eg ? 'اتبعت تاني. ' : 'أُرسل الرابط مرة أخرى. ') : '') + (waiting ? (eg ? 'تقدر تبعته تاني بعد ' : 'يمكنك الإرسال مجددًا بعد ') + secs + '.' : ''),
      changeLabel: eg ? 'غيّر الإيميل' : 'غيّر البريد',
      changeEmail: () => { this.stop(); this.setState({ sentTo: '', left: 0, again: false, email: s.sentTo, err: '' }); },
      finishLabel: eg ? 'ارجع لتسجيل الدخول' : 'العودة لتسجيل الدخول',
      finish: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
