<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإشعارات — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
.m-row:active{background:#DCEBD6}
@media (prefers-reduced-motion: reduce){.m-press{transition:none}.m-press:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="Main.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; flex: 1 1 auto">الإشعارات</h1>
      <a href="NotificationSettings.dc.html" class="m-press" aria-label="{{settingsLabel}}" style="width: 48px; height: 48px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 8px; text-align: center">
        <div aria-label="مكان رسمة الشاشة الفاضية" style="width: 120px; height: 80px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed rgba(8,99,79,0.35); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #637570">رسمة بخط واحد</div>
        <span style="font-size: 14px; font-weight: 700; margin-top: 8px">{{emptyTitle}}</span>
        <span style="font-size: 13px; color: #637570">{{emptyBody}}</span>
      </div>
    </sc-if>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #637570">{{sec.title}}</h2>
        <div style="border-radius: 22px; padding: 4px 8px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
          <sc-for list="{{sec.rows}}" as="n" hint-placeholder-count="2">
            <a href="{{n.href}}" data-keep="{{n.keep}}" onPointerDown="{{n.prep}}" onFocus="{{n.prep}}" onClick="{{n.prep}}" class="m-press m-row" style="{{n.style}}">
              <span style="{{n.tile}}">
                <sc-if value="{{n.i.sms}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M13 8H7"></path><path d="M17 12H7"></path></svg></sc-if>
                <sc-if value="{{n.i.move}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg></sc-if>
                <sc-if value="{{n.i.budget}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></sc-if>
                <sc-if value="{{n.i.sub}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17.5v-11"></path></svg></sc-if>
                <sc-if value="{{n.i.debt}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"></path><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path><path d="m2 16 6 6"></path><circle cx="16" cy="9" r="2.9"></circle><circle cx="6" cy="5" r="3"></circle></svg></sc-if>
                <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}"><span aria-label="جديد" style="position: absolute; top: -3px; left: -3px; width: 10px; height: 10px; border-radius: 5px; background: #08634F; box-shadow: 0 0 0 2px #FFFFFF"></span></sc-if>
              </span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 700">{{n.title}}</span><span style="font-size: 11px; color: #637570; flex-shrink: 0">{{n.when}}</span></span>
                <span style="font-size: 13px; color: #193D33">{{n.body}}</span>
                <span style="font-size: 11px; color: #637570">{{n.why}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #637570">{{lockTitle}}</span>
      <div aria-hidden="true" style="border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; background: rgba(25,61,51,0.82); color: #FFFFFF; box-shadow: 0 10px 24px rgba(16,45,53,0.20)">
        <span style="width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)">م</span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700">مصروفي</span><span style="font-size: 13px">{{lockText}}</span></span>
        <span style="font-size: 11px; color: #DCEBD6">{{lockWhen}}</span>
      </div>
      <span style="font-size: 12px; color: #637570">{{lockNote}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","فاضي"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const empty = (this.props.state ?? 'عادي') === 'فاضي';
    const cur = eg ? 'ج.م' : 'ر.س';
    let read = false;
    // «تعليم الكل كمقروء» من نافذة الجرس
    try { read = window.sessionStorage.getItem('masroufy-notif-read') === '1'; } catch (e) {}
    // الشاشة اللي بتفتح بتقرا اختيارها من هنا (التطبيق بيفتح لوحة كاملة، مفيش باراميتر)
    const keep = (k, v) => { const f = () => { try { window.sessionStorage.setItem(k, v); } catch (e) {} }; f.data = JSON.stringify({ [k]: v }); return f; };
    const tint = { sms: ['rgba(8,99,79,0.10)', '#08634F'], move: ['rgba(36,105,186,0.12)', '#2469BA'], budget: ['rgba(190,61,72,0.10)', '#BE3D48'], sub: ['rgba(149,96,0,0.12)', '#956000'], debt: ['rgba(165,80,96,0.12)', '#A55060'] };
    const row = (icon, title, body, why, when, to, prep, unread, last) => ({
      title, body, why, when, unread: !!unread && !read, i: { [icon]: true },
      href: to + '.dc.html', prep: prep || (() => {}), keep: prep ? prep.data : '{}',
      tile: 'position: relative; width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); background: ' + tint[icon][0] + '; color: ' + tint[icon][1],
      style: 'box-sizing: border-box; text-decoration: none; color: #193D33; display: flex; align-items: flex-start; gap: 12px; padding: 12px 8px; border-radius: 16px;' + (last ? '' : ' box-shadow: 0 1px 0 rgba(204,216,204,0.55)')
    });
    const sections = empty ? [] : [
      { title: eg ? 'محتاج قرارك' : 'بانتظار قرارك', rows: [
        row('sms', eg ? 'رسايل من البنك مستنية تأكيدك' : 'رسائل من البنك بانتظار تأكيدك',
          eg ? '٤ رسايل: بنك جديد، وواحدة شبه عملية موجودة، وواحدة ما اتفهمتش' : '٤ رسائل: بنك جديد، وواحدة تشبه عملية موجودة، وواحدة لم تُفهم',
          eg ? 'ليه دلوقتي: وصلت رسالة جديدة ومستنية' : 'لماذا الآن: وصلت رسالة جديدة بانتظارك', eg ? 'من ١٠ دقايق' : 'قبل ١٠ دقائق', 'BankSms', null, true),
        row('move', eg ? 'حوالة من طرف جديد' : 'حوالة من طرف جديد',
          eg ? 'حساب آخره ٤٨٢١ — مين ده؟' : 'حساب ينتهي بـ ٤٨٢١ — من هذا؟',
          eg ? 'ليه دلوقتي: أول مرة يحوّلك' : 'لماذا الآن: أول تحويل منه', eg ? 'النهارده' : 'اليوم', 'OperationDetail', keep('masroufy-txn', 'party'), true),
        // §75 (٥ و٩ و١٢) — قرار المالك ٢٠٢٦-١٠-٠٨ «الاتنين»: إشعار لكل عملية، ولو ما ردّش بتفضل مستنياه في المراجعة
        row('move', eg ? 'تحويل لليلى — سلفة ولا دعم؟' : 'تحويل إلى ليلى — سلفة أم دعم؟', (eg ? '١٬٥٠٠ ' : '٥٠٠ ') + cur + (eg ? '، ٦ أكتوبر' : '، ٦ أكتوبر'), eg ? 'ليه دلوقتي: ليلى شخص مربوط، وبنسألك كل مرة' : 'لماذا الآن: ليلى شخص مرتبط، ونسألك كل مرة', eg ? 'امبارح' : 'أمس', 'ReviewQueue', null, true),
        row('debt', eg ? 'حوالة من أحمد — ده سداد السلفة؟' : 'حوالة من أحمد — هل هي سداد السلفة؟', (eg ? '٥٥٥ ' : '١٨٥ ') + cur + (eg ? '، وليك عنده نفس المبلغ' : '، ولك عنده المبلغ نفسه'), eg ? 'ليه دلوقتي: جت من حد ليك عنده سلفة' : 'لماذا الآن: وصلت ممن لك عنده سلفة', eg ? 'من يومين' : 'قبل يومين', 'ReviewQueue', null, true),
        row('sub', eg ? 'شراء بالدولار — كام بالجنيه؟' : 'شراء بالدولار — كم بالريال؟', eg ? '٤٠ دولار، والبنك ما كتبش المبلغ بالجنيه' : '٤٠ دولارًا، ولم يذكر البنك المبلغ بالريال', eg ? 'ليه دلوقتي: من غيره الصرف ناقص' : 'لماذا الآن: بدونه يبقى الصرف ناقصًا', eg ? 'من ٤ أيام' : 'قبل ٤ أيام', 'ReviewQueue', null, true, true)
      ] },
      { title: eg ? 'جديد' : 'جديد', rows: [
        row('budget', eg ? 'التسوق عدّى السقف' : 'التسوق تجاوز السقف',
          eg ? 'صرفت ١٠٧٪ من سقف التسوق' : 'صرفت ١٠٧٪ من سقف التسوق',
          eg ? 'ليه دلوقتي: عملية اتسجلت لوحدها من رسالة البنك' : 'لماذا الآن: عملية سُجّلت تلقائيًا من رسالة البنك', eg ? 'النهارده' : 'اليوم', 'Operations', keep('masroufy-ops-tab', 'budgets'), true),
        // §75-15: تذكير أسبوعي جوه الملخص بعدد اللي محتاج تأكيد
        row('sms', eg ? 'تذكير الأسبوع' : 'تذكير الأسبوع', eg ? 'عندك ٨ عمليات محتاجة تأكيد' : 'لديك ٨ عمليات تحتاج تأكيدًا', eg ? 'ليه دلوقتي: ملخص كل أسبوع' : 'لماذا الآن: ملخص أسبوعي', eg ? 'النهارده' : 'اليوم', 'ReviewQueue', null, true),
        row('sub', eg ? 'اشتراك الجيم بعد يومين' : 'اشتراك النادي بعد يومين',
          (eg ? '١٩٩ ' : '١٩٩ ') + cur + (eg ? ' يوم ٩ أكتوبر' : ' يوم ٩ أكتوبر'),
          eg ? 'ليه دلوقتي: قرّب ميعاده (٣ أيام)' : 'لماذا الآن: اقترب موعده (٣ أيام)', eg ? 'امبارح' : 'أمس', 'Subscriptions'),
        row('debt', eg ? 'فهد اتأخر' : 'فهد تأخّر في السداد',
          eg ? 'ميعاد سداده كان من ٥ أيام' : 'موعد سداده قبل ٥ أيام',
          eg ? 'ليه دلوقتي: عدّى الميعاد' : 'لماذا الآن: تجاوز الموعد', eg ? 'من ٣ أيام' : 'قبل ٣ أيام', 'PersonProfile', null, false, true)
      ] }
    ];
    return {
      settingsLabel: eg ? 'إعدادات الإشعارات' : 'إعدادات الإشعارات',
      isEmpty: empty,
      emptyTitle: eg ? 'مفيش حاجة جديدة' : 'لا جديد',
      emptyBody: eg ? 'هنقولك لما يبقى فيه حاجة تستاهل.' : 'سننبهك عندما يستحق الأمر.',
      sections,
      lockTitle: eg ? 'كده بيظهر على شاشة القفل' : 'هكذا يظهر على شاشة القفل',
      lockText: eg ? 'عملية مستنية سؤال واحد منك' : 'عملية بانتظار سؤال واحد منك',
      lockWhen: eg ? 'دلوقتي' : 'الآن',
      lockNote: eg ? 'من غير مبالغ ولا أسامي ولا عدد. واللي بيتسجل لوحده من رسايل البنك مالوش إشعار — بتشوفه في العمليات بلمعة.' : 'بلا مبالغ ولا أسماء ولا أعداد. وما يُسجَّل تلقائيًا من رسائل البنك لا يصدر عنه إشعار — تراه في العمليات بلمعة.'
    };
  }
}
</script>
</body>
</html>
