<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>القايمة السريعة للعملية — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.q-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.q-press:active{transform:scale(.97)}
.q-veil{animation:q-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.q-lift{animation:q-lift 400ms cubic-bezier(.18,.9,.28,1.08) both}
.q-pop{animation:q-pop 420ms cubic-bezier(.18,.9,.28,1.08) both}
@keyframes q-fade{from{opacity:0}to{opacity:1}}
@keyframes q-lift{from{transform:scale(1)}to{transform:scale(1.025)}}
@keyframes q-pop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.q-lift{animation:none;transform:none}.q-pop{animation:q-fade 150ms both}.q-press{transition:none}.q-press:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="position: absolute; inset: 0; z-index: 7; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <button type="button" class="q-veil" onClick="{{close}}" aria-label="إغلاق القايمة" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.16); backdrop-filter: blur(8px) saturate(0.88); -webkit-backdrop-filter: blur(8px) saturate(0.88)"></button>
  <div class="q-lift" aria-hidden="true" style="{{liftStyle}}">
    <div style="{{M.tileStyle}}">
      <dc-import name="OpIcon" kind="{{M.kind}}" hint-size="18px,18px"></dc-import>
      <sc-if value="{{M.flag}}" hint-placeholder-val="{{ false }}"><span aria-label="غير مسجّلة" style="position: absolute; top: -1px; left: -1px; width: 8px; height: 8px; border-radius: 4px; background: #BE3D48"></span></sc-if>
    </div>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{M.name}}</span><span style="font-size: 12px; color: #637570">{{M.sub}}</span></div>
    <span dir="ltr" style="{{M.amountStyle}}">{{M.amount}}</span>
  </div>
  <div role="menu" aria-label="إجراءات العملية" class="q-pop" style="{{menuStyle}}">
    <span aria-hidden="true" style="position: absolute; top: 2px; left: 14%; width: 56%; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent); transform: rotate(-8deg)"></span>
    <a href="OperationDetail.dc.html" data-keep="{{M.keep}}" onClick="{{M.prep}}" role="menuitem" class="q-press" style="height: 48px; display: flex; align-items: center; border-radius: 16px; padding: 0 14px; font-size: 15px; color: #193D33; text-decoration: none">{{detailLabel}}</a>
    <sc-for list="{{items}}" as="mi" hint-placeholder-count="3">
      <button type="button" role="menuitem" class="q-press" onClick="{{mi.go}}" style="{{mi.style}}">{{mi.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// القايمة السريعة بالضغطة الطويلة على صف في «العمليات» (اتفصلت من Operations عشان حد الـ300 سطر لما اتضاف وضع التحديد)
// الصف بيترفع مكانه، والقايمة تحته أو فوقه حسب المساحة · props: row (الصف نفسه) · top / h (مكانه في الشاشة) · items [{label, go, strong}] · detail-label · on-close
class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', items = Array.isArray(this.props.items) ? this.props.items : [];
    const M = this.props.row || { keep: '{}', prep: () => {}, tileStyle: '', name: '', sub: '', amount: '', amountStyle: '', kind: 'food', flag: false };
    const top = Number(this.props.top) || 300, h = Math.max(56, Number(this.props.h) || 56), H = (items.length + 1) * 48 + 18, below = top + h + 12 + H < 844 - 110;
    return {
      M, close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); }, detailLabel: this.props.detailLabel || (eg ? 'شوف التفاصيل' : 'عرض التفاصيل'),
      items: items.map((x) => ({ label: x.label, go: x.go, style: 'height: 48px; border: 0; border-radius: ' + (x.strong ? 18 : 16) + 'px; text-align: right; padding: 0 14px; font: inherit; font-size: 15px; cursor: pointer; ' + (x.strong ? 'font-weight: 700; color: #08634F; background: linear-gradient(145deg, rgba(255,255,255,0.90), rgba(255,255,255,0.40)); box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 3px rgba(255,255,255,0.6), 0 2px 8px rgba(33,58,45,0.06)' : 'color: #193D33; background: transparent') })),
      liftStyle: 'position: absolute; left: 20px; right: 20px; top: ' + top.toFixed(1) + 'px; min-height: ' + Math.max(64, h).toFixed(0) + 'px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; gap: 12px; background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(240,246,240,0.80)); box-shadow: inset 0 2px 0 #FFFFFF, inset 0 -3px 5px #FFFFFF, 0 22px 48px rgba(16,45,53,0.20), 0 0 0 1px rgba(255,255,255,0.9)',
      menuStyle: 'position: absolute; left: 20px; width: 300px; top: ' + (below ? top + Math.max(64, h) + 12 : top - H - 12).toFixed(1) + 'px; transform-origin: ' + (below ? 'top' : 'bottom') + ' left; border-radius: 28px; padding: 9px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(125deg, rgba(239,249,239,0.86), rgba(231,241,227,0.66) 55%, rgba(205,232,210,0.76)); backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3); box-shadow: inset 1px 1px 2px rgba(255,255,255,0.75), inset -1px -1px 3px rgba(59,113,102,0.18), 0 18px 44px rgba(29,54,53,0.20)'
    };
  }
}
</script>
</body>
</html>
