<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","لسه ما بدأتش أحوّش","المتوسطات غير متاحة"],"default":"عادي","section":"الحالة"},"age":{"editor":"enum","options":["معروف","مش مكتوب"],"default":"معروف","section":"الحالة"},"income":{"editor":"enum","options":["معروف","مش معروف"],"default":"معروف","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":1500}}'>
// جزء «هتبقى معاك كام» في أول شاشة الاستثمار (§87 + §89 عند جلسة كوتلن: جوه الشاشة العادية، من غير اسم «مستقبلي»)

const NOW = 2026, MONTH = 10, CH = [1, 2, 5, 10, 15, 20, 25, 30, 40], S = 100000000n, E12 = 1000000000000n;
const C = {
  sa: { cur: 'ر.س', cash: 735000, re: 57600000, gold: 5256000, stk: 8900000, debts: [[3480000, 145000], [100000, 25000], [245000, 0]], save: 180000, low: -45000, income: 1596667, unknownStart: 50000, passive: 0, cpi: 174, rg: 1488, rs: 795, step: 50, miles: [[10000000, '100 ألف'], [50000000, 'نص مليون'], [100000000, 'أول مليون']],

  eg: { cur: 'ج.م', cash: 2530000, re: 384000000, gold: 42000000, stk: 66000000, debts: [[735000, 0]], save: 600000, low: -150000, income: 1125000, unknownStart: 200000, passive: 1125000, cpi: 1633, rg: 3422, rs: 1942, step: 250, miles: [[100000000, 'أول مليون'], [500000000, '5 مليون'], [1000000000, '10 مليون']],

};
const GOALS = [['السفر', 2 / 12], ['جوال جديد', 2 / 12], ['الطوارئ', 8 / 12]];
class Component extends DCLogic {
  constructor(props) { super(props); let marks = []; try { marks = JSON.parse(window.sessionStorage.getItem('masroufy-year-marks') || '[]'); } catch (e) {} this.state = { years: 10, today: true, amount: null, mix: 'mine', path: null, wheel: false, marks: Array.isArray(marks) ? marks : [] }; this.mo = {}; }
  mulDiv(a, n, d) { const neg = (a < 0n) !== (n < 0n) && a !== 0n && n !== 0n; const x = (a < 0n ? -a : a) * (n < 0n ? -n : n); const q = (x * 2n + d) / (d * 2n); return neg ? -q : q; }
  pow12(m) { let x = S; for (let i = 0; i < 12; i++) x = (x * (S + m) + S / 2n) / S; return x; }
  monthly(bp) { if (!bp) return 0n; if (this.mo[bp] != null) return this.mo[bp]; const t = S + BigInt(bp) * 10000n; let lo = -60000000n, hi = 25000000n; while (lo < hi) { const mid = lo + (hi - lo) / 2n; if (this.pow12(mid) >= t) hi = mid; else lo = mid + 1n; } const b = lo - 1n; return (this.mo[bp] = t - this.pow12(b) < this.pow12(lo) - t ? b : lo); }
  fmt(minor) { const a = Math.abs(minor); return (minor < 0 ? '−' : '') + String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  pct(bp) { const a = Math.abs(bp), f = a % 100; return (bp < 0 ? '−' : '') + (a - f) / 100 + '.' + (f < 10 ? '0' : '') + f + '%'; }
  digits(v) { return String(v || '').replace(/[٠-٩۰-۹]/g, (d) => '٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹'.indexOf(d) % 10).trim(); }
  mixBp(c, mix) { if (mix === 'stk') return c.rs; if (mix === 'gold') return c.rg; if (mix === 're') return c.cpi; const w = c.re + c.gold + c.stk; return w ? Number((BigInt(c.re) * BigInt(c.cpi) + BigInt(c.gold) * BigInt(c.rg) + BigInt(c.stk) * BigInt(c.rs)) / BigInt(w)) : c.rs; }
  // 40 سنة شهر بشهر، وبنسجّل آخر كل سنة: الخطوط التلاتة + الدهب والأسهم واللي استثمرته بفلوس النهارده (للدخل من غير شغل)
  project(c, save, amt2, amt3, mix, today) {
    const m = { re: this.monthly(c.cpi), gold: this.monthly(c.rg), stk: this.monthly(c.rs), mix: this.monthly(mix) };

        const v = (x) => (today ? real(x) : Number(x));
        out.l1.push(v(base + BigInt(save * t))); out.l2.push(v(base + p2)); out.l3.push(v(base + p3));

    }

  }
  // الدخل من غير شغل في الشهر (بفلوس النهارده): الربح فوق الغلاء بس من الدهب والأسهم واللي استثمرته + الإيجار والعائد المعروفين

  renderVals() {
    const s = this.state, st = this.props.state ?? 'عادي', eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a), n = (x) => x.toLocaleString('en-US');
    const na = st === 'المتوسطات غير متاحة', low = st === 'لسه ما بدأتش أحوّش';
    const c = eg ? C.eg : C.sa, other = eg ? C.sa : C.eg;
    const save = low ? c.low : c.save, incomeKnown = this.props.income !== 'مش معروف';
    const tenth = incomeKnown ? (c.income - (c.income % 1000)) / 10 : c.unknownStart, stepAmt = eg ? 50000 : 10000;
    const startAmt = Math.max(stepAmt, Math.round((low ? tenth : save + tenth) / stepAmt) * stepAmt);
    const amt = s.amount != null ? s.amount : startAmt, years = s.years, Y = NOW + years, today = s.today;
    const mix = this.mixBp(c, s.mix), marks0 = Array.isArray(s.marks) ? s.marks : [];
    let birth = null; try { birth = window.sessionStorage.getItem('masroufy-birth'); } catch (e) {}

    const cut = (a) => a.slice(0, years + 1), mk = (v) => '≈ ' + this.fmt(v) + ' ' + c.cur, mo = T(' شهريًا', ' في الشهر');

    const P = [

      if (i < 0) { mileRows.push({ label, when: T('ليس خلال 40 سنة', 'مش خلال 40 سنة'), done: false }); return; }
      if (i <= years) marks.push({ key: sel.key, i, label });
      mileRows.push({ label, when: 'سنة ' + (NOW + i) + ' (' + T('بعد ', 'بعد ') + name(i) + ')', done: false });
    });
    GOALS.forEach(([g]) => mileRows.push({ label: 'هدف «' + g + '»', when: g === 'الطوارئ' ? 'يونيو 2027' : 'ديسمبر 2026', done: false, goal: true }));
    // الدخل من غير شغل للطريق المختار: النهارده ووقتها (وبالرقم الاسمي لو اختار «زي ما هيكون»)
    const nom = (v) => (today ? v : Number(this.mulDiv(BigInt(v), E12, pr.F[years])));
    const potY = pr && sel.id !== 'keep' ? pr.inv[years][sel.key === 'l2' ? 'p2' : 'p3'] : 0;
    const passive = pr ? { now: this.fmt(this.passiveAt(c, pr, 0, 0, mix)) + ' ' + c.cur, year: Y, value: this.fmt(nom(this.passiveAt(c, pr, years, potY, mix))) + ' ' + c.cur, label: sel.title,
      note: T('الربح فوق الغلاء فقط دون أن تمس الأصل: الذهب ', 'الربح فوق الغلاء بس من غير ما تلمس الأصل: الدهب ') + this.pct(Math.max(0, c.rg - c.cpi)) + T(' · الأسهم ', ' · الأسهم ') + this.pct(Math.max(0, c.rs - c.cpi)) + T(' سنويًا', ' في السنة') + (c.passive ? T(' + الإيجار وعائد الشهادة ', ' + الإيجار وعائد الشهادة ') + this.fmt(c.passive) + ' ' + c.cur : '') } : null;
    // البلدين: «زي ما إنت» لكل بلد بعملته، والمجمّع بسعر صرف النهارده (1 ر.س = 13.9330 ج.م)
    const op = na ? null : this.project(other, other.save, other.save, other.save, this.mixBp(other, 'mine'), today);
    const FX = 139330n, mine = pr ? pr.l1[years] : null, theirs = op ? op.l1[years] : null;
    const conv = theirs == null ? 0 : Number(eg ? this.mulDiv(BigInt(theirs), FX, 10000n) : this.mulDiv(BigInt(theirs), 10000n, FX));
    const countries = pr ? { rows: [[eg ? 'مصر' : 'السعودية', mk(mine)], [eg ? 'السعودية' : 'مصر', '≈ ' + this.fmt(theirs) + ' ' + other.cur]], total: mk(mine + conv), year: Y,
      fx: T('لو استمر كل شيء كما هو · بسعر صرف اليوم: 1 ر.س = 13.93 ج.م — من سعر الدولار بالريال وبالجنيه (ياهو فاينانس، 10 أكتوبر 2026)', 'لو كل حاجة فضلت زي ما هي · بسعر صرف النهارده: 1 ر.س = 13.93 ج.م — من سعر الدولار بالريال وبالجنيه (ياهو فاينانس، 10 أكتوبر 2026)'),
      warn: today ? '' : T('الرقم المجمّع بسعر صرف اليوم، والجنيه يتحرك كثيرًا — تقريبي جدًا.', 'الرقم المجمّع بسعر صرف النهارده، والجنيه بيتحرك كتير — تقريبي جدًا.') } : null;
    const debtNow = c.debts.reduce((x, d) => x + d[0], 0), assetsNow = c.re + c.gold + c.stk, netNow = c.cash + assetsNow - debtNow;
    const chipStyle = (on) => 'height: 36px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; ' + (on ? 'color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const end = pr ? pr[sel.key][years] : 0, delta = end - netNow;
    const maxAmt = Math.max(startAmt * 4, incomeKnown ? c.income : 0);
    return {
      withHold: this.props.holdingsState != null, holdState: this.props.holdingsState || 'عادي', holdExtra: Array.isArray(this.props.extra) ? this.props.extra : [],
      onAdd: () => { if (typeof this.props.onAdd === 'function') this.props.onAdd(); },
      ok: !!pr, na, naText: T('غير متاح: ملف المتوسطات لم يصل بعد، فلا نستطيع حساب الأرباح.', 'غير متاح: ملف المتوسطات لسه ما وصلش، فمش هنقدر نحسب الأرباح.'),
      spaceName: eg ? 'مصر' : 'السعودية', cur: c.cur, startYear: NOW, series, marks, flags: GOALS.map(([g, x]) => ({ x, label: 'هدف «' + g + '»' })), ageNow: ageNow || 0, focusKey: sel.key, focusLabel: sel.title,
      youIn: T('أنت بعد', 'إنت كمان'), yearsLabel: name(years), years, wheelAria: T('غيّر المدة، الآن ', 'غيّر المدة، دلوقتي ') + name(years),
      yearLine: 'سنة ' + Y + (ageNow ? T(' · عمرك وقتها ', ' · هتبقى ') + n(ageNow + years) + ' سنة' : ''), noAge: !ageNow, ageLink: T('اكتب عمرك في حاسبة التقاعد ←', 'اكتب سنك في حاسبة التقاعد ←'),
      heroText: pr ? mk(end) : '', heroSentence: sel.sentence + (today ? '' : T(' — بالرقم كما سيكون وقتها', ' — بالرقم زي ما هيكون وقتها')),
      nowLine: T('اليوم ', 'النهارده ') + mk(netNow), deltaText: pr ? (delta >= 0 ? '+' : '') + this.fmt(delta) : '', deltaStyle: 'font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (delta >= 0 ? '#A6DEC1' : '#FFA8AC'),
      openWheel: () => this.setState({ wheel: true }), closeWheel: () => this.setState({ wheel: false }), wheelOpen: !!s.wheel, markYears: marks0,
      onPick: (k) => { if (CH.indexOf(k) >= 0) this.setState({ years: k }); },
      onMark: (y) => { const list = marks0.filter((x) => x !== y).concat([y]).sort((a, b) => a - b); try { window.sessionStorage.setItem('masroufy-year-marks', JSON.stringify(list)); } catch (e) {} this.setState({ marks: list, years: y - NOW > s.years ? CH.find((k) => k >= y - NOW) || 40 : s.years }); },
      onUnmark: (y) => { const list = marks0.filter((x) => x !== y); try { window.sessionStorage.setItem('masroufy-year-marks', JSON.stringify(list)); } catch (e) {} this.setState({ marks: list }); },
      pathsTitle: T('اختر طريقك', 'اختار طريقك'), pathsSub: T('الرقم في الأعلى والخط العريض يتغيران معه', 'الرقم اللي فوق والخط العريض بيتغيّروا معاه'),
      paths: P.map((p) => { const on = p === sel; return { title: p.title, desc: p.desc, value: pr ? mk(pr[p.key][years]) : '', on: on ? 'true' : 'false', pick: () => this.setState({ path: p.id }),
        key: 'width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0; background: ' + p.color,
        style: 'width: 100%; border: 0; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font: inherit; color: #193D33; cursor: pointer; background: ' + (on ? '#DCEBD6' : 'rgba(25,61,51,0.035)') + '; box-shadow: ' + (on ? 'inset 0 0 0 1.5px #08634F' : 'none') }; }),
      showStepper: sel.id === 'more', stepTitle: T('كم تستثمر شهريًا؟', 'هتستثمر كام في الشهر؟'), amountText: this.fmt(amt) + ' ' + c.cur,
      plus: () => this.setState({ amount: Math.min(maxAmt, amt + stepAmt) }), minus: () => this.setState({ amount: Math.max(stepAmt, amt - stepAmt) }),
      plusLabel: T('زد ', 'زوّد ') + this.fmt(stepAmt), minusLabel: T('قلّل ', 'قلّل ') + this.fmt(stepAmt),
      amountHint: low ? (incomeKnown ? T('بدأنا بنحو 10% من دخلك (ادفع لنفسك أولًا)', 'بدأنا بحوالي 10% من دخلك (ادفع لنفسك الأول)') : T('دخلك غير معروف، فبدأنا بـ', 'دخلك مش معروف، فبدأنا بـ') + this.fmt(c.unknownStart) + ' ' + c.cur) : T('ادخارك الحالي ', 'تحويشك دلوقتي ') + this.fmt(save) + T(' + نحو 10% من دخلك', ' + حوالي 10% من دخلك'),
      showMix: sel.id !== 'keep', mixTitle: T('تستثمرها في', 'بتستثمرها في'),
      mixes: [['mine', T('مثل أملاكك', 'زي أملاكك')], ['stk', 'أسهم'], ['gold', T('ذهب', 'دهب')], ['re', 'عقار']].map(([k, label]) => ({ label, on: s.mix === k ? 'true' : 'false', pick: () => this.setState({ mix: k }), style: chipStyle(s.mix === k) })),
      mixSource: T('بمتوسط ', 'بمتوسط ') + this.pct(mix) + T(' سنويًا', ' في السنة') + (s.mix === 'mine' ? T(' (متوسط أملاكك بحسب قيمة كل نوع)', ' (متوسط أملاكك حسب قيمة كل نوع)') : ' — ' + (s.mix === 'stk' ? c.src.stk : s.mix === 'gold' ? c.src.gold : c.src.cpi)),
      chartTitle: T('كم سيصبح معك', 'هيبقى معاك كام'),
      modes: [[true, T('بقيمة اليوم', 'بفلوس النهارده')], [false, T('وقتها', 'زي ما هيكون')]].map(([v, label]) => ({ label, on: s.today === v ? 'true' : 'false', pick: () => this.setState({ today: v }), style: 'height: 34px; padding: 0 10px; border: 0; border-radius: 11px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; ' + (s.today === v ? 'color: #08634F; background: #FFFFFF; box-shadow: 0 2px 8px rgba(29,54,53,0.10)' : 'color: #637570; background: transparent') })),
      chartNote: T('الخط العريض طريقك المختار · مرّر إصبعك على التشارت لترى أي سنة', 'الخط العريض هو طريقك · حرّك صباعك على التشارت تشوف أي سنة'),
      pins: marks0.map((y) => ({ i: y - NOW, label: String(y) })), hasPins: marks0.length > 0 && !!pr, pinsTitle: T('علاماتك', 'علاماتك'),
      pinRows: pr ? marks0.map((y) => ({ year: String(y), value: mk(pr[sel.key][y - NOW]) })) : [],
      mileRows, passive, countries
