<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مصادر الدخل — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.ih-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.ih-press:active{transform:scale(.97)}
.ih-in{animation:ih-in 280ms cubic-bezier(.2,.8,.2,1) both}
@keyframes ih-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ih-press{transition:none}.ih-press:active{transform:none}.ih-in{animation:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div style="display: flex; align-items: center; gap: 12px">
    <sc-if value="{{isHub}}" hint-placeholder-val="{{ true }}"><a href="More.dc.html" data-back="1" class="ih-press" aria-label="رجوع" style="width: 48px; height: 48px; text-decoration: none; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #193D33; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a></sc-if>
    <sc-if value="{{isKind}}" hint-placeholder-val="{{ false }}"><button type="button" class="ih-press" onClick="{{back}}" aria-label="رجوع" style="width: 48px; height: 48px; border: 0; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #193D33; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button></sc-if>
    <h1 style="margin: 0; flex: 1 1 auto; font-size: 22px; font-weight: 700">{{title}}</h1>
  </div>

  <sc-if value="{{isHub}}" hint-placeholder-val="{{ true }}"><div class="ih-in" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
      <button type="button" class="ih-press" onClick="{{k.open}}" style="{{k.style}}">
        <span style="{{k.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.icon}}"></path></svg></span>
        <span style="font-size: 15px; font-weight: 700">{{k.name}}</span>
        <span style="{{k.subStyle}}">{{k.sub}}</span>
      </button>
    </sc-for>
  </div></sc-if>

  <sc-if value="{{isKind}}" hint-placeholder-val="{{ false }}"><div class="ih-in" style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 700; color: #637570">{{nowLabel}}</span>
    <sc-for list="{{now}}" as="x" hint-placeholder-count="1">
      <a href="IncomeSourceDetail.dc.html" class="ih-press" style="text-decoration: none; color: #193D33; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
        <span style="{{kindTile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{kindIcon}}"></path></svg></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{x.name}}</span><span style="font-size: 12px; color: #637570">{{x.line}}</span></span>
        <span dir="ltr" style="font-size: 15px; font-weight: 700; color: #13764D; font-variant-numeric: tabular-nums">{{x.amount}}</span>
      </a>
    </sc-for>
    <sc-if value="{{noNow}}" hint-placeholder-val="{{ false }}"><div style="border-radius: 22px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: rgba(8,99,79,0.06)"><span style="{{kindTile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{kindIcon}}"></path></svg></span><span style="font-size: 14px; font-weight: 700">{{noNowText}}</span></div></sc-if>
    <div style="display: flex; gap: 8px"><sc-for list="{{acts}}" as="a" hint-placeholder-count="2"><button type="button" class="ih-press" onClick="{{a.go}}" style="{{a.style}}">{{a.label}}</button></sc-for></div>
    <sc-if value="{{hasPast}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: #637570">{{pastLabel}}</span>
      <div style="border-radius: 22px; padding: 8px 16px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
        <sc-for list="{{past}}" as="p" hint-placeholder-count="2">
          <a href="IncomeSourceDetail.dc.html" style="display: flex; gap: 12px; text-decoration: none; color: #193D33">
            <span aria-hidden="true" style="width: 12px; display: flex; flex-direction: column; align-items: center"><span style="width: 10px; height: 10px; margin-top: 14px; border-radius: 5px; background: #9AB0A7"></span><span style="{{p.line}}"></span></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 0 12px"><span style="font-size: 15px; font-weight: 700">{{p.name}}</span><span style="font-size: 12px; color: #637570">{{p.dates}}</span></span>
          </a>
        </sc-for>
      </div>
    </div></sc-if>
  </div></sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 12px 18px; border-radius: 18px; font-size: 14px; font-weight: 700; color: #FFFFFF; background: rgba(25,61,51,0.92)">{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// مصادر الدخل بعد الدمج (قرار المالك 2026-10-23، §112 عن طريق جلسة كوتلن): «مصادر الدخل» و«جهات العمل» شاشة واحدة
// فوق: الأنواع ثابتة دايمًا (حتى لو فاضية — توجيه «الهيكل الثابت») · جوه النوع: «دلوقتي» + «اللي فات» كخط زمني (الشركات اللي اشتغلت فيها)
// الإيجار نوع هنا (قرار الخريطة). الأسماء والمبالغ مخترعة، بالوحدة الصغرى
const withCur = (v, c) => (c === '⃁' ? '⁦⃁ ' + v + '⁩' : v + ' ' + c);
const ICON = { job: 'M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 13h18', part_time: 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18', client: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8', rent: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', investment: 'M3 17l6-6 4 4 8-8M15 7h6v6', pension: 'M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z', other: 'M12 5v14M5 12h14' };
const DATA = {
  sa: [
    { kind: 'job', name: 'شركة الريادة للحلول', since: '28 أبريل 2026', end: null, pay: 'يوم 28 شهريًا', expected: 1250000 },
    { kind: 'job', name: 'مجموعة السهم التجارية', since: 'مارس 2025', end: 'أبريل 2026' },
    { kind: 'job', name: 'مؤسسة النخبة', since: 'يناير 2023', end: 'فبراير 2025' },
    { kind: 'part_time', name: 'مكتب الواحة للتصميم', since: '10 أغسطس 2026', end: null, pay: 'كل خميس', expected: 80000 },
    { kind: 'client', name: 'متجر نورة للعطور', since: 'يناير 2026', end: 'يونيو 2026' }
  ],
  eg: [
    { kind: 'rent', name: 'شقة المعادي', since: '1 يناير 2026', end: null, pay: 'يوم 5 كل شهر', expected: 900000 },
    { kind: 'investment', name: 'شهادة ادخار', since: '1 يوليو 2026', end: null, pay: 'يوم 1 كل شهر', expected: 225000 },
    { kind: 'job', name: 'شركة الدلتا للمقاولات', since: 'سبتمبر 2021', end: 'فبراير 2024' }
  ]
};
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kind: null, toast: '' }; }
  componentDidUpdate() { if (this.state.toast && !this._t) this._t = setTimeout(() => { this._t = null; this.setState({ toast: '' }); }, 2200); }
  componentWillUnmount() { clearTimeout(this._t); }
  fmt(m) { return String(Math.round(m / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (sa, e) => (eg ? e : sa), s = this.state, cur = eg ? 'ج.م' : '⃁';
    const NAME = { job: T('دوام كامل', 'دوام كامل'), part_time: T('دوام جزئي', 'بارت تايم'), client: T('عميل أو عمل حر', 'عميل أو فري لانس'), rent: 'إيجار', investment: T('عائد استثمار', 'عائد استثمار'), pension: 'معاش', other: T('دخل آخر', 'دخل تاني') };
    const list = DATA[eg ? 'eg' : 'sa'];
    const tile = (on) => 'width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); ' + (on ? 'color: #08634F; background: rgba(8,99,79,0.10)' : 'color: #8A9A95; background: rgba(99,117,112,0.10)');
    const order = ['job', 'part_time', 'client', 'rent', 'investment', 'pension', 'other'];
    const kinds = order.map((k) => {
      const xs = list.filter((x) => x.kind === k), now = xs.filter((x) => !x.end), has = xs.length > 0;
      const sub = now.length ? now[0].name : has ? T('سابقًا: ', 'قبل كده: ') + xs[0].name : T('أضف', 'ضيف');
      return { name: NAME[k], icon: ICON[k], tile: tile(!!now.length), sub, open: () => this.setState({ kind: k }),
        subStyle: 'font-size: 12px; line-height: 1.5; ' + (now.length ? 'color: #13764D; font-weight: 700' : 'color: #637570'),
        style: 'border: 0; border-radius: 22px; padding: 14px; min-height: 120px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font: inherit; text-align: right; cursor: pointer; color: #193D33; ' + (has ? 'background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)' : 'background: rgba(255,255,255,0.55); box-shadow: inset 0 0 0 1.5px rgba(204,216,204,0.9)') };
    });
    const k = s.kind, xs = k ? list.filter((x) => x.kind === k) : [], now = xs.filter((x) => !x.end), past = xs.filter((x) => x.end);
    const btn = (main) => 'flex: 1 1 0; min-height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (main ? 'color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #08634F; background: rgba(8,99,79,0.10)');
    const isWork = k === 'job' || k === 'part_time';
    return {
      title: k ? NAME[k] : T('مصادر الدخل', 'مصادر الدخل'),
      back: () => this.setState({ kind: null }),
      isHub: !k, isKind: !!k, kinds,
      kindIcon: k ? ICON[k] : '', kindTile: tile(true),
      nowLabel: isWork ? T('عملك الحالي', 'شغلك دلوقتي') : T('الحالي', 'دلوقتي'),
      now: now.map((x) => ({ name: x.name, line: (x.pay || '') + ' · ' + T('منذ ', 'من ') + x.since, amount: x.expected ? withCur(this.fmt(x.expected), cur) : '' })),
      noNow: !now.length, noNowText: isWork ? T('لا عمل حاليًا', 'مش شغال دلوقتي') : T('لا شيء حاليًا', 'مفيش حاجة دلوقتي'),
      acts: (isWork && now.length ? [[T('غيّرت عملي', 'غيّرت شغلي'), true], [T('أضف آخر', 'ضيف تاني'), false]] : [[T('أضف', 'ضيف'), true]]).map(([label, main]) => ({ label, style: btn(main), go: () => this.setState({ toast: T('يفتح شاشة الإضافة', 'بيفتح شاشة الإضافة') }) })),
      hasPast: past.length > 0, pastLabel: isWork ? T('أماكن عملت فيها', 'أماكن اشتغلت فيها') : T('السابق', 'اللي فات'),
      past: past.map((x, i) => ({ name: x.name, dates: x.since + ' – ' + x.end, line: 'flex: 1 1 auto; width: 2px; margin-top: 4px; background: ' + (i < past.length - 1 ? 'rgba(154,176,167,0.5)' : 'transparent') })),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
