<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الديون القديمة — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.d-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.d-press:active{transform:scale(.97)}
.d-veil{animation:d-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.d-up{animation:d-up 450ms cubic-bezier(.2,.7,.3,1) both}
.d-in{animation:d-in 380ms cubic-bezier(.2,.7,.3,1) backwards}
@keyframes d-fade{from{opacity:0}to{opacity:1}}
@keyframes d-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes d-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.d-press{transition:none}.d-press:active{transform:none}.d-up,.d-in{animation:d-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
input::placeholder{color:#8A9A95}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div style="position: fixed; inset: 0; z-index: 9">
    <button type="button" class="d-veil" onClick="{{closeSheet}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
    <div role="dialog" aria-modal="true" aria-label="{{title}}" class="d-up" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; box-sizing: border-box; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
      <span style="font-size: 18px; font-weight: 700">{{title}}</span>
      <span style="font-size: 13px; color: #637570">{{note}}</span>

      <sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}">
        <div style="border-radius: 18px; padding: 2px 12px; background: rgba(25,61,51,0.04)">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
            <div class="d-in" style="{{r.rowStyle}}">
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{r.name}}</span><span style="{{r.dirStyle}}">{{r.dirLabel}}</span></span>
              <span dir="ltr" style="{{r.amountStyle}}">{{r.amount}}</span>
              <button type="button" class="d-press" onClick="{{r.remove}}" aria-label="{{r.removeLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #637570; cursor: pointer; background: transparent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <span style="font-size: 13px; font-weight: 700">{{whoLabel}}</span>
      <div role="radiogroup" aria-label="{{whoLabel}}" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{p.on}}" class="d-press" onClick="{{p.pick}}" style="{{p.style}}">{{p.name}}</button>
        </sc-for>
      </div>
      <input type="text" aria-label="{{newLabel}}" placeholder="{{newLabel}}" value="{{newName}}" onInput="{{typeName}}" maxlength="80" aria-invalid="{{nameInvalid}}" aria-describedby="pd-name-err" style="{{nameStyle}}">
      <sc-if value="{{nameBad}}" hint-placeholder-val="{{ false }}"><span id="pd-name-err" role="alert" style="font-size: 13px; color: #BE3D48">{{nameErr}}</span></sc-if>

      <sc-if value="{{askDir}}" hint-placeholder-val="{{ false }}">
        <div role="radiogroup" aria-label="{{dirTitle}}" style="display: flex; gap: 8px">
          <sc-for list="{{dirs}}" as="dv" hint-placeholder-count="2">
            <button type="button" role="radio" aria-checked="{{dv.on}}" class="d-press" onClick="{{dv.pick}}" style="{{dv.style}}">{{dv.label}}</button>
          </sc-for>
        </div>
      </sc-if>

      <label for="pd-amount" style="font-size: 13px; font-weight: 700">{{amountLabel}}</label>
      <div style="{{amountBox}}">
        <input id="pd-amount" type="text" inputmode="decimal" dir="ltr" value="{{amountText}}" onInput="{{typeAmount}}" placeholder="0" aria-invalid="{{amountInvalid}}" aria-describedby="pd-amount-err" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 0; background: transparent; font: inherit; font-size: 20px; font-weight: 700; color: #193D33; outline: none; text-align: right; font-variant-numeric: tabular-nums">
        <span style="font-size: 14px; color: #637570">{{currency}}</span>
      </div>
      <sc-if value="{{amountBad}}" hint-placeholder-val="{{ false }}"><span id="pd-amount-err" role="alert" style="font-size: 13px; color: #BE3D48">{{amountErr}}</span></sc-if>

      <div style="display: flex; gap: 8px; margin-top: 4px">
        <button type="button" class="d-press" onClick="{{add}}" style="flex: 1 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #08634F; cursor: pointer; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px rgba(8,99,79,0.35)">{{addLabel}}</button>
        <button type="button" class="d-press" onClick="{{finish}}" style="flex: 1 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.25)">{{doneLabel}}</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["recv","pay","both"],"default":"recv","section":"الحالة"},"tried":{"editor":"enum","options":["0","1"],"default":"0","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // ديون قديمة من أسئلة «كمّل ملفك»: بتتكتب في الأشخاص على طول من غير عملية (§26 · §27 — ManagePeople.addOpeningDebt)
  constructor(props) {
    super(props);
    const mode = (props && props.mode) || 'recv';
    this.state = { rows: [], who: null, newName: '', amountText: '', dir: mode === 'pay' ? 'pay' : 'recv', tried: (props && props.tried) === '1' };
  }
  fmt(minor) { const a = Math.abs(minor); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  toMinor(text) { const t = String(text || '').replace(/[٠-٩۰-۹]/g, (d) => '٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹'.indexOf(d) % 10).replace(/٫/g, '.').replace(/[^0-9.]/g, ''); if (!t) return null; const [w, f = ''] = t.split('.'); return parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10); }
  current() {
    const s = this.state;
    const name = s.newName.trim() || s.who || '';
    const okText = /^\s*\d[\d,]*(\.\d{1,2})?\s*$/.test(s.amountText);
    const minor = okText ? this.toMinor(s.amountText) : null;
    return { name, minor, ok: !!name && minor != null && minor > 0, empty: !name && !s.amountText.trim() };
  }
  add() {
    const c = this.current();
    if (!c.ok) { this.setState({ tried: true }); return null; }
    const row = { name: c.name, dir: this.state.dir, minor: c.minor };
    this.setState({ rows: this.state.rows.concat([row]), who: null, newName: '', amountText: '', tried: false });
    return row;
  }
  finish() {
    const c = this.current();
    let rows = this.state.rows;
    if (!c.empty || !rows.length) { const r = this.add(); if (!r) return; rows = rows.concat([r]); }
    if (this.props.onDone) this.props.onDone(rows);
  }
  renderVals() {
    const s = this.state;
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const T = (msa, egy) => (eg ? egy : msa);
    const cur = eg ? 'ج.م' : 'ر.س';
    const c = this.current();
    const nameBad = s.tried && !c.name;
    const amountBad = s.tried && !(c.minor > 0);
    const chip = (on) => 'min-height: 44px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%)' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const DIR = { recv: T('لك عنده', 'ليك عنده'), pay: T('عليك له', 'عليك ليه') };
    return {
      title: T('أضف الديون القديمة', 'ضيف الديون القديمة'),
      note: T('تظهر في الأشخاص وتُسدَّد عاديًا، ولا تدخل في المصروف ولا الدخل ولا رصيد الكاش.', 'بتظهر في الأشخاص وتتسدد عادي، ومش بتدخل في المصروف ولا الدخل ولا رصيد الكاش.'),
      hasRows: s.rows.length > 0,
      rows: s.rows.map((r, i) => ({ name: r.name, dirLabel: DIR[r.dir],
        dirStyle: 'font-size: 12px; font-weight: 700; color: ' + (r.dir === 'recv' ? '#13764D' : '#BE3D48'),
        amount: (r.dir === 'recv' ? '+' : '−') + this.fmt(r.minor) + ' ' + cur,
        amountStyle: 'font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (r.dir === 'recv' ? '#13764D' : '#BE3D48'),
        remove: () => this.setState({ rows: s.rows.filter((x, j) => j !== i) }), removeLabel: T('حذف ', 'شيل ') + r.name,
        rowStyle: 'display: flex; align-items: center; gap: 8px; min-height: 56px;' + (i === s.rows.length - 1 ? '' : ' border-bottom: 1px solid rgba(204,216,204,0.55);') })),
      whoLabel: T('مَن؟', 'مين؟'),
      people: ['ليلى', 'يوسف', 'سارة', 'خالد', 'عمر'].map((nm) => { const on = s.who === nm && !s.newName.trim();
        return { name: nm, on: on ? 'true' : 'false', style: chip(on), pick: () => this.setState({ who: nm, newName: '' }) }; }),
      newLabel: T('أو اكتب اسم شخص جديد', 'أو اكتب اسم شخص جديد'), newName: s.newName,
      typeName: (e) => this.setState({ newName: e.target.value }), nameInvalid: nameBad ? 'true' : 'false', nameBad,
      nameErr: T('أدخل اسم كل شخص', 'اكتب اسم كل شخص'),
      nameStyle: 'height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; color: #193D33; outline: none; background: #FFFFFF; box-shadow: inset 0 0 0 ' + (nameBad ? '1.5px #BE3D48' : '1px rgba(204,216,204,0.9)'),
      // «الاتنين»: يختار الاتجاه لكل شخص
      askDir: (this.props.mode || 'recv') === 'both', dirTitle: T('الاتجاه', 'الاتجاه'),
      dirs: ['recv', 'pay'].map((d) => ({ label: DIR[d], on: s.dir === d ? 'true' : 'false', pick: () => this.setState({ dir: d }), style: chip(s.dir === d) + '; flex: 1 1 0' })),
      amountLabel: (s.dir === 'recv' ? T('كم لك عنده؟', 'ليك عنده كام؟') : T('كم عليك له؟', 'عليك ليه كام؟')), currency: cur,
      amountText: s.amountText, typeAmount: (e) => this.setState({ amountText: e.target.value }), amountInvalid: amountBad ? 'true' : 'false', amountBad,
      // ONBOARD_DEBT_AMOUNT بالاسم؛ ولو الاسم لسه ناقص، الجملة من غير اسم
      amountErr: c.name ? T('يجب أن يكون مبلغ دين «' + c.name + '» أكبر من صفر', 'مبلغ دين «' + c.name + '» لازم يكون أكبر من صفر') : T('يجب أن يكون المبلغ أكبر من صفر', 'المبلغ لازم يكون أكبر من صفر'),
      amountBox: 'display: flex; align-items: center; height: 48px; border-radius: 16px; padding: 0 14px; gap: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 ' + (amountBad ? '1.5px #BE3D48' : '1px rgba(204,216,204,0.9)'),
      addLabel: T('أضف شخصًا آخر', 'ضيف شخص تاني'), add: () => { this.add(); },
      doneLabel: T('تم', 'تمام'), finish: () => this.finish(),
      closeSheet: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
