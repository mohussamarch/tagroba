<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اسأل مصروفي — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.k-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.k-press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.k-press{transition:none}.k-press:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; pointer-events: none; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">

  <sc-if value="{{closed}}" hint-placeholder-val="{{ true }}">
    <div style="{{barWrapStyle}}">
      <div style="flex: 1 1 auto; min-width: 0; height: 44px; border-radius: 22px; display: flex; align-items: center; background: linear-gradient(135deg, rgba(255,255,255,0.86), rgba(225,233,234,0.70) 50%, rgba(255,255,255,0.90)); backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3); box-shadow: inset 1px 2px 3px #FFFFFF, inset 0 -3px 5px rgba(255,255,255,0.85), 0 10px 24px rgba(29,54,53,0.14), 0 0 0 0.5px rgba(155,179,179,0.25)">
        <button type="button" class="k-press" onClick="{{openIt}}" style="flex: 1 1 auto; min-width: 0; height: 48px; margin: -2px 0; border: 0; padding: 0 14px 0 6px; background: transparent; font: inherit; font-size: 13px; color: #637570; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#08634F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M19 15l.7 1.8L21.5 17.5l-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
          <span style="flex: 1 1 auto; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{barText}}</span>
        </button>
        <sc-if value="{{micSide}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="k-press" onClick="{{listenNow}}" aria-label="أضف بالصوت" style="width: 44px; height: 48px; margin: -2px 0; flex-shrink: 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <span style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #08634F; background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(227,239,230,0.80) 55%, rgba(201,230,212,0.90)); box-shadow: inset 1px 1px 2px #FFFFFF, inset -1px -2px 3px rgba(8,99,79,0.16), 0 3px 8px rgba(8,99,79,0.14)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
          </span>
        </button>
        </sc-if>
        <sc-if value="{{addSide}}" hint-placeholder-val="{{ false }}">
        <button type="button" class="k-press" onClick="{{addNow}}" aria-label="{{addLabel}}" style="width: 44px; height: 48px; margin: -2px 0; flex-shrink: 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <span style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: linear-gradient(145deg, rgba(14,140,112,0.94), rgba(8,99,79,0.90)); box-shadow: inset 1px 1px 2px rgba(200,255,235,0.5), inset -1px -2px 3px rgba(0,47,48,0.3), 0 4px 10px rgba(8,99,79,0.26)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          </span>
        </button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 30; pointer-events: auto">
      <dc-import name="AssistantChat" space="{{spaceName}}" context="{{ctx}}" brand-name="{{brandName}}" brand-title="{{brandTitle}}" listen-first="{{voice}}" on-close="{{closeIt}}" hint-size="390px,844px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"context":{"editor":"enum","options":["الرئيسية","العمليات","الأشخاص","الاستثمار","المزيد"],"default":"الرئيسية","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"startOpen":{"editor":"boolean","default":false,"section":"الحالة"},"bottom":{"editor":"int","default":88,"section":"الحالة"},"addInBar":{"editor":"boolean","default":false,"section":"الحالة"},"onAdd":{"editor":null},"$preview":{"width":390,"height":844}}'>
// اسم المساعد ولقبه في مكان واحد (لسه مش متحسوم — المالك بيختار): الشريط ورأس المحادثة و«بيكتب» وأسماء الأزرار كلها بتاخد من هنا
const BRAND = { name: 'مصروفي', title: 'مساعدك المالي الذكي' };
// الشريط الرفيع فوق شريط التنقل (§73 §74). الضغط عليه بيفتح صفحة المحادثة (AssistantChat) فوق الشاشة كلها،
// والميكروفون بيفتحها وهي بتسمع على طول. المحادثة نفسها بتفضل لو اتقفلت أو اتنقلت (§67) — متخزنة جوه AssistantChat.
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: !!props.startOpen, voice: false };
  }
  componentDidUpdate(prev) {
    if (prev.startOpen !== this.props.startOpen) this.setState({ open: !!this.props.startOpen, voice: false });
  }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const open = this.state.open;
    return {
      closed: !open, isOpen: open,
      openIt: () => this.setState({ open: true, voice: false }),
      closeIt: () => this.setState({ open: false, voice: false }),
      listenNow: () => this.setState({ open: true, voice: true }),
      barWrapStyle: "position: absolute; left: 20px; right: 20px; bottom: " + (Number(this.props.bottom) || 88) + "px; height: 48px; display: flex; align-items: center; pointer-events: auto",
      micSide: !this.props.addInBar, addSide: !!this.props.addInBar,
      addNow: () => { if (typeof this.props.onAdd === "function") this.props.onAdd(); },
      addLabel: eg ? "ضيف عملية" : "أضف عملية",
      barText: eg ? 'اسأل ' + BRAND.name + ' أو اطلب منه أي حاجة…' : 'اسأل ' + BRAND.name + ' أو اطلب منه أي شيء…',
      spaceName: eg ? 'مصر' : 'السعودية',
      ctx: this.props.context ?? 'الرئيسية',
      brandName: BRAND.name, brandTitle: BRAND.title,
      voice: this.state.voice
    };
  }
}
</script>
</body>
</html>
