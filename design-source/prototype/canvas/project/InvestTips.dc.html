class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    return {
      spaceName: eg ? 'مصر' : 'السعودية', title: eg ? 'النصايح' : 'النصائح',
      intro: eg ? 'نصايح عامة من جهات رسمية، اقراها براحتك.' : 'نصائح عامة من جهات رسمية، اقرأها على مهل.'

}
