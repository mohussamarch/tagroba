<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الجمعيات — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.m-scroll{scrollbar-width:none}.m-scroll::-webkit-scrollbar{display:none}.m-scroll>*{flex-shrink:0}
.m-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1)}
.m-press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.m-press{transition:none}.m-press:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: radial-gradient(70% 38% at 100% 0%, rgba(166,222,193,0.45), transparent 70%), radial-gradient(60% 34% at 0% 62%, rgba(155,197,255,0.16), transparent 70%), radial-gradient(80% 40% at 50% 100%, rgba(166,222,193,0.40), transparent 70%), linear-gradient(155deg, #FAF9F3 0%, #EFF3ED 48%, #DCE9DF 100%)">
  <div class="m-scroll" style="height: 844px; box-sizing: border-box; overflow-y: auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <a href="Operations.dc.html" data-back="1" class="m-press" aria-label="رجوع" style="width: 48px; height: 48px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #193D33; text-decoration: none; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; flex: 1 1 auto">الجمعيات</h1>
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 8px; text-align: center">
        <div aria-label="مكان رسمة الشاشة الفاضية" style="width: 120px; height: 80px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed rgba(8,99,79,0.35); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #637570">رسمة بخط واحد</div>
        <span style="font-size: 14px; font-weight: 700; margin-top: 8px">{{emptyTitle}}</span>
        <span style="font-size: 13px; color: #637570">{{emptyBody}}</span>
      </div>
    </sc-if>

    <sc-for list="{{roscas}}" as="r" hint-placeholder-count="2">
      <div style="border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 14px 32px rgba(29,54,53,0.09)">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: #637570">{{r.terms}}</span></span>
          <span style="{{r.stageStyle}}">{{r.stage}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; justify-content: space-between; font-size: 12px; color: #637570"><span>{{r.progressLabel}}</span><span>{{r.turn}}</span></span>
          <span role="progressbar" aria-valuenow="{{r.pct}}" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 4px; overflow: hidden; background: rgba(25,61,51,0.08)"><span style="{{r.bar}}"></span></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <span style="display: flex; flex-direction: column; padding: 8px 10px; border-radius: 14px; background: rgba(25,61,51,0.04)"><span style="font-size: 11px; color: #637570">{{paidLabel}}</span><span dir="ltr" style="text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.paid}}</span></span>
          <span style="display: flex; flex-direction: column; padding: 8px 10px; border-radius: 14px; background: rgba(25,61,51,0.04)"><span style="font-size: 11px; color: #637570">{{gotLabel}}</span><span dir="ltr" style="text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.got}}</span></span>
          <span style="display: flex; flex-direction: column; padding: 8px 10px; border-radius: 14px; background: rgba(25,61,51,0.04)"><span style="font-size: 11px; color: #637570">{{gainLabel}}</span><span style="{{r.gainStyle}}">{{r.gain}}</span></span>
        </div>
        <span style="{{r.posStyle}}">{{r.position}}</span>
      </div>
    </sc-for>

    <button type="button" disabled="{{true}}" aria-describedby="rosca-soon" style="height: 48px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); opacity: 0.45; cursor: default">{{newLabel}}</button>
    <span id="rosca-soon" style="font-size: 12px; color: #637570; text-align: center">{{soon}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["عادي","فاضي","غير متاح"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  fmt(minor) { const a = Math.abs(minor); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const st = this.props.state ?? 'عادي';
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const k = eg ? 3 : 1, cur = eg ? 'ج.م' : 'ر.س';
    const n = (x) => x.toLocaleString('ar-EG');
    const na = st === 'غير متاح';
    // مخترعة. القسط والأدوار بالوحدة الصغرى
    const defs = [
      { name: eg ? 'جمعية العيلة' : 'جمعية العائلة', turns: 10, inst: 100000, paidN: 4, myTurn: na ? null : 6, gotN: 0, stage: 'save' },
      { name: eg ? 'جمعية الشغل' : 'جمعية العمل', turns: 6, inst: 50000, paidN: 6, myTurn: 2, gotN: 1, stage: 'done' }
    ];
    const S = {
      save: { label: eg ? 'ادخار' : 'ادخار', style: 'color: #08634F; background: #DCEBD6' },
      pay: { label: eg ? 'سداد' : 'سداد', style: 'color: #956000; background: #FBF0DD' },
      done: { label: eg ? 'خلصت' : 'انتهت', style: 'color: #637570; background: rgba(99,117,112,0.12)' }
    };
    const roscas = st === 'فاضي' ? [] : defs.map((d) => {
      const paid = d.paidN * d.inst * k;
      const got = d.gotN * d.turns * d.inst * k;
      const pct = Math.floor((d.paidN * 100) / d.turns);
      const pos = paid - got;
      return {
        name: d.name,
        terms: n(d.turns) + (eg ? ' أدوار · ' : ' أدوار · ') + this.fmt(d.inst * k) + ' ' + cur + (eg ? ' كل شهر' : ' شهريًا'),
        stage: S[d.stage].label,
        stageStyle: 'font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; flex-shrink: 0; ' + S[d.stage].style,
        progressLabel: (eg ? 'دفعت ' : 'دفعت ') + n(d.paidN) + (eg ? ' من ' : ' من ') + n(d.turns),
        turn: d.myTurn == null ? (eg ? 'دورك لسه ما اتعرفش' : 'دورك غير معروف بعد') : (eg ? 'دورك رقم ' : 'دورك رقم ') + n(d.myTurn),
        pct: String(pct),
        bar: 'display: block; height: 8px; border-radius: 4px; width: ' + pct + '%; background: #27785B',
        paid: this.fmt(paid), got: got ? this.fmt(got) : '—',
        gain: d.myTurn == null ? 'غير متاح' : (eg ? 'ولا حاجة' : 'لا شيء'),
        gainStyle: 'font-size: 13px; font-weight: 700; color: #637570',
        position: d.stage === 'done' ? (eg ? 'خلصت من غير مكسب ولا خسارة.' : 'انتهت بلا ربح ولا خسارة.') : pos > 0 ? (eg ? 'الجمعية شايلالك ' : 'الجمعية تحفظ لك ') + this.fmt(pos) + ' ' + cur : (eg ? 'عليك للجمعية ' : 'عليك للجمعية ') + this.fmt(-pos) + ' ' + cur,
        posStyle: 'font-size: 13px; font-weight: 700; color: ' + (pos > 0 && d.stage !== 'done' ? '#13764D' : '#637570')
      };
    });
    return {
      isEmpty: st === 'فاضي',
      emptyTitle: eg ? 'مفيش جمعيات' : 'لا توجد جمعيات',
      emptyBody: eg ? 'ضيف جمعية وهنحسبلك دفعت كام وقبضت كام.' : 'أضف جمعية لنحسب ما دفعت وما قبضت.',
      roscas,
      paidLabel: 'دفعت', gotLabel: eg ? 'قبضت' : 'قبضت', gainLabel: eg ? 'المكسب' : 'الربح',
      newLabel: eg ? 'جمعية جديدة' : 'جمعية جديدة',
      soon: eg ? 'معالج الجمعية (٨ أسئلة) بيتبني في الخطوة الجاية.' : 'معالج الجمعية (٨ أسئلة) يُبنى في الخطوة القادمة.'
    };
  }
}
</script>
</body>
</html>
