      <span role="status" style="{{sumStyle}}">{{sumLine}}</span>

        <button type="button" class="bs-press" onClick="{{back}}" style="flex: 1 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #193D33; cursor: pointer; background: rgba(25,61,51,0.07)">{{backLabel}}</button>

        <span style="font-size: 16px; font-weight: 700; color: #08634F">{{doneTitle}}</span>

    </sc-if>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"provider":{"editor":"enum","options":["تابي","تمارا"],"default":"تابي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"onBack":{"editor":null},"onDone":{"editor":null},"$preview":{"width":390,"height":844}}'>
// خصم تابي/تمارا المجمّع (بند 4 من DESIGN-BRIEF-0.6 · طلب المالك 2026-10-17): خصم واحد فيه أكتر من قسط
// بيتفتح من «مجموع أكتر من قسط» في «ده قسط من أنهي مشترى؟» (`BnplSheet`) · الأقساط المستحقة اللي مجموعها = الخصم بالظبط بتتعلّم لوحدها «غالبًا دول» وانت تأكد
// تقدر تعدّل مبلغ أي قسط بإيدك، وتزوّد «+ مشترى جديد» (اسم + أول دفعة + قسمتها على كام). «وزّع» بيتفتح بس لما المجموع = الخصم بالظبط. المبالغ كلها بالهللة/القرش
const fmt = (m) => { const a = Math.abs(m), f = a % 100; return String((a - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; };
const money = (m, c) => (c === '⃁' ? '⁦⃁ ' + fmt(m) + '⁩' : '⁦' + fmt(m) + '⁩ ' + c);
const toMinor = (t) => { const p = String(t || '').replace(/[^\d.]/g, '').split('.'); return Number(p[0] || 0) * 100 + Number(((p[1] || '') + '00').slice(0, 2)); };
const plain = (m) => (m % 100 ? fmt(m) : fmt(m).slice(0, -3)).replace(/,/g, '');
// الخطط المفتوحة لو اللوحة لوحدها (جوه `BnplSheet` بتيجي من فوق): الاسم · القسط · اتدفع · العدد · الجاي
const OPEN = { 'تابي': [['سماعة لاسلكية', 25000, 2, 4, '7 نوفمبر'], ['طقم أواني', 18000, 2, 3, '20 أكتوبر']], 'تمارا': [['ساعة رياضية', 40000, 1, 4, '1 نوفمبر']] };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = this.fresh(props); }
  fresh(p) {
    const k = (p.space ?? 'السعودية') === 'مصر' ? 3 : 1;
    const plans = (OPEN[p.provider ?? 'تابي'] || []).map(([name, inst, paid, total, next]) => ({ name, inst: inst * k, paid, total, next }));
    const debit = Number(p.debit) > 0 ? Number(p.debit) : 43000 * k;
    const all = plans.reduce((t, x) => t + x.inst, 0);
    const sel = {}, amts = {};
    plans.forEach((x) => { sel[x.name] = all === debit; amts[x.name] = plain(x.inst); });
    return { plans, debit, k, sel, amts, sugg: all === debit && plans.length > 1, news: [], nid: 0, done: false };
  }
  componentDidUpdate(prev) { if (prev.provider !== this.props.provider || prev.space !== this.props.space || prev.debit !== this.props.debit) this.setState(this.fresh(this.props)); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (msa, egy) => (eg ? egy : msa);
    const s = this.state, cur = eg ? 'ج.م' : '⃁', prov = this.props.provider ?? 'تابي';
    const green = 'linear-gradient(160deg, #0A7A62 0%, #08634F 100%)';
    const setNew = (id, patch) => this.setState((st) => ({ news: st.news.map((x) => (x.id === id ? Object.assign({}, x, patch) : x)) }));
    const picked = s.plans.filter((x) => s.sel[x.name]);
    const sum = picked.reduce((t, x) => t + toMinor(s.amts[x.name]), 0) + s.news.reduce((t, x) => t + toMinor(x.amt), 0);
    const left = s.debit - sum;
    const count = picked.length + s.news.length;
    const saveOff = left !== 0 || count < 2 || s.news.some((x) => !x.name.trim() || !toMinor(x.amt));
    const rows = picked.map((x) => ({ name: x.name, amt: money(toMinor(s.amts[x.name]), cur) })).concat(s.news.map((x) => ({ name: x.name.trim() + T(' (جديد · الدفعة ', ' (جديد · الدفعة ') + x.at + T(' من ', ' من ') + x.split + ')', amt: money(toMinor(x.amt), cur) })));
    const tick = (on) => 'width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #08634F' : 'background: #FFFFFF; border: 1.5px solid rgba(25,61,51,0.28)');
    return {
      provider: prov,
      badge: 'min-width: 52px; height: 52px; padding: 0 8px; box-sizing: border-box; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; ' + (prov === 'تابي' ? 'color: #0B3B2E; background: #3BFFC1' : 'color: #FFFFFF; background: #2D2D6E'),
      debitLine: T('خصم من ', 'خصم من ') + prov + T(' · اليوم', ' · النهارده'), debitText: money(s.debit, cur), cur,
      title: T('هذا الخصم فيه كم قسط؟', 'الخصم ده فيه كام قسط؟'),
      lead: T('علّم الأقساط التي خُصمت معًا، وعدّل المبلغ إن اختلف. وإن كان فيه مشترى جديد أضفه.', 'علّم الأقساط اللي اتخصمت مع بعض، وعدّل المبلغ لو مختلف. ولو فيه مشترى جديد زوّده.'),
      isEdit: !s.done, isDone: s.done,
      hasSugg: s.sugg, sugg: T('غالبًا هذه: أقساط ', 'غالبًا دول: أقساط ') + s.plans.map((x) => '«' + x.name + '»').join(T(' و', ' و')) + T(' مستحقة، ومجموعها = المبلغ تمامًا. أكّد أو عدّل.', ' مستحقة، ومجموعهم = المبلغ بالظبط. أكّد أو عدّل.'),
      instLabel: T('قيمة القسط', 'قيمة القسط'), firstLabel: T('قيمة الدفعة', 'قيمة الدفعة'),
      amtRow: 'display: flex; align-items: center; gap: 8px; font-size: 13px; color: #637570',
      amtInput: 'width: 112px; height: 42px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; text-align: left; direction: ltr; font-variant-numeric: tabular-nums; color: #193D33; background: rgba(25,61,51,0.05)',
      parts: s.plans.map((x) => {
        const on = !!s.sel[x.name];
        return { name: x.name, on: on ? 'true' : 'false', showAmt: on, amt: s.amts[x.name], tick: tick(on),
          sub: T('بقي ', 'فاضل ') + (x.total - x.paid) + T(' من ', ' من ') + x.total + T(' · القسط ', ' · القسط ') + money(x.inst, cur) + T(' · القادم ', ' · الجاي ') + x.next,
          card: 'border-radius: 18px; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; box-shadow: ' + (on ? 'inset 0 0 0 1.5px #08634F' : 'inset 0 0 0 1px rgba(25,61,51,0.10)'),
          pick: () => this.setState((st) => ({ sel: Object.assign({}, st.sel, { [x.name]: !st.sel[x.name] }), sugg: false })),
          type: (e) => { const v = e && e.target ? e.target.value : ''; this.setState((st) => ({ amts: Object.assign({}, st.amts, { [x.name]: v }), sugg: false })); } };
      }),
      newTitle: T('مشترى جديد', 'مشترى جديد'), newPh: T('ماذا اشتريت؟ مثل: مكنسة', 'اشتريت إيه؟ مثلًا: مكنسة'), removeLabel: T('إزالة', 'شيل'),
      splitLabel: T('قسّمتها على', 'قسمتها على'), atLabel: T('هذه الدفعة رقم', 'الدفعة دي رقم'),
      news: s.news.map((x) => ({ name: x.name, amt: x.amt,
        typeName: (e) => setNew(x.id, { name: e && e.target ? e.target.value : '' }),
        typeAmt: (e) => setNew(x.id, { amt: e && e.target ? e.target.value : '' }),
        remove: () => this.setState((st) => ({ news: st.news.filter((y) => y.id !== x.id) })),
        ats: Array.from({ length: x.split }, (y, i) => i + 1).map((n) => ({ label: String(n), on: x.at === n ? 'true' : 'false', pick: () => setNew(x.id, { at: n }),
          style: 'width: 40px; height: 40px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; ' + (x.at === n ? 'font-weight: 700; color: #FFFFFF; background: ' + green : 'color: #193D33; background: rgba(25,61,51,0.06)') })),
        splits: [2, 3, 4, 6].map((n) => ({ label: String(n), on: x.split === n ? 'true' : 'false', pick: () => setNew(x.id, { split: n, at: Math.min(x.at, n) }),
          style: 'width: 40px; height: 40px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; ' + (x.split === n ? 'font-weight: 700; color: #FFFFFF; background: ' + green : 'color: #193D33; background: rgba(25,61,51,0.06)') })) })),
      addLabel: T('+ مشترى جديد', '+ مشترى جديد'),
      addNew: () => this.setState((st) => ({ news: st.news.concat([{ id: st.nid + 1, name: '', amt: left > 0 ? plain(left) : '', split: 4, at: 1 }]), nid: st.nid + 1, sugg: false })),
      sumLine: left === 0 ? T('الموزَّع ', 'الموزّع ') + money(sum, cur) + T(' — يطابق الخصم تمامًا', ' — مطابق للخصم بالظبط') : left > 0 ? T('الموزَّع ', 'الموزّع ') + money(sum, cur) + T(' · يتبقى ', ' · فاضل ') + money(left, cur) : T('الموزَّع ', 'الموزّع ') + money(sum, cur) + T(' · يزيد ', ' · زيادة ') + money(-left, cur),
      sumStyle: 'font-size: 13px; font-weight: 700; color: ' + (left === 0 ? '#08634F' : '#956000'),
      saveOff, saveLabel: T('وزّع على الأقساط', 'وزّع على الأقساط'),
      saveStyle: 'flex: 2 1 0; height: 52px; border: 0; border-radius: 18px; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; background: ' + green + '; ' + (saveOff ? 'opacity: 0.45; cursor: default' : 'cursor: pointer'),
      save: () => { if (!saveOff) this.setState({ done: true }); },
      backLabel: T('رجوع', 'رجوع'), back: () => { if (s.done) { this.setState({ done: false }); return; } if (typeof this.props.onBack === 'function') this.props.onBack(); },
      doneTitle: T('تم التوزيع', 'اتوزّع'), doneRows: rows,
      doneNote: T('كل خطة عُلّم فيها قسط «دُفع» بالمبلغ ده، والمشترى الجديد اتعملت له خطة كل شهر، والدفعات التي قبل رقمها عُلّمت «دُفعت قبل ذلك» دون عمليات جديدة.', 'كل خطة اتعلّم فيها قسط «اتدفع» بالمبلغ ده، والمشترى الجديد اتعملّه خطة كل شهر، والدفعات اللي قبل رقمها اتعلّمت «اتدفعت قبل كده» من غير عمليات جديدة.'),
      finishLabel: T('تم', 'تمام'), finish: () => { if (typeof this.props.onDone === 'function') this.props.onDone({ parts: rows.map((r) => r.name) }); else this.setState(this.fresh(this.props)); }
    };
  }
}
