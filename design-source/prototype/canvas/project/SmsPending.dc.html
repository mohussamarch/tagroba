<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33; background: #F4F2EA">

        <div role="status" style="display: flex; flex-direction: column; gap: 8px">

          <span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums"><span style="color: #08634F">{{recText}}</span><span style="color: #956000">{{leftText}}</span></span>
          <span style="font-size: 12px; color: #637570">{{nowShape}}</span>
          <span style="border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #08634F; background: #DCEBD6">{{bgNote}}</span>
        </div>
      </sc-if>
      <sc-if value="{{heroBtn}}" hint-placeholder-val="{{ true }}"><button type="button" class="sp-press" onClick="{{heroAct}}" style="{{heroBtnStyle}}">{{heroLabel}}</button></sc-if>
    </div>

        <span style="display: flex; align-items: center; gap: 8px"><span style="{{salChip}}">{{salChipText}}</span><span style="font-size: 13px; font-weight: 700; color: #956000">{{salTitle}}</span></span>
        <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 14px">{{salLine}}</span><span style="font-size: 16px; font-weight: 700; color: #08634F; font-variant-numeric: tabular-nums">{{salAmt}}</span></span>
        <div style="display: flex; gap: 8px">

              </div>
            </sc-for>
          </div>
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 12px; color: #637570">{{g.shown}}</span><sc-if value="{{g.hasMore}}" hint-placeholder-val="{{ true }}"><button type="button" class="sp-press" onClick="{{g.more}}" style="height: 36px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(8,99,79,0.08)">{{g.moreLabel}}</button></sc-if></span>
          <button type="button" class="sp-press" onClick="{{g.confirm}}" style="height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.22)">{{g.confirmLabel}}</button>
        </sc-if>
        <sc-if value="{{g.done}}" hint-placeholder-val="{{ false }}">
          <span class="sp-in" style="display: flex; align-items: center; gap: 8px; border-radius: 14px; padding: 8px 8px 8px 12px; background: #DCEBD6"><span style="flex: 1 1 auto; font-size: 13px; font-weight: 700; color: #08634F">{{g.doneText}}</span><sc-if value="{{g.canUndo}}" hint-placeholder-val="{{ true }}"><button type="button" class="sp-press" onClick="{{g.undo}}" style="height: 36px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #08634F; cursor: pointer; background: rgba(255,255,255,0.7)">{{undoLabel}}</button></sc-if></span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{hasStrip}}" hint-placeholder-val="{{ false }}">
    <div role="status" class="sp-in" style="position: absolute; left: 16px; right: 16px; bottom: 24px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 18px; color: #FFFFFF; background: rgba(25,61,51,0.94); box-shadow: 0 12px 28px rgba(25,61,51,0.28)">
      <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.6">{{strip}}</span>
      <button type="button" class="sp-press" onClick="{{stripUndo}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 0; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #9FE0C8; cursor: pointer; background: rgba(255,255,255,0.10)">{{undoLabel}}</button>
    </div>
  </sc-if>

  <sc-if value="{{away}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 9"><dc-import name="SmsAway" phase="{{awayPhase}}" waiting="{{awayWaiting}}" space="{{spaceName}}" on-open="{{backIn}}" hint-size="390px,844px"></dc-import></div>
  </sc-if>
</div>

<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["مستنية","بيسجّل","في الخلفية","خلصت"],"default":"مستنية","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// مخترعة · [المعرّف، البنك، الشكل، النوع، [حقول اتقرت]، عدد الرسايل، [[اسم، وقت، مبلغ بالهللة]...]]
const G = [
  ['g1', 'بنك الواحة', 'شراء بالبطاقة', 'out', ['المحل', 'المبلغ', 'البطاقة •••• 22'], 14, [['مقهى المرسى', '1:12 م', 2300], ['صيدلية الشفاء', '11:40 ص', 4150], ['مخبز السنابل', 'أمس', 1200], ['محطة وقود الطريق', 'أمس', 9000], ['بقالة الحي', '15 أكتوبر', 6325], ['مطعم الريف', '14 أكتوبر', 5800]]],
  ['g2', 'بنك الواحة', 'تحويل لحساب', 'transfer', ['الحساب •••• 4821', 'المبلغ'], 4, [['تحويل لحساب آخره 4821', '10:05 ص', 50000], ['تحويل لحساب آخره 7710', 'أمس', 12000], ['تحويل لحساب آخره 4821', '12 أكتوبر', 30000]]],
  ['g3', 'مصرف الريان', 'مبلغ وارد', 'in', ['المبلغ', 'من •••• 1190'], 3, [['مبلغ وارد', '9:30 ص', 30000], ['مبلغ وارد', '11 أكتوبر', 15000], ['مبلغ وارد', '2 أكتوبر', 30000]]]
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timers = [];
    this.state = this.fresh(props.state);
    this.backIn = () => this.setState({ run: this.state.rec >= this.total() ? 'done' : 'running' });
  }
  total() { return G.reduce((a, g) => a + g[5], 0); }
  fresh(st) {
    const v = st ?? 'مستنية';
    const base = { run: null, rec: 0, conf: {}, page: {}, hidden: {}, salary: 'wait', strip: '', last: null };
    if (v === 'بيسجّل') { Object.assign(base, { run: 'running', rec: 9 }); this.go(); }
    if (v === 'في الخلفية') { Object.assign(base, { run: 'away', rec: 15 }); this.go(); }
    if (v === 'خلصت') Object.assign(base, { run: 'done', rec: this.total(), conf: { g1: 'all', g2: 'all', g3: 'all' } });
    return base;
  }
  componentDidUpdate(prev) { if (prev.state !== this.props.state) { this.stop(); this.setState(this.fresh(this.props.state)); } }
  componentWillUnmount() { this.stop(); }
  stop() { this.timers.forEach(clearInterval); this.timers = []; }
  // «أكّد الأشكال»: بيكمّل حتى لو سبت الصفحة (رد المالك 2026-10-17) — العدادات بتتحرك وهو شغال
  go() {
    this.stop();
    this.timers.push(setInterval(() => {
      const t = this.total(), n = Math.min(t, (this.state.rec || 0) + 1);
      if (n >= t) { this.stop(); this.setState({ rec: t, run: this.state.run === 'away' ? 'away' : 'done', conf: { g1: 'all', g2: 'all', g3: 'all' } }); }
      else this.setState({ rec: n });
    }, 420));
  }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const s = this.state, k = eg ? 3 : 1, T = this.total();
    const n = (x) => x.toLocaleString('en-US');
    const fmt = (m) => { const f = m % 100; return String((m - f) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (f < 10 ? '0' : '') + f; };
    const money = (m, sign) => eg ? '⁦' + sign + fmt(m) + '⁩ ج.م' : '⁦' + sign + '⃁ ' + fmt(m) + '⁩';
    const KIND = { out: [eg ? 'مصروف' : 'مصروف', '#BE3D48', 'rgba(190,61,72,0.10)', '−'], in: [eg ? 'دخل' : 'دخل', '#08634F', '#DCEBD6', '+'], transfer: [eg ? 'تحويل' : 'تحويل', '#2469BA', 'rgba(36,105,186,0.10)', '−'] };
    const running = s.run === 'running' || (s.run === 'away' && s.rec < T);
    const hide = (id, msg) => this.setState({ hidden: Object.assign({}, s.hidden, { [id]: true }), strip: msg, last: id });
    const groups = G.map(([id, bank, shape, kind, fields, cnt, L], gi) => {
      const cum = G.slice(0, gi + 1).reduce((a, x) => a + x[5], 0), reached = running && s.rec >= cum;
      const kd = KIND[kind], page = s.page[id] || 1, conf = s.conf[id];
      const vis = L.slice(0, page * 3).map((x, i) => [id + '.' + i, x]).filter(([lid]) => !s.hidden[lid]);
      const gone = L.filter((x, i) => s.hidden[id + '.' + i]).length;
      const left = cnt - gone;
      return {
        bank: (eg ? 'من ' : 'من ') + bank, shape, count: conf || reached ? '' : n(left) + (eg ? ' رسالة' : ' رسالة'),
        open: !conf && !running && left > 0, done: !!conf || reached,
        why: eg ? 'أول رسالة بالشكل ده من البنك ده: أكّدها مرة، وبعد كده رسايل الشكل ده بتتسجل لوحدها' : 'أول رسالة بهذا الشكل من هذا البنك: أكّدها مرة، وبعدها تُسجَّل رسائل هذا الشكل تلقائيًا',
        readLabel: eg ? 'فهمناها كده:' : 'فهمناها هكذا:', fields: fields.map((t) => ({ t })),
        lines: vis.map(([lid, [name, when, amt]], i) => ({
          name: eg ? name.replace('ينتهي بـ', 'آخره') : name, when, kind: kd[0], amount: money(amt * k, kd[3]),
          badge: 'flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: ' + kd[1] + '; background: ' + kd[2],
          amtStyle: 'flex-shrink: 0; min-width: 84px; text-align: left; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (kind === 'in' ? '#08634F' : '#193D33'),
          rowStyle: 'display: flex; flex-direction: column; gap: 8px; padding: 10px 2px;' + (i ? ' border-top: 1px solid rgba(25,61,51,0.07);' : ''),
          isTransfer: kind === 'transfer',
          whoLabel: eg ? 'سجّلها وحدد مين' : 'سجّلها وحدّد من', ownLabel: eg ? 'حسابي التاني' : 'حسابي الآخر',
          who: () => hide(lid, eg ? 'اتسجلت — «مين ده؟» مستنياك في تفاصيلها' : 'سُجّلت — «من هذا؟» بانتظارك في تفاصيلها'),
          own: () => hide(lid, eg ? 'اتسجلت تحويل بين محافظك' : 'سُجّلت تحويلًا بين محافظك')
        })),
        shown: (eg ? 'ظاهر ' : 'ظاهر ') + n(vis.length) + (eg ? ' من ' : ' من ') + n(left),
        hasMore: page * 3 < L.length, moreLabel: eg ? 'اعرض الأقدم' : 'اعرض الأقدم',
        more: () => this.setState({ page: Object.assign({}, s.page, { [id]: page + 1 }) }),
        confirmLabel: eg ? 'أكّد الشكل ده' : 'أكِّد هذا الشكل',
        confirm: () => this.setState({ conf: Object.assign({}, s.conf, { [id]: vis.length }) }),
        doneText: conf === 'all' || reached ? (eg ? 'اتسجلت ' : 'سُجّلت ') + n(left) + (eg ? ' بالشكل ده' : ' بهذا الشكل') : (eg ? 'اتسجلت ' : 'سُجّلت ') + n(conf || 0) + (eg ? '، ومعاها ' : '، ومعها ') + n(Math.max(0, left - (conf || 0))) + (eg ? ' بنفس الشكل' : ' بالشكل نفسه'),
        canUndo: conf !== 'all' && !reached && !running,
        undo: () => { const c = Object.assign({}, s.conf); delete c[id]; this.setState({ conf: c }); }
      };
    });
    const openN = groups.filter((g) => g.open).length;
    const waitMsgs = G.reduce((a, g) => a + (s.conf[g[0]] ? 0 : g[5] - g[6].filter((x, i) => s.hidden[g[0] + '.' + i]).length), 0);
    const remaining = (running || s.run === 'away' ? T - s.rec : waitMsgs) + (s.salary === 'wait' ? 1 : 0);
    const finished = s.run === 'done';
    const shapeNow = G.find((g, gi) => s.rec < G.slice(0, gi + 1).reduce((a, x) => a + x[5], 0)) || G[G.length - 1];
    return {
      title: eg ? 'مستنية تأكيدك' : 'بانتظار تأكيدك',
      countText: n(remaining),
      countStyle: 'font-size: 13px; font-weight: 700; min-width: 28px; height: 28px; padding: 0 8px; box-sizing: border-box; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; ' + (remaining ? 'color: #FFFFFF; background: #956000' : 'color: #08634F; background: #DCEBD6'),
      heroTitle: running ? (eg ? 'بنسجّل بالأشكال اللي أكدتها…' : 'نسجّل بالأشكال التي أكدتها…') : finished ? (eg ? 'خلّصنا — اتسجلت ' : 'اكتمل — سُجّلت ') + n(T) + (eg ? ' رسالة' : ' رسالة') : remaining ? n(remaining) + (eg ? ' رسالة مستنية — من ' : ' رسالة بانتظارك — من ') + n(openN) + (eg ? ' أشكال' : ' أشكال') + (s.salary === 'wait' ? (eg ? ' ومرتب' : ' وراتب') : '') : (eg ? 'مفيش حاجة مستنية — كله اتسجّل.' : 'لا شيء بانتظارك — سُجّل كل شيء.'),
      heroSub: running ? (eg ? 'كل شكل بيتسجّل برسايله كلها، والعدادات بتتحرك وهو شغال.' : 'يُسجَّل كل شكل برسائله كلها، والعدادات تتحرك أثناء العمل.') : finished ? (s.salary === 'wait' ? (eg ? 'فاضل المرتب تحت — أكّده بنفسك.' : 'بقي الراتب بالأسفل — أكّده بنفسك.') : (eg ? 'الرسايل الجاية بنفس الأشكال دي هتتسجل لوحدها.' : 'تُسجَّل الرسائل القادمة بهذه الأشكال تلقائيًا.')) : (eg ? 'كل شكل بتأكّده مرة، ورسايله اللي جاية بتتسجل لوحدها. أو أكّد كل الأشكال مرة واحدة.' : 'تؤكد كل شكل مرة، ثم تُسجَّل رسائله القادمة تلقائيًا. أو أكّد الأشكال كلها مرة واحدة.'),
      showProgress: running,
      fill: 'display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #0A7A62, #13A07F); width: ' + Math.round((s.rec / T) * 100) + '%',
      recText: (eg ? 'اتسجل ' : 'سُجّل ') + n(s.rec), leftText: (eg ? 'مستني ' : 'متبقٍ ') + n(T - s.rec),
      nowShape: (eg ? 'دلوقتي: ' : 'الآن: ') + shapeNow[2] + ' · ' + shapeNow[1],
      bgNote: eg ? 'تقدر تسيب الصفحة — التسجيل هيكمّل في الخلفية وهنبعتلك إشعار لما يخلص' : 'يمكنك مغادرة الصفحة — يكتمل التسجيل في الخلفية ونرسل لك إشعارًا عند انتهائه',
      heroBtn: running || (!finished && openN > 0),
      heroLabel: running ? (eg ? 'اخرج — هيكمّل لوحده' : 'اخرج — يكمل وحده') : (eg ? 'أكّد الأشكال (' : 'أكّد الأشكال (') + n(openN) + ')',
      heroBtnStyle: 'height: 48px; border: 0; border-radius: 16px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ' + (running ? 'color: #193D33; background: rgba(25,61,51,0.06)' : 'color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 18px rgba(8,99,79,0.22)'),
      heroAct: () => { if (running) this.setState({ run: 'away' }); else { this.setState({ run: 'running', rec: G.reduce((a, g) => a + (s.conf[g[0]] ? g[5] : g[6].filter((x, i) => s.hidden[g[0] + '.' + i]).length), 0) }); this.go(); } },
      salaryWait: s.salary === 'wait' && !running,
      salChip: 'font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: #FFFFFF; background: #956000', salChipText: eg ? 'راتب' : 'راتب',
      salTitle: eg ? 'شكلها مرتبك' : 'تبدو راتبك',
      salLine: (eg ? 'تحويل وارد من جهة شغلك · 28 سبتمبر' : 'تحويل وارد من جهة عملك · 28 سبتمبر'), salAmt: money(850000 * k, '+'),
      salYesLabel: eg ? 'أيوه ده مرتبي' : 'نعم، هذا راتبي', salNoLabel: eg ? 'لأ، دخل تاني' : 'لا، دخل آخر',
      salYes: () => this.setState({ salary: 'yes', strip: eg ? 'اتسجّل مرتب — والتوقع بقى يتحسب منه' : 'سُجّل راتبًا — ويُحسب منه التوقع', last: 'salary' }),
      salNo: () => this.setState({ salary: 'no', strip: eg ? 'اتسجّل «دخل تاني»' : 'سُجّل «دخلًا آخر»', last: 'salary' }),
      groups,
      undoLabel: eg ? 'تراجع' : 'تراجع',
      hasStrip: !!s.strip && s.run !== 'away', strip: s.strip,
      stripUndo: () => { if (s.last === 'salary') this.setState({ salary: 'wait', strip: '' }); else if (s.last) { const h = Object.assign({}, s.hidden); delete h[s.last]; this.setState({ hidden: h, strip: '' }); } },
      away: s.run === 'away', awayPhase: s.rec < T ? 'بيسجّل' : 'خلص', awayWaiting: s.salary === 'wait', spaceName: eg ? 'مصر' : 'السعودية',
      backIn: this.backIn
    };
  }
}
</script>
</body>
</html>
