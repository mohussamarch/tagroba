<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المظهر الليلي وإخفاء الأرقام — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.np-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.np-press:active{transform:scale(.96)}
.np-root,.np-root *{transition:background-color 300ms ease,color 300ms ease,box-shadow 300ms ease}
@media (prefers-reduced-motion: reduce){.np-press{transition:none}.np-root,.np-root *{transition:none}}
</style>
</helmet>
<div dir="rtl" class="np-root" style="{{root}}">
  <div style="display: flex; align-items: center; gap: 10px">
    <span aria-hidden="true" style="{{avatar}}">م</span>
    <span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">{{hello}}</span><span style="{{muted}}">{{date}}</span></span>
  </div>

  <div style="{{hero}}">
    <span style="display: flex; align-items: center; gap: 8px">
      <span style="flex: 1 1 auto; font-size: 13px; color: #DCEBD6">{{heroLabel}}</span>
      <button type="button" class="np-press" onClick="{{toggleHide}}" aria-pressed="{{hideAria}}" aria-label="{{eyeLabel}}" style="width: 44px; height: 44px; border: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #FFFFFF; background: rgba(255,255,255,0.12)">
        <sc-if value="{{isHidden}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.1A10 10 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"></path></svg></sc-if>
        <sc-if value="{{isShown}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
      </button>
    </span>
    <span style="font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.5px">{{total}}</span>
    <span style="display: flex; justify-content: space-between; font-size: 13px; color: #DCEBD6"><span>{{freeLine}}</span><span>{{cashLine}}</span></span>
  </div>

  <div style="{{card}}">
    <span style="{{cap}}">{{opsTitle}}</span>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <span style="{{r.style}}"><span aria-hidden="true" style="{{icon}}">{{r.letter}}</span><span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="{{muted}}">{{r.sub}}</span></span><span style="{{r.amtStyle}}">{{r.amt}}</span></span>
    </sc-for>
  </div>

  <div style="{{card}}">
    <span style="{{cap}}">{{themeTitle}}</span>
    <div role="radiogroup" aria-label="{{themeTitle}}" style="{{segWrap}}"><sc-for list="{{themes}}" as="t" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{t.on}}" class="np-press" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
    <span style="display: flex; align-items: center; gap: 10px; padding-top: 6px">
      <span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{startTitle}}</span><span style="{{muted}}">{{startSub}}</span></span>
      <button type="button" role="switch" aria-checked="{{startAria}}" aria-label="{{startTitle}}" onClick="{{toggleStart}}" style="width: 56px; height: 48px; flex-shrink: 0; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent"><span style="{{track}}"><span style="{{knob}}"></span></span></button>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["فاتح","غامق"],"default":"غامق","section":"الحالة"},"hidden":{"editor":"boolean","default":false,"section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// المظهر الليلي + زرار إخفاء الأرقام (طلب المالك «ضروري» 2026-10-22)
// المظهر: فاتح · غامق · زي الجوال. الغامق: خلفية #0F1A17 · كروت #18241F · كلام #E6EFEA · باهت #9AB0A7 · الأخضر الأساسي #3FBF8F (أفتح عشان يتقري)، والكارت الرئيسي #0A4A3B
// العين في الكارت الرئيسي: كل المبالغ في البرنامج تبقى «••••» لحد ما تدوس تاني. «اخفي الأرقام لما أفتح البرنامج» بيخليها مخفية من الأول
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: props.theme === 'فاتح' ? 'light' : 'dark', hide: !!props.hidden, start: false }; }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme || prev.hidden !== this.props.hidden) this.setState({ theme: this.props.theme === 'فاتح' ? 'light' : 'dark', hide: !!this.props.hidden }); }
  renderVals() {
    const s = this.state, dk = s.theme !== 'light';
    const K = dk ? { bg: '#0F1A17', card: '#18241F', text: '#E6EFEA', muted: '#9AB0A7', line: 'rgba(230,239,234,0.08)', acc: '#3FBF8F', hero: 'linear-gradient(160deg, #0B5A47 0%, #083D31 100%)', soft: 'rgba(230,239,234,0.06)', shadow: 'none' }
      : { bg: '#EFF3ED', card: '#FFFFFF', text: '#193D33', muted: '#637570', line: 'rgba(204,216,204,0.55)', acc: '#08634F', hero: 'linear-gradient(160deg, #0A7A62 0%, #08634F 100%)', soft: 'rgba(25,61,51,0.06)', shadow: '0 1px 2px rgba(29,54,53,0.05), 0 12px 28px rgba(29,54,53,0.08)' };
    const H = '⁦••••⁩';
    const m = (txt) => (s.hide ? H + ' ج.م' : '⁦' + txt + '⁩ ج.م');
    const seg = (on) => 'flex: 1 1 0; height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'font-weight: 700; color: ' + K.text + '; background: ' + (dk ? '#24342E' : '#FFFFFF') + '; box-shadow: 0 1px 4px rgba(0,0,0,0.15)' : 'color: ' + K.muted + '; background: transparent');
    const R = [['مطعم الفول', 'أكل · النهارده', '-185.00', false], ['حوالة خالد', 'تحويل · امبارح', '+4,500.00', true], ['بنزينة', 'بنزين · امبارح', '-600.00', false]];
    return {
      root: "width: 390px; height: 844px; box-sizing: border-box; padding: 22px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; font-family: SAR, 'Noto Sans Arabic', Tahoma, sans-serif; color: " + K.text + '; background: ' + K.bg,
      avatar: 'width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: ' + K.acc + '; background: ' + K.soft,
      hello: 'مساء الخير يا محمد', date: 'الأربعا، 22 أكتوبر', muted: 'font-size: 12px; color: ' + K.muted,
      hero: 'border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 8px; color: #FFFFFF; background: ' + K.hero + (dk ? '; box-shadow: inset 0 0 0 1px rgba(63,191,143,0.18)' : '; box-shadow: 0 16px 32px rgba(8,99,79,0.25)'),
      heroLabel: 'معاك دلوقتي', total: s.hide ? H : '⁦ج.م 25,300⁩',
      freeLine: 'تقدر تصرف ' + m('15,000'), cashLine: 'كاش ' + m('2,700'),
      isHidden: s.hide, isShown: !s.hide, hideAria: s.hide ? 'true' : 'false', eyeLabel: s.hide ? 'بيّن الأرقام' : 'اخفي الأرقام',
      toggleHide: () => this.setState({ hide: !s.hide }),
      card: 'border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: ' + K.card + '; box-shadow: ' + K.shadow,
      cap: 'font-size: 13px; font-weight: 700; padding-bottom: 4px; color: ' + K.muted,
      icon: 'width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: ' + K.acc + '; background: ' + K.soft,
      opsTitle: 'آخر العمليات',
      rows: R.map(([name, sub, amt, inc], i) => ({ name, sub, letter: name[0], amt: s.hide ? H : '⁦' + amt + '⁩',
        style: 'display: flex; align-items: center; gap: 10px; min-height: 56px; ' + (i < R.length - 1 ? 'border-bottom: 1px solid ' + K.line : ''),
        amtStyle: 'flex-shrink: 0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (inc ? K.acc : K.text) })),
      themeTitle: 'المظهر', segWrap: 'display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: ' + K.soft,
      themes: [['light', 'فاتح'], ['dark', 'غامق'], ['auto', 'زي الجوال']].map(([id, label]) => ({ label, on: (id === 'auto' ? false : s.theme === id) ? 'true' : 'false', style: seg(id !== 'auto' && s.theme === id), pick: () => this.setState({ theme: id === 'auto' ? 'dark' : id }) })),
      startTitle: 'اخفي الأرقام لما أفتح البرنامج', startSub: 'تدوس على العين عشان تبان',
      startAria: s.start ? 'true' : 'false', toggleStart: () => this.setState({ start: !s.start }),
      track: 'position: relative; display: block; width: 44px; height: 26px; border-radius: 13px; background: ' + (s.start ? K.acc : (dk ? 'rgba(230,239,234,0.18)' : 'rgba(25,61,51,0.16)')),
      knob: 'position: absolute; top: 2px; right: ' + (s.start ? 20 : 2) + 'px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF'
    };
  }
}
</script>
</body>
</html>
