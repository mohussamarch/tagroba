<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دايرتك — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.me-ring{transition:background 420ms cubic-bezier(.2,.7,.3,1)}
</style>
</helmet>
<span role="img" aria-label="{{label}}" style="{{outer}}"><span aria-hidden="true" class="me-ring" style="{{ring}}"></span><span style="{{inner}}"><sc-if value="{{hasChar}}" hint-placeholder-val="{{ false }}"><dc-import name="CharacterArt" mode="راس" look="{{charLook}}" size="{{size}}" label="{{label}}" hint-size="48px,48px"></dc-import></sc-if></span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"number","default":48,"section":"الحالة"},"pct":{"editor":"number","default":60,"section":"الحالة"},"$preview":{"width":72,"height":72}}'>
// دايرة صاحب الحساب (طلب المالك 2026-10-08): جواها الكاركتر بتاعه، وحواليها شريط بنسبة اكتمال ملفه — والشريط بيختفي لما الملف يكمل 100%
// لو صاحب الحساب بنى الكاركتر من «ابني شخصيتك» (masroufy-character) بيظهر هنا (CharacterArt)، ولو لسه: شكل واحد محايد
// الأشكال الستة المؤقتة («اختر شكلك») اتشالت (المالك 2026-10-15: «ده ايه لازمته»)
class Component extends DCLogic {
  char() {
    const c = this.props.char;
    if (c && typeof c === 'object') return c;
    try { const v = window.sessionStorage.getItem('masroufy-character'); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  renderVals() {
    const ch = this.char();
    const size = Math.max(24, Number(this.props.size) || 48);
    const pct = Math.max(0, Math.min(100, Math.round(Number(this.props.pct ?? 60))));
    const done = pct >= 100;
    const head = '#4D747C', body = '#39575D';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="15.5" r="7.5" fill="' + head + '"/><path d="M4.5 41c0-9 6.9-15 15.5-15s15.5 6 15.5 15z" fill="' + body + '"/></svg>';
    const fig = "url('data:image/svg+xml," + encodeURIComponent(svg) + "')";
    // الشريط برّه الدايرة بس (طلب المالك): الدايرة نفسها زي ما هي بمقاسها وزجاجها، والشريط طبقة حواليها بمسافة صغيرة
    const T = Math.max(3, Math.round(size / 16)), G = 2;
    const cut = 'radial-gradient(farthest-side, transparent calc(100% - ' + T + 'px), #000 calc(100% - ' + T + 'px))';
    return {
      size, hasChar: !!ch, charLook: ch || {},
      label: 'شخصيتك' + (done ? '' : ' — ملفك مكتمل ' + pct.toLocaleString('en-US') + '%'),
      outer: 'position: relative; width: ' + size + 'px; height: ' + size + 'px; flex-shrink: 0; display: flex',
      ring: done ? 'display: none' : 'position: absolute; inset: -' + (T + G) + 'px; border-radius: 50%; pointer-events: none; background: conic-gradient(#13764D 0 ' + pct + '%, rgba(25,61,51,0.12) ' + pct + '% 100%); mask-image: ' + cut + '; -webkit-mask-image: ' + cut,
      inner: 'flex: 1 1 auto; border-radius: 50%; overflow: hidden; '
        + 'background: ' + (ch ? '' : fig + ' center bottom / 84% no-repeat, ') + 'linear-gradient(145deg, rgba(255,255,255,0.95), rgba(227,239,230,0.70) 55%, rgba(201,230,212,0.80)); '
        + 'backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: inset 1px 1px 2px #FFFFFF, inset -1px -2px 3px rgba(8,99,79,0.18), 0 8px 18px rgba(8,99,79,0.16)'
    };
  }
}
</script>
</body>
</html>
