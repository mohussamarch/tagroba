<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أضف للصف — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.rp-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.rp-press:active{transform:scale(.97)}
.rp-veil{animation:rp-fade 220ms cubic-bezier(.2,.7,.3,1) both}
.rp-up{animation:rp-up 420ms cubic-bezier(.18,.9,.28,1.04) both}
@keyframes rp-fade{from{opacity:0}to{opacity:1}}
@keyframes rp-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.rp-press{transition:none}.rp-press:active{transform:none}.rp-up{animation:rp-fade 150ms both}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="position: absolute; inset: 0; z-index: 9; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <button type="button" class="rp-veil" onClick="{{close}}" aria-label="إغلاق" style="position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer; background: rgba(32,59,48,0.22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px)"></button>
  <div role="dialog" aria-modal="true" aria-label="{{title}}" class="rp-up" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; max-height: 620px; border-radius: 28px 28px 0 0; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: 0 -18px 44px rgba(29,54,53,0.18)">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: rgba(25,61,51,0.16)"></span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 700">{{title}}</span>
      <span style="font-size: 13px; color: #637570">{{sub}}</span>
    </div>
    <div style="overflow-y: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 8px; justify-items: center; padding: 6px 0">
      <sc-for list="{{list}}" as="q" hint-placeholder-count="8">
        <button type="button" class="rp-press" onClick="{{q.pick}}" aria-label="{{q.label}}" style="border: 0; background: transparent; padding: 0; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; color: #193D33">
          <span style="{{q.circle}}">{{q.initial}}</span>
          <span style="font-size: 12px; font-weight: 700; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{q.name}}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 13px; color: #637570; text-align: center; padding: 12px 0">{{emptyText}}</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
// «+» في وضع تعديل الصف (PeopleOrbit) بيفتح دي: الناس اللي مش في الصف، والضغطة بتضيف الشخص في أول مكان فاضي (on-pick بالاسم)
class Component extends DCLogic {
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر', T = (a, b) => (eg ? b : a);
    const people = Array.isArray(this.props.people) ? this.props.people : ['هند', 'ماجد', 'لمى', 'بدر', 'دانة', 'تركي', 'خالد'].map((name) => ({ name, initial: name.charAt(0) }));
    const pick = typeof this.props.onPick === 'function' ? this.props.onPick : () => {};
    return {
      title: T('أضف للصف', 'ضيف للصف'),
      sub: T('يظهر فوق شخصيتك في أول مكان فارغ.', 'هيظهر فوق شخصيتك في أول مكان فاضي.'),
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      list: people.map((q) => ({
        name: q.name, initial: q.initial, label: T('أضف ', 'ضيف ') + q.name,
        circle: 'width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #08634F; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: ' + (q.dep ? '0 0 0 3px #A6DEC1, ' : '') + 'inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 10px 22px rgba(29,54,53,0.10)',
        pick: () => pick(q.name)
      })),
      empty: !people.length, emptyText: T('كل الأشخاص في الصف.', 'كل الناس في الصف.')
    };
  }
}
</script>
</body>
</html>
