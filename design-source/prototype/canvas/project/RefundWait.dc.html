<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مستني استرداد — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
.rw-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1)}
.rw-press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.rw-press{transition:none}.rw-press:active{transform:none}}
</style>
</helmet>
<div style="{{rootStyle}}">
  <sc-if value="{{isOff}}" hint-placeholder-val="{{ true }}">
    <button type="button" class="rw-press" onClick="{{turnOn}}" style="width: 100%; min-height: 60px; border: 1.5px dashed rgba(36,105,186,0.35); border-radius: 18px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font: inherit; text-align: right; color: #193D33; cursor: pointer; background: #FFFFFF">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(36,105,186,0.10)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2469BA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></span>
      <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{offTitle}}</span><span style="font-size: 12px; color: #637570">{{offHint}}</span></span>
    </button>
  </sc-if>
  <sc-if value="{{isWait}}" hint-placeholder-val="{{ false }}">
    <div style="border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: rgba(36,105,186,0.07)">
      <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 9px; color: #FFFFFF; background: #2469BA">{{waitPill}}</span><span style="flex: 1 1 auto"></span><button type="button" class="rw-press" onClick="{{turnOff}}" style="height: 36px; padding: 0 12px; border: 0; border-radius: 12px; font: inherit; font-size: 12px; font-weight: 700; color: #2469BA; cursor: pointer; background: #FFFFFF">{{offBtn}}</button></span>
      <span style="font-size: 13px; line-height: 1.7">{{waitBody}}</span>
    </div>
  </sc-if>
  <sc-if value="{{isBack}}" hint-placeholder-val="{{ false }}">
    <div style="border-radius: 18px; padding: 12px; display: flex; align-items: center; gap: 10px; background: rgba(8,99,79,0.08)">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #08634F"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
      <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700; color: #08634F">{{backTitle}}</span><span style="font-size: 12px; color: #637570">{{backBody}}</span></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bare":{"editor":"boolean","default":false,"section":"الحالة"},"state":{"editor":"enum","options":["عادي","مستني استرداد","اترد"],"default":"عادي","section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":350,"height":140}}'>
// «مستني استرداد» على المشترى نفسه (قرار المالك 2026-10-17 — PLAN-0.6 §7): مصروف شغل هيترد ⇐ ما يتحسبش من مصروفك لحد ما يترد
// لما تحويل يوصل من جهة الشغل ويتقال عليه «استرداد مصاريف» (`MoneyWhat`) المشترى ده بيتقترح فوق ويبقى «اترد»
const KEY = { 'عادي': 'off', 'مستني استرداد': 'wait', 'اترد': 'back' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: KEY[props.state] || 'off' };
  }
  componentDidUpdate(prev) { if (prev.state !== this.props.state) this.setState({ mode: KEY[this.props.state] || 'off' }); }
  renderVals() {
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const m = this.state.mode;
    const tell = (on) => { if (typeof this.props.onChange === 'function') this.props.onChange(on); };
    return {
      rootStyle: "font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33" + (this.props.bare ? "" : "; padding: 14px; min-height: 140px; box-sizing: border-box; background: #EFF3ED"),
      isOff: m === 'off', isWait: m === 'wait', isBack: m === 'back',
      offTitle: eg ? 'مصروف شغل؟ هيترد لي' : 'مصروف عمل سيُستردّ؟',
      offHint: eg ? 'ما يتحسبش من مصروفك لحد ما الفلوس ترجع' : 'لا يُحسب من مصروفك حتى يعود المبلغ',
      turnOn: () => { this.setState({ mode: 'wait' }); tell(true); },
      turnOff: () => { this.setState({ mode: 'off' }); tell(false); },
      waitPill: eg ? 'مستني استرداد' : 'بانتظار الاسترداد', offBtn: eg ? 'شيل' : 'إلغاء',
      waitBody: eg ? 'مش محسوب من مصروفك. أول ما فلوس تيجي من جهة شغلك ونقول عليها «استرداد مصاريف»، المشترى ده هيطلع أول اقتراح.' : 'لا يُحسب من مصروفك. حين يصل مبلغ من جهة عملك وتختار «استرداد مصاريف» يظهر هذا المشترى أول اقتراح.',
      backTitle: eg ? 'اترد' : 'تم الاسترداد',
      backBody: eg ? 'من «شركة الأفق» · 14 أكتوبر — ومش محسوب من مصروفك' : 'من «شركة الريادة» · 14 أكتوبر — ولا يُحسب من مصروفك'
    };
  }
}
</script>
</body>
</html>
