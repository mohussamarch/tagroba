<script type="text/x-dc" data-dc-script data-props='{"navStyle":{"editor":"enum","options":["زرار في النص","اسحب لفوق","زرار جنب الشريط","بدون زرار"],"default":"زرار في النص","section":"زرار الإضافة"},"state":{"editor":"enum","options":["عادي","فاضي","بيحمّل","خطأ"],"default":"عادي","section":"الحالة"},"edit":{"editor":"boolean","default":false,"section":"الحالة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"السعودية","section":"الحالة"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // ترتيب صف «أهم 5» (طلب المالك 2026-10-10): بيتحفظ في الحساب في التطبيق — هنا masroufy-people-top (أسماء)
    let order = null;
    try { const v = JSON.parse(window.sessionStorage.getItem('masroufy-people-top') || 'null'); if (Array.isArray(v)) order = v; } catch (e) {}
    this.state = { p: 0, addOpen: false, added: [], order, editing: props.edit === true, undo: null, pickOpen: false };
    this.RANGE = 420;
    this.setScroller = (el) => { this.scroller = el; };
    this.onScroll = () => {
      if (!this.scroller || this.raf) return;
      this.raf = setTimeout(() => {
        this.raf = 0;
        const p = Math.max(0, Math.min(1, this.scroller.scrollTop / this.RANGE));
        if (Math.abs(p - this.state.p) > 0.002) this.setState({ p });
        if (this.state.editing && this.scroller.scrollTop > 8) this.setState({ editing: false });
      }, 16);
    };
    this.toggleAll = () => {
      if (!this.scroller) return;
      this.scroller.scrollTo({ top: this.state.p > 0.5 ? 0 : this.RANGE, behavior: this.reduced() ? 'auto' : 'smooth' });
    };
  }
  componentWillUnmount() { if (this.raf) clearTimeout(this.raf); if (this.undoT) clearTimeout(this.undoT); }
  componentDidUpdate(prev) { if (prev.edit !== this.props.edit) this.setState({ editing: this.props.edit === true }); }
  saveOrder(order) { if (!Array.isArray(order)) return; order = order.filter((n) => typeof n === 'string'); try { window.sessionStorage.setItem('masroufy-people-top', JSON.stringify(order)); } catch (e) {} this.setState({ order }); }
  rowNames(all) { const names = all.map((q) => q.name); return (Array.isArray(this.state.order) ? this.state.order : names.slice(0, 5)).filter((n) => names.indexOf(n) >= 0).slice(0, 5); }
  reduced() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
  people(eg) {
    // مخترعة بالكامل. b = الرصيد مع الشخص بالوحدة الصغرى: موجب = لك، سالب = عليك (من غير مقاصة)
    const base = [
      ['ليلى', true, 0], ['يوسف', true, 0], ['سارة', false, 0], ['خالد', false, 50000], ['أحمد', false, 18500],
      ['عمر', false, -200000], ['نورة', false, 30000], ['فهد', false, 120000], ['ريم', false, 0], ['سلمان', false, -45000],
      ['هند', false, 0], ['ماجد', false, 0], ['لمى', false, 0], ['بدر', false, 0], ['دانة', false, 0], ['تركي', false, 0]
    ];
    const k = eg ? 3 : 1;
    return base.map(([name, dep, b]) => ({ name, dep, b: b * k, initial: name.charAt(0) }));
  }
  fmt(minor) { const a = Math.abs(minor); return String((a - (a % 100)) / 100).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  renderVals() {
    const st = this.props.state ?? 'عادي';
    const eg = (this.props.space ?? 'السعودية') === 'مصر';
    const cur = eg ? 'ج.م' : 'ر.س';
    const p = this.state.p;
    const reduced = this.reduced();
    const smooth = (x) => { const t = Math.max(0, Math.min(1, x)); return t * t * (3 - 2 * t); };
    const all = this.people(eg);
    const everyone = all.concat(this.state.added.map((name) => ({ name, initial: name.charAt(0), b: 0 })));
    const rowN = this.rowNames(everyone);
    const top = rowN.map((nm) => everyone.find((q) => q.name === nm));
    const rest = everyone.filter((q) => rowN.indexOf(q.name) < 0);

    // الأسطوانة: صف أهم 5 مطوي فوق (بيظهر في الصفحة الكاملة بس)، وتحته الباقيين؛ السحب لفوق بيلف الصفوف ناحيتك
    const cell = (q) => ({
      isPerson: true, isAdd: false, name: q.name, initial: q.initial,
      circle: 'width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #08634F; background: linear-gradient(165deg, #FFFFFF 0%, #FBFAF4 100%); box-shadow: ' + (q.dep ? '0 0 0 3px #A6DEC1, ' : '') + 'inset 0 1px 0 #FFFFFF, 0 1px 2px rgba(29,54,53,0.05), 0 10px 22px rgba(29,54,53,0.10)',
      chip: q.b > 0 ? 'لك ' + this.fmt(q.b) : q.b < 0 ? 'عليك ' + this.fmt(q.b) : '',
      chipStyle: 'min-height: 16px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: ' + (q.b > 0 ? '#13764D' : q.b < 0 ? '#BE3D48' : 'transparent')
    });
    const groups = [top.map(cell), rest.slice(0, 5).map(cell), rest.slice(5, 10).map(cell), rest.slice(10).map(cell).concat([{ isPerson: false, isAdd: true }])];
    const ROW = 106, GAP = 8;
    const ease = [smooth((p - 0.35) / 0.5), 1, smooth((p - 0.05) / 0.5), smooth((p - 0.2) / 0.5)];
    let y = 0;
    const rows = groups.map((cells, k) => {
      const e = ease[k];
      let transform, h, opacity;
      if (k === 0) { h = (ROW + GAP) * e; opacity = e; transform = 'scale(' + (0.6 + 0.4 * e).toFixed(3) + ')'; }
      else if (k === 1) { h = ROW + GAP; opacity = 1; transform = 'none'; }
      else {
        const angle = reduced ? 0 : -84 * (1 - e);
        h = reduced ? (ROW + GAP) * e : ROW * Math.cos(angle * Math.PI / 180) + GAP * e;
        opacity = 0.14 + 0.86 * e;
        transform = 'rotateX(' + angle.toFixed(1) + 'deg)';

      y += h;

    });

    const lak = all.filter((q) => q.b > 0), alek = all.filter((q) => q.b < 0);
    const sum = (xs) => xs.reduce((s, q) => s + Math.abs(q.b), 0);
    const showPeople = st === 'عادي' || st === 'خطأ';
    const heroO = Math.max(0, 1 - 2.2 * p);
    const n = (x) => x.toLocaleString('en-US');
    return {
      setScroller: this.setScroller, onScroll: this.onScroll, toggleAll: this.toggleAll,
      navStyle: this.props.navStyle ?? "زرار في النص",
      spaceName: eg ? 'مصر' : 'السعودية',
      eventsLabel: 'الأحداث',
      addOpen: this.state.addOpen, openAdd: () => this.setState({ addOpen: true }), closeAdd: () => this.setState({ addOpen: false }),
      onAddPerson: (q) => { if (q && q.name) this.setState((st) => ({ addOpen: false, added: st.added.concat([q.name]) })); },
      allLabel: p > 0.5 ? 'رجوع' : 'الكل (' + n(all.length) + ')',
      trackStyle: 'position: relative; height: ' + (showPeople ? 844 + this.RANGE : 844) + 'px',
      snapEndStyle: 'position: absolute; top: ' + this.RANGE + 'px; height: 1px; width: 1px',
      isLoading: st === 'بيحمّل', isEmpty: st === 'فاضي', isError: st === 'خطأ',
      showStage: st !== 'بيحمّل',
      showPeople,
      heroStyle: 'position: absolute; top: 82px; left: 20px; right: 20px; height: 360px; transform-origin: center top; transform: translateY(' + (-70 * p).toFixed(1) + 'px) scale(' + (1 - 0.18 * p).toFixed(3) + '); opacity: ' + heroO.toFixed(3) + '; pointer-events: ' + (heroO > 0.5 ? 'auto' : 'none') + '; z-index: ' + (this.state.editing ? 5 : 'auto'),
      rows, editing: this.state.editing, rowPeople: top, customRow: Array.isArray(this.state.order), canAdd: rest.length > 0,
      setEditing: (v) => this.setState({ editing: !!v }), endEdit: () => this.setState({ editing: false }),
      reorder: (names) => this.saveOrder(names),
      removeAt: (i) => { if (!rowN[i]) return; const order = rowN.filter((_, k) => k !== i); this.saveOrder(order); if (this.undoT) clearTimeout(this.undoT); this.undoT = setTimeout(() => this.setState({ undo: null }), 4000); this.setState({ undo: { name: rowN[i], i } }); },
      hasUndo: !!this.state.undo, undoLabel: 'تراجع',
      undoText: this.state.undo ? (eg ? 'اتشال «' + this.state.undo.name + '» من الصف' : 'أُزيل «' + this.state.undo.name + '» من الصف') : '',
      undo: () => { const u = this.state.undo; if (!u) return; const order = this.rowNames(everyone); order.splice(Math.min(u.i, order.length), 0, u.name); this.saveOrder(order.slice(0, 5)); if (this.undoT) clearTimeout(this.undoT); this.setState({ undo: null }); },
      pickOpen: this.state.pickOpen, openPick: () => this.setState({ pickOpen: true }), closePick: () => this.setState({ pickOpen: false }),
      pickList: rest, pickOne: (nm) => { if (typeof nm !== 'string') return; this.saveOrder(rowN.concat([nm]).slice(0, 5)); this.setState({ pickOpen: false }); },
      drumStyle: 'position: absolute; left: 20px; right: 20px; top: ' + drumTop.toFixed(1) + 'px; height: ' + y.toFixed(1) + 'px; perspective: 700px; perspective-origin: center top',
      boxesStyle: 'position: absolute; left: 20px; right: 20px; top: ' + (drumTop + y + 4).toFixed(1) + 'px; display: flex; gap: 10px; opacity: ' + Math.max(0, 1 - 2.4 * p).toFixed(3) + '; pointer-events: ' + (p < 0.3 ? 'auto' : 'none'),
      lakTotal: (st === 'خطأ' ? '—' : this.fmt(sum(lak))) + ' ' + cur,
      alekTotal: (st === 'خطأ' ? '—' : this.fmt(sum(alek))) + ' ' + cur,
      lakCount: 'عند ' + n(lak.length) + ' أشخاص',
      alekCount: alek.length === 2 ? (eg ? 'لاتنين' : 'لشخصين') : 'لـ ' + n(alek.length) + ' أشخاص'
    };
  }
}
</script>
