<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تعديل تصنيف — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.e-press{transition:transform 220ms cubic-bezier(.2,.7,.3,1),box-shadow 220ms cubic-bezier(.2,.7,.3,1),background 220ms cubic-bezier(.2,.7,.3,1)}
.e-press:active{transform:scale(.97)}
.e-tile{transition:background 160ms cubic-bezier(.2,.7,.3,1),color 160ms cubic-bezier(.2,.7,.3,1)}
.e-x{scrollbar-width:none}.e-x::-webkit-scrollbar{display:none}.e-x>*{flex-shrink:0}
@media (prefers-reduced-motion: reduce){.e-press,.e-tile{transition:none}.e-press:active{transform:none}}
:focus-visible{outline:none;box-shadow:0 0 0 3px #956000}
</style>
</helmet>
<div dir="rtl" style="width: 100%; min-width: 350px; display: flex; flex-direction: column; gap: 10px; font-family: 'Noto Sans Arabic', Tahoma, sans-serif; color: #193D33">
  <div style="display: flex; align-items: center; gap: 12px">
    <span class="e-tile" aria-hidden="true" style="{{previewTile}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{previewIc}}"></path></svg></span>
    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><h2 style="margin: 0; font-size: 18px; font-weight: 700">{{title}}</h2><span style="font-size: 12px; color: #637570">{{path}}</span></span>
  </div>

  <label for="ce-name" style="font-size: 13px; font-weight: 700">{{nameLabel}}</label>
  <input id="ce-name" type="text" value="{{name}}" onInput="{{typeName}}" maxlength="80" placeholder="{{namePh}}" aria-invalid="{{hasErr}}" style="{{nameStyle}}">
  <sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 12px; font-weight: 700; color: #BE3D48">{{err}}</span></sc-if>

  <span style="font-size: 13px; font-weight: 700">{{parentLabel}}</span>
  <sc-if value="{{lockedParent}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #637570">{{lockedNote}}</span></sc-if>
  <sc-if value="{{canMove}}" hint-placeholder-val="{{ true }}">
    <div role="radiogroup" aria-label="{{parentLabel}}" class="e-x" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
      <sc-for list="{{parents}}" as="pa" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{pa.on}}" class="e-press" onClick="{{pa.pick}}" style="{{pa.style}}"><span aria-hidden="true" style="{{pa.dot}}"></span>{{pa.name}}</button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isMain}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 700">{{groupLabel}}</span>
      <div role="radiogroup" aria-label="{{groupLabel}}" style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{groups}}" as="gr" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{gr.on}}" class="e-press" onClick="{{gr.pick}}" style="{{gr.style}}">{{gr.name}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; font-weight: 700">{{colorLabel}}</span>
      <div role="radiogroup" aria-label="{{colorLabel}}" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="18">
          <button type="button" role="radio" aria-checked="{{sw.on}}" aria-label="{{sw.name}}" class="e-press" onClick="{{sw.pick}}" style="height: 44px; border: 0; padding: 0; border-radius: 14px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="{{sw.dot}}"></span></button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #637570">{{subsColorNote}}</span>
    </div>
  </sc-if>
  <sc-if value="{{isSub}}" hint-placeholder-val="{{ false }}">
    <span style="display: flex; align-items: center; gap: 8px; border-radius: 14px; padding: 10px 12px; font-size: 12px; color: #637570; background: rgba(25,61,51,0.04)"><span aria-hidden="true" style="{{subDot}}"></span>{{subNote}}</span>
  </sc-if>

  <span style="font-size: 13px; font-weight: 700">{{iconLabel}}</span>
  <div role="radiogroup" aria-label="{{iconLabel}}" style="max-height: 184px; overflow-y: auto; border-radius: 16px; padding: 6px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; background: rgba(25,61,51,0.04)">
    <sc-for list="{{icons}}" as="ic" hint-placeholder-count="12">
      <button type="button" role="radio" aria-checked="{{ic.on}}" aria-label="{{ic.key}}" class="e-press" onClick="{{ic.pick}}" style="{{ic.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.d}}"></path></svg></button>
    </sc-for>
  </div>
  <sc-if value="{{needIcon}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #956000">{{needIconText}}</span></sc-if>

  <div style="position: sticky; bottom: 0; z-index: 1; margin: 0 -20px; padding: 10px 20px 4px; display: flex; flex-direction: column; background: linear-gradient(to top, #FBFAF4 75%, rgba(251,250,244,0))"><button type="button" class="e-press" onClick="{{save}}" disabled="{{cantSave}}" style="{{saveStyle}}">{{saveLabel}}</button></div>
  <sc-if value="{{canHide}}" hint-placeholder-val="{{ false }}">
    <button type="button" class="e-press" onClick="{{hide}}" style="height: 48px; border: 0; border-radius: 18px; font: inherit; font-size: 14px; font-weight: 700; color: #637570; cursor: pointer; background: rgba(25,61,51,0.06)">{{hideLabel}}</button>
    <span style="font-size: 12px; color: #637570; text-align: center">{{hideNote}}</span>
  </sc-if>
</div>
</x-dc>

    if (!sws.some((x) => String(x.hsl) === String(d.hsl))) sws.push({ name: eg ? 'لونه الحالي' : 'لونه الحالي', hsl: d.hsl });
    const chip = (on) => 'height: 44px; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; ' + (on ? 'font-weight: 700; color: #08634F; background: #DCEBD6; box-shadow: inset 0 0 0 1.5px #08634F' : 'color: #193D33; background: rgba(25,61,51,0.06)');
    const curSw = sws.find((x) => String(x.hsl) === String(s.hsl));
    const groupName = (k) => (d.groups.find((g) => g.key === k) || { name: '' }).name;
    const parents = [{ id: null, name: eg ? 'أساسي (من غير أب)' : 'رئيسي (بلا أب)', hsl: null }].concat(d.mains).map((m) => ({
      name: m.name, on: (s.parent || null) === m.id ? 'true' : 'false',
      pick: () => this.setState({ parent: m.id }),
      style: chip((s.parent || null) === m.id),
      dot: 'width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; ' + (m.hsl ? 'background: ' + this.col(m.hsl) : 'box-shadow: inset 0 0 0 1.5px #637570')
    }));
    const icons = Object.keys(I).map((key) => ({ key, d: I[key], on: s.icon === key ? 'true' : 'false', pick: () => this.setState({ icon: key }),
      style: 'height: 44px; border: 0; padding: 0; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; ' + (s.icon === key ? 'color: ' + color + '; background: ' + color + '24; box-shadow: inset 0 0 0 1.5px ' + color : 'color: #4D5F5A; background: transparent') }));
    const titles = { edit: eg ? 'تعديل تصنيف' : 'تعديل تصنيف', 'new-main': eg ? 'تصنيف أساسي جديد' : 'تصنيف رئيسي جديد', 'new-sub': eg ? 'فرعي جديد' : 'فرع جديد' };
    return {
      title: titles[d.mode] || titles.edit,
      path: isMain ? groupName(s.group) : groupName(par ? par.group : s.group) + ' › ' + (par ? par.name : ''),
      previewTile: 'width: 48px; height: 48px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: ' + color + '; background: ' + color + '1F; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7)' + (s.icon ? '' : ', inset 0 0 0 1.5px ' + color + '66'),
      previewIc: s.icon ? I[s.icon] || '' : '',
      nameLabel: 'الاسم', namePh: eg ? 'اسم التصنيف' : 'اسم التصنيف', name: s.name,
      typeName: (e) => this.setState({ name: String(e.target.value || '').slice(0, 80) }),
      hasErr: !!err, err,
      nameStyle: 'height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; color: #193D33; outline: none; background: ' + (err ? 'rgba(190,61,72,0.06); box-shadow: inset 0 0 0 1.5px rgba(190,61,72,0.45)' : 'rgba(25,61,51,0.05)'),
      parentLabel: eg ? 'تحت أنهي تصنيف؟' : 'تحت أي تصنيف؟',
      lockedParent: !!(d.hasSubs && isMain), canMove: !(d.hasSubs && isMain),
      lockedNote: eg ? 'التصنيف ده تحته فرعيات، فمينفعش يتنقل تحت تصنيف تاني.' : 'لهذا التصنيف فروع، فلا يُنقل تحت تصنيف آخر.',
      parents,
      isMain, isSub: !isMain,
      groupLabel: 'المجموعة',
      groups: d.groups.map((g) => ({ name: g.name, on: s.group === g.key ? 'true' : 'false', pick: () => this.setState({ group: g.key }), style: chip(s.group === g.key) })),
      colorLabel: (eg ? 'اللون: ' : 'اللون: ') + (curSw ? curSw.name : ''),
      swatches: sws.map((x) => { const on = String(x.hsl) === String(s.hsl), k = this.col(x.hsl); return { name: x.name, on: on ? 'true' : 'false', pick: () => this.setState({ hsl: x.hsl }),
        dot: 'width: 30px; height: 30px; border-radius: 15px; background: ' + k + '; box-shadow: ' + (on ? '0 0 0 3px #FFFFFF, 0 0 0 5px ' + k : 'inset 0 1px 0 rgba(255,255,255,0.35)') }; }),
      subsColorNote: d.hasSubs ? (eg ? 'لو غيّرت اللون، درجات الفرعيات بتتغير معاه.' : 'تغيير اللون يغيّر درجات فروعه معه.') : (eg ? 'كل تصنيف أساسي ليه لون مختلف.' : 'لكل تصنيف رئيسي لون مختلف.'),
      subDot: 'width: 14px; height: 14px; border-radius: 7px; flex-shrink: 0; background: ' + color,
      subNote: eg ? 'اللون درجة من لون «' + (par ? par.name : '') + '»، والمجموعة من عنده — بيتحسبوا لوحدهم.' : 'اللون درجة من لون «' + (par ? par.name : '') + '»، والمجموعة منه — يُحسبان تلقائيًا.',
      iconLabel: 'الرمز', icons,
      needIcon: !s.icon, needIconText: eg ? 'اختار رمز من القايمة.' : 'اختر رمزًا من القائمة.',
      cantSave,
      saveLabel: d.mode === 'edit' ? (eg ? 'احفظ' : 'احفظ') : (eg ? 'ضيف' : 'أضف'),
      saveStyle: 'height: 48px; margin-top: 4px; border: 0; border-radius: 18px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; background: linear-gradient(160deg, #0A7A62 0%, #08634F 100%); ' + (cantSave ? 'opacity: 0.45; cursor: default' : 'cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(8,99,79,0.28)'),
      save: () => { if (cantSave || typeof this.props.onSave !== 'function') return; this.props.onSave({ mode: d.mode, id: d.id, name: nm, icon: s.icon, parent: s.parent || null, hsl: isMain ? s.hsl : null, group: isMain ? s.group : null }); },
      canHide: d.mode === 'edit' && d.active,
      hideLabel: eg ? 'اخفيه من الاختيار' : 'أخفِه من الاختيار',
      hideNote: isMain && d.hasSubs ? (eg ? 'فرعياته بتستخبى معاه. العمليات اللي عليه بتفضل زي ما هي.' : 'تُخفى فروعه معه. العمليات المصنفة عليه تبقى كما هي.') : (eg ? 'العمليات اللي عليه بتفضل زي ما هي، وتقدر ترجّعه من «المخفية».' : 'العمليات المصنفة عليه تبقى كما هي، ويمكن إعادته من «المخفية».'),
      hide: () => { if (typeof this.props.onHide === 'function' && d.id) this.props.onHide(d.id); }
    };
  }
}
</script>
</body>
</html>
