<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شريط النصايح — مصروفي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.tp-in{animation:tp-in 320ms cubic-bezier(.2,.8,.2,1) both}
@keyframes tp-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.tp-out{animation:tp-out 220ms ease-in both}
@keyframes tp-out{to{opacity:0;transform:translateY(-8px);height:0;margin:0;padding:0}}
@media (prefers-reduced-motion: reduce){.tp-in,.tp-out{animation:none}}
</style>
</helmet>
<div style="font-family: 'Noto Sans Arabic', Tahoma, sans-serif">
  <sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
    <div role="note" class="tp-in" style="border-radius: 16px; padding: 10px 6px 10px 12px; display: flex; align-items: center; gap: 10px; color: #193D33; background: #EAF2FB; box-shadow: inset 0 0 0 1px rgba(36,105,186,0.18)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2469BA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"></path></svg>
      <span style="flex: 1 1 auto; font-size: 13px; line-height: 1.6">{{text}}</span>
      <button type="button" onClick="{{close}}" aria-label="{{closeLabel}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #637570; background: transparent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"text":{"editor":"text","default":"دوسة طويلة على أي عملية تفتح اختصارات.","section":"النصيحة"},"space":{"editor":"enum","options":["السعودية","مصر"],"default":"مصر","section":"الحالة"},"$preview":{"width":358,"height":80}}'>
// شريط النصايح (طلب المالك 2026-10-17 — اتأجل وفتحه 2026-10-23): أي شرح طويل أو تلميح أصفر (لو مش ضروري) يبقى شريط صغير فوق الصفحة بعلامة إكس
// بيظهر أول مرة تفتح الصفحة بس، ولما تقفله ما يرجعش (يتحفظ لكل صفحة). «بيّن النصايح تاني» في الإعدادات بيرجّعهم كلهم. سطر واحد قصير
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { show: true }; }
  renderVals() {
    const eg = (this.props.space ?? 'مصر') === 'مصر';
    return { show: this.state.show, text: this.props.text || '', closeLabel: eg ? 'اقفل النصيحة' : 'أغلق النصيحة', close: () => this.setState({ show: false }) };
  }
}
</script>
</body>
</html>
