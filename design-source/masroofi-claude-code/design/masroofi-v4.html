1 يومًا&lt;br&gt;المصروف المتوقع لنهاية الشهر: ${money(s/20*30)} ر.س&lt;/small&gt;&lt;/section&gt;`:''}&lt;section class=&quot;m-panel&quot;&gt;&lt;div class=&quot;m-row&quot;&gt;&lt;h2&gt;مصروفك حسب التصنيف&lt;/h2&gt;${button('إدارة','data-go=&quot;categories&quot;')}&lt;/div&gt;${s?`&lt;div class=&quot;v-donut&quot; style=&quot;background:conic-gradient(${gradient})&quot; role=&quot;img&quot; aria-label=&quot;توزيع مصروف الفترة؛ التفاصيل بالقائمة&quot;&gt;&lt;div&gt;&lt;strong&gt;${money(s)}&lt;/strong&gt;&lt;span class=&quot;m-muted&quot;&gt;ر.س&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;v-legend&quot;&gt;${sh.map(x=&gt;`&lt;button data-category=&quot;${x.c.id}&quot; style=&quot;${style(x.c)}&quot;&gt;&lt;span class=&quot;v-dot&quot;&gt;&lt;/span&gt;${esc(x.c.name)} &lt;strong&gt;${fmt(x.percent)}%&lt;/strong&gt;&lt;/button&gt;`).join('')}&lt;/div&gt;`:'&lt;div class=&quot;v-empty&quot;&gt;اختار فترة تانية أو أضف كشف حساب.&lt;/div&gt;'}&lt;/section&gt;&lt;section class=&quot;m-panel&quot;&gt;&lt;div class=&quot;m-row&quot;&gt;&lt;h2&gt;آخر العمليات&lt;/h2&gt;${button('الكل','data-go=&quot;transactions&quot;')}&lt;/div&gt;${txRows(tx.filter(withinPeriod).slice(0,5))}&lt;/section&gt;${periodAnalysis()}`}

function addMenu(){sheet('إضافة جديدة',`&lt;div class=&quot;v4-flow&quot;&gt;${[['purchase','receipt','مشتريات أو فاتورة','تصنيف، وسم، وربط بشخص'],['transfer','arrow-left-right','حركة أموال','دخل، دين، تحويل لمصر أو بين محافظك'],['import','file-up','كشف حساب','تصنيف تلقائي ومراجعة المكرر'],['person','user-plus','شخص جديد','حساب للديون والأمانات']].map(([k,i,n,d])=&gt;`&lt;button data-v4add=&quot;${k}&quot;&gt;${ic(i)}&lt;span&gt;${n}&lt;small&gt;${d}&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;`).join('')}&lt;/div&gt;`)}
function transfers(){let list=tx.filter(withinPeriod).filter(t=&gt;transferTab==='all'||direction(t)===transferTab),all=tx.filter(withinPeriod),sum=dir=&gt;all.filter(t=&gt;direction(t)===dir).reduce((a,t)=&gt;a+t.amount,0);return `${dateBar()}&lt;div class=&quot;v4-balance&quot; style=&quot;margin-bottom:14px&quot;&gt;&lt;div&gt;&lt;span&gt;متحصلات&lt;/span&gt;&lt;strong class=&quot;v4-in&quot;&gt;+${money(sum('in'))}&lt;/strong&gt;&lt;small class=&quot;m-muted&quot;&gt;وارد · ليس كله دخلًا&lt;/small&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;مدفوعات&lt;/span&gt;&lt;strong class=&quot;v4-out&quot;&gt;−${money(sum('out'))}&lt;/strong&gt;&lt;small class=&quot;m-muted&quot;&gt;صادر · ليس كله مصروفًا&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;v-tools&quot;&gt;${button('إضافة حركة','data-v4add=&quot;transfer&quot;','m-primary')}${button('الأشخاص','data-go=&quot;people&quot;')}&lt;/div&gt;&lt;div class=&quot;m-pills&quot;&gt;${[['all','الكل'],['in','متحصلات'],['out','مدفوعات'],['internal','بين محافظي']].map(([k,n])=&gt;button(n,`data-v4flow=&quot;${k}&quot; aria-pressed=&quot;${transferTab===k}&quot;`)).join('')}&lt;/div&gt;&lt;details class=&quot;m-panel&quot;&gt;&lt;summary&gt;تقسيمات حركة الأموال&lt;/summary&gt;&lt;p class=&quot;v4-help&quot;&gt;الدخل: العمل (مرتب، بونص، نسبة، أوفر تايم)، فري لانس، بيع.&lt;/p&gt;&lt;p class=&quot;v4-help&quot;&gt;متحصلات أخرى: قرض مستلم، تحصيل دين لك، أمانة مستلمة.&lt;/p&gt;&lt;p class=&quot;v4-help&quot;&gt;مدفوعات: مشتريات وفواتير، قرض ممنوح، سداد دين عليك، رد أمانة، تحويل لمصر.&lt;/p&gt;&lt;p class=&quot;v4-help&quot;&gt;بين محافظي: حركة واحدة لا تزيد الدخل أو المصروف. برق وسيلة تحويل لمصر؛ تُحدّد المعالجة حسب المستفيد.&lt;/p&gt;&lt;/details&gt;&lt;section class=&quot;m-panel&quot;&gt;${txRows(list)}&lt;/section&gt;`}
function balances(id){let receivable=0,payable=0;tx.filter(t=&gt;t.personId===id).forEach(t=&gt;{if(t.linkMode==='receivable')receivable+=t.recoverableAmount||0;if(t.kind==='loan_given')receivable+=t.amount;if(t.kind==='debt_collected')receivable-=t.amount;if(['loan_received','custody_received'].includes(t.kind))payable+=t.amount;if(['debt_repaid','custody_returned'].includes(t.kind))payable-=t.amount});return {receivable:Math.round(receivable*100)/100,payable:Math.round(payable*100)/100}}

function newPerson(){sheet('شخص جديد',`&lt;label&gt;الاسم&lt;input class=&quot;m-input&quot; id=&quot;v4-personname&quot; placeholder=&quot;اسم الشخص&quot;&gt;&lt;/label&gt;${errBox()}${button('إضافة الشخص','data-v4saveperson','m-primary')}`)}

ot; step=&quot;.01&quot; value=&quot;${t.recoverableAmount||t.amount}&quot;&gt;&lt;/label&gt;&lt;p class=&quot;v4-help&quot;&gt;في حالة الدين فقط: هذا الجزء يظهر في «لك عنده»، ويتبقى عليك ${money(personalAmount(t))} ر.س من هذه العملية.&lt;/p&gt;`:`&lt;p class=&quot;v4-alert&quot;&gt;${t.kind==='own'?`${esc(t.from)} ← ${esc(t.to)} · تحويل بين حساباتك لا يُحسب دخلًا أو مصروفًا.`:t.type==='income'?'دخل مسجل ضمن الفترة.':'حركة أموال؛ لا تُحسب كدخل أو مصروف شخصي.'}&lt;/p&gt;${button('تعديل نوع الحركة',`data-v4editmove=&quot;${id}&quot;`)}`}${t.kind==='own'&amp;&amp;t.service==='برق'?button('تغيير مستفيد تحويل مصر',`data-v4editmove=&quot;${id}&quot;`):''}${t.type==='expense'?`&lt;label class=&quot;m-check&quot;&gt;&lt;input id=&quot;v4-exclude&quot; type=&quot;checkbox&quot; ${t.excluded?'checked':''}&gt; استبعاد من مصروفي الشخصي&lt;/label&gt;`:''}&lt;label class=&quot;m-check&quot;&gt;&lt;input id=&quot;v4-cash&quot; type=&quot;checkbox&quot; ${t.cash||t.source==='كاش'?'checked':''}&gt; وسم كاش ملازم للعملية&lt;/label&gt;&lt;label&gt;ملاحظة&lt;input class=&quot;m-input&quot; id=&quot;v4-note&quot; value=&quot;${esc(t.note||'')}&quot;&gt;&lt;/label&gt;${errBox()}${button('حفظ التعديل',`data-v4savetx=&quot;${id}&quot;`,'m-primary')}${t.personId?button('افتح حساب '+esc(personName(t.personId)),`data-v4person=&quot;${t.personId}&quot;`):''}`)}
function entryForm(kind='purchase',personId='',editId=null){let old=tx.find(t=&gt;t.id===editId),chosen=old?(old.service==='برق'?'egypt':old.kind):kind;sheet(editId?'تعديل حركة أموال':'إضافة حركة',`&lt;label&gt;نوع الحركة&lt;select class=&quot;m-input&quot; id=&quot;v4-kind&quot;&gt;${[['الدخل',['salary','bonus','commission','overtime','freelance','sale']],['متحصلات أخرى',['loan_received','debt_collected','custody_received']],['مدفوعات',['purchase','loan_given','debt_repaid','custody_returned','egypt']],['حركة داخلية',['own']]].map(([g,ks])=&gt;`&lt;optgroup label=&quot;${g}&quot;&gt;${ks.map(k=&gt;`&lt;option value=&quot;${k}&quot; ${k===chosen?'selected':''}&gt;${kinds[k][0]}&lt;/option&gt;`).join('')}&lt;/optgroup&gt;`).join('')}&lt;/select&gt;&lt;/label&gt;&lt;label&gt;الوصف / التاجر&lt;input class=&quot;m-input&quot; id=&quot;v4-name&quot; value=&quot;${esc(old?.name||'')}&quot; placeholder=&quot;مثال: البيك أو راتب العمل&quot;&gt;&lt;/label&gt;&lt;div class=&quot;v-split&quot;&gt;&lt;label&gt;المبلغ · ر.س&lt;input class=&quot;m-input&quot; id=&quot;v4-amount&quot; type=&quot;number&quot; min=&quot;.01&quot; step=&quot;.01&quot; value=&quot;${old?.amount||''}&quot;&gt;&lt;/label&gt;&lt;label&gt;التاريخ&lt;input class=&quot;m-input&quot; id=&quot;v4-date&quot; type=&quot;date&quot; value=&quot;${old?.date||`${selectedYear}-${String(selectedMonth).padStart(2,'0')}-20`}&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;label&gt;التصنيف للمشتريات&lt;select class=&quot;m-input&quot; id=&quot;v4-entrycat&quot;&gt;${catOptions(old?.cat||byName('متفرقات').id)}&lt;/select&gt;&lt;/label&gt;&lt;label&gt;الشخص&lt;select class=&quot;m-input&quot; id=&quot;v4-entryperson&quot;&gt;${personOptions(old?.personId||personId)}&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;v-split&quot;&gt;&lt;label&gt;المحفظة / من&lt;select class=&quot;m-input&quot; id=&quot;v4-from&quot;&gt;${wallets.map(w=&gt;`&lt;option ${w===(old?.from||old?.source)?'selected':''}&gt;${w}&lt;/option&gt;`).join('')}&lt; <script>(() => {

    const data = event.data;

        typeof height === "number" &&
        Number.isFinite(height) &&
