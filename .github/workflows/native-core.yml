# قلب تطبيق كوتلن للجهازين — KOTLIN_PLAN §4-أ٥
# على جهاز ماك من GitHub (مجاني للمستودع العام): اختبارات ملفات المرجع + بناء كود الآيفون.
# ⚠️ من غير أي أسرار. الكشف الحقيقي مش موجود هنا، فاختباره ما بيشتغلش (بيشتغل على جهاز المالك بس).
name: native-core

on:
  push:
    paths:
      - 'native-app/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: اختبارات ملفات المرجع (JVM)
        run: chmod +x gradlew && ./gradlew :core:jvmTest :app:jvmTest :data:jvmTest :device:jvmTest --console=plain
      - name: اختبار اللي بيختلف من جهاز للتاني على محاكي الآيفون
        # `nfkc` و`compareArabic` بس هما اللي كودهم بيختلف؛ القيم المتوقعة من التطبيق الحالي.
        # ملفات المرجع بتتقرا من القرص فاختباراتها على الكمبيوتر بس.
        # `:device`: منافذ الجهاز (PDFKit · الملفات · القفل) على كشف مخترع — مفيش ماك غير هنا.
        run: |
          set +e
          ./gradlew :core:iosSimulatorArm64Test :data:iosSimulatorArm64Test :device:iosSimulatorArm64Test --console=plain 2>&1 | tee ios-test.log
          status=${PIPESTATUS[0]}
          grep -h "PROBE" ios-test.log device/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | head -60 || true
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|FAILED|expected|Caused by" ios-test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            # رسالة الفشل نفسها مش بتطلع في السجل على Kotlin/Native — من ملفات النتايج
            grep -ho '<failure message="[^"]*"' */build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | cut -c1-900 | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          # «نجح» من غير ما يشغّل حاجة = مش نجاح. العدد بيتطبع كملاحظة عشان يتقرا من برا.
          count=$(grep -ho 'tests="[0-9]*"' core/build/test-results/iosSimulatorArm64Test/*.xml data/build/test-results/iosSimulatorArm64Test/*.xml device/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | grep -o '[0-9]*' | paste -sd+ - | bc)
          count=${count:-0}
          echo "::notice::اختبارات اتشغلت على محاكي الآيفون: $count"
          device=$(grep -ho 'tests="[0-9]*"' device/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "::notice::منهم منافذ الجهاز (:device): ${device:-0}"
          grep -h "محاكي الآيفون: القفل" device/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | head -1 | sed 's/^ */::notice::/'
          if [ "${device:-0}" -lt 6 ]; then
            echo "::error::اختبارات :device على المحاكي أقل من 6 — النجاح ده مش مضمون"
            exit 1
          fi
          if [ "$count" -lt 1 ]; then
            echo "::error::مفيش ولا اختبار اتشغل على المحاكي — النجاح ده فاضي"
            exit 1
          fi
      - name: بناء كود الآيفون (جهاز حقيقي + المحاكي) — القلب والاستخدامات والتخزين
        # أخطاء المترجم بتتطبع كـ«error annotations» كمان، عشان تبان من برا من غير ما حد يفتح السجل
        run: |
          set +e
          ./gradlew :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64 :app:compileKotlinIosArm64 :app:compileKotlinIosSimulatorArm64 :data:compileKotlinIosArm64 :data:compileKotlinIosSimulatorArm64 :firestore:compileKotlinIosArm64 :firestore:compileKotlinIosSimulatorArm64 :device:compileKotlinIosArm64 --console=plain 2>&1 | tee ios-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|Caused by|FAILURE:" ios-build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

  # تجربة مكتبة فايربيز (KOTLIN_PLAN §4-أ4): هل قارئ GitLive — نفس الملف اللي اتجرب على محاكي أندرويد — بيتبني للآيفون؟
  # job لوحده: لو فشل، نتيجة القلب فوق ما بتتأثرش، والفشل بيبان باسمه. بناء بس (مفيش ربط بمكتبات فايربيز للآيفون ولا تشغيل).
  firebase-trial:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: بناء قارئ GitLive للآيفون (جهاز حقيقي + المحاكي)
        run: |
          set +e
          chmod +x gradlew
          ./gradlew -p firebase-trial :gitlive:compileKotlinIosArm64 :gitlive:compileKotlinIosSimulatorArm64 --console=plain 2>&1 | tee trial-ios.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|Caused by|FAILURE:" trial-ios.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          # لازم المهمتين يكونوا اشتغلوا فعلًا مش «اتخطوا»
          ran=$(grep -cE "> Task :gitlive:compileKotlinIos(Arm64|SimulatorArm64)$" trial-ios.log)
          echo "::notice::مهام بناء GitLive للآيفون اللي اشتغلت: $ran"
          [ "$ran" -eq 2 ] || { echo "::error::المفروض مهمتين — النجاح ده مش مضمون"; exit 1; }
