# قلب تطبيق كوتلن للجهازين — KOTLIN_PLAN §4-أ٥
# على جهاز ماك من GitHub (مجاني للمستودع العام): اختبارات ملفات المرجع + بناء كود الآيفون.
# ⚠️ من غير أي أسرار. الكشف الحقيقي مش موجود هنا، فاختباره ما بيشتغلش (بيشتغل على جهاز المالك بس).
name: native-core

on:
  push:
    paths:
      - 'native-app/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: اختبارات ملفات المرجع (JVM)
        run: chmod +x gradlew && ./gradlew :core:jvmTest --console=plain
      - name: اختبار اللي بيختلف من جهاز للتاني على محاكي الآيفون
        # `nfkc` و`compareArabic` بس هما اللي كودهم بيختلف؛ القيم المتوقعة من التطبيق الحالي.
        # ملفات المرجع بتتقرا من القرص فاختباراتها على الكمبيوتر بس.
        run: |
          set +e
          ./gradlew :core:iosSimulatorArm64Test --console=plain 2>&1 | tee ios-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|FAILED|expected|Caused by" ios-test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          # «نجح» من غير ما يشغّل حاجة = مش نجاح. العدد بيتطبع كملاحظة عشان يتقرا من برا.
          count=$(grep -ho 'tests="[0-9]*"' core/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null | grep -o '[0-9]*' | paste -sd+ - | bc)
          count=${count:-0}
          echo "::notice::اختبارات اتشغلت على محاكي الآيفون: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::مفيش ولا اختبار اتشغل على المحاكي — النجاح ده فاضي"
            exit 1
          fi
      - name: بناء كود الآيفون (جهاز حقيقي + المحاكي)
        # أخطاء المترجم بتتطبع كـ«error annotations» كمان، عشان تبان من برا من غير ما حد يفتح السجل
        run: |
          set +e
          ./gradlew :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64 --console=plain 2>&1 | tee ios-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|Caused by|FAILURE:" ios-build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
