# تحديث أسعار الذهب والفضة وأسهم تداول.
#
# ليه هنا مش في التطبيق؟ Cloud Functions مش متاحة في باقة Spark
# (CLAUDE.md #12)، فالتحديث بيحصل بره تمامًا والتطبيق بيقرا الناتج
# كملف عادي من الريبو.
#
# لو مصدر فشل، سعره بيختفي من الملف ويتسجل سبب اختفائه —
# ما بيتكتبش صفر ولا سعر إمبارح كأنه سعر النهارده.
#
# المتوسطات (`public/averages.json` — OVERRIDES §69.6) في نفس المهمة، بس بتتحسب
# مرة في الشهر (السكربت بيقرر لوحده). ⚠️ المهام المجدولة بتشتغل من الفرع الرئيسي
# (main) بس — فالملف ما بيتعملش لحد ما الفرع ده يتدمج.

name: تحديث الأسعار

on:
  schedule:
    # 5:00 صباحًا بتوقيت السعودية (02:00 UTC) كل يوم
    - cron: '0 2 * * *'
  # زر تشغيل يدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: جلب الأسعار
        run: node scripts/fetch-prices.mjs

      # يوم 1 في الشهر أو لو الملف أقدم من 28 يوم — غير كده السكربت بيخرج من غير تغيير.
      # فشله ما يوقفش حفظ الأسعار (الرقم القديم بيفضل في الملف وعليه «قديم»).
      - name: المتوسطات الشهرية
        continue-on-error: true
        run: |
          node --test scripts/averages/averages.test.mjs
          node scripts/fetch-averages.mjs

      - name: حفظ الملف لو اتغير
        run: |
          if git diff --quiet -- public/prices.json && [ -z "$(git status --porcelain -- public/averages.json)" ]; then
            echo "مفيش تغيير في الأسعار ولا المتوسطات"
            exit 0
          fi
          git config user.name "masroufy-price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/prices.json
          if [ -f public/averages.json ]; then git add public/averages.json; fi
          git commit -m "تحديث الأسعار $(date -u +%Y-%m-%d)"
          git push
